    aliases: [incident response, incident handling, containment, eradication, forensic investigation, breach response, csirt]
  Threat hunting:
    category: Defensive
    aliases: [threat hunting, threat intelligence, ioc, indicators of compromise, ttp, mitre attack, adversary]
  EDR / XDR:
    category: Defensive
    aliases: [edr, xdr, crowdstrike, sentinelone, carbon black, defender for endpoint, endpoint detection]
  Malware analysis:
