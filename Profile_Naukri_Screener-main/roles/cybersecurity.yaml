# Cyber security - SOC analyst, VAPT, GRC and security engineering.
#
# Security job titles cover four fairly different careers, and this pack
# deliberately holds all four so the first scan shows which one the market is
# actually offering you. Once you know, delete the categories you do not work
# in - a lexicon full of skills you have never touched fills the study page
# with Gaps and drags the interview questions away from your real strengths.
#
#   Offensive   - VAPT, red team, exploit work
#   Defensive   - SOC, SIEM, incident response, threat hunting
#   GRC         - audit, ISO 27001, risk, compliance
#   Engineering - cloud security, IAM, DevSecOps, security tooling
#
# Inherits roles/_common.yaml for the networking, cloud and Linux vocabulary,
# all of which security adverts lean on heavily.

label: Cyber Security
primary_role: Cyber Security Analyst

seed_keywords:
  - Cyber Security Analyst
  - SOC Analyst
  - Information Security
  - VAPT

searches:
  - {keyword: Cyber Security Analyst, location: null}
  - {keyword: SOC Analyst, location: null}
  - {keyword: Information Security Engineer, location: null}
  - {keyword: VAPT, location: null}
  - {keyword: Security Engineer, location: remote}

must_have_any:
  - security
  - cyber
  - soc
  - infosec
  - information security
  - vulnerability
  - penetration testing
  - threat
  - compliance

exclude_title_keywords:
  # "Security" without "cyber" is overwhelmingly physical security on Naukri.
  - security guard
  - physical security
  - security supervisor
  - housekeeping
  - sales

synonyms:
  vapt: vulnerability assessment and penetration testing
  ir: incident response
  infosec: information security
  siem: security information and event management
  edr: endpoint detection and response
  iam: identity and access management
  soc: security operations centre

tight_terms: [soc, siem, edr, xdr, iam, waf, dlp, mfa, pki, ids, ips, ir, vpn, ssl, tls, cve, ioc, ttp, sast, dast]

interview_focus: >-
  Weight questions toward the reasoning behind a call: why this alert was a
  true positive, what the analyst did next and in what order, how a finding was
  written up for a developer who has to fix it, and how risk was explained to
  someone non-technical. Advanced questions should be incident scenarios and
  architecture decisions, not tool trivia.

lexicon:
