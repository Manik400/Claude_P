# QA Automation / SDET.
#
# Inherits roles/_common.yaml and adds what is specific to testing. See
# docs/ROLES.md for the format.

label: QA Automation / SDET
primary_role: QA / SDET

# Seeds for the search terms jobs.yaml falls back to when it lists none.
seed_keywords:
  - SDET
  - QA Automation
  - Automation Test Engineer
  - Test Automation Engineer

# Ready-made searches. Copy these into jobs.yaml and edit the locations.
searches:
  - {keyword: SDET, location: null}
  - {keyword: QA Automation, location: null}
  - {keyword: Automation Test Lead, location: remote}
  - {keyword: Python Automation Testing, location: null}
  - {keyword: Playwright Automation, location: null}

# A job must mention at least one of these somewhere, or it is dropped before
# scoring. This is the "is this even my field" gate.
must_have_any:
  - QA
  - SDET
  - test automation
  - automation testing
  - quality engineering
  - test engineer
  - quality assurance

exclude_title_keywords:
  - hardware
  - sales

synonyms:
  sdet: software development engineer in test
  qa: quality assurance
  restassured: rest assured
  automation testing: test automation
  automation tester: test automation

tight_terms: [pom, tdd, bdd, uat, k6]

interview_focus: >-
  Weight questions toward framework design, flaky-test debugging, CI
  integration and what the candidate would do when a suite fails in a release
  pipeline. Test strategy questions belong at the advanced level.

