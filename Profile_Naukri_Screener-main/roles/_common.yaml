# Skills that appear in job adverts for every technical field.
#
# Every role pack inherits this file, so a pack only has to describe what makes
# its field different. Edit here and all four roles get the change.
#
# Format, per entry:
#
#   Canonical Name:
#     category: the group it appears under on the study page
#     aliases:  every spelling a recruiter might type. Matched with word
#               boundaries, case-insensitively. "java" will not match
#               "javascript" and "api" will not match "rapid".
#
# The canonical name is what the study page and the prompts print, so write it
# the way people say it out loud.

label: Common technical vocabulary

# Title words that are a no for anyone using this toolkit as an experienced
# hire. Role packs add their own on top.
exclude_title_keywords:
  - intern
  - fresher
  - trainee

# Terms whose bare form is too common to trust a loose match on.
tight_terms: [sql, git, aws, gcp, ai, ml, api, ci, qc, rca, ip, dns, sla]

# Different spellings folded together before job scoring compares anything.
synonyms:
  cicd: ci cd
  ci/cd: ci cd
  js: javascript
  k8s: kubernetes

lexicon:
