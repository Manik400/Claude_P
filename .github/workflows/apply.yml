name: Queue request (phone)
run-name: "Queue: ${{ inputs.action }} · ${{ inputs.note || '' }}"

# Started from the phone page (Jobs -> add to queue, Queue tab, Track tab).
# Writes an encrypted request to data/apply/queue/ on the gh-pages branch.
# It does NOT apply itself: GitHub's runners have no LinkedIn/Naukri login,
# and a datacenter IP on your account is what gets it restricted. Your PC
# runs the queue (site\phone_apply.bat, every 30 min and at logon, scheduled
# by site\schedule_phone_apply.ps1), applies from home with the real session,
# and publishes data/apply/queue.enc back for the phone.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "queue = add jobs; remove / retry = by key; pause / resume the queue; settings = auto rule, limit, offsite; answers = screening answers; profile = your answers form; notes = application status/notes"
        type: choice
        options: [queue, remove, retry, pause, resume, settings, answers, profile, notes]
        default: queue
      payload:
        description: "JSON payload (see site/tools/run_apply_queue.py)"
        required: false
        default: ""
      report:
        description: "(queue, old style) report id whose postings to queue"
        required: false
        default: ""
      jobs:
        description: "(queue, old style) job keys, comma-separated, or 'all'"
        required: false
        default: "all"
      note:
        description: "Optional note"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -q cryptography
      - name: Queue the request
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_REPORT: ${{ inputs.report }}
          INPUT_JOBS: ${{ inputs.jobs }}
          INPUT_NOTE: ${{ inputs.note }}
          INPUT_PAYLOAD: ${{ inputs.payload }}
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          PAGES_REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: python site/tools/run_apply_queue.py
