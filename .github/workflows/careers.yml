name: Careers search (phone)
run-name: "Careers: ${{ inputs.role }} · ${{ inputs.countries || 'worldwide' }}${{ inputs.relocation == 'strict' && ' · relocation' || '' }}"

# Started from the phone page (site/index.html -> Careers), the GitHub mobile app, or
# `gh workflow run careers.yml -f role="software engineer" -f experience=3-5 -f relocation=strict`.
# Reads the career pages of the companies in job-hunt/assets/companies.txt and publishes the
# encrypted result to the gh-pages branch, where the phone page's Careers tab shows it.

on:
  workflow_dispatch:
    inputs:
      role:
        description: "Job title(s), comma-separated"
        required: true
        default: "software engineer"
      experience:
        description: "Your experience in years, e.g. 4 or 3-5"
        required: false
        default: ""
      countries:
        description: "Countries (names or ISO2), comma-separated, or worldwide"
        required: false
        default: "worldwide"
      relocation:
        description: "strict = only jobs that offer relocation; visa = relocation or visa sponsorship"
        type: choice
        options: [strict, visa, any]
        default: strict
      fit:
        description: "Experience filter"
        type: choice
        options: [default, strict, all]
        default: default
      days:
        description: "Only postings from the last N days (empty = all open postings)"
        required: false
        default: ""
      companies:
        description: "Only these companies (comma list, empty = whole list)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: job-hunt/requirements*.txt

      - name: Install
        run: python -m pip install -q -r job-hunt/requirements.txt cryptography

      # The free local model (job-hunt/scripts/jobbot/localai.py): semantic
      # ranking, a "why it fits" line per top job, relocation second opinions.
      # Off until the repo variable LOCAL_AI is "1"; the ~1.4 GB of model files
      # are cached between runs (actions/cache keeps them 7 days past last use).
      - name: Install local AI
        if: vars.LOCAL_AI == '1'
        continue-on-error: true
        run: >
          python -m pip install -q -r job-hunt/requirements-ai.txt
          --only-binary llama-cpp-python
          --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Cache local AI models
        if: vars.LOCAL_AI == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/jobbot-ai
          key: local-ai-v1-${{ vars.LOCAL_AI_MODEL || 'unsloth/Qwen3.5-2B-GGUF:Qwen3.5-2B-Q4_K_M.gguf' }}-${{ vars.LOCAL_AI_EMBED_MODEL || 'BAAI/bge-small-en-v1.5' }}
      - name: Download local AI models
        if: vars.LOCAL_AI == '1'
        continue-on-error: true
        env:
          LOCAL_AI_MODEL: ${{ vars.LOCAL_AI_MODEL }}
          LOCAL_AI_EMBED_MODEL: ${{ vars.LOCAL_AI_EMBED_MODEL }}
        run: cd job-hunt/scripts && python -m jobbot.localai --download

      - name: Search and publish
        env:
          INPUT_ROLE: ${{ inputs.role }}
          INPUT_EXPERIENCE: ${{ inputs.experience }}
          INPUT_COUNTRIES: ${{ inputs.countries }}
          INPUT_RELOCATION: ${{ inputs.relocation }}
          INPUT_FIT: ${{ inputs.fit }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_COMPANIES: ${{ inputs.companies }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          # Local model settings (repo variables; see job-hunt/README.md)
          LOCAL_AI: ${{ vars.LOCAL_AI }}
          LOCAL_AI_MODEL: ${{ vars.LOCAL_AI_MODEL }}
          LOCAL_AI_EMBED_MODEL: ${{ vars.LOCAL_AI_EMBED_MODEL }}
          LOCAL_AI_BUDGET_SECONDS: ${{ vars.LOCAL_AI_BUDGET_SECONDS || '420' }}
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          PAGES_REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: python site/tools/run_careers.py
