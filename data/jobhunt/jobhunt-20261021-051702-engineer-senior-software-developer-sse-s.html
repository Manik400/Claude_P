posted_raw": "", "salary": "₹15L – ₹25L • No equity", "snippet": "# About Zenskar Zenskar is an AI-native revenue automation platform built to handle real-world complexity. It sits between your CRM and ERP automating everything in between: billing, revenue recognition, collections, usage metering, and analytics. Across any pricing model, any entity structure, any currency. **Our vision: Zero-Touch Finance.** Agents execute. Humans supervise. Finance teams set th", "description": "# About Zenskar Zenskar is an AI-native revenue automation platform built to handle real-world complexity. It sits between your CRM and ERP automating everything in between: billing, revenue recognition, collections, usage metering, and analytics. Across any pricing model, any entity structure, any currency. **Our vision: Zero-Touch Finance.** Agents execute. Humans supervise. Finance teams set the rules. Zenskar runs them. Founded by Apurv Bansal and Saurabh Agarwal, second-time founders whose previous startups were acquired by Snapdeal and Gaana. The team brings experience from Google, Deutsche Bank, Elevation Capital, IIT Bombay, IIT Delhi, and Harvard Business School. We have 5x'd revenue in the past year. We are default alive. ## Funding We raised **$15M in Series A** funding in April 2026, led by Susquehanna Venture Capital, Bessemer Venture Partners, Shine Capital, and Rho, with participation from Rocketship, J-Ventures, Future Back Ventures by Bain & Company, and Converge. The funding is being used to expand our **Agents Marketplace** and scale operations, not headcount. 📰 Read the announcement → https://youtu.be/jRb2ybvrSwU?si=vuLLgUY_MFdRzDMl See how Zenskar automates the full order-to-cash cycle, from contract to cash, without spreadsheets, workarounds, or engineering tickets.* ## The Problem We're Solving Finance teams aren't struggling because they lack AI tools. They're struggling because the systems underneath those tools were built for a simpler world. These systems label real-world complexity as edge cases and force teams into costly, error-prone workarounds: revenue leakage, delayed collections, audit risk, and finance teams buried in grunt work. Bolting AI onto these broken foundations is as good as a Ferrari engine on a horse-drawn carriage. Zenskar is purpose-built from the ground up: the architecture handles complexity natively, so AI actually works. It combines **foundational flexibility + deterministic calculation + purpose-built AI agents** to deliver end-to-end automation across the order-to-cash cycle - without workarounds, without engineering tickets. The B2B billing and revenue automation market is **$2B today, projected to reach $10B by 2030**. ## What Customers Say > *\"We're saving 200+ hours/quarter on invoicing and receivables by completely automating our recurring billing.\"* - **Noy Kalansky, Finance Controller, Pontera** > > *\"Zenskar automates revenue recognition accurately for our value-based billing: agents reducing manual hours by 70%.\"* - **Matt Barnard, VP Finance, Vertice** > > *\"Zenskar’s agents automated 90% of our billing, integrated with our CRM, and accelerated revenue collection by a month.\"* - **Ming Lui, VP Finance, Yembo** > > *\"Sardine had spent 4 years running billing in-house for high-volume, usage-based pricing. Zenskar took care of it all.\"* - **Sardine team** > > *\"We launched our product 4 months faster instead of building an in-house system for our usage-based pricing.\"* - **Kshitij Gupta, CEO, 100ms** > # About the role We’re looking for an early-career engineer who enjoys building things end to end. You might build an API in the morning, wire it into a product workflow in the afternoon, and spend the next day figuring out why one very determined edge case refuses to cooperate. This is a full-stack role, but not one where “full stack” means changing button colours and occasionally calling an API. You’ll work across product UI, backend services, data models and integrations. You can be stronger on one side: we don’t expect perfect symmetry - but you should be excited to learn and work across both. Our backend is primarily **Python and Postgres on AWS**. On the frontend, you’ll work with a modern JavaScript/TypeScript application. Familiarity with our exact stack helps, but it is not a requirement. **Also:** you do not need to know billing or accounting before joining. You will learn. Probably more than you ever planned to. ## What you'll walk into This is software that moves money, so correctness matters. A tiny-looking edge case can create a very real invoice, and customers tend to notice those. At the same time, the product needs to feel simple. Finance teams should not need to understand our database schema-or summon an engineer-to complete everyday work. That combination creates interesting full-stack problems: - Turning complex billing rules into workflows that are understandable in the UI. - Building APIs that remain predictable when customer configurations become complicated. - Showing useful errors instead of “Something went wrong. Please try again.” - Handling retries, duplicate requests and partial failures safely. - Making large datasets and long-running operations feel responsive. - Giving users visibility into what our AI agents did, why they did it and what needs human attention. You won’t spend your first three months watching onboarding videos. You’ll pair with the team, read real code and start shipping carefully scoped changes. ### **Projects you might work on** The exact project will depend on product priorities, but early SDE1 projects could look like: - **Make a product workflow truly end to end:** Build or improve a workflow spanning a frontend form, API validation, persistence and the final success/error experience. - *For example: configuring a pricing rule, creating a customer, reviewing an invoice adjustment or setting up a usage alert.* - **Make failures understandable:** Improve a workflow where backend validation is technically correct but the user has no idea what to do next. You might introduce structured errors in the API, map them to the right UI state and add enough observability to understand how often the failure occurs. - **Improve an integration experience:** Work on a CRM, ERP or payment integration: status tracking, retry behavior, duplicate handling, failure visibility and the UI through which a user understands what happened. - **Make a slow screen boringly fast:** Trace a slow product workflow from browser to database. Improve the query or API, introduce pagination where needed and make loading behavior sensible in the UI. - **Write an AI agent to solve a business usecase:** Write an AI agent on our internal platform to help solve customers’ usecases. ### **Your first 30 days** The goal of the first month is not to know everything. It is to become comfortable enough with one part of the system to make small useful, safe changes. By the end of your first 30 days, we expect you to have: - Set up the application locally and understood how code moves from your laptop to production. - Learned the basic journey from contract and usage data to invoices and revenue workflows. - Traced at least one product flow from the UI through the API and database. - Shipped a few small production changes—likely a bug fix or contained product improvement. - Written or updated tests for the behavior you changed. - Participated in code reviews and acted on feedback. - Debugged one real issue alongside another engineer. - Demoed something you shipped to the team. - Learned how we use logs, metrics and other tools to verify that a change is healthy. It is completely fine to ask a lot of questions. We would much rather answer an early question than investigate a confidently shipped mystery later. ### **By 90 days** By the end of your first 90 days, you should be able to own a small, well-scoped feature from discussion to production. That means you can: - Clarify the expected behavior and identify important edge cases. - Break the work into manageable pieces. - Make the necessary frontend, API and data-model changes. - Handle loading, empty, validation, permission and failure states. - Write useful tests without being reminded at the end. - Work with product and design when the expected experience is unclear. - Use code review feedback to improve the solution rather than only patching comments. - Deploy the feature and verify that it behaves correctly in production. - Investigate a production issue using logs and the codebase, with help when needed. - Explain what you built, why you built it that way and what you would improve next. You will not be expected to design the next five years of Zenskar’s architecture. You will be expected to take increasing ownership of your corner of it. A good 90-day outcome is not “never needed help.” It is “asked for help at the right time, learned quickly and became noticeably more independent.” ## **Who you are** - You have **1–3 years of professional software development experience**. Substantial internships and strong personal or open-source projects count. - You have built at least one non-trivial application or feature and can explain what you personally contributed. - You are comfortable programming in at least one mainstream language and are willing to work in Python. - You understand basic web concepts: HTTP, APIs, databases, validation and application state. - You can write ordinary, readable code using common data structures and control flow. - You enjoy figuring things out, but you also know when to ask for help. - You can explain your thinking without hiding behind framework terminology. - You care whether the feature works for the user—not only whether your pull request was merged. ### **Good to have** None of these are mandatory: - Python, Postgres or SQL experience. - Experience with a modern JavaScript or TypeScript frontend framework. - Building and consuming REST APIs. - Exposure to AWS, Docker, CI/CD or background jobs. - Experience at a startup or on a small product team. - A habit of writing unit and integration tests. - Personal projects that have real users—even if the number of users is your five very patient friends. - Experience using AI coding tools without outsourcing your understanding to them. - Any exposure to billing, payments, accounting or fintech. ## Location - Hybrid - 3 days per week - Office Location: Indiranagar, Bengaluru. - Address: 3rd Floor, A wing No 1, Carlton Towers, HAL Old Airport Rd, HAL 2nd Stage, Indiranagar, Bengaluru, Karnataka 560008. ## Interview process Our interviews are practical and evidence-based. No single round exceeds 60 minutes, and we are not interested in testing whether you memorised obscure Python behavior or 200 LeetCode problems. - **R0, Introductory conversation:** A short conversation about something you built, what you personally owned, what went wrong and what you learned. We’ll also align on the role, location and compensation. - **R1, Practical coding and debugging:** You’ll work in a small Python codebase with supplied tests. The goal is to understand the requirement, write working code and debug failures—not solve an algorithm puzzle. - **R2, Code-first design:** You’ll implement a small component with a few business rules and then adapt it when the requirement changes. - **R3, Hiring Manager:** A discussion about projects, learning, feedback, mistakes, ownership and the kind of environment in which you do your best work. During technical rounds, documentation and syntax search are allowed. AI can help with syntax or a small isolated utility, but it cannot be used to solve or debug the interview problem for you. We’ll explain the rules clearly before starting. No surprise gotchas. ## How to apply Interested? Click here to apply → https://evolve.keka.com/careers/jobdetails/91601 OR Write to nitya@zenskar.com", "skills": [], "employment_type": "full-time", "exp_min": 1, "exp_max": null, "seniority": "", ion. Collaborate with development teams on automation, infrastructure design, and release reliability. Required Technical Skills Linux & Networking: Linux administration, troubleshooting, TCP/IP, DNS, HTTP/S, firewalls, load balancers, and AWS networking (VPC, subnets, routing, security groups). Git & Scripting: Git workflows, branching strategies, and Bash or Python scripting. Containers & Orchestration: Docker, Kubernetes fundamentals, and hands-on Helm chart development, configuration, releases, and troubleshooting. CI/CD: Practical experience with GitHub Actions, Jenkins, GitLab CI, or an equivalent platform; automated builds, testing, deployments, and rollbacks. AWS: Hands-on experience with services such as EC2, VPC, IAM, S3, RDS, CloudWatch, and EKS or ECS. Terraform: Infrastructure provisioning, reusable modules, remote state, state locking, environment separation, and plan/apply workflows. Monitoring & Security: Metrics, logs, dashboards, alerts, incident troubleshooting, least-privilege IAM, secret management, and vulnerability scanning. Good To Have (Preferred Skills) Experience with Azure or Google Cloud Platform (GCP). GitOps tools such as Argo CD or Flux. DevSecOps tools such as Trivy, Gitleaks, SonarQube, or Snyk. OpenTelemetry, distributed tracing, SRE practices, or FinOps. Relevant certifications such as AWS SAA / DOP, CKA, CKAD, or Terraform Associate. Eligibility Criteria Experience: 1-6 years in DevOps, SRE, cloud infrastructure, or platform engineering. Education: Relevant degree or equivalent practical experience. Certifications: Cloud, Kubernetes, or Terraform certifications are preferred but not mandatory. Willingness to work onsite in Surat and participate in operational support as required. What You Will Gain Hands-on ownership of real-world cloud infrastructure and deployment workflows. Opportunities to work on infrastructure design, automation, security, and cloud optimization. Structured learning paths, learning materials, and support for professional development. Growth opportunities toward Senior DevOps Engineer, Platform Engineer, or SRE roles. Soft Skills We Value Ownership, systematic problem-solving, curiosity, clear communication, collaboration, proactiveness, composure, and continuous improvement. Why Join Codewinglet? Modern products and technologies in an AI-first engineering environment. Real-time AI projects, including AI Agents and GenAI systems. High-growth, fast-paced learning environment. Exposure to the latest technologies and live projects. Supportive and transparent leadership. Clear career growth and performance-based appraisals. Competitive & industry-aligned salary. Stable team culture with regular engagement activities. Flexible working hours and 5-day work week. On-time salary disbursement.", "skills": [], "employment_type": "permanent", "exp_min": 1.0, "exp_max": 6.0, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 54.0, "matched_skills": ["devops", "aws", "docker", "ci/cd", "linux", "github actions", "ec2", "s3", "rds"], "missing_skills": ["artificial intelligence", "terraform", "kubernetes", "helm", "site reliability", "monitoring", "git", "iam"], "also_on": [], "query": "engineer", "id": "9f03a0d4ccbf", "extra": {"details_fetched": true, "salary_stated": false, "semantic": 0.44, "score_confidence": "high", "is_mnc": false, "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Codewinglet%20Private%20Limited%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Surat%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Codewinglet%20Private%20Limited%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Surat%22"}, "Engineering managers": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Codewinglet%20Priva 5-software-engineer", "country": "IN", "location": "Bangalore Urban", "remote": true, "posted": null, "posted_at": null, "posted_raw": "", "salary": "", "snippet": "# Job Description: Quickbase Application Developer & Python Engineer **Company:** Insight Consultants **Role:** Quickbase Application Developer & Python Engineer **Employment Type:** Full-time or Contract (based on experience) **Location:** Bangalore, India ## About the Role Insight Consultants is looking for a hands-on developer to manage, maintain, and continuously improve an existing Quickbase", "description": "# Job Description: Quickbase Application Developer & Python Engineer **Company:** Insight Consultants **Role:** Quickbase Application Developer & Python Engineer **Employment Type:** Full-time or Contract (based on experience) **Location:** Bangalore, India ## About the Role Insight Consultants is looking for a hands-on developer to manage, maintain, and continuously improve an existing Quickbase application. This role goes beyond application support. We want someone who can understand business requirements, identify opportunities to improve existing processes, develop new functionality, and use Python to build integrations, automate tasks, and extend the application's capabilities. The ideal candidate combines strong Quickbase development skills with Python programming experience and a practical, problem-solving mindset. They should be comfortable working with an existing application, understanding how it works, and progressively making it more efficient, scalable, and user-friendly. ## Key Responsibilities ### 1. Quickbase Application Management - Take ownership of the existing Quickbase application, including its tables, relationships, forms, reports, dashboards, and workflows. - Maintain and troubleshoot existing functionality, resolve issues, and ensure the application operates reliably. - Manage application enhancements, user access, permissions, and configuration changes. - Review the existing application architecture and identify opportunities to improve performance, usability, and maintainability. - Document application structure, business rules, workflows, and technical changes. ### 2. Application Enhancements and Development - Gather and translate business requirements into practical Quickbase solutions. - Develop new features, forms, reports, dashboards, automations, and workflows. - Improve existing business processes by reducing manual work and eliminating unnecessary steps. - Identify gaps in the current application and proactively recommend improvements. - Test enhancements, troubleshoot defects, and implement changes with minimal disruption to existing operations. ### 3. Python Development and Automation - Develop Python scripts and utilities to automate repetitive tasks and business processes. - Build integrations between Quickbase and other applications, APIs, databases, and data sources. - Use Python to perform data validation, transformation, reconciliation, and bulk data processing. - Develop custom functionality where Quickbase's native capabilities are insufficient or where an external service would be more effective. - Write maintainable, reusable, and well-documented code. ### 4. Integrations and Data Management - Work with Quickbase APIs and REST APIs to exchange data with external systems. - Design and maintain reliable data import, export, synchronization, and integration processes. - Monitor data quality, investigate discrepancies, and implement validation and error-handling mechanisms. - Ensure appropriate handling of credentials, access permissions, and sensitive business data. ### 5. Continuous Improvement - Work with business stakeholders to understand operational challenges and improvement opportunities. - Evaluate whether a requirement is best addressed through Quickbase configuration, Python development, or integration with another system. - Recommend solutions that improve productivity, reduce errors, and support future business growth. - Maintain technical documentation and communicate progress, issues, and recommendations clearly. ## Required Qualifications - Demonstrated experience developing and maintaining applications using **Quickbase**. - Proficiency in **Python**, including writing scripts, working with data, debugging, and building automation. - Experience working with REST APIs, JSON, authentication, and API integrations. - Understanding of relational databases, data structures, and data relationships. - Experience troubleshooting existing applications and enhancing functionality without disrupting established workflows. - Strong analytical and problem-solving skills. - Ability to understand business requirements and translate them into technical solutions. - Good communication skills and the ability to work independently. ## Preferred Qualifications - Experience with Quickbase pipelines, formula fields, relationships, reports, and application administration. - Experience with Quickbase API integrations and advanced application customization. - Familiarity with SQL and database concepts. - Experience with Git or other version control systems. - Familiarity with cloud platforms, scheduled jobs, and automated deployments. - Experience with data analytics, reporting, workflow automation, or AI-enabled business applications. ## Who We Are Looking For We are looking for a practical, hands-on developer who takes ownership of the application and thinks beyond the immediate task. Someone who asks, \"Can this process be made better?\" rather than simply implementing the next requested change. The right person will be comfortable working with an existing system, learning its business logic, proposing improvements, and delivering solutions that make a measurable difference to the business.", "skills": [], "employment_type": "full-time", "exp_min": 1, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 51.2, "matched_skills": ["rest api", "data structures", PT, Codex, or similar AI tools as part of your default engineering workflow. If you do not know how to use AI effectively to write code, debug issues, understand unfamiliar systems, and improve your own engineering output, **please do not apply**. We are looking for engineers who can use AI as leverage — while still bringing strong judgment, ownership, and engineering taste. AI can write a lot of the first draft. You are responsible for the final result. ## What we are building ClearFeed is building an AI-first support platform for modern teams working in Slack and Microsoft Teams. Our product connects conversations, tickets, knowledge bases, engineering tools, CRMs, and AI agents so companies can resolve customer and internal requests faster. Our engineers work on real product problems: * How should an AI agent understand a support conversation? * When should it answer automatically, and when should it ask a human? * How do we safely connect Slack, Teams, Zendesk, Jira, GitHub, Linear, Salesforce, HubSpot, and other tools? * How do we make AI workflows observable, debuggable, and trustworthy? * How do we ship fast without creating chaos for customers? ## What you will do You will take ambiguous customer problems and turn them into working software. That may include API design, backend logic, database changes, Slack/Teams workflows, AI-agent behavior, product UX, tests, monitoring, and deployment. You will be expected to: * Use AI tools heavily while writing and reviewing code. * Use AI to create first-pass designs, specs, implementation plans, tests, and docs. * Build backend services using TypeScript, Node.js, NestJS, PostgreSQL, Redis, queues, and cloud infrastructure. * Work on AI-agent features involving LLMs, RAG, tool-calling, structured outputs, evals, guardrails, and observability. * Own features end to end: idea → design → implementation → testing → release → production debugging. * Debug production issues and improve the system after every incident. * Improve our engineering system itself: better prompts, better internal tools, better test generation, better review loops, better deployment workflows. * Move fast, but stay accountable for what ships. ## What “AI-native” means here We do not mean “vibe code and hope it works.” We mean: * You can use AI to move significantly faster. * You can use AI to write, refactor, test, and debug code. * You can review AI-generated code critically. * You understand that AI is often confidently wrong. * You can use AI for product thinking, but you do not outsource judgment. * You can ship faster without lowering quality. * You can explain your decisions clearly to humans. The best engineers in the next decade will not be the ones who manually type the most code. They will be the ones who combine product judgment, technical depth, and AI leverage to ship high-quality software faster than traditional teams. ## What we are looking for You may be a good fit if: * You are already using AI coding tools daily. * You are faster today than you were one year ago because of AI. * You have strong software fundamentals and do not blindly trust generated code. * You can work across backend, product, integrations, and basic frontend when needed. * You care about customer experience, not just clean abstractions. * You enjoy working in small teams with high ownership. * You can take a problem statement and come back with a working solution. * You are comfortable with ambiguity. * You like shipping. * You are curious, direct, and low-ego. ## Bonus points We will pay extra attention if you have: * Built something real using AI agents. * Used Claude Code, Cursor, Codex, v0, Lovable, Replit, or similar tools seriously. * Shipped a side project using AI. * Built integrations with Slack, Teams, Zendesk, Jira, GitHub, Salesforce, or HubSpot. * Worked on support, developer tools, workflow automation, or B2B SaaS products. * Written about your engineering work. * Open-source contributions or visible proof of work. ## How we evaluate We use AI in our hiring process for the same reason we use it in engineering: it helps everyone move faster and spend time where human judgment matters most. The first step is a short AI-led interview of around 15 minutes. It helps us understand your background, your experience, and how you think about building software. After that, you will have three technical discussions with our team: * Problem solving + debugging * Problem solving * System design We want to understand how you reason, how you debug, how you make trade-offs, and how well you can combine engineering fundamentals with AI tools to build reliable software faster. ## What you get We want engineers to have the tools, support, and environment to do their best work. ### Flexible AI Credits You will get flexible AI credits and access to the tools you need to build faster — Claude, Cursor, ChatGPT, Codex, or whatever genuinely helps you ship better software. We do not want engineers hesitating before using AI because of subscription limits or tool access. ### Health and medical support You get comprehensive medical insurance, along with **free doctor consultations**. We are a small team, but we want to be thoughtful about health, family, and emergencies. You should not have to figure everything out on your own when something medical comes up. ### Sports and team activities We sponsor badminton and cricket games for the team. Not mandatory forced-fun activities. Just real sports, real games, and a good way to spend time with people outside tickets, PRs, and production issues. ## How to apply Apply here or send your resume to jobs@clearfeed.ai with: * Your LinkedIn, GitHub, or resume. * One thing you have built that you are proud of. * A short note on how you use AI in your engineering workflow. * Optional: a Loom/video/walkthrough of something you built.", "skills": [], "employment_type": "full-time", "exp_min": 0, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0,     if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>
<style>

    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }

  * { scrollbar-width: thin; }

    --ink: #11151A; --fg: #11151A; --muted: #4E575F; --line: #11151A; --line2: #C9CCC3;
    --accent: #EE3D28; --accent-on: #FFFFFF; --accent-soft: rgba(238,61,40,.12); --accent-bg: rgba(238,61,40,.12);
    --v2-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --v2-display: 'Archivo Black', Impact, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root[data-ui="v2"]:not([data-theme="light"]) {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); }
  :root[data-ui="v2"] body, :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea {

  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tag, :root[data-ui="v2"] .pill, :root[data-ui="v2"] .ghost, :root[data-ui="v2"] .tb-toggle,
  :root[data-ui="v2"] details.fgrp > summary, :root[data-ui="v2"] span.fgrp > .flabel, :root[data-ui="v2"] .muted, :root[data-ui="v2"] th, :root[data-ui="v2"] code {

</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
