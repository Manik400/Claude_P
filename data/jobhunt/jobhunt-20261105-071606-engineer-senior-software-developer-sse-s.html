llfound", "title": "Firmware Engineer", "company": "FloMobility", "url": "https://wellfound.com/jobs/4985524-firmware-engineer", "country": "IN", "location": "Bengaluru", "remote": false, "posted": "2026-11-04", "posted_at": "2026-11-04T13:07:19+00:00", "posted_raw": "", "salary": "", "snippet": "**Company Overview** The world is moving towards an autonomous future where sooner or later everything that is driven, pushed or pulled today, will be moving by itself. At Flo Mobility, we believe that the true adaptation of autonomy lies in the seamless coexistence of humans and bots. By leveraging the power of sensors, computer vision, edge computing, and actuators, we optimize this relationship", "description": "**Company Overview** The world is moving towards an autonomous future where sooner or later everything that is driven, pushed or pulled today, will be moving by itself. At Flo Mobility, we believe that the true adaptation of autonomy lies in the seamless coexistence of humans and bots. By leveraging the power of sensors, computer vision, edge computing, and actuators, we optimize this relationship to deliver the best speed, agility, comfort and control. Our hero product, FLO Hauler, is an Autonomous Electric Material mover, helping customers reduce time and cost of moving material across Construction, Agriculture, Mining and Warehousing industries. Flo Hauler is being used by industry leaders like L&T, PSP, Total Environment to gain 50% savings on cost and time for the last mile of material movement. Our solutions are offered on Raas (Robot-as-a-service) model. The no capex approach makes it easy for our clients to adopt our MMRs (Material Movement Robots). **Role Overview** We are looking for a Firmware Engineer with 1 to 2 years of hands-on experience to join our robotics team and build the next generation of autonomous systems. You will design, develop, and debug embedded firmware that controls and communicates with our MMRs and autonomous platforms, working closely with electronics, mechanical, software, and systems engineers. This role offers real ownership of production-grade firmware on robots deployed in the field, along with the chance to deepen your expertise in STM32, ESP32, CAN, and robotics communication stacks. You will collaborate with firmware and cross-functional engineering teams to troubleshoot hardware-software issues, optimize system performance, and develop robust firmware for production-grade robotic platforms. **Responsibilities** **Embedded Firmware Development:** Design, develop, and maintain firmware in C/C++ for robotics platforms, primarily on STM32 and ESP32 microcontrollers. **STM32 Development:** Use STM32CubeIDE, STM32CubeMX, HAL, and CMSIS for peripheral configuration, driver development, hardware bring-up, and debugging. **ESP32 Development:** Build embedded applications using PlatformIO, Arduino framework, or ESP-IDF, including sensor integration, wireless connectivity, and system-level firmware. **Peripheral Interfacing:** Develop and debug drivers for GPIO, UART, SPI, I2C, ADC, DAC, PWM, timers, interrupts, DMA, and watchdogs. **CAN Communication:** Implement and debug CAN-based communication between STM32 controllers, motor controllers, sensors, and other embedded nodes, including frame design, IDs, baud rates, filtering, termination, and error handling. **Protocol & Sensor Integration:** Integrate sensors, motor drivers, displays, and other devices over UART, I2C, SPI, CAN, RS485, and similar interfaces. Exposure to higher-level protocols such as Modbus or CANopen is a plus. **Debugging & Diagnostics:** Debug firmware and hardware issues using ST-LINK/SWD, JTAG, oscilloscopes, logic analyzers, multimeters, CAN analyzers, and serial terminals. Analyze logs, reproduce field issues, and drive problems to root cause. **Python Tooling & Automation:** Write Python scripts for firmware testing, log analysis, CAN/serial data parsing, test automation, and diagnostic tools. **Testing & Validation:** Create test procedures, perform functional and integration testing, and validate firmware against system requirements. **Firmware Architecture:** Design modular, non-blocking, interrupt-driven firmware with state machines, fault handling, and clean driver abstractions. **Cross-functional Collaboration:** Work with electronics, mechanical, and software teams to resolve hardware-software integration issues and improve system performance. **Version Control & Releases:** Use Git for branching, merging, code reviews, and maintaining versioned firmware releases. Contribute to documentation of firmware design and release notes. **Education Background** Bachelor's degree (B.E./B.Tech.) in Electronics & Communication Engineering (ECE), Electrical & Electronics Engineering (EEE), Instrumentation Engineering, or a related field. Relevant certifications in Firmware Design (ESP32, STM32,Arduino), Embedded Systems **Skills** 1. 1 to 2 years of hands-on experience in embedded firmware development 2. Strong fundamentals in Embedded C/C++ (pointers, structures, enums, bit manipulation, memory management, interrupts) 3. Hands-on experience with STM32 microcontrollers using STM32CubeIDE / STM32CubeMX, HAL, and CMSIS 4. Hands-on experience with ESP32 (PlatformIO, Arduino framework, or ESP-IDF) 5. Solid understanding of UART, SPI, I2C, GPIO, ADC, PWM, timers, interrupts, and DMA 6. Practical experience with CAN protocol: frames, standard/extended IDs, arbitration, baud rates, acceptance filters, and error handling 7. Proficiency in Python for scripting, tooling, and test automation 8. Strong debugging skills using ST-LINK/SWD, JTAG, breakpoints, watchpoints, register inspection, and serial logs 9. Comfortable with lab equipment: oscilloscopes, logic analyzers, multimeters, bench power supplies, and CAN/serial analyzers 10. Proficiency with Git (repositories, branches, merges, tags, releases) **What We Look For** 1. A strong foundation in embedded C/C++, microcontrollers, communication protocols, and basic electronics 2. A debugging mindset: the ability to analyze logs, reproduce failures, find root causes, and fix issues on real hardware 3. Candidates who have shipped STM32/ESP32 projects, CAN-based systems, sensor or motor-controller interfaces, or other embedded products will be preferred 4. Hands-on experience and the ability to solve real hardware/firmware problems are valued more than purely theoretical knowledge 5. Ownership, curiosity, and the ability to work collaboratively in a fast-moving robotics startup", "skills": [], "employment_type": "full-time", "exp_min": 0, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 26.1, "matched_skills": ["test automation", "code review"], "missing_skills": ["firmware", "embedded", "stm32", "esp32", "robotics", "c++", "arduino", "python"], "also_on": [], "query": "engineer", "id": "wf4985524", "extra": {"company_size": "SIZE_11_50", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": false, "semantic": 0.318, "score_confidence": "high", "ai_summary": {"why": "Strong backend experience with Kafka, PostgreSQL, and AWS aligns well with embedded systems' need for robust communication and data processing.", "gaps": "Lacks specific embedded firmware (STM32/ESP32) and robotics domain knowledge required for this role."}, "is_mnc": false, "contacts": {"domain": "flomobility.com", "site": "", "emails": ["pratik@flomobility.com", "manesh@flomobility.com", "careers@flomobility.com", "dinesh@flomobility.com", "puneet@flomobility.com", "akash@flomobility.com", "sunny@flomobility.com", "prashant@flomobility.com", "gautham@flomobility.com", "nandan@flomobility.com"], "people": [{"name": "Pratik Patel", "title": "Co-Founder", "company": "FloMobility", "location": "", "email": "pratik@flomobility.com", "linkedin": "https://www.linkedin.com/in/pratikpatel0929", "source": "hunter", "confidence": 85}, {"name": "Manesh Jain", "title": "CEO", "company": "FloMobility",     const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>
<style>

    border-radius: 12px; padding: 3px 6px; }

  details.fgrp > summary::-webkit-details-marker { display: none; }

  details.fgrp[open] > summary::before { transform: rotate(90deg); }
  details.fgrp > summary:hover { opacity: 1; }
  details.fgrp > .fbody { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; vertical-align: middle; margin-left: 4px; }
  details.fgrp:not([open]) { opacity: .9; }
  /* a filter field: a labelled group, always open - only the whole toolbar collapses */
  span.fgrp { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; vertical-align: middle;
    border: 1px solid rgba(127,127,127,.28); border-radius: 12px; padding: 3px 8px; }

    opacity: .7; padding: 4px 2px; white-space: nowrap; }
  span.fgrp > .fbody { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* the whole filter toolbar can be hidden: only its Filters button stays */
  .tb-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: inherit; font-size: 0.75rem; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }
  .tb-toggle:hover { opacity: 1; }
  .tb-toggle::after { content: "\25B4"; font-size: 0.7rem; }
  .tb-hidden .tb-toggle::after { content: "\25BE"; }
  .tb-hidden > :not(.tb-toggle) { display: none !important; }
  .tb-hidden { padding-top: 4px !important; padding-bottom: 4px !important; }

  /* thin scrollbars that follow the page's light / dark theme */
  :root { color-scheme: light dark; } :root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }
  * { scrollbar-width: thin; }

  /* V2 skin (the site's portfolio look): one layer over each page's own variables */
  :root[data-ui="v2"] {
    --bg: #E9EAE4; --surface: #FFFFFF; --surface-2: #F5F6F2; --card: #FFFFFF; --card2: #F5F6F2;
    --ink: #11151A; --fg: #11151A; --muted: #4E575F; --line: #11151A; --line2: #C9CCC3;
    --accent: #EE3D28; --accent-on: #FFFFFF; --accent-soft: rgba(238,61,40,.12); --accent-bg: rgba(238,61,40,.12);
    --v2-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --v2-display: 'Archivo Black', Impact, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root[data-ui="v2"]:not([data-theme="light"]) {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); }
  :root[data-ui="v2"] body, :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea {
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  :root[data-ui="v2"] h1, :root[data-ui="v2"] h2, :root[data-ui="v2"] h3 { font-family: var(--v2-display); font-weight: 400; letter-spacing: -.01em; }
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tag, :root[data-ui="v2"] .pill, :root[data-ui="v2"] .ghost, :root[data-ui="v2"] .tb-toggle,
  :root[data-ui="v2"] details.fgrp > summary, :root[data-ui="v2"] span.fgrp > .flabel, :root[data-ui="v2"] .muted, :root[data-ui="v2"] th, :root[data-ui="v2"] code {
    font-family: var(--v2-mono); letter-spacing: .02em; }
  :root[data-ui="v2"] *:not(svg):not(path):not(circle) { border-radius: 0 !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea,
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle, :root[data-ui="v2"] details.fgrp, :root[data-ui="v2"] span.fgrp { border: 2px solid var(--line) !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle { box-shadow: 2px 2px 0 var(--line); font-weight: 700; }
  :root[data-ui="v2"] .chip[aria-pressed="true"], :root[data-ui="v2"] button[aria-pressed="true"] { background: var(--accent) !important; color: #fff !important; }
  :root[data-ui="v2"] [class*="card"], :root[data-ui="v2"] .app, :root[data-ui="v2"] .stat, :root[data-ui="v2"] section,
  :root[data-ui="v2"] .q, :root[data-ui="v2"] .row, :root[data-ui="v2"] article { border-color: var(--line) !important; box-shadow: 3px 3px 0 var(--line); }
</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
