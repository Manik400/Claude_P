ing database queries, refining access controls, and strengthening distributed concurrency. This role fits someone who reads how a production system actually behaves before changing it, and who ships verified fixes over quick guesses. WHAT YOU’LL OWN • Candidate Coding Experience: Build and harden our browser-based IDE—editing workflows, resilient autosave, live execution feedback over WebSockets, pre-assessment environment checks, and reliable media uploads. • Recruiter Decision Console: Develop the dashboard hiring managers rely on under time pressure—candidate reports, code-quality and integrity breakdowns, session timelines, review queues, and synchronized media playback. • Core Backend & Orchestration: Design and scale APIs and state machines handling assessment lifecycles, candidate sessions, RBAC, usage accounting, and asynchronous workflows with clean contracts and idempotent failure handling. • Analysis & Scoring Pipelines: Extend our code-quality and integrity pipelines across deterministic scoring rules, telemetry processing, computer-vision signals, and bounded LLM integrations—keeping results accurate and explainable. • Reliability & Observability: Improve resilience across execution sandboxes, PostgreSQL databases, Redis queues, and object storage. Debug issues with distributed traces and metrics, and back every fix with regression tests. OUR STACK You don't need prior fluency in every tool, but you should be strong in TypeScript and comfortable moving across frontend state, backend APIs, SQL query plans, and Python services: • Frontend: React, TypeScript, Vite, Tailwind CSS, TanStack Query, Monaco Editor, Socket.IO, browser media/WASM APIs • Backend: Node.js (NestJS, Prisma, Express), Python (FastAPI) • Data & Async: PostgreSQL, Redis, S3-compatible object storage, BullMQ, Celery, Server-Sent Events • Infra & Observability: Docker, Linux, GitHub Actions, OpenTelemetry, Prometheus, Grafana, k6 WHAT WE’RE LOOKING FOR • 1–4 years of production experience end-engineer", "country": "IN", "location": "Hyderabad, Nandyal", "remote": true, "posted": null, "posted_at": null, "posted_raw": "", "salary": "", "snippet": "Hiring: Backend Software Engineer – AI Systems & Android Applications Company: Nandi Group We are looking for an experienced Backend Software Engineer with strong expertise in backend development, AI/LLM systems integration, database engineering, cloud infrastructure, and Android application development. The ideal candidate should have demonstrated experience building, deploying, and maintaining p", "description": "Hiring: Backend Software Engineer – AI Systems & Android Applications Company: Nandi Group We are looking for an experienced Backend Software Engineer with strong expertise in backend development, AI/LLM systems integration, database engineering, cloud infrastructure, and Android application development. The ideal candidate should have demonstrated experience building, deploying, and maintaining production applications, with the ability to independently take ownership of backend architecture, AI integrations, databases, infrastructure, third-party services, and application reliability. This is a backend-focused engineering role requiring strong practical experience, sound architectural judgment, and the ability to manage systems throughout their development and production lifecycle. KEY RESPONSIBILITIES • Design, develop, deploy, and maintain scalable backend services, APIs, and server-side application architecture. • Build and integrate AI-powered capabilities using LLM APIs, Retrieval-Augmented Generation (RAG), vector search, and multimodal AI services. • Develop AI workflows involving tool calling, structured outputs, speech processing, and real-time streaming. • Design, manage, and optimize PostgreSQL databases, including schemas, indexing, transactions, migrations, and vector embeddings. • Configure and maintain cloud infrastructure, backend platforms, storage, and deployment environments. • Implement secure authentication, authorization, access controls, and data protection. • Build integrations with third-party APIs, payment gateways, messaging providers, and external services. • Develop OTP/phone authentication, notification systems, payment processing, and webhook-based workflows. • Own the end-to-end integration between backend services, AI systems, and Android applications, including state synchronization, offline handling, and production releases. • Implement CI/CD, automated testing, monitoring, logging, backups, and disaster recovery processes. • Monitor and optimize system performance, AI response latency, infrastructure costs, and operational reliability. • Independently troubleshoot production issues, resolve technical failures, and maintain long-term system stability. REQUIRED TECHNICAL EXPERTISE 1. Backend Engineering • Strong practical experience with Node.js, TypeScript/JavaScript, Python, or equivalent backend technologies. • RESTful API architecture, API security, authentication, authorization, and server-side business logic. • WebSockets, Server-Sent Events (SSE), and real-time data streaming. • Background jobs, asynchronous processing, message queues, caching, and data synchronization. • API performance optimization, error handling, and production debugging. 2. AI, LLM & Intelligent Systems Integration • Hands-on experience integrating AI model APIs such as OpenAI, Anthropic, Google Gemini, or equivalent providers into backend applications. • Experience implementing Retrieval-Augmented Generation (RAG), document ingestion, embeddings, semantic search, and vector databases. • Knowledge of PostgreSQL vector search using pgvector or comparable technologies. • Experience with LLM function/tool calling, structured outputs, multi-step AI workflows, and context management. • Integration of Speech-to-Text (STT), Text-to-Speech (TTS), translation, and image/vision AI services. • Real-time AI response streaming and asynchronous model processing. • Understanding of AI system reliability, response evaluation, prompt injection risks, access controls, latency, rate limits, and cost optimization. • Experience managing AI providers, API failures, retries, fallbacks, and production monitoring. 3. Database Engineering • Strong proficiency in PostgreSQL and SQL. • Relational database architecture, schema design, indexing, and query optimization. • Transactions, concurrency, data integrity, and database migrations. • Experience with database access controls, backup and recovery, and performance tuning. • Knowledge of vector embeddings and similarity search. • Proven ability to maintain and troubleshoot production databases. 4. Cloud Infrastructure & Backend Platforms • Practical experience with AWS, including relevant services such as EC2, S3, Lambda, IAM, RDS, and CloudWatch. • Experience with Supabase, including PostgreSQL, Authentication, Storage, Row Level Security (RLS), Edge Functions, and pgvector, or equivalent backend platforms. • Cloud architecture, deployment, storage management, and infrastructure configuration. • Secure environment configuration, secrets management, and access control. • Logging, monitoring, infrastructure security, scaling, and production reliability. 5. Third-Party APIs & System Integrations • Strong experience integrating third-party APIs, SDKs, and external services. • Payment gateway integrations such as Razorpay, PhonePe, or equivalent providers. • OTP authentication, phone verification, and identity services. • SMS, WhatsApp Business API, push notifications, and messaging platforms. • Logistics, shipping, order management, and external service integrations. • Webhook processing, API authentication, rate limiting, retries, error handling, and asynchronous synchronization. • Multilingual application support and localization integrations. 6. Android Application Integration & Deployment • Working knowledge of React Native, Expo, Kotlin, Java, or equivalent Android development technologies. • Experience integrating Android applications with backend APIs, databases, authentication, and AI services. • Handling streaming responses, voice/image inputs, state synchronization, and offline data. • Android build processes, application signing, Google Play Console, and production releases. • Ability to independently troubleshoot client-server integration issues and support application maintenance. 7. Development, Testing & Production Operations • Git, version control, and collaborative development workflows. • CI/CD pipelines, automated testing, and deployment management. • Production monitoring, incident response, and systematic debugging. • Application security, dependency management, and secure coding practices. • Technical documentation and maintainable software architecture. QUALIFICATIONS • Bachelor's degree in Computer Science, Software Engineering, or a related field, or equivalent practical experience. • Minimum 3 years of professional software development experience, with significant hands-on backend engineering experience. • Demonstrated experience developing, deploying, and maintaining production backend systems and relational databases. • Practical experience integrating AI/LLM capabilities into applications, preferably in production environments. • Experience with cloud infrastructure, API integrations, and application deployment. • Strong understanding of database design, backend security, scalability, and system reliability. • Ability to independently diagnose technical issues, make architectural decisions, and maintain production systems. • Proven ownership of real-world software systems beyond initial development. WHAT WE ARE LOOKING FOR We are looking for a technically strong, independent, and dependable engineer capable of taking end-to-end responsibility for backend infrastructure, AI integrations, database systems, cloud services, third-party APIs, and Android application connectivity. The successful candidate should be able to design and implement new systems, maintain and improve existing infrastructure, handle production issues, and make sound technical decisions without requiring continuous supervision. We place particular emphasis on practical engineering experience, production reliability, problem-solving ability, and demonstrated technical ownership. HOW TO APPLY Apply directly through Wellfound (or email your application to suraj@nandipipes.com if you are unable to apply here), along with your resume and one or more of the following: • Links to production applications or relevant GitHub repositories. • A brief architectural overview of a backend system, database infrastructure, or AI/LLM pipeline you personally designed, deployed, or maintained. • Details of your individual contributions to cloud infrastructure, database engineering, AI integrations, and production operations. Candidates with demonstrated experience building and maintaining real production systems will be given preference.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 55.2, "matched_skills": ["postgresql", "vector databases", "ci/cd", "test automation", "performance optimization", "typescript", "javascript", "rest api", "websockets", "sql", "concurrency", "aws"], "missing_skills": ["artificial intelligence", "android", "llm", "monitoring", "rag", "logging", "node.js", "python"], "also_on": [], "query": "engineer", "id": "wf5085724", "extra": {"company_size": "SIZE_1001_5000", "posted_checked": "none", "salary_stated": false, "semantic": 0.588, "score_confidence": "high", "is_mnc": false, "contacts": {"domain": "nandipipes.com", "site": "", "emails": ["suraj@nandipipes.com"], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Nandi%20Pipes%22%20%28%22Technical%20Recrui 20OR%20%22CTO%22%29%20%22Bengaluru%22"}, "Senior engineer": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Amazon%22%20%28%22Senior%20engineer%22%29%20%22Bengaluru%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Amazon%22%20%28%22Senior%20engineer%22%29%20%22Bengaluru%22"}}}}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Senior Software Engineer (TypeScript/Electron)- Desktop Native", "company": "Bitwarden", "url": "https://wellfound.com/jobs/4995334-senior-software-engineer-typescript-electron-desktop-native", "country": "IN", "location": "Noida", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "$42k – $42k", "snippet": "Bitwarden promotes better internet security and safety with the leading open source password management solution for individuals, teams, and business organizations. Our philosophy on security is that “we are all in this together” – we continue to offer a full-featured free version of Bitwarden so that everyone can be protected with strong password management. We also provide enterprise-grade solut", "description": "Bitwarden promotes better internet security and safety with the leading open source password management solution for individuals, teams, and business organizations. Our philosophy on security is that “we are all in this together” – we continue to offer a full-featured free version of Bitwarden so that everyone can be protected with strong password management. We also provide enterprise-grade solutions to some of the largest companies in the world, and will continue to innovate in the identity and authentication market as the world starts to grow beyond passwords. Read more on [the Bitwarden blog](https://bitwarden.com/blog/). As a Senior TypeScript/Electron Engineer on the Desktop Native team, you will build secure, reliable desktop experiences that connect the Bitwarden Electron application with native OS capabilities. You will focus on the TypeScript and Electron side of features such as Autotype, the SSH agent, and the DuckDuckGo integration, collaborating closely with Rust engineers and teams working on the vault and desktop platform. This role is primarily for someone strong in TypeScript, Electron, and modern application development who enjoys solving cross-platform challenges in a zero-knowledge, end-to-end encrypted product. Rust expertise is a plus, not a requirement. **WHAT YOU WILL DO** - Design, build, and maintain TypeScript/Electron components for Desktop Native features, including Autotype, the SSH agent, and the DuckDuckGo integration. - Develop end-to-end desktop workflows across Angular/TypeScript UI, Electron main and preload processes, and Node.js integrations. - Work with Rust engineers to integrate native modules, well-defined application interfaces, and OS-level capabilities on Windows, macOS, and Linux. - Design and maintain secure IPC and native integration boundaries, with particular care for sensitive credential data. - Partner with product, design, QA, Platform, and Vault teams to deliver reliable, user-friendly experiences across the desktop application. - Improve performance, reliability, accessibility, and maintainability through automated tests and cross-platform debugging. - Review pull requests and help raise the quality of TypeScript/Electron engineering, including community contributions on GitHub. - Identify technical debt and contribute to pragmatic refactoring, architecture improvements, and technical documentation. - Participate in technical design discussions, code reviews, and sharing knowledge across the team. - Independently plan, estimate, and deliver new feature work and bug fixes in a collaborative, distributed engineering environment. **WHAT YOU BRING TO BITWARDEN** - Strong production TypeScript/JavaScript experience — 4–6+ years of professional software engineering experience. - Hands-on experience developing Electron desktop applications, including main and renderer processes, preload scripts, and IPC. - Experience with Angular or a comparable modern front-end framework, and building maintainable user-facing applications. - Strong understanding of Node.js, asynchronous application code, and secure handling of sensitive data across process boundaries. - Experience testing, debugging, and shipping applications across desktop operating systems such as Windows, macOS, and Linux. - Experience using AI tooling in your development and testing workflow (Anthropic Claude preferred). - Familiarity with Rust, native Node.js modules (N-API), or OS-level integrations is a plus, not a requirement. - Collaborative and adaptable mindset. - Openness and authenticity combined with excellent communication skills. - Excitement and enthusiasm for open source and for better internet security. - Excellent problem-solving skills – you might not know all the answers, but you know how to find and communicate the solution. **WHY WORK WITH US** - Our user community loves us and we love them. Come to work each day with a sense of purpose as we bring a more secure internet experience to everyone from our friends and family to the world’s largest organizations. - Become an expert. You’ll get immersed in the prominent technology markets of security and open source software. - We are dedicated to building a diverse and talented team. Work remotely with motivated and supportive team members across the world. - Learn and grow. Take on new challenges with the support of your team, and join our #growth-club to continue personal and professional development. - At Bitwarden, we are passionate about what we do, but not necessarily everything we do. Our engineering team makes it a policy to carve out some time for personal growth, learning, skill building and pursuing personal passions that positively impact the team and company. To ensure that everyone has time to reaffirm their purpose and grow, you are encouraged to self-direct up to 15% of yo perate. Our products include: * **AI Answering Agent** that handles customer calls 24/7 * **Collections Agent** that helps businesses recover outstanding revenue * **Field Co-Pilot** that supports technicians in the field Our vision is to build an AI-native platform where intelligent agents understand workflows, take actions, and become an essential operating layer for commercial service businesses. We are past zero. Customers are actively using our products, and we are scaling rapidly. The next phase requires engineers who can build reliable systems, move quickly, and take ownership beyond just completing assigned tasks. ## THE ROLE As a Senior Software Engineer at Clara AI, you will be a hands-on engineer responsible for building and scaling AI-native products from concept to production. You will work closely with product, engineering, and customers to understand problems, design solutions, and ship production-quality software. This is not a role where you simply execute predefined technical tasks. We are looking for engineers who can identify problems, make sound technical decisions, and own solutions end-to-end. ## WHAT YOU'LL OWN ### Build AI-native products You will work on products where AI is a core capability. You may work across: * AI agents and autonomous workflows * LLM-powered applications * Intelligent automation systems * Knowledge retrieval and reasoning systems * AI evaluation and improvement frameworks ### Own technical problems end-to-end You will: * Design and build production systems * Make technical decisions and evaluate tradeoffs * Build scalable APIs and backend systems * Work across the stack where required * Debug complex technical problems * Improve system reliability, performance, and maintainability * Take ownership of features from idea to production ### Work closely with product and customers You will work closely with product and business teams to understand real customer problems and translate them into technical solutions. You will be expected to think beyond the implementation and understand the business impact of what you build. ### Stay hands-on This is a highly hands-on engineering role. You will: * Write production-quality code * Prototype and test new ideas * Participate in architecture and system design discussions * Review code and improve engineering practices * Use AI tools extensively to improve engineering velocity * Continuously learn and adapt to new technologies ## WHAT SUCCESS LOOKS LIKE ### First 30 Days * Build strong context around Clara AI's technology and customers * Understand existing systems and engineering practices * Start shipping meaningful improvements * Identify opportunities to improve product or engineering velocity ### First 60 Days * Own significant technical initiatives * Deliver production features independently * Improve system quality, reliability, or performance * Contribute meaningfully to architecture and technical decisions ### First 90 Days * Independently own important areas of the product * Ship meaningful AI-native capabilities * Raise engineering quality and technical standards * Become a reliable technical owner within the team ## WHO WE'RE LOOKING FOR ### Must Have * **3–7 years of software engineering experience** * Strong hands-on engineering background * Experience building and scaling production systems * Strong problem-solving and engineering fundamentals * Experience owning features or technical initiatives end-to-end * Strong understanding of backend systems and APIs * Product mindset and ability to understand customer problems * Comfortable working in ambiguity and fast-changing environments ### Strong Signals * Has been an early engineer or worked in a startup environment * Has built products or features from zero to one * Experience with AI-powered products or LLM applications * Uses AI tools extensively to improve engineering velocity * Strong full-stack experience * Has worked closely with product or customers * Demonstrates strong ncurrent code, with careful attention to synchronisation, shared state and real-time behaviour. - Optimise software for speed, memory footprint and deterministic performance across target platforms. - Diagnose and fix bugs, race conditions and performance bottlenecks, including issues that only appear on real hardware. - Work with image and video data paths where required — capture, buffering and processing. - Collaborate with hardware, firmware, algorithms and systems teams to define, design and ship new features. - Maintain high coding standards, with clean, reviewable and testable code. - Travel to client sites as needed to support integration, commissioning and field debugging. **Qualifications** - Bachelor's degree in Computer Science, Electronics, Electrical Engineering or a related technical field. - Proven professional experience in C and C++, particularly in embedded or systems-level software. - Strong background in embedded application and firmware development, with examples of prior work. - Practical experience integrating peripherals and sensors, and working directly from datasheets and interface specifications. - Solid understanding of multi-threading and concurrent programming, and the failure modes that come with them. - Comfortable working in Linux, including cross-compilation and building for embedded targets. - Strong debugging instincts and analytical skills, especially where the problem sits between software and hardware. - Clear communication, including the ability to explain technical detail to non-technical stakeholders. - Willingness and ability to travel for client engagements. **Preferred Skills** - Experience with image processing, video pipelines or camera interfaces. - Familiarity with device drivers, kernel-space development or RTOS environments. - Working knowledge of Python for test, automation and analysis tooling. - Version control with Git, and familiarity with modern build systems such as CMake. - Experience with unit, integration and automated testing frameworks. - A track record of designing and implementing systems that scale and stay maintainable. - Sound grounding in professional software engineering practice across the full development life cycle.", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 50.5, "matched_skills": ["data structures", "linux", "test automation", "c"], "missing_skills": ["embedded", "firmware", "c++", "rtos", "python", "git"], "also_on": [], "query": "engineer", "id": "wf4632634", "extra": {"company_size": "SIZE_201_500", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": false, "semantic": 0.213, "score_confidence": "high", "is_mnc": false}}, {"source": "instahyre", "source_name": "Instahyre", "title": "Full - Stack Engineer", "company": "FundApps", "url": "https://www.instahyre.com/job-449081-full-stack-engineer-at-fundapps-bangalore/", "country": "IN", "location": "Bangalore", "remote": null, "posted": "2026-11-03", "posted_at": null, "posted_raw": "", "salary": "cts that monitor over US$20 trillion in assets under management every single day, used by some", "snippet": "Compliance monitoring and reporting specialists", "description": "As part of the engineering team, you'll be working on a suite of innovative products that monitor over US$20 trillion in assets under management every single day, used by some of the world's largest Investment Managers. We are looking for a Mid-Level FullStack Engineer who can help drive innovation and deliver great software at pace while also keeping sustainability in mind. We need highly motivated, intelligent people hungry for a challenge. Requirements: Background: You are a mid-level engineer with generalist knowledge of product development concepts (software design, product requirements, work breakdown) and agile practices (TDD, CI/CD, cation": "India, Bengaluru", "remote": true, "posted": null, "posted_at": null, "posted_raw": "", "salary": "₹15L – ₹20L • No equity", "snippet": "## About ScopeX ScopeX builds cross-border payments and digital wallets for the Indian diaspora. When our app moves money, a missed bug is a customer's rent, not a cosmetic glitch. ## About the role We're hiring our first dedicated Mobile QA Automation Engineer to own test automation for the ScopeX app on iOS and Android. You'll build the automation that lets our React Native team ship weekly with", "description": "## About ScopeX ScopeX builds cross-border payments and digital wallets for the Indian diaspora. When our app moves money, a missed bug is a customer's rent, not a cosmetic glitch. ## About the role We're hiring our first dedicated Mobile QA Automation Engineer to own test automation for the ScopeX app on iOS and Android. You'll build the automation that lets our React Native team ship weekly with confidence, and you'll set the quality bar for mobile releases. You'll work directly with the mobile and backend engineers and report to the CTO. This is a hands-on engineering role: you write code every day, not test cases in spreadsheets. ## What you'll do - Design and build the mobile E2E test framework for our React Native app, covering iOS and Android from one codebase. - Automate the money-critical flows first: onboarding and KYC, login and 2FA, adding beneficiaries, quotes and FX rates, sending money, wallet top-ups, and transaction history. - Run tests in CI on every pull request and nightly on a real-device cloud, with results, screenshots and videos posted back to the PR. - Own API-level tests for the backend services the app depends on, so most logic is checked below the UI and E2E suites stay small and fast. - Build test data tooling: seeded test users, sandbox payment and KYC providers, and mocked network responses for edge cases (timeouts, declined payments, partial failures). - Keep the suite trustworthy: track flaky tests, quarantine and fix them, and keep the main pipeline under 15 minutes. - Define the release checklist and gate App Store and Play Store releases on automated results, including OTA update checks. - Cover the non-functional basics: accessibility checks, app performance (startup time, memory), and security smoke tests such as certificate pinning and secure storage. - Work with developers on testability: stable testIDs, debug menus, and feature flags that make the app easy to automate. - Use AI coding tools to speed up writing and maintaining tests, and review what they produce with a critical eye. ## What we're looking for ### Must have - 4+ years in QA automation, with at least 2 years automating native or React Native mobile apps. - Strong TypeScript or JavaScript: you write clean, reviewed test code with page objects or flow abstractions, not record-and-replay scripts. - Built or significantly reworked a mobile E2E framework that runs in CI on real devices. - Solid API testing: REST, auth flows (OAuth, JWT), and reading backend logs to find the root cause. - Know the iOS and Android differences that break tests: permissions, deep links, push notifications, biometrics, keyboards, OS versions. - A track record of cutting flakiness, with numbers you can talk about. - Clear written English for bug reports and test plans. ### Nice to have - Fintech, payments or banking experience: KYC, card or wallet flows, FX, idempotency and reconciliation. - Experience with regulated releases: audit trails, release sign-offs, compliance evidence. - Detox internals or native XCUITest/Espresso. - Performance or security testing on mobile. - Basic Go or SQL for checking data behind a transaction. ## Your first 90 days 1. Days 1-30: map the app's critical flows, audit existing tests and manual test cases in Qase, and agree on the target stack with the mobile team. 2. Days 31-60: framework in CI, smoke suite of the top 10 money flows running on every PR on iOS and Android. 3. Days 61-90: nightly regression on a device cloud, flaky-test tracking in place, and releases gated on automated results. ## Hiring process 1. Intro call with the hiring manager (30 min). 2. Technical interview: walk us through a framework you built and its trade-offs (60 min). 3. Practical task: automate two flows in a sample React Native app, then review it with us live (90 min, paid if done as a take-home). 4. Meet the team (45 min). ## What we offer - Ownership of mobile quality from day one, with a direct line to the CTO. - Budget for device cloud, tooling and AI coding assistants. ScopeX is an equal opportunity employer. We are committed to building an inclusive team.", "skills": [], "employment_type": "full-time", "exp_min": 4, "exp_max": null, "seniority": "senior", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 40.2, "matched_skills": ["qa", "test automation", "typescript", "javascript", "english", "sql"], "missing_skills": ["ios", "android", "react native", "payments", "artificial intelligence", "app store", "play store", "accessibility"], "also_on": [], "query": "engineer", "id": "wf3203566", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 2000000, "salary_lpa": 20.0, "salary_text": "₹15L – ₹20L • No equity", "semantic": 0.464, "score_confidence": "high", "is_mnc": false, "lpa": 20.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "ASIC Front-end Design engineer", "company": "Hewlett Packard Enterprise", "url": "https://www.linkedin.com/jobs/view/4490620086", "country": "IN", "location": "Greater Kolkata Area", "remote": null, "posted": "2026-11-16", "posted_at": null, "posted_raw": "1 day ago", "salary": "", "snippet": "", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_ port integration with wireless communication technologies such as Bluetooth Low Energy and Wi-Fi. - Develop reliable data handling, device management, error detection, and recovery mechanisms. - Diagnose communication and integration issues across multiple embedded subsystems. **Gimbal and Motor-Control Systems** - Develop firmware for gimbal control, stabilization, sensing, and motor-drive systems. - Integrate IMUs, encoders, motor drivers, and other motion-control sensors. - Work with BLDC motors, motor controllers, and electronic speed controllers. - Support the implementation and tuning of control algorithms for stabilization and motor control. - Diagnose timing, vibration, sensor, communication, and control-related issues. **Hardware Bring-Up and Device Drivers** - Develop and maintain board support packages, hardware-abstraction layers, and device drivers. - Bring up new microcontroller-based boards and validate clocks, memory, power sequencing, peripherals, and communication interfaces. - Port firmware to new hardware platforms and microcontroller variants. - Read electronic schematics and component datasheets to support firmware development and debugging. - Collaborate with hardware engineers to diagnose board-level and hardware-software integration issues. **Bootloaders and Firmware Updates** - Develop and maintain bootloaders and firmware-update mechanisms. - Support wired and wireless firmware-update workflows. - Implement firmware validation, rollback, recovery, and fail-safe mechanisms. - Improve the reliability and usability of production programming and update processes. **Debugging, Testing, and Validation** - Debug firmware using hardware debuggers, oscilloscopes, logic analyzers, and other laboratory instruments. - Develop unit, integration, hardware-in-the-loop, and system-level tests. - Investigate firmware defects, timing issues, memory corruption, communication failures, and hardware faults. - Perform root-cause analysis and implement corrective actions. - Support bench testing, field testing, flight trials, and production validation. - Maintain test procedures, debugging records, and technical documentation. **Production and Engineering Support** - Improve firmware build, programming, calibration, and production-test workflows. - Support manufacturing teams during board programming, testing, and failure analysis. - Use Git for version control, collaboration, code review, and release management. - Work with hardware, avionics, controls, and flight-test teams to resolve system-level issues. - Maintain clear documentation for firmware architecture, interfaces, configuration, and releases. ### Required Qualifications and Skills - Strong hands-on experience with Embedded C/C++ and low-level programming. - Experience with bare-metal development and microcontrollers such as STM32, ESP32, or similar platforms. - Understanding of microcontroller peripherals, interrupts, timers, ADCs, DMA, memory, and watchdogs. - Experience with UART, SPI, I2C, CAN, RS-485, and related embedded communication protocols. - Understanding of RTOS concepts, task scheduling, synchronization, concurrency, and inter-process communication. - Experience developing device drivers, board support packages, and hardware-abstraction layers. - Knowledge of bootloader development and firmware-update mechanisms. - Strong firmware debugging and root-cause analysis skills. - Experience using hardware debuggers, oscilloscopes, logic analyzers, and other laboratory instruments. - Ability to read electronic schematics, component datasheets, and technical documentation. - Basic hardware fault-finding and board bring-up skills. - Familiarity with Git and software version-control practices. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience with drones, UAV avionics, autopilots, or gimbal systems. - Knowledge of BLDC motors, motor drivers, electronic speed controllers, and motor-control techniques. - Experience integrating IMUs, encoders, cameras, or other UAV sensors and payloads. - Experience with Bluetooth Low Energy, Wi-Fi, or other wireless communication technologies. - Familiarity with control systems, sensor fusion, and stabilization algorithms. - Experience with PX4, ArduPilot, MAVLink, or similar UAV technologies. - Exposure to FPGA development and FPGA-microcontroller integration. - Experience taking embedded products from prototype through manufacturing and production. **Experience:** 2+ years in embedded software or firmware development. **Education:** B.E./B.Tech in Electronics and Communication, Electrical and Electronics, Instrumentation, Computer Science, or a related field.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 38.1, "matched_skills": ["data structures", "code review", "concurrency", "c"], "missing_skills": ["firmware", "embedded", "c++", "rtos", "stm32", "esp32", "bluetooth", "technical documentation"], "also_on": [], "query": "software-engineer", "id": "wf4867012", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 1600000, "salary_lpa": 16.0, "salary_text": "₹12L – ₹16L • No equity", "semantic": 0.268, "score_confidence": "high", "is_mnc": false, "lpa": 16.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6.0}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Senior Engineer, Application Development", "company": "Colt Technology Services", "url": "https://www.adzuna.in/land/ad/5969564108?se=OLSaKCTj8RGXMNRRpZDicQ&utm_medium=api&utm_source=28f9775f&v=ED023EABA61340243F1B6690C68A599A88A9B36B", "country": "IN", "location": "India", "remote": null, "posted": "2026-11-18", "posted_at": "2026-11-18T06:43:50+00:00", "posted_raw": "2026-11-18T06:43:50Z", "salary": "", "snippet": "This job ations, camera parameters and sensor orientation. • Convert measurements between image, sensor, platform and world coordinate systems. • Process data from cameras, gimbals and multiple sensors, including data that is noisy, incomplete or asynchronous. • Handle timing and synchronization across subsystems - sensor latency, processing delays, clock differences and missing data. • Implement recursive estimation techniques that maintain a running best estimate of system state as successive noisy measurements arrive, including prediction between updates and handling of the associated uncertainty. • Apply filtering, smoothing and numerical methods - interpolation, integration, iterative solvers, least-squares fitting to produce stable results from imperfect input. • Analyze recorded datasets, evaluate algorithm accuracy against reference data, and quantify sources of error. • Build Python and Qt-based tooling for simulation, visualization and analysis to support algorithm development and validation. • Optimize algorithms for accuracy, robustness and real-time performance. • Work closely with the computer vision, imaging, embedded and systems teams. **Required Skills** **Mathematics** A strong working command of most of the following, and the ability to derive results rather than only apply library functions: • Linear algebra; vector and matrix mathematics • Trigonometry, 2D and 3D geometry • Coordinate transformations and rotation representations • Numerical methods and optimization • Error analysis and uncertainty estimation • Signal processing fundamentals Above all, you should be able to take a mathematical model and turn it into software that behaves correctly outside of ideal conditions. **Software Engineering** • Strong C/C++ programming skills, particularly in numerical or algorithm-heavy code. • Good working knowledge of Python for prototyping, simulation and data analysis. • Experience with Qt for building desktop tools, visualization utilities and operator-facing interfaces. • Comfortable working in a Linux development environment, with CMake, Git and standard build and debugging tooling. • Ability to write clean, maintainable and testable code. **Qualifications** A Bachelor's or Master's in Computer Science, Mathematics, Applied Mathematics, Robotics, Mechanical Engineering, Control Systems or a related field. Demonstrated mathematical ability combined with solid software engineering experience matters more to us than the specific qualification.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Very fresh", "relevance": 1.0, "score": 33.6, "matched_skills": ["data structures", "linux"], "missing_skills": ["c++", "python", "computer vision", "embedded", "prototyping", "data analysis", "git", "robotics"], "also_on": [], "query": "engineer", "id": "wf4632624", "extra": {"company_size": "SIZE_201_500", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": false, "semantic": 0.281, "score_confidence": "high", "is_mnc": false}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Engineer - SDET ( Regression Testing)", "company": "Bitwarden", "url": "https://www.linkedin.com/jobs/view/4474029294", "country": "IN", "location": "Delhi, Delhi, India", "remote": null, "posted": "2026-11-17", "posted_at": "2026-11-17T12:46:29.104752+00:00", "posted_raw": "19 hours ago", "salary": "", "snippet": "", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 32.8, "matched_skills": [], "missing_skills": [], "also_on": [], "query": "engineer", "id": "li4474029294", "extra": {"linkedin_id": "4474029294", "salary_stated": false, "semantic": 0.341, "score_confidence": "low", "is_mnc": false, s the engine that drives our teams of innovators. We champion diversity of thought and ideas, we behave like leaders regardless of title, we are committed to achieving ambitious goals, and we love celebrating our wins – big and small. Supported by operating principles of being strategy-led, values-based and disciplined in execution, you’ll be inspired, connected, developed and rewarded here. Everything that makes you unique is welcome; join us and let’s build what’s next - together! Cloud Automation Engineer(3-5 years) Here at Anaplan, we have reinvented how companies see, plan, and run their businesses. Our platform allows our customers to uncover new insights, connect their strategy to their plans, and work in ways they had not previously thought possible. We’re growing fast, constantly innovating, and couldn’t be prouder to help our customers move forward with confidence in a sophisticated and changing world. We are looking for forward-thinking people who bend over backward to put customers first. Individuals who thrive on challenge and are ready to grasp the opportunity of a lifetime. Because we fundamentally believe every colleague brings unique value to our whole. We are a workplace where each person feels seen, heard, and valued, and can contribute their unique talent to our collective effort. We believe that for ourselves and for our customers. Cloud Automation Engineer – Anaplan IN We are looking for a Cloud Automation Engineer to join our growing team at Anaplan IN as part of the Foundation Engineering team. You'll be working in a global environment, supporting the development and maintenance of our hybrid multi-cloud infrastructure. This role is ideal for someone eager to grow their cloud automation skills while working on meaningful projects. You’ll work closely with experienced engineers, learning best practices in cloud architecture, automation, and infrastructure management. What you will do: • Support the design and implementation of scalable and secure infrastructure in a hybrid, multi-cloud environment (AWS/GCP/Azure). • Assist in managing infrastructure using Infrastructure as Code (IaC) tools like Terraform and Docker. • Develop and maintain configuration code with a focus on reusability and scalability. • Participate in the automation of testing and deployment of infrastructure. • Collaborate with Platform Engineering and other teams to ensure infrastructure meets scalability and resilience requirements. • Learn and contribute to cloud architecture best practices. • Help identify opportunities to optimize cloud resource usage and improve efficiency. • What we’re looking for: • Hands-on experience with public cloud platforms (AWS, GCP or Azure). • Experience with scripting languages such as Python or Bash. • Familiarity with version control systems like Git. • Understanding of automation tools such as Terraform. • Working knowledge of Linux/Unix operating systems and basic networking concepts. • Experience with or willingness to learn about REST APIs and automation pipelines. • BSc degree in Computer Science or related field, or equivalent practical experience. Preferred Experience (Nice to have): • Exposure to monitoring tools like Grafana or Prometheus. • Familiarity with CI/CD tools (e.g., Jenkins). • Basic knowledge of containerization technologies (Docker, Kubernetes). • Experience with configuration management tools (Ansible, Chef). This is a great opportunity to develop your cloud automation skills in a supportive environment while working on impactful projects at scale. If you’re eager to learn and ready to dive into cloud technologies, we’d love to hear from you! Our Commitment to Diversity, Equity, Inclusion and Belonging (DEIB) We believe attracting and retaining the best talent and fostering an inclusive culture strengthens our business. DEIB improves our workforce, enhances trust with our partners and customers, and drives business success. Build your career in a place where diversity, equity, plications using Gazebo or similar simulation environments. - Integrate perception outputs with guidance, navigation, control, and mission-planning systems. - Develop interfaces between onboard computers, flight controllers, payloads, and ground-control systems. - Diagnose issues across sensors, middleware, networks, embedded software, and onboard computers. **UAV and Autonomous Systems** - Develop perception and navigation capabilities for multirotor and fixed-wing UAV platforms. - Support obstacle detection, target tracking, visual navigation, inspection, and autonomous mission workflows. - Integrate onboard perception applications with PX4, ArduPilot, or similar flight stacks. - Support communication with flight controllers using MAVLink. - Work with QGroundControl, Mission Planner, and related UAV tools. - Collaborate with avionics, embedded software, controls, hardware, and flight-test teams. **Testing and Validation** - Conduct software-in-the-loop and hardware-in-the-loop simulations. - Develop test datasets, test scenarios, and acceptance criteria for perception systems. - Perform bench testing, field testing, and flight trials. - Evaluate system performance under representative operating and environmental conditions. - Diagnose sensor, communication, model, software, and system-level issues. - Perform root-cause analysis and implement corrective actions. - Maintain testing procedures, integration records, model documentation, and validation reports. **Application and Interface Development** - Develop supporting applications, visualization tools, and operator interfaces. - Build tools for model configuration, telemetry monitoring, data recording, playback, and analysis. - Support Qt-based software development when required. - Implement clear logs, diagnostics, and system-health reporting. - Maintain modular, testable, and documented software. ### Required Qualifications and Skills - Strong proficiency in Python. - Working proficiency in C/C++ for performance le CDSPACE is looking for Embedded Hardware Engineers to design, prototype, test, and integrate electronics for aerospace and UAV platforms. You will work across high-power and low-power electronics, motor controllers, UAV avionics, gimbal systems, FPGA-based designs, camera systems, and RF communication systems. The role covers the complete hardware lifecycle, from circuit design and component selection through PCB development, bench validation, manufacturing support, and flight integration. ### What You’ll Do **Electronic Systems Design** - Design and develop analog, digital, mixed-signal, and power-electronic circuits. - Develop low-power electronics for sensing, control, communication, and embedded computing. - Develop and validate high-power electronics for motor-control and power-distribution applications. - Select components based on electrical, thermal, reliability, availability, and production requirements. - Evaluate alternate components and document the engineering basis for substitutions. - Design protection, monitoring, and fault-detection circuits for reliable operation. **Motor Controllers and Power Electronics** - Develop, modify, and validate motor controllers and electronic speed controllers. - Work with BLDC and PMSM motors, three-phase inverters, switching devices, gate drivers, and current- and voltage-sensing circuits. - Evaluate motor-control hardware under different loads, operating conditions, and transient events. - Measure and optimize RPM, torque, voltage, current, power, efficiency, and thermal performance. - Diagnose switching, power-delivery, control, and electromagnetic-noise issues. **UAV Avionics and Gimbal Systems** - Design and integrate avionics hardware for UAV platforms. - Develop electronics for gimbal control, stabilization, motor drive, sensing, and camera integration. - Integrate flight controllers, sensors, payloads, power systems, and onboard computing hardware. - Support hardware bring-up and flight integration of avionics and gimbal subsystems. - Investigate system-level issues involving power, communication, sensing, and control. **FPGA and Digital Systems** - Support FPGA-based hardware development and integration. - Develop or integrate FPGA interfaces for high-speed data acquisition, signal processing, control, and communication. - Work with microcontrollers, processors, memory devices, and programmable logic. - Validate digital interfaces, timing, signal integrity, and hardware-software interactions. **RF Communication Systems** - Develop and integrate RF communication hardware for UAV and ground systems. - Support wireless telemetry, command-and-control links, and payload communication systems. - Evaluate RF modules, transceivers, interfaces, power requirements, and system compatibility. - Conduct bench and field testing to diagnose connectivity, interference, range, and reliability issues. **PCB Development and Manufacturing** - Read, review, and develop electronic schematics using KiCad. - Support PCB layout for high-power, low-power, mixed-signal, RF, motor-control, FPGA, and avionics designs. - Review PCB layouts for power integrity, signal integrity, grounding, thermal performance, manufacturability, and testability. - Prepare and maintain bills of materials, component specifications, assembly documentation, and test reports. - Coordinate with PCB fabrication, assembly, and manufacturing teams during prototyping and production. - Apply design-for-manufacturing and design-for-test principles to improve product reliability and testability. **Hardware Prototyping, Testing, and Validation** - Build prototypes and perform hardware bring-up, bench testing, and system integration. - Create test setups for motor controllers, avionics, gimbal systems, RF systems, power electronics, and camera hardware. - Use oscilloscopes, multimeters, current probes, logic analyzers, power supplies, electronic loads, and related laboratory instruments. - Conduct controlled tests across different loads, temperatures, operating conditions, and transient events. - Perform root-cause analysis across hardware, firmware, and system interfaces. - Implement corrective actions and verify their effectiveness. - Prepare test procedures, validation reports, and technical documentation. ### Required Qualifications and Skills - Strong understanding of analog, digital, mixed-signal, and power-electronic design. - Practical experience with high-power and low-power electronic systems. - Experience with Embedded C/C++ and microcontroller-based systems. - Familiarity with ARM-based microcontrollers, STM32, or similar platforms. - Understanding of BLDC/PMSM motors, three-phase inverters, motor controllers, and ESC architecture. - Knowledge of switching devices, gate drivers, current sensing, voltage sensing, power conversion, and protection circuits. - Understanding of UAV avionics, gimbal systems, sensors, payloads, and onboard electronics. - Familiarity with FPGA hardware, programmable logic, or high-speed digital interfaces. - Understanding of RF communication systems and wireless hardware integration. - Experience with communication protocols such as CAN, UART, SPI, I2C, and RS-485. - Experience with PCB design, component selection, hardware bring-up, and laboratory testing. - Ability to read and interpret electronic schematics and technical documentation. - Strong analytical, debugging, and problem-solving skills. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience developing hardware for drones, autonomous systems, robotics, or aerospace platforms. - Experience with FPGA development tools and hardware-description languages such as Verilog or VHDL. - Knowledge of RF testing, antenna integration, telemetry systems, or long-range communication links. - Experience with camera interfaces, image sensors, and high-speed data links. - Knowledge of electromagnetic compatibility, signal integrity, power integrity, and thermal design. - Experience taking electronic products from prototype through manufacturing and production. **Education:** Bachelor’s degree in Electrical Engineering, Electronics Engineering, Computer Engineering, or a related field.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 20.2, "matched_skills": [], "missing_skills": ["fpga", "embedded", "prototyping", "technical documentation", "monitoring", "firmware", "c++", "stm32"], "also_on": [], "query": "software-engineer", "id": "wf4867010", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 1600000, "salary_lpa": 16.0, "salary_text": "₹12L – ₹16L • No equity", "semantic": 0.188, "score_confidence": "high", "is_mnc": false, "lpa": 16.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6.0}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Engineer II, Systems Reliability Engineering", "company": "Levi Strauss", "url": "https://www.adzuna.in/details/5969235485?utm_medium=api&utm_source=28f9775f", "country": "IN", "location": "India", "remote": null, "posted": "2026-11-17", "posted_at": "2026-11-17T22:18:12+00:00", "posted_raw": "2026-11-17T22:18:12Z", "salary": "", "snippet": "Calling all originals: At Levi Strauss & Co., you can be yourself — and be part of something bigger. We're a company of people who like to forge our own path and leave the world better than we found it. Who believe that what makes us different makes us stronger. So add your voice. Make an impact. Find your fit — and your future. Introduction As an Engineer I, Systems Reliability Engineering, you w", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "V  Making accuracy and control the reason people choose us. ### What you’ll get to build next - Build a deep understanding of finance work, from matching messy records to reading financial documents, that in time leads to finance-specific models of our own. - Build toward a month-end close that largely runs itself. ### You’ll thrive here if - You have built software for finance, payments, accounting or fintech, and you know why accuracy matters. - You have shipped AI agents where “mostly right” was not good enough. - You have tamed messy external systems and made them reliable. - You enjoy sitting with finance teams and seeing your work change their month. ### Why Isomorph For fifty years, software inside a company has been written by a small group of engineers, for everyone else. That is ending. With AI, the people who know the work best (the finance analyst, the ops lead, the recruiter, the support manager) can now build the software they need themselves. Most of them have never written a line of code. This is one of the biggest shifts in how companies work, and it has a missing piece. The software these people build is useful, and very often unsafe: no sign-in, sensitive data exposed, nobody to run it, and invisible to IT. Multiply that across a large company and you get thousands of apps and agents that nobody governs. **Isomorph is the foundation that software runs on.** Bring an app or agent built with any AI tool, and Isomorph runs it on the company’s own cloud: secured, connected to company data and systems, monitored and kept healthy. Builders never think about infrastructure. IT stays in control of everything. We believe every company will become AI-native one workflow at a time, built by its own people. Isomorph is where that software will live. **The team.** You will join a small, high-talent-density founding team from IIT Madras and IIT Delhi. The founders are second-time founders who have built companies before and sold one. ### Why you’ll love it here - <script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const META = DATA.meta || {};
  const JOBS = DATA.jobs || [];
  const COUNTRIES = DATA.countries || [];
  const SCORED = JOBS.some(j => j.score !== null && j.score !== undefined);
  const STATE_KEY = 'jobhunt:state';
  const UI_KEY = 'jobhunt:ui:' + (META.run_id || 'run');

  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  const S = Object.assign({ applied: {}, saved: {}, hidden: {} }, load(STATE_KEY, {}));
  const ui = Object.assign({
    country: 'ALL', q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any',
    sort: SCORED ? 'score' : 'fit', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false,
  }, load(UI_KEY, {}));
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // theme
  const savedTheme = load('jobhunt:theme', null);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  $('theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); save('jobhunt:theme', next);
  };

  // header
  const roles = (META.roles || []).join(', ');
  const exp = META.experience_label ? ` · <b>${esc(META.experience_label)}</b> experience` : '';
  const cs = COUNTRIES.filter(c => c.code !== 'REMOTE').map(c => c.flag + ' ' + c.name).join(', ');
  $('criteria').innerHTML = `<b>${esc(roles)}</b>${exp} · ${esc(cs)}${META.resume_name ? ' · scored against <b>' + esc(META.resume_name) + '</b>' : ''} · ${esc(META.generated || '')}`;
  const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));
  const blocked = new Set((DATA.sources || []).filter(s => s.status !== 'ok').map(s => s.source_name));
  $('stats').innerHTML = `<b>${JOBS.length}</b> jobs · <b>${okSources.size}</b> sources${blocked.size ? ` · <span title="${esc([...blocked].join(', '))}">${blocked.size} unavailable</span>` : ''}`;

  // sources panel
  const grid = $('srcGrid');
  const bySrc = {};
  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });
  grid.innerHTML = Object.keys(bySrc).sort().map(name => {
    const rows = bySrc[name];
    const total = rows.reduce((a, r) => a + (r.count || 0), 0);
    const bad = rows.filter(r => r.status !== 'ok');
    const cls = bad.length === rows.length ? (bad[0].status) : 'ok';
    const detail = rows.map(r => `${r.country}${r.status === 'ok' ? ':' + r.count : ' ' + r.status}`).join(' ');
    return `<div><span class="${cls}">●</span> ${esc(name)} <b>${total}</b> <span class="cc" title="${esc(bad.map(b => b.error || '').join('\n'))}">${esc(detail)}</span></div>`;
  }).join('');
  $('srcSummary').textContent = `Sources (${Object.keys(bySrc).length}) — click to see per-country counts; blocked platforms have direct search links under each country tab`;

  // fit chips
  const FITS = [['fit', 'Fit'], ['stretch', 'Stretch'], ['unknown', 'Unknown'], ['over', 'Overqualified'], ['no', 'Too senior']];
  function renderFitChips() {
    $('fitChips').innerHTML = FITS.map(([k, l]) => `<button class="chip ${ui.fits.includes(k) ? 'on' : ''}" data-fit="${k}">${l}</button>`).join('');
  }
  $('fitChips').onclick = e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;
    const k = b.dataset.fit; ui.fits = ui.fits.includes(k) ? ui.fits.filter(x => x !== k) : ui.fits.concat(k); persist(); render();
  };

  // sort options
  const SORTS = SCORED ? [['score', 'Best match'], ['date', 'Newest'], ['fit', 'Experience fit'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']]
                       : [['fit', 'Experience fit'], ['date', 'Newest'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']];
  $('sort').innerHTML = SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (!SCORED) $('scoreRange').style.display = 'none';

  // source select
  const srcNames = [...new Set(JOBS.map(j => j.source_name))].sort();
  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs
  function renderTabs(counts) {
    const tabs = [{ code: 'ALL', name: 'All', flag: '' }].concat(COUNTRIES);
    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src; $('viaSel').value = ui.via || '';
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  $('viaSel').onchange = () => { ui.via = $('viaSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly', 'mncOnly', 'highPay'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; $('viaSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'via', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved', 'exp_class', 'freshness']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '', j.exp_class || '', j.freshness || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;

    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();

<script>
(function () {

  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
</body>
</html>
