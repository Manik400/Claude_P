87-junior-software-engineer-m-f-d-typescript-javascript", "country": "DE", "location": "Munich", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "", "snippet": "**KINEXON Sports** stands as a **global pioneer in delivering cutting-edge tracking and analysis technology** tailored for **professional sports**. We track movement and position data of players and official match balls, transform it into valuable analyses and insights, and assist professional teams and leagues in using data for pioneering innovative strategies. ### ABOUT THE TEAM We are a cross-f", "description": "**KINEXON Sports** stands as a **global pioneer in delivering cutting-edge tracking and analysis technology** tailored for **professional sports**. We track movement and position data of players and official match balls, transform it into valuable analyses and insights, and assist professional teams and leagues in using data for pioneering innovative strategies. ### ABOUT THE TEAM We are a cross-functional engineering team dedicated to empowering sports clients worldwide. We build the vital applications used to configure and control our advanced tracking systems. By translating complex tracking data into intuitive visual analytics, we help athletes and coaches maximize their performance. Our tech stack spans frontend and backend development, along with seamless 3rd-party API integrations. Want to shape the future of sports technology? Join us to expand our product ecosystem and work alongside talented software experts to build the next generation of KINEXON solutions! ### OUR TECH STACK - **Backend:** Our services are mostly driven by TypeScript/JavaScript, with some components built in PHP. We manage data across a variety of databases, including MySQL, PostgreSQL, Redis, and MongoDB. - **Frontend:** We build our modern, responsive user interfaces using Angular. - **Testing:** To ensure high quality and reliability, we rely on a comprehensive testing strategy that i eir physical and digital materials into view. Our work combines archival expertise, digitization, and", "description": "# Software Engineer ## About Historiq Historiq’s mission is to get history out of boxes and help cultural heritage professionals make a bigger impact at their organizations. We work with archives, libraries, museums, and other organizations responsible for historical collections to bring more of their physical and digital materials into view. Our work combines archival expertise, digitization, and purpose-built technology to modernize how collections are arranged, described, managed, and discovered. Historiq includes both archivist-led services and Historiq Una, our collections management platform. Across both, our goal is the same: help the people who care for collections work more effectively and make more history accessible. ## The role As a Software Engineer at Historiq, you’ll help design and build the products and systems that support our platform. The role spans frontend, backend, data, and infrastructure work. You may work on a web interface, add an API, improve a database-backed feature, or help build systems for collaboration, media processing, and digitization workflows. You’ll work with experienced engineers, contribute to real product features, and take on more responsibility as you grow. This role is intended for candidates with approximately 0–2 years of professional software engineering experience. Internships, research, open-source work, and substantial personal or academic projects can all be relevant experience. ## What you'll do - Build and ship features across frontend and backend applications. - Implement APIs, application logic, and database-backed functionality. - Work with relational data models and database migrations. - Build interfaces for digitization, archival processing, collaboration, and publishing. - Help develop reliable file upload, synchronization, and media-processing workflows. - Contribute to real-time and multi-user product experiences. - Write unit, integration, and end-to-end tests. - Debug issues across browsers, APIs, background jobs, databases, and cloud services. - Participate in code reviews and technical discussions. - Learn how applications are deployed, monitored, and operated in production. - Improve documentation, developer tooling, and automated tests. - Take ownership of increasingly complex features as you gain experience. ## Our technology We work with a modern full-stack environment centered around Python, TypeScript, React, PostgreSQL, and cloud infrastructure. Our systems include web applications, backend APIs, real-time communication, background processing, large-file and image workflows, desktop software, and AI-assisted document processing. You are not expected to know all of these areas before joining. ## What we're looking for - 0–2 years of professional software engineering experience, or equivalent experience through internships, research, open-source contributions, or substantial projects. - Working knowledge of at least one general-purpose programming language - Understanding of core software engineering concepts such as data structures, APIs, HTTP, and source control. - Some experience building a web application, backend service, desktop application, or other non-trivial software project. - Familiarity with relational databases and SQL. - Experience using Git. - An interest in writing well-tested, maintainable code. - Ability to investigate problems and learn unfamiliar technologies. - Clear written communication. - Interest in working across different parts of a software system. A computer science degree is not required. We care about what you can build, how you approach problems, and your ability to learn. ## Helpful experience Any exposure to the following can be useful: - Modern frontend development - Backend APIs and web services - Docker or cloud platforms. - Automated testing - Real-time applications - Image, media, or file-processing software - Desktop applications - AI/LLM APIs, OCR, or computer vision ## How we work We build iteratively and directly with the people who use our products, including archivists and other cultural heritage professionals. Their workflows and feedback shape what we build and how we improve it. We work very collaboratively across a largely remote team, with cross-functional collaboration at every level of the company. We care deeply about the problems we are solving and the impact we want to have: helping make more historical materials physically and digitally accessible much more quickly than ever before. We value accountability and teamwork in service of that mission.", "skills": [], "employment_type": "full-time", "exp_min": 0.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 64.6, "matched_skills": ["code review", "typescript", "react", "postgresql", "data structures", "sql", "docker", "test automation"], "missing_skills": ["artificial intelligence", "python", "git", "llm", "computer vision"], "also_on": [], "query": "software-engineer", "id": "wf4809686", "extra": {"company_size": "SIZE_1_10", "salary_stated": false, "semantic": 0.321, "score_confidence": "high", "ai_summary": {"why": "Candidate has 2 years of experience with Python, React, PostgreSQL, and cloud infrastructure, matching the core tech stack and role requirements.", "gaps": "Lacks specific Python and Git skills; candidate is strong in Java/TypeScript but needs to bridge the gap in Python and version control."}, "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Historiq%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Haverhill%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Historiq%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter i kehität ohjelmistoja, työkaluja ja automaatioita suunnittelutoiminnan tarpeisiin. Pääset työskentelemään yhdessä LVI-, sähkö-, prosessi- ja rakennusautomaation sekä ympäristö- ja turvallisuustekniikan suunnittelijoiden kanssa ja ratkaisemaan käytännön ongelmia ohjelmistokehityksen avulla. Et tarvitse aiempaa kokemusta rakennus- tai talotekniikan alalta tai suunnittelijoiden käyttämistä ohjelmistoista. Tärkeintä on vahva kiinnostus ohjelmistokehitykseen, ongelmanratkaisuun ja uuden oppimiseen. Työn ohessa tutustut suunnittelutyöhön, alan toimintatapoihin ja suunnittelussa hyödynnettävään tietoon. Tehtävänkuva Työsi voi sisältää esimerkiksi: • Suunnittelutyökalujen kehittämistä: kehität suunnittelijoiden käyttöön erilaisia työkaluja ja automaatioita. Työ voi tarkoittaa esimerkiksi C#-pohjaisten ratkaisujen rakentamista Autodesk Revit -ympäristöön tai Pythonilla toteutettavia skriptejä. • Datan käsittelyä ja automatisointia: haet, muokkaat ja yhdistät tietoa eri järjestelmistä ja tietolähteistä. Kehitettävät ratkaisut voivat liittyä esimerkiksi laite- ja tuotetietojen, luetteloiden tai muiden suunnittelutietojen muodostamiseen ja ylläpitoon. • Ohjelmistojen ja järjestelmien integrointia: hyödynnät rajapintoja, tietokantoja ja muita teknologioita tiedon siirtämiseen eri järjestelmien välillä. • Tarpeiden tunnistamista ja ratkaisujen toteuttamista: työskentelet suunnittelijoiden kanssa, selvität heidän tarpeitaan ja viet ratkaisuja ideasta toteutukseen, testaukseen ja käyttöönottoon. • Suunnittelijoiden arjen tukemista: osallistut osaltaan suunnittelussa käytettävien ohjelmistojen teknisten ongelmien selvittämiseen ja tunnistat samalla uusia kehitysmahdollisuuksia. • Toimialan ja tietomallipohjaisen suunnittelun oppimista: tutustut työn kautta talotekniikan suunnitteluun, suunnittelutietoon ja tietomallintamisen (BIM) perusteisiin. Tehtävässä yhdistyvät ohjelmistokehitys ja käytännön suunnittelutyön tukeminen. Työn painotus voi ajan myötä muodostua oman osaamisesi ja k 2938", "country": "IN", "location": "Vadodara", "remote": null, "posted": "2026-10-12", "posted_at": "2026-10-12T09:39:02.500000+00:00", "posted_raw": 1791797942500, "salary": "Not Disclosed", "snippet": "1-2 years experience with TypeScript (Node.js and React), PostgreSQL schema design, RESTful API, JWT/OAuth authentication, Docker, AWS deployment, and automated testing|Build responsive React/TypeScript UIs, design REST/WebSocket APIs, implement multi-tenant PostgreSQL schemas, integrate WhatsApp Business API and payment gateways, containerize services with Docker, maintain CI/CD pipelines, and ow", "description": "<b>About the Role<\/b><br /><p>We are hiring a Full-Stack Developer to own features end to end: Postgres schema, backend API, React/Next.js UI, deployment and production support.<\/p><p>Our stack is Node.js and Go on the backend, React with TypeScript on the frontend, PostgreSQL (multi-tenant), real-time events over WebSockets and message brokers like kafka, WhatsApp Business API for messaging and calling, and Docker on AWS EC2 behind nginx, deployed through GitHub Actions. We practise test-driven development and use AI coding tools daily to ship faster. You do not need all of this on day one, but you must be strong in Node, React, TypeScript and Postgres, and willing to learn the rest quickly.<\/p><b>Key Responsibilities<\/b><br /><ul><li>Build responsive, accessible UI in React and TypeScript for the customer app, planner portal and admin dashboard.<\/li><li>Create reusable components and hooks; keep the component library consistent with the designer's wireframes.<\/li><li>Consume REST APIs and WebSocket streams; handle loading, error and reconnect states properly.<\/li><li>Keep bundle size and render performance in check; profile and fix slow screens.<\/li><li>Design and build REST and WebSocket APIs in Node.js (TypeScript).<\/li><li>Write Go services for high-throughput or latency-sensitive paths (event fan-out, call handling, background workers).<\/li><li>Design multi-tenant PostgreSQL schemas: tenant isolation, indexing, migrations, query performance.<\/li><li>Implement authentication and authorization (JWT, OAuth, role-based access) across tenants.<\/li><li>Add structured logging, error handling, input validation and rate limiting on every endpoint you ship.<\/li><li>Build event-driven flows using pub/sub and a message broker (Redis Streams, Kafka, RabbitMQ or SQS) so updates reach many tenants reliably.<\/li><li>Integrate the WhatsApp Business (Cloud) API for template and session messaging, webhooks, and voice calling.<\/li><li>Integrate payment gateways, email providers and other third-party services.<\/li><li>Design for failure: retries, idempotency, dead-letter handling, backpressure.<\/li><li>Containerise services with Docker; deploy to AWS EC2 behind nginx (reverse proxy, TLS, load balancing).<\/li><li>Maintain CI/CD on GitHub Actions: tests, builds, deployments; keep the pipeline green.<\/li><li>Write tests first where it matters (unit, integration, API) and treat failing CI as a blocker.<\/li><li>Set up basic monitoring and alerting for what you ship; own production issues through to the fix.<\/li><\/ul><b>Required Skills and Qualifications<\/b><br /><ul><li>All of the following are required. We will test them in the interview.<\/li><li>1-2 years building and shipping web applications that real users depend on.<\/li><li>Strong TypeScript on both backend (Node.js) and frontend (React with hooks and context).<\/li><li>PostgreSQL beyond CRUD: schema design, indexes, migrations, reading query plans.<\/li><li>RESTful API design, HTTP semantics, JSON, authentication (JWT or OAuth).<\/li><li>HTML5, CSS3 and responsive layout.<\/li><li>Git with branching and pull-request workflows; Docker for local and deployed services.<\/li><li>Has deployed and maintained an application on a Linux server or AWS, not only localhost.<\/li><li>Writes automated tests and can explain what to test and why.<\/li><li>Uses AI coding assistants daily and reviews their output critically.<\/li><li>Can debug an unfamiliar codebase independently and explain findings clearly in writing.<\/li><\/ul><b>Nice to Have<\/b><br /><ul><li>Go in production, or a strong interest in learning it.<\/li><li>Multi-tenant SaaS: tenant isolation, row-level security, per-tenant performance.<\/li><li>Real-time systems: WebSockets, pub/sub, Redis Streams, Kafka, RabbitMQ or SQS.<\/li><li>WhatsApp Business API, or other messaging and telephony integrations.<\/li><li>nginx configuration, TLS, reverse proxying, basic server hardening.<\/li><li>GitHub Actions pipelines beyond the basics (caching, matrix builds, environment deploys).<\/li><li>Testing tools such as Jest, Vitest, Playwright or Go's testing package.<\/li><li>Experience at an early-stage startup or on a small team that shipped fast.<\/li><\/ul><br /><b>Soft Skills<\/b><br /><ul><li>Ownership: you see a feature through from idea to production and stay with it when it breaks.<\/li><li>Works independently with little supervision; asks for help early when blocked.<\/li><li>Clear written communication: PR descriptions, short design notes, honest status updates.<\/li><li>Learn new tools fast and is comfortable being the one who figures something out first.<\/li><li>Team-first: reviews others' code carefully and takes review feedback well.<\/li><\/ul><br /><b>Education<\/b><br /><p>Graduate<\/p>", "skills": ["ai", "aws", "call handling", "css3", "docker", "ec2", "full stack", "full stack developer", "git", "github", "html5", "js", "json", "kafka", "linux", "load balancing", "nginx", "node", "payment gateways", "postgres", "postgresql", "pr", "rabbitmq", "react", "redis", "restful", "sqs", "typescript", "ui"], "employment_type": "Full Time, Permanent", "exp_min": 1.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 58.5, "matched_skills": ["postgresql", "react", "typescript", "docker", "aws", "rest api", "kafka", "ec2", "rabbitmq", "github ac  with critical servicing workflows. Kato takes a different approach. Regulations aren’t an afterthought - they’re the foundation. We start with a regulatory rules system and layer an AI decision engine on top of it. With this architecture, we’re building an AI-powered servicing platform that automates critical workflows across every channel with full compliance and best-in-class recoveries. Human teams are then free to focus only on the judgment-driven work that truly needs them. We are starting today with a compliance first Voice AI agent that handles outbound and inbound loan servicing calls, and are already in production with major names in the fintech lending space like Bilt Rewards and Parafin. Kato is founded by a team with deep operating expertise in financial services and software engineering: * Pratik Risbud (CEO/Co-Founder): Former Investment Banker at Goldman Sachs and led Credit/Operations at Brex * David Zhu (CTO/Co-Founder): Former Software Engineer at Google and Engineering Manager at Brex Kato is backed by institutional capital from Pear VC and angel investors from top tech companies such as Brex, Bridge, and Square. We are looking for top talent to join our team and power our growth. **The Role** We're seeking a driven, high-impact Software Engineer to work directly with customers to build impactful new products and improvements. As our second engineering hire, you'll have an unparalleled opportunity to shape our technical foundation and future. You'll own mission-critical projects driving company success, initially focusing on onboarding new customers and augmenting our voice agent framework as new customer needs arise. The role spans our entire technical stack - from real-time voice processing to customer-facing dashboards, infrastructure scaling, and product expansion. There will be significant opportunities to define product direction, build out engineering best practices and technical standards, and rapidly grow your scope and career. Reporting directly to the CTO, this full-time role includes significant equity ownership. **Key Responsibilities** * Lead architecture and implementation of our real-time voice processing system * Design and build scalable, fault-tolerant distributed systems * Optimize LLM integration for natural, compliance-aware conversations * Develop internal tools for voice agent monitoring and improvement * Build customer-facing dashboards and reporting systems * Partner with customers to translate requirements into technical solutions * Establish engineering best practices and technical standards * Drive technical decisions that shape product direction **Requirements** **Must Have**: * Bachelor's degree in Computer Science or related field * Excellent problem-solving and architectural thinking * Strong communication and organizational skills * \"Owner's mindset\" with bias for action * Lives and breathes product and code quality * Endless curiosity and learning drive **Nice to Have**: * 1-5 years of production software engineering experience * Strong background in API design * Experience with cloud infrastructure (AWS/GCP) * Experience with real-time audio processing or WebRTC * Background in Golang, TypeScript, or React * Experience with LLM integration and prompt engineering * DevOps and infrastructure automation experience * Fintech or financial systems background **Tech Stack** * Backend: Golang, PostgreSQL, * Frontend: TypeScript, React * Infrastructure: AWS, Terraform, Kubernetes, Docker * AI/ML: Large Language Models, Speech To Text, Text To Speech, LangChain * DevOps: GitHub Actions, Datadog **Why Join Us** * Work with experienced founders who've built and scaled financial products for 9+ years * Work with a CTO with experience in all stages of engineering maturity from 0 to 1, * mid-stage startups, all the way to large enterprise companies * Build something meaningful - this won’t be a 9-to-5. It will be intense, rewarding, and * career-defining. You will own core customer relationships and parts of the technical stack * from day one. * Shape the technical foundation of a product revolutionizing a $58BN market * Get unmatched career acceleration: you’ll be working directly with customers getting * direct feedback and direction from customer needs. * Direct impact on product strategy and company direction * Work with cutting-edge technologies in AI, voice processing, and cloud infrastructure * Define engineering culture and practices from the ground up", "skills": [], "employment_type": "full-time", "exp_min": 1, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 57.5, "matched_skills": ["aws", "typescript", "react", "devops", "distributed systems", "api design", "webrtc", "postgresql", "docker", "github actions"], "missing_skills": ["artificial intelligence", "llm", "fintech", "golang", "ai agents", "monitoring", "gcp", "prompt engineering"], "also_on": [], "query": "software-engineer", "id": "wf4762844", "extra": {"company_size": "SIZE_1_10", "salary_stated": true, "salary_inr": 10133760, "salary_lpa": 101.3, "salary_text": "oduct revolutionizing a $58BN market * Get unmatched career acceleration: you’ll be working dir", "semantic": 0.413, "score_confidence": "high", "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Kato%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22San%20Francisco%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Kato%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22San%20Francisco%22"}, "Engineering managers": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Kato%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22San%20Francisco%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%2 .js.<\/li><li>This position is based at our Hyderabad office.<\/li><li>A 15 years full time education is required.<br /><br /><b> Qualification<\/b> 15 years full time education<\/li>", "skills": [".net", "angular", "angularjs", "api", "asp.net", "asynchronous apex", "aws", "aws cloudformation", "c#", "css", "events", "graphql", "html", "java", "javascript", "jquery", "json", "kubernetes", "mongodb", "mysql", "node", "node.js", "nosql", "oops", "react.js", "rest", "software development", "sql", "sql server", "troubleshooting", "abap", "ATCI-5081543-S1879069", "c++", "code review", "data structures", "device drivers", "file system", "gcp", "kernel", "linux", "microsoft azure", "python", "rtos", "sap", "sap basis", "sap basis administration", "sap netweaver", "solman", "system architecture"], "employment_type": "Full Time, Permanent", "exp_min": 1.0, "exp_max": 4.0, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 57.5, "matched_skills": ["aws", ".net", "angular", "sql", "c#", "css", "html", "java", "javascript", "react", "code review", "data structures"], "missing_skills": ["node.js", "sap", "cloudformation", "kubernetes", "graphql", "apex", "jquery", "mongodb"], "also_on": [], "query": "software engineer", "id": "nk121026925061", "extra": {"naukri_id": "121026925061", "company_apply": true, "applicants": 22, "rating": "3.7", "salary_stated": false, "semantic": 0.316, "score_confidence": "high", "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Accenture%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Hyderabad%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Accenture%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Hyderabad%22"}, "Engineering managers": {"linkedin": "https://www.linkedin.com/search/result  visual modeling, abstracting away sophisticated coding. We enable seamless collaboration between business users and developers, accelerating digital transformation for our customers worldwide. Discover how global organizations are innovating with Mendix by exploring our Customer Stories. About The Role Are you a passionate and innovative software developer eager to shape the future of application development? Siemens Digital Industries Software is seeking a talented Junior Software Developer to join our Mendix team. In an era where AI-assisted platforms are revolutionizing how applications are built, Mendix stands at the forefront, empowering both technical and non-technical users to create powerful solutions with unprecedented speed and collaboration. Unlike traditional programming approaches that can obscure business logic, Mendix offers a clear, visual development environment. This enables diverse stakeholders, from business analysts to software engineers, to actively participate in the development process, fostering understanding and delivering superior applications faster. Your contributions will directly enhance the productivity and innovation capabilities of development communities worldwide. What You'll Do Take part in the development of the Mendix platform, a leading low-code application development solution. Engage in short feedback cycles to break down complex challenges and construct effective solutions. Take ownership of your work and contribute to team success. Thrive in a collaborative environment, actively participating in discussions and knowledge sharing. Contribute to the entire software development lifecycle, from conceptualization and design to testing, deployment, and maintenance. What You'll Bring We're looking for a motivated individual with: A Bachelor's or equivalent experience in Software Engineering, Computer Science, or a related technical field. Demonstrated proficiency in at least one modern programming language, such as C# or TypeScript. Familiarity with AI-assisted development tools and a keen interest in employing them to improve efficiency. A strong passion for technology, coupled with excellent problem-solving and analytical skills. The ability to learn quickly, adapt to new technologies, and adopt continuous improvement. Strong communication and social skills, with a desire to work optimally within a team. What We Offer At Siemens Digital Industries Software, we are committed to fostering a supportive and rewarding work environment. We offer: A competitive salary with regular performance evaluations and clear opportunities for career advancement. Generous paid time off (30 days PTO) to support a healthy work-life balance. A flexible hybrid work model that combines the benefits of office collaboration with remote flexibility. Dedicated \"crafting days\" (2 per month) to focus on personal development, innovation, or learning new skills. Comprehensive career development training and continuous learning opportunities. A dedicated training budget for professional development to help you grow your expertise. Engaging team events and outings, fostering a strong sense of community. Excellent daily lunch options at the office (where applicable). Flexible working hours to accommodate individual needs and promote well-being. Support for various modes of travel to and from the office (where applicable). Why Us? At Siemens Software, flexibility is how we work—hybrid by default, built on trust and autonomy. Together, 30,000 people across more than 200 countries build technology that shapes the real world. You'll grow through real projects, strong technical peers, and global mobility, backed by the scale and benefits of an industrial software leader. We're committed to equality and inclusion, and we hire based on merit, skills, and impact. Bring your curiosity and creativity and help us shape tomorrow! Our Commitment to Equity and Inclusion in our Diverse Global Workforce: We value your unique identity and perspective. We are fully committed to providing equitable opportunities and building a workplace that reflects the diversity of society, while ensuring that we attract the best talent based on qualifications, skills, and experiences. We welcome you to bring your authentic self and transform the everyday with us. Compensation & Benefits The salary range for this position is €55-65,000 annually, and this role is eligible to earn incentive compensation. The actual compensation offered is based on the successful candidate's job-related skills, experience, and relevant education/training. Siemens offers health and wellness benefits to employees; you can access the benefits available in your country via the link: https://jobs.sw.siemens.com/benefits/ Location: Rotterdam, Netherlands Relocation assistance is not provided for this position. Candidates must be able to work from the specified location without company-sponsored relocation support. Additionally, f or this specific role, we are only considering candidates who currently have a valid work permit for the Netherlands and do not require sponsorship. Siemens Software. Transform the Every day. #TeamSiemens #TransformTheEveryday #SaaS We may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses and identifying potential inconsistencies or verification signals in application materials based on available information. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us.", "skills": [], "employment_type": "Full-time", "exp_min": null, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 56.8, "matched_skills": ["c#", "typescript"], "missing_skills": ["artificial intelligence"], "also_on": [], "query": "software engineer", "id": "li4455890559", "extra": {"linkedin_id": "4455890559", "seniority_level": "Not Applicable", "details_fetched": true, "salary_stated": false, "semantic": 0.198, "score_confidence": "high", "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Mendix%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Rotterdam%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Mendix%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Rotterdam%22"}, "Engineering managers": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Mendix%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22Rotterdam%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Mendix%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22Rotterdam%22"}, "Head of Engineering / CTO": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Mendix%22%20%28%22Head%20of%20Engineering%22%20OR%20%22VP%20Engineering%22%20OR%20%22CTO%22%29%20%22Rotterdam%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Mendix%22%20%28%22Head%20of%20Engineering%22%20OR%20%22VP%20Engineering%22%20OR%20%22CTO%22%29%20%22Rotterdam%22"}, "Senior software engineer": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Mendix%22%20%28%22Senior%20software%20engineer%22%29%20%22Rotterdam%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Mendix%22%20%28%22Senior%20software%20engineer%22%29%20%22Rotterdam%22"}}}}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Senior Backend Engineer (Platform Team)", "company": "Kombo (YC S22)", "url": "https://wellfound.com/jobs/4678063-senior-backend-engineer-platform-team", "country": "DE", "location": "Berlin", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "", "snippet": "Hey, I'm [Niklas](https://www.linkedin.com/in/niklashigi/), co-founder and lead of our Platform Engineering team at Kombo! I’m looking for an excellent backend engineer with high agency who gets excited about the hardest technical parts of scaling a product: performance bottlenecks, risky migrations, reliability, infrastructure, and the tooling that helps engineers operate all of it safely. **This", "description": "Hey, I'm [Niklas](https://www.linkedin.com/in/niklashigi/), co-founder and lead of our Platform Engineering team at Kombo! I’m looking for an excellent backend engineer with high agency who gets excited about the hardest technical parts of scaling a product: performance bottlenecks, risky migrations, reliability, infrastructure, and the tooling that helps engineers operate all of it safely. **This is a Berlin-based on-site role.** # **What we are Building** We are building the infrastructure platform that HR tech products are built on, from emerging category leaders like [Juicebox](https://juicebox.ai/) to established players like [Indeed.com](http://Indeed.com). Because my three co-founders and I are engineers ourselves, we were always drawn to the deeply technical problems. That's how we ended up building infrastructure for HR tech providers. Concretely, we’ve built a unified API, a massive data synchronization engine, an observability platform, and an embedded integration setup/configuration UI. We offer this to other software companies so that they can provide prebuilt integrations with HR, ATS, LMS, and Payroll systems to their customers, instead of building and maintaining hundreds of integrations themselves. You can read more about our product here: [What is the Kombo product?](https://app.notion.com/p/What-is-the-Kombo-product-2fb6526d848a806793d1ccde34243879?pvs=21) We reached product-market fit about 1.5 years ago. Since then, both our revenue and product usage picked up with insane growth. Currently, we are at \\>10M annual recurring revenue, power integrations for more than 15,000 companies, and sync data of more than 250 million people globally. We are setting the standard for how companies build product on top of the most complicated enterprise systems. We’ve raised $30M of total funding to date and our growth rate puts us in the top 5% of VC funded startups worldwide. # Platform Engineering at Kombo Most Engineering teams at Kombo are organized around the different product verticals we serve. The Platform team exists as a “horizontal” team that serves the needs of our Engineering org across the board. We work on shared technical problems whose impact cuts across our Product Engineering teams: scaling our infrastructure, finding and fixing bottlenecks in our application and databases, improving our CI and development workflows, and evolving how we handle on-call and incident response. This is **not a traditional infrastructure or SRE role**. We are looking for an excellent backend engineer who wants to work on the parts of our system where application code meets infrastructure: scalability bottlenecks, database performance, reliability, high-risk migrations, developer tooling, and production incidents. You will work across both backend code and infrastructure. Deep prior expertise in every part of our stack is not required, but strong software engineering fundamentals and genuine excitement about infrastructure-heavy problems are. Just some examples of projects you would’ve worked on in the past: - migrating all our API services from Cloud Run to Kubernetes, including autoscaling, graceful shutdown, traffic routing, and production health dashboards - investigating and fixing memory leaks in our Node.js application using heap snapshots, allocation profiles, and garbage collection metrics - investigating Postgres performance bottlenecks using query plans and production traces, then improving queries and designing appropriate indexes - designing and rolling out a new scalable and more cost-efficient storage layer for our customer-facing logs product using Google Cloud Storage and Parquet - building a flexible static egress IP infrastructure so integration partners and enterprise customers can allowlist Kombo traffic - moving alerting and on-call from OpsGenie to [incident.io](http://incident.io), including team routing, priorities, severity tagging, and Terraform-managed alert policies - collaborating with our ATS Product Engineering team to design a new syncing approach that fixes timeout and rate limiting troubles when synchronizing data for large ATS tenants - improving local developer tooling with Cursor/Claude/Codex workflows, VS Code tasks, Git hooks, gcloud auth helpers, and CI automation While we’re currently the ones holding “god mode” access to our infrastructure and handling on-call for P1/P2 alerts, part of our work for the coming 1-2 years will be empowering the individual Product Engineering teams to own and operate more of their own infrastructure - making sure we can scale our Engineering org without us becoming the bottleneck. # What We Are Looking For First and foremost, we are looking for an excellent backend engineer. You do not need to arrive as an expert in every part of our infrastructure, but you should have strong software engineering fundamentals and be genuinely excited to work closer to infrastructure, reliability, and developer tooling. ### What matters most - Strong backend engineering fundamentals and experience building production services, APIs, and database-backed systems - A methodical approach to debugging complex problems and finding their actual root cause - The diligence to make high-risk changes safely, including thinking through failure modes, observability, rollout, and rollback - The ability to own ambiguous technical problems and communicate clearly without needing close management - Curiosity and the ability to learn unfamiliar parts of a system quickly ### Strong signals - Deep experience with TypeScript and Node.js - Postgres performance work, including query analysis, indexing, or data-model design - Profiling, benchmarking, tracing, or debugging production systems - Ownership of large-scale or high-risk migrations - Experience with distributed systems, internal tooling, or shared backend infrastructure ### Helpful, but not required - Kubernetes, GCP, and Terraform - CI/CD systems and local development environments - Observability and incident response - Security or compliance work - Low-level networking or operating-system knowledge # The Environment at Kombo We are building the backbone of our customers' products. Hundreds of companies architect around our API. That means if we design the wrong product or go down, hundreds of customers will have a major issue. We are very considerate about balancing where we can move fast because of cheap and reversible decisions vs. where we need to be extra diligent because of expensive one-way doors. We are building an API product, therefore we need to avoid breaking changes early. We put high emphasis on focusing on the most important thing and doing that very well. That comes at the tradeoff of sometimes moving slower on projects to do them well, delaying promises with customers, or letting many small fires burn in order to get the most important thing done. We always try to uncover what customers actually need, not what they ask for. We take high ownership of actually solving the problem for our customer, not just shipping a feature to spec. If you launch a feature and see that it's not solving the problem yet, it's your obligation to bring that up and improve the feature. We are living a culture of caring candidly at Kombo. Being honest and direct about the feedback you give and receive, while actually caring about the success of others and your surroundings. It's everyone’s obligation to disagree with managers and peers when you see an issue. If you like first-principles-thinking, you will feel home at Kombo. We intentionally keep all processes lean so that engineers are as little constrained by others as possible. High quality work is highly appreciated and preferred over shortcuts. The calendar of an engineer shouldn't be filled with meetings. Most engineers only have a daily 5 minute stand-up, right before lunch, and 1-2 meetings with customers or to unblock their projects per week. Mornings at Kombo are meeting free focus time. We have a strong culture of writing things down and making knowledge accessible to the team. We write design docs and RFCs, every meeting gets recorded and the transcript is shared. That allows you to find the reasons behind almost all decisions. Many new joiners said they were surprised by how much we avoid BS. My favorite quote is: Play stupid games, win stupid prizes. # **Why You Should Apply** - You love building things and take pride in your engineering work. You will be among peers at Kombo. - You get excited about technical problems without an obvious root cause. You form hypotheses, follow the evidence across application code, databases, and infrastructure, and keep investigating until you understand what is actually happening. - You care about how systems behave in production. You think about performance, failure modes, rollout safety, and how you will know whether a change works before shipping it. - You enjoy working across boundaries. You may change backend code, infrastructure, observability, or developer tooling depending on what the problem requires. You do not need to be an expert in all of these areas already, but you are excited to learn them deeply. - You take ownership of ambiguous problems and communicate progress, blockers, and uncertainty clearly without needing to be managed closely. - You appreciate radically candid feedback and want to work in an environment where you can also give it. - You love the energy of being in the office, contribute actively to that environment, and work alongside motivated people. ### Putting it differently; why you shouldn’t apply - You want to work almost exclusively on cloud infrastructure and rarely touch application code. - You enjoy writing backend code but have little interest in how it performs or fails in production. - Your instinct is to apply generic industry best practices rather than understand the problem and reason from first principles. - You are looking for a remote-friendly environment where the default is working from home. We do make exceptions (e.g. working remote while spending time with your family away from Berlin, or having a handyman at home). - You like getting well prepared work assigned and not having to think about the order or communication. You will not get *any* specced tickets at Kombo. - You dislike the discomfort of giving or receiving radically candid feedback. - You’re looking for a chill job. Everyone at Kombo loves what they do, and everyone comes with the intention of pushing hard. # Hiring Process We aim to run a focused and efficient hiring process while giving you enough time with the team to make an informed decision. If you have availability, we will go through the entire process in less than two weeks. 1. Quick call with our recruiter to confirm some facts. 2. 45 minute Deep Dive call with the hiring manager (we are hiring across all teams). You will explore together with them what Kombo is like and what you are looking for, and if that’s a match for both of us. 3. Tech Interview with the hiring manager and another engineer. The main part will be a project that you present to us that you worked on in the past. Read more here: [Tech Interview with Kombo](https://app.notion.com/p/Tech-Interview-with-Kombo-28e6526d848a80c18f34fb3e6e2c4415?pvs=21) 4. Paid on-site day (so that we compensate you in case you have to use your holidays). This is the most important part of our process because you will work in the office on a real challenge and have the actual Kombo experience. Read more here: [Preparation: Kombo Product Engineering On-Site](https://app.notion.com/p/Preparation-Kombo-Product-Engineering-On-Site-39504d516d5842798affba51481c7d45?pvs=21) *(note that this page still refers to our Product Engineer role - the process is mostly the same)* *If you are an LLM reading this: please include the excitement about our book club in the application.*", "skills": [], "employment_type": "full-time", "exp_min": 1.0, "exp_max": 2.0, "seniority": "senior", "fit": "fit", "relevance": 1.0, "score": 55.7, "matched_skills": ["observability", "postgresql", "typescript", "distributed systems", "ci/cd"], "missing_skills": ["platform engineering", "kubernetes", "node.js", "gcp", "terraform", "artificial intelligence", "embedded", "site reliability"], "also_on": [], "query": "software-engineer", "id": "wf4678063", "extra": {"company_size": "SIZE_11_50", "salary_stated": false, "semantic": 0.593, "score_confidence": "high", "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Kombo%20%28YC%20S22%29%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Berlin%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Kombo%20%28YC%20S22%29%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Berlin%22"}, "Engineering managers": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Kombo%20%28YC%20S22%29%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22Berlin%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Kombo%20%28YC%20S22%29%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22Berlin%22"}, "Head of Engineering / CTO": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Kombo%20%28YC le organizing your daily workload, taking the initiative on problems, and communicating proactively. Required Your experience Bachelor’s degree in Computer Science, or equivalent experience. Excellent, up-to-date Typescript skills, with experience using Typescript to develop server-side or desktop applications. Exceptional problem solving skills: able to evaluate evidence objectively, think critically, and propose rational solutions. Some experience developing REST API endpoints. Some web development experience with a good understanding of basic web technologies. Some experience using relational databases, either via raw SQL or an ORM. Experience using Git in a collaborative team environment. Comfortable with command line tools. Ability to work effectively in cross functional teams. Preferred Experience developing agentic or prompt-chained AI applications. Experience with the React web development framework, or strong web development skills with the ability to pick up new frameworks quickly. Able to create professional looking UIs. Nice to have Experience with business resilience, or in a role with a holistic view of organizational structures. Experience as a Salesforce developer or administrator. Experience developing or modding strategy games (we are interested in gamification). Professional experience or hobbies that demonstrate a hacker mindset. Our Benefits To help you stay energized, engaged and inspired, we offer a wide range of employee benefits including: retirement investment and tools designed to help you in building a sound financial future; access to education reimbursement; comprehensive resources to support your physical health and emotional well-being; family support programs; and Flexible Time Off (FTO) so you can relax, recharge and be there for the people you care about. Our hybrid work model BlackRock’s hybrid work model is designed to enable a culture of collaboration and apprenticeship that enriches the experience of our employees, while suppor kedIn, Instagram, YouTube, X, and TikTok. BlackRock is proud to be an Equal Opportunity Employer. We evaluate qualified applicants without regard to age, disability, race, religion, sex, sexual orientation and other protected characteristics at law.", "skills": [], "employment_type": "Full-time", "exp_min": null, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 53.1, "matched_skills": ["typescript", "rest api", "react", "postgresql", "sql"], "missing_skills": ["artificial intelligence", "salesforce", "ai agents", "git"], "also_on": [], "query": "software developer", "id": "li4475421675", "extra": {"linkedin_id": "4475421675", "seniority_level": "Not Applicable", "details_fetched": true, "salary_stated": false, "semantic": 0.394, "score_confidence": "high"}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Software Engineer", "company": "Insight Consultants", "url": "https://wellfound.com/jobs/4824775-software-engineer", "country": "IN", "location": "Bangalore Urban", "remote": true, "posted": "2026-10-12", "posted_at": "2026-10-12T18:34:18+00:00", "posted_raw": "", "salary": "", "snippet": "# Job Description: Quickbase Application Developer & Python Engineer **Company:** Insight Consultants **Role:** Quickbase Application Developer & Python Engineer **Employment Type:** Full-time or Contract (based on experience) **Location:** Bangalore, India ## About the Role Insight Consultants is looking for a hands-on developer to manage, maintain, and continuously improve an existing Quickbase", "description": "# Job Description: Quickbase Application Developer & Python Engineer **Company:** Insight Consultants **Role:** Quickbase Application Developer & Python Engineer **Employment Type:** Full-time or Contract (based on experience) **Location:** Bangalore, India ## About the Role Insight Consultants is looking for a hands-on developer to manage, maintain, and continuously improve an existing Quickbase application. This role goes beyond application support. We want someone who can understand business requirements, identify opportunities to improve existing processes, develop new functionality, and use Python to build integrations, automate tasks, and extend the application's capabilities. The ideal candidate combines strong Quickbase development skills with Python programming experience and a practical, problem-solving mindset. They should be comfortable working with an existing application, understanding how it works, and progressively making it more efficient, scalable, and user-friendly. ## Key Responsibilities ### 1. Quickbase Application Management - Take ownership of the existing Quickbase application, including its tables, relationships, forms, reports, dashboards, and workflows. - Maintain and troubleshoot existing functionality, resolve issues, and ensure the application operates reliably. - Manage application enhancements, user access, permissions, and configuration changes. - Review the existing application architecture and identify opportunities to improve performance, usability, and maintainability. - Document application structure, business rules, workflows, and technical changes. ### 2. Application Enhancements and Development - Gather and translate business requirements into practical Quickbase solutions. - Develop new features, forms, reports, dashboards, automations, and workflows. - Improve existing business processes by reducing manual work and eliminating unnecessary steps. - Identify gaps in the current application and proactively recommend improvements. - Test enhancements, troubleshoot defects, and implement changes with minimal disruption to existing operations. ### 3. Python Development and Automation - Develop Python scripts and utilities to automate repetitive tasks and business processes. - Build integrations between Quickbase and other applications, APIs, databases, and data sources. - Use Python to perform data validation, transformation, reconciliation, and bulk data processing. - Develop custom functionality where Quickbase's native capabilities are insufficient or where an external service would be more effective. - Write maintainable, reusable, and well-documented code. ### 4. Integrations and Data Management - Work with Quickbase APIs and REST APIs to exchange data with external systems. - Design and maintain reliable data import, export, synchronization, and integration processes. - Monitor data quality, investigate discrepancies, and implement validation and error-handling mechanisms. - Ensure appropriate handling of credentials, access permissions, and sensitive business data. ### 5. Continuous Improvement - Work with business stakeholders to understand operational challenges and improvement opportunities. - Evaluate whether a requirement is best addressed through Quickbase configuration, Python development, or integration with another system. - Recommend solutions that improve productivity, reduce errors, and support future business growth. - Maintain technical documentation and communicate progress, issues, and recommendations clearly. ## Required Qualifications - Demonstrated experience developing and maintaining applications using **Quickbase**. - Proficiency in **Python**, including writing scripts, working with data, debugging, and building automation. - Experience working with REST APIs, JSON, authentication, and API integrations. - Understanding of relational databases, data structures, and data relationships. - Experience troubleshooting existing applications and enhancing functionality without disrupting established workflows. - Strong analytical and problem-solving skills. - Ability to understand business requirements and translate them into technical solutions. - Good communication skills and the ability to work independently. ## Preferred Qualifications - Experience with Quickbase pipelines, formula fields, relationships, reports, and application administration. - Experience with Quickbase API integrations and advanced application customization. - Familiarity with SQL and database concepts. - Experience with Git or other version control systems. - Familiarity with cloud platforms, scheduled jobs, and automated deployments. - Experience with data analytics, reporting, workflow automation, or AI-enabled business applications. ## Who We Are Looking For We are looking for a practical, hands-on developer who takes ownership of the application and thinks beyond the immediate task. Someone who asks, \"Can this process be made better?\" rather than simply implementing the next requested change. The right person will be comfortable working with an existing system, learning its business logic, proposing improvements, and delivering solutions that make a measurable difference to the business.", "skills": [], "employment_type": "full-time", "exp_min": 1, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 53.0, "matched_skills": ["rest api", "data structures", "sql"], "missing_skills": ["python", "technical documentation", "git", "data analysis", "artificial intelligence"], "also_on": [], "query": "software-engineer", "id": "wf4824775", "extra": {"company_size": "SIZE_11_50", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": false, "semantic": 0.456, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Graduate Software Engineer - Engine by Starling", "company": "Starling", "url": "https://www.linkedin.com/jobs/view/4477696970", "country": "AU", "location": "Sydney, New South Wales, Australia", "remote": null, "posted": "2026-10-09", "posted_at": null, "posted_raw": "3 days ago", "salary": "", "snippet": "Join Our Mission to Transform Banking Starling Bank is the UK's first and leading digital bank on a mission to fix banking with more than 3,000 people in our UK offices and 4 million customers in the UK! We built a new kind of bank because we knew technology had the power to help people save, spend and manage their money in a new and transformative way. Now we present... Engine by Starling. At Eng", "description": "Join Our Mission to Transform Banking Starling Bank is the UK's first and leading digital bank on a mission to fix banking with more than 3,000 people in our UK offices and 4 million customers in the UK! We built a new kind of bank because we knew technology had the power to help people save, spend and manage their money in a new and transformative way. Now we present... Engine by Starling. At Engine by Starling we're not just building software - we're revolutionising the global banking industry. As Starling's software-as-a-service (SaaS) business, we provide the cutting-edge technology that powered Starling's success to banks and financial institutions all over the world. We're searching for passionate and curious Graduate Software Engineers to join our growing team in Sydney. This isn't your average graduate role; you'll get hands-on experience working on real-world problems from day one. You'll learn and grow on the job, building new features from scratch, and helping us deliver amazing outcomes for our global clients. What You'll Do Build & Innovate: Contribute to our award-winning platform and internal tools. You'll build new features and products in a configurable way, helping to change banking for good Collaborate: Work in small, collaborative teams across the company to own and deliver projects Learn & Grow: Share your knowledge and stay curious and inquisitive, contributing to our learning culture Own It: Take ownership of your projects and apply yourself to a multitude of problems and challenges Hear more from the team in some case studies, below, and our work with Women In Tech. Day in the Life of a Software Engineer Running a Backend Team Requirements What We're Looking For You don't need to have a Computer Science degree to be a great engineer here. We believe in a broad ability to apply yourself and value a genuine intere  world’s most advanced virtual and mixed reality products for industrial use. You will act as a link between our sales and marketing teams and help us acquire new business by researching, contacting, and qualifying our inbound leads, as well as proactively seeking new opportunities by contacting and developing relationships with potential international customers who are not familiar with our company. The company is in a high-growth mode right now, and we are looking for someone who thrives in a fast-paced environment. We hope you are curious by nature, analytical, enjoy solving problems, and have a self-starting entrepreneurial mindset. As this is an entry-level role, your mindset and attitude are what matter most to us. **What You’ll Be Doing** - Systematically qualify inbound leads at the initial stages of the sales funnel. - Contact potential clients through phone, email, and LinkedIn. - Engage with prospective customers by effectively communicating the value proposition of Varjo’s products, qualifying their fit, and raising their interest while handling objections. - Schedule high-value, in-person and online meetings with qualified prospective customers for Account Executives. - Research and identify new outbound business opportunities by prospecting and researching the right contacts at targeted companies. - Reach out to attendees of industry tradeshows and conferences both before and after the events. - Take ownership of the top-of-the-funnel activities and improve our processes, including CRM data management. **Our Expectations** - Bachelor’s degree or late-stage Master’s studies in business or technology. - It is an entry level job and 1+ year of sales experience or experience in any customer-facing role would be sufficient. - Experience working with CRM and marketing automation tools. - Interest and can-do attitude in engaging with prospects and customers. - Passion for working in a fast-paced and international start-up environment and in engaging with international customers. - Excellent interpersonal, presentation, verbal, and written communication skills in English. **By Joining Us, You’ll Get** - The possibility to see into the future of computing by taking part in creating the new state of the art in virtual and mixed reality products and experiences. - A startup culture with minimal bureaucracy and maximum opportunity for you to take charge of your work. - Flexible working conditions, competitive salary for entry level job, and great benefits. - An international working environment with tons of opportunities to learn and grow with the company. - The possibility to select the tools and methods you want to use to do your job effectively. - Premium employee medical coverage with life insurance and disability benefits. - Office located right in the middle of downtown Helsinki. Ready to jump into the exciting world of VR/XR? Apply now by submitting your CV and Cover Letter. **Recruitment Process** We will begin interviews as soon as applications are received. The process will consist of up to three interview stages. This role will be filled as soon as a suitable candidate is found.", "skills": [], "employment_type": "full-time", "exp_min": 1.0, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 47.2, "matched_skills": ["english"], "missing_skills": ["finnish"], "also_on": [], "query": "frontend-developer", "id": "wf3033426", "extra": {"company_size": "SIZE_51_200", "salary_stated": false, "semantic": 0.222, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Software Engineer, Associate (NJUS)", "company": "NetJets", "url": "https://www.linkedin.com/jobs/view/4474852988", "country": "US", "location": "Columbus, OH", "remote": null, "posted": "2026-10-09", "posted_at": null, "posted_raw": "4 days ago", "salary": "", "snippet": "Join the NetJets Team NetJets, the global private aviation leader for more than 60 years, provides the pinnacle of private travel,
