 to list all required job duties on this form. There may be other important duties assigned, depending on the position. For a list of essential job functions, please refer to the essential functions document for this job. Education Bachelor's in Computer Science or Computer Engineering Certifications and Licenses Years Of Experience 0-2 years of experience Core Competencies Service-Oriented Curiosity Collaboration Adaptability Strives For Positive Results Knowledge, Skills, Abilities And Other (KSAOs) Bachelor's degree in, Computer Science, Electrical Engineering, or a equivalent engineering field. Previous internship or work experience as an entry level engineer with 0-2 years’ experience is preferred. Strong programming skills in languages such as Java, C/C++, Javascript, python are a must. Experience and knowledge of cloud services like AWS is a plus. Experience in web development, mobile development, or software engineering projects as part of educational curriculum is preferred. Excellent communication and collaboration skills. Knowledge and experience in Agile methodologies is a plus How NetJets Supports You NetJets is proud to provide a variety of attractive benefits to our employees, including many at no cost. Employees have access to no cost options including Medical, Dental, and Vision benefits, with access to robust networks of nationwide providers. Our Comprehensive Suite Of Benefits Include Medical, Dental, and Vision Healthcare Advocacy Employee Assistance Program Flexible Spending Accounts Health Savings Account with annual employer contribution Wellness Programs & Discounts Paid Time Off Parental Leave of Absence Life and Accident Insurance Voluntary benefits (financial protection plans) 401(k) plan, with 67% of every dollar you contribute through standard elective deferral and catch-up contributions matched by NetJets. Super catch-up contributions are not eligible for the employer match. Short and Long-Term Disability Legal Plan Identity Theft Protection Plans Pet Insurance Family & Caregiving Support", "skills": [], "employment_type": "Volunteer", "exp_min": 0.0, "exp_max": 2.0, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 47.1, "matched_skills": ["agile", "java", "javascript", "aws"], "missing_skills": ["monitoring", "team leadership", "c++", "python", "mobile development"], "also_on": [], "query": "software engineer", "id": "li4474852988", "extra": {"linkedin_id": "4474852988", "seniority_level": "Not Applicable", "details_fetched": true, "salary_stated": false, "semantic": 0.312, "score_confidence": "high"}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Junior Backend Developer", "company": "SPARK COMMODITIES UK", "url": "https://wellfound.com/jobs/4756827-junior-backend-developer", "country": "GB", "location": "London", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "£30k – £48k • No equity", "snippet": "* This is a full-time position with a permanent contract. * This role is based in London. We provide WeWork memberships, with the flexibility to work from home. **What is Spark Commodities?** Founded in Singapore in early 2019, Spark is a company with offices in London and Singapore focused on improving how people understand price and trade physical commodities. We are backed by three leading comp", "description": "* This is a full-time position with a permanent contract. * This role is based in London. We provide WeWork memberships, with the flexibility to work from home. **What is Spark Commodities?** Founded in Singapore in early 2019, Spark is a company with offices in London and Singapore focused on improving how people understand price and trade physical commodities. We are backed by three leading companies within the energy ecosystem: Kpler, ICE, and EEX, and we rely on amazing people to build amazing products. We currently work with over 200 companies, including some of the world's biggest energy and financial players. Our small but growing team brings together people from diverse backgrounds, combining varied skill sets and international experience. We prioritise execution, agility, and ownership to deliver meaningful impact quickly. **What Does the Role Involve?** * Learn about how the commodities pricing industry works. * Build meaningful products that our customers use and depend on for everyday business. * Use every learning and observation to improve our products continually. * Own what you build, with the ability to decide how to build it (subject to current stack and compliance rules), and take responsibility for operating it in the production environment. * Own the full development lifecycle, from shaping specifications to building, testing, deploying to production, and maintaining what you ship. * Share knowledge about newly developed features with the company's stakeholders. **Our Team and Culture** * We Are Builders At Heart. * We are builders at heart, a collective of independent, deep thinkers. * Curious, committed, and humble, we're dedicated to making a real impact. * We value open, honest, and feedback-driven collaboration, with a strong product-first culture. * The best idea wins, and we're always open to better ways of doing things. * We use AI tools at every stage of the company, relying on them daily to move faster and improve how we work. * We're building a fully distributed team across London, Singapore, and France. * We default to writing, meet when it matters, and optimise for deep work. * You'll have real ownership and a direct impact on the company's success. **You Would Be a Great Fit if You:** * You value software craftsmanship and take pride in building well-designed software that steadily delivers value. * You have a strong sense of ownership and care about what you build. * You're a builder at heart, with an entrepreneurial mindset and a desire to make things work long-term. * You're eager to learn or already comfortable scaling and operating services in growth environments. * You're proficient in a couple of languages. Functional programming experience is a plus. Our current platform is mostly Python (with some TypeScript and SQL), and we're evolving toward a more structured codebase: * Concepts like clean/hexagonal architecture, DDD, CQRS, event sourcing, and event-driven systems are familiar to you. * AI is part of your development workflow: you leverage it daily to build faster and smarter. * You care about quality: you write tests, ship complete features, and keep codebases clean and maintainable. * You deliver iteratively, moving fast while learning at each step. * You make decisions based on data rather than opinions, and you're comfortable finding the data when it's missing. * You're comfortable with changing priorities and see them as opportunities rather than obstacles. You're also willing to challenge the status quo. * You're excited about making a strong impact in a growing startup. **Our Hiring Process** We see hiring as a human process, a two-way conversation to see if there is a good fit between you and us. As a startup, we also like to keep things streamlined. An idea of your hiring journey with us: * A meeting with one of our engineers or CTO to introduce each other and explore mutual interests. * A conversation of 1.30 hours max with two engineers to assess your technical skills. We will ask you to show some code you developed, explain how it works, and describe the technical challenges you faced. * A 30-minute open-minded conversation with our CEO to get to know each other and see whether you would be excited to work together. * Offer We aim to give you the best candidate experience, keep you updated and be transparent with our feedback along the way.", "skills": [], "employment_type": "full-time", "exp_min": 1, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 47.0, "matched_skills": ["typescript", "sql"], "missing_skills": ["spark", "artificial intelligence", "functional programming", "python", "domain-driven design", "event-driven"], "also_on": [], "query": "software-developer", "id": "wf4756827", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 5184000, "salary_lpa": 51.8, "salary_text": "£30k – £48k • No equity", "semantic": 0.427, "score_confidence": "high"}}, {"source": "daijob", "source_name": "Daijob", "title": "Vietnamese-Speaking QA Bridge Coordinator | JLPT N2 | 1+ Year QA Experience", "company": "", "url": "https://www.daijob.com/en/jobs/detail/1552288", "country": "JP", "location": "Japan Tokyo Meguro", "remote": null, "posted": null, "posted_at": null, "posted_raw": "", "salary": "JPY - Japanese Yen JPY 3500K - JPY 5000K", "snippet": "Our company is an IT company that operates multiple web services, including a night leisure portal site with over 100 million monthly page views. The IT Communicator position we are currently recruiting for will connect overseas development bases with domestic teams, supporting project progress and quality improvement. You will play a crucial role in collaborating with global teams and contributin · Japanese: Business Level(JLPT Level 2 or N2)", "description": "", "skills": [], "employment_type": "", "exp_min": 1.0, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 0.0, "score": 46.9, "matched_skills": ["qa"], "missing_skills": ["japanese"], "also_on": [], "query": "software engineer", "id": "dj1552288", "extra": {"level": "Staff Level", "japanese_level": "Business Level(JLPT Level 2 or N2)", "salary_stated": true, "salary_inr": 1960000, "salary_lpa": 19.6, "salary_text": "JPY - Japanese Yen JPY 3500K - JPY 5000K", "semantic": 0.332, "score_confidence": "medium"}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Software Engineer", "company": "Boom", "url": "https://wellfound.com/jobs/4716782-software-engineer", "country": "US", "location": "Austin", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "$120k – $200k • 0.01% – 0.15%", "snippet": "# **Software Engineer** We hire software engineers across levels under a single posting. Title, compensation, and scope are set during the process based on demonstrated competency, so apply once and we will place you at the right level. We are currently focused on mid- to senior-level hires, with room to move in either direction for the right candidate. ## Our mission Boom is on a mission to level", "description": "# **Software Engineer** We hire software engineers across levels under a single posting. Title, compensation, and scope are set during the process based on demonstrated competency, so apply once and we will place you at the right level. We are currently focused on mid- to senior-level hires, with room to move in either direction for the right candidate. ## Our mission Boom is on a mission to level the playing field for the 110+ million renters in the US by making housing more flexible, affordable, and rewarding. Boom is building a suite of rental financial services for renters and property managers, including tenant screening, rent payment reporting, rent reporting-as-a-service, and a number of integrations with the largest property management systems (PMS). Boom serves renters through the Boom App and property managers via the Boom Platform. Now serving thousands of renters, Boom is led by second-time founder Rob Whiting (ex-BCG, Rubicon). It is backed by investors such as Starting Line, Clocktower Ventures, Mischief VC (Plaid CEO Zach Perret's fund), and Gilgamesh Ventures (Petal co-founders), and angels such as William Hockey (CEO of Column, founder and former CTO of Plaid) and Harry Stebbings. Boom has been profiled by Inman, Business Insider, HousingWire, and more. ## Opportunity We recently announced our Series A, and we are growing engineering to meet the demands of our B2B partners and B2C users. The roadmap ahead spans new consumer and platform products, deeper PMS integrations, and an agentic operational layer for residential real estate. Credit, identity, income, and payment data flow through our platform every day, so the systems you build carry real consequences for the people who use them. You will work closely with our founder, product and engineering leadership, our product team, and a growing group of senior engineers. We are hiring in Austin, TX, where our leadership and product team is based. Our engineering culture is practical and close to the product. We care about shipping work that reaches real users, holding a high bar for quality, and communicating clearly. At our size none of that is settled, so the engineers who join now have a real hand in it: the standards we hold, the tools we adopt, how we use AI, and how we hire. If that sounds like how you want to work, we would like to hear from you. ## What you'll do Every engineer here owns product in production. You will: - Design, build, and maintain user-facing products and the backend systems that power our platform - Contribute to and help evolve our core backend architecture, with attention to scalability and performance - Own your services in production, including observability, on-call, and debugging real incidents - Collaborate with product, operations, and leadership to align technical solutions with business needs - Drive engineering practice through code review, testing, and documentation ## Focus areas Our platform spans several products, and we staff engineers against the ones where the roadmap is heaviest. Tell us in your application which of these interests you. We support engineers moving across areas over time, which primarily has happened when we spin up a new product or team. **BoomScreen.** Tenant screening for property managers and the applicant flows that feed it. Work here spans screening operations tooling, the applicant experience, and integrations with the largest property management systems. **BoomReport and core platform.** Rent payment reporting to the credit bureaus, rent reporting-as-a-service for partners, embedded partner surfaces, and the billing and platform services the rest of the products are built on. **BoomCRM.** Leads, tasks, and workflow automation for property managers, plus the listings experience that sits on top of it. **AI and agents.** Customer-facing production AI features across every product, plus standalone agents for leasing, application, and underwriting. Own the full agent stack: prompts, tools, memory, retrieval, orchestration, evals, and observability. Build the eval and feedback loops that let us improve agents without regressions, including offline evals, online metrics, and human review queues. We also have products in development that we have not announced yet. ## What you'll need This list describes the engineer we picture, not a checklist we score against. If you meet most of it and the work sounds like yours, apply. We would rather read your application and talk it through than have you screen yourself out. Required of every engineer, at any level: - 3+ years of professional web development experience - Strong backend development skills, with a preference for engineers who work comfortably across the stack - Experience with Ruby, or with a similar backend language plus the ability to ramp up quickly in our stack. Our backend primarily runs on Ruby (Grape and Sequel), with a growing number of services in Node.js, and React/Next.js and TypeScript on the frontend - Experience integrating third-party APIs, including OAuth flows, webhooks, rate limits, and idempotency - A track record of owning services in production, with real exposure to observability, on-call rotations, and incident debugging - You use AI coding agents in your daily work and have shipped real code with them. Claude Code is part of how we build here, and we expect you to reach for it and to keep getting better with it - Strong communication skills. You are comfortable collaborating across teams and explaining technical concepts clearly - Comfort setting your own direction in an early-stage environment where priorities shift and context is incomplete - Empathy for our end users, including low-to-moderate-income renters, and a desire to build products that make a difference ## Level and compensation We are hiring primarily at the mid to senior range, with flexibility in either direction for the right candidate. Title, scope, and compensation are set during the process based on the experience and competency you demonstrate rather than years or prior titles. The range listed above is directional and adjustable based on competency, including for candidates whose experience puts them above the scope described here. ## Nice to have Depending on your focus area, some of the following are a plus: - Running coding agents autonomously, including cloud or overnight sessions, and a point of view on how to structure work so that pays off - Building and maintaining APIs and tooling that other developers consume, including partner-facing integrations and MCP tools - AWS, Terraform, and infrastructure work generally - 1-2 years building production LLM features or agents, hands-on with Anthropic or OpenAI APIs and agent patterns such as tool use, structured outputs, RAG, and multi-step planning - A track record with evals. You have built or owned an eval suite and know the difference between a demo that impresses and a system that works at scale - Product judgment and taste for LLM products. You can articulate what a model should not do, where to put guardrails, when to fall back to deterministic logic, and what UX makes errors tolerable - Voice AI stacks (LiveKit, Deepgram, ElevenLabs), vector stores, and retrieval pipelines - A working grasp of common attack classes such as the OWASP Top 10, auth and session flaws, and supply chain risk, and the habit of building secure-by-default paths in code you own - Experience championing AI adoption with non-technical teammates and meeting them where they are ## Benefits of working at Boom - Competitive salary with stock options - Full healthcare coverage (health, dental, vision) including 50% coverage for dependents - 15 days of Paid Time Off (PTO) per year, 3 sick days, and all US federal holidays (11 in total). Note: we think unlimited PTO is BS and causes some employees to feel guilty when they take it - Company-issued laptop/MacBook - Company-sponsored training and development - Regular off-sites, retreats, and other company-sponsored events and travel opportunities", "skills": [], "employment_type": "full-time", "exp_min": 1.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 46.8, "matched_skills": ["observability", "code review", "react", "typescript", "aws"], "missing_skills": ["artificial intelligence", "team leadership", "ruby", "llm", "ai agents", "scalability", "embedded", "node.js"], "also_on": [], "query": "software-engineer", "id": "wf4716782", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 16800000, "salary_lpa": 168.0, "salary_text": "$120k – $200k • 0.01% – 0.15%", "semantic": 0.255, "score_confidence": "high"}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Associate Software Engineer", "company": "Point", "url": "https://wellfound.com/jobs/4751369-associate-software-engineer", "country": "US", "location": "San Francisco", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "$139k – $153k", "snippet": "**Location** This is a hybrid role based in Palo Alto, with team members expected to work onsite one day per week for in-person collaboration. **About the role** We’re seeking a **Software Engineer (IC1)** to join our team and help support and grow Point’s multi-product digital platform. In this role, you’ll work under the guidance of senior engineers and alongside product partners on the **Custom", "description": "**Location** This is a hybrid role based in Palo Alto, with team members expected to work onsite one day per week for in-person collaboration. **About the role** We’re seeking a **Software Engineer (IC1)** to join our team and help support and grow Point’s multi-product digital platform. In this role, you’ll work under the guidance of senior engineers and alongside product partners on the **Customer Operations pillar**, building smaller features within a defined product area that help our Sales and Customer Experience teams deliver faster, smarter, and more personalized experiences for our customers. This is an entry point into production engineering. You’ll learn how our systems fit together, how features move from design review to release, and how emerging technologies—such as AI-assisted workflows—are applied in real production environments under responsible data and privacy guidelines. This role is ideal for an early-career engineer who is eager to learn, receptive to feedback, comfortable in a fast-paced environment, and inclined to over-communicate rather than go quiet. Check out our latest [Engineering Blog](https://point.com/blog/engineering-wins-at-point-in-2024) to learn more about why it's a great time to join Point's Engineering team! **Your responsibilities** - Build and ship smaller, well-scoped features within an established codebase, with guidance from senior engineers. - Write and test code against the acceptance criteria of your assigned tasks, including unit tests for both positive and negative conditions. - Submit clear, reviewable PRs; review teammates’ code and use feedback on your own PRs as a key resource for technical growth. - Work with senior engineers to design solutions for assigned tasks and discuss the tradeoffs of different approaches. - Participate in sprint planning, grooming, retrospectives, and technical design reviews with a view toward learning best practices. - Communicate progress, risks, and blockers early and often to your team and cross-functional partners — err on the side of over-communication. - Learn how AI- and data-powered components are used in production systems while following responsible data and privacy guidelines. - Write clearly in both informal (Slack, email) and formal (Jira tickets, commit messages, PR descriptions) media. - Follow team standards for testing, documentation, monitoring, and operational readiness, and make minor refactors to keep the code you touch clean and clear. - Estimate your own tasks, seek out mentorship, and work with product managers to understand the business impact of technical decisions. **About you** - Bachelor’s degree in Computer Science, Engineering, or a related field, or equivalent practical experience. - 1+ years of professional software engineering experience, including internships or co-op experience, writing object-oriented code in a production, coursework, or open-source setting. - Foundational grasp of object-oriented design — classes, interfaces, encapsulation, and inheritance versus composition — in at least one object-oriented language such as TypeScript, Python, Ruby, Java, or C#. - Working understanding of data structures and data modeling, and the ability to break a problem into well-named objects, methods, and responsibilities. - Some exposure to building or consuming APIs and to working with a relational database. - Familiarity with unit testing, including stubbing or mocking dependencies, and a willingness to build that skill quickly. - Exposure to customer-facing applications through coursework, internships, side projects, or early professional work. - Ability to communicate clearly with teammates and ask questions when product or design requirements are ambiguous. - Comfortable working in a fast-paced environment, balancing quality and speed while learning under guidance. - Collaborative team player who actively seeks out feedback and mentorship and acts on it. **Nice to have** - Exposure to common design patterns, or to a statically typed language such as Java, C#, or Kotlin - A/B testing frameworks and data-driven experimenta ical innovation in Medical technologies. Guided by our winning culture and values to Think & Act Like Owners, as One Team, and Play to Win, we turn commitment into results and achieve more together. Join Us to Deliver Innovative Solutions That People Trust! Privacy Notice - Active Candidates: Aptiv is an equal employment opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, national origin, sex, gender identity, sexual orientation, disability status, protected veteran status or any other characteristic protected by law. Originally posted on Himalayas", "skills": ["Cybersecurity-Intern", "DevOps-Intern", "Linux-Developer", "Software-Developer-Intern", "Software-Developer-Internship", "Software-Development-Intern", "Software-Development-Internship", "Software-Engineer-Intern", "Software-Engineering-Intern", "Software-Intern"], "employment_type": "Intern", "exp_min": null, "exp_max": null, "seniority": "intern", "fit": "fit", "relevance": 1.0, "score": 46.4, "matched_skills": ["linux", "devops", "ci/cd"], "missing_skills": ["cybersecurity", "artificial intelligence", "elixir", "python", "c++", "git", "telecommunications", "robotics"], "also_on": [], "query": "software developer", "id": "93a80ae8ddcb", "extra": {"eligible": ["US"], "seniority": "Entry-level", "salary_stated": false, "semantic": 0.122, "score_confidence": "high"}}, {"source": "arbeitnow", "source_name": "Arbeitnow", "title": "Working Student / Intern Process & Sustainability Engineering", "company": "Ineratec Gmbh 1", "url": "https://www.arbeitnow.com/jobs/companies/ineratec-gmbh-1/working-student-intern-process-sustainability-engineering-karlsruhe-9401", "country": "DE", "location": "Karlsruhe", "remote": false, "posted": "2026-10-12", "posted_at": "2026-10-12T17:09:54+00:00", "posted_raw": 1791824994, "salary": "", "snippet": "Short Description Would you like to actively help shape the energy transition while gaining deep insig e development of tools and infrastructure to enhance the platform’s decentralized capabilities. * What You Will Get * Direct access to a fast-scaling AI + Web3 project. * Work closely with a high-performance founder and engineering team on mission-critical activities. * Learn the inner workings of product, fundraising, growth, and partnerships. * Full flexibility — remote, async-friendly, focus is on results. * Growth opportunity to evolve into a senior engineering role or specialized software position for the right candidate. **Requirements** * Current enrollment in or recent graduation from a Bachelor’s degree program in Computer Science, Software Engineering, or a related field at an Australian university. Students in their final years are strongly encouraged to apply. * Hands-on experience in software development through coursework, personal projects, internships, or research, including proficiency in languages like Python, JavaScript, or similar. * Familiarity with web development frameworks (e.g., React, Node.js) or blockchain technologies (e.g., smart contracts, decentralized systems) is a plus. * Experience with version control systems (e.g., Git) and basic understanding of software development best practices. * Eagerness to learn, adapt, and thrive in a dynamic, fast-moving startup environment.", "skills": [], "employment_type": "full-time", "exp_min": 0, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 43.1, "matched_skills": ["aws", "javascript", "react"], "missing_skills": ["artificial intelligence", "web3", "tensorflow", "pytorch", "machine learning", "azure", "hugging face", "ai agents"], "also_on": [], "query": "software-engineer", "id": "wf3365415", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 5544000, "salary_lpa": 55.4, "salary_text": "$33k – $66k • No equity", "semantic": 0.304, "score_confidence": "high"}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Software Engineer - Intern - Sydney", "company": "MongoDB", "url": "https://wellfound.com/jobs/3283386-software-engineer-intern-sydney", "country": "AU", "location": "Sydney", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "", "snippet": "MongoDB’s mission is to empower innovators to create, transform, and disrupt industries by unleashing the power of software and data. We enable organizations of all sizes to easily build, scale, and run modern applications by helping them modernize legacy workloads, embrace innovation, and unleash AI. Our industry-leading developer data platform, MongoDB Atlas, is the only globally distributed, mu", "description": "MongoDB’s mission is to empower innovators to create, transform, and disrupt industries by unleashing the power of software and data. We enable organizations of all sizes to easily build, scale, and run modern applications by helping them modernize legacy workloads, embrace innovation, and unleash AI. Our industry-leading developer data platform, MongoDB Atlas, is the only globally distributed, multi-cloud database and is available in more than 115 regions across AWS, Google Cloud, and Microsoft Azure. Atlas allows customers to build anywhere—on the edge, on premises, or across cloud providers. With offices worldwide and over 175,000 developers joining MongoDB every month, it’s no wonder that leading organizations, like Samsung and Toyota, trust MongoDB to build next-generation, AI-powered applications. **About Our Teams** Our Sydney Internship opportunities are on our App Modernisation & Integration, Field Engineering, Replicated Storage Services, and Storage Engines teams. Please see below for a brief overview of each team! **App Modernisation & Integration** The MongoDB App Modernisation & Integration Team is building a suite of products that bring workloads into MongoDB and create visualisations on top of the data stored in MongoDB. The team works on many challenges, ranging from data migration to code modernisation and unlocking insights about data stored in Atlas using cutting-edge techniques like AI. Our tech stack includes Typescript, Java, Go, and NodeJS. As an intern, you will work on an interesting full-stack project with a dedicated mentor who will help you learn the nuances of product software development. During your internship, you will have the opportunity to make a meaningful impact on a production codebase with a team committed to you having a positive experience! **Field Engineering** The Field Engineering organization is a fast-paced, entrepreneurial team whose focus is bridging the gap between MongoDB official database products and the reality of our services organizations who are “boots on the ground” and often rely upon quickly created tools to assist customers with modernizing their application code and architectures. The sort of projects we work on are varied, but include a combination of research, proof of concept, and product development. Since we focus on GenAI, this includes working with LLMs, parsing tools, agentic frameworks, etc. Our tools are immediately usable, experimented on, and then refined by a broad engineering team worldwide. As an intern, you will work on one or more of these GenAI projects with dedicated mentors who will help you learn the nuances of product software development. During your internship, you will have the opportunity to make a meaningful impact on a production codebase with a team committed to you having a positive experience! **Replicated Storage Services** The MongoDB Replicated Storage Services team's mission is to research and develop new algorithms for storing data, maintain a pluggable protocol for MongoDB storage engines, and provide a comprehensive framework for managing concurrent, transactional access to data stored locally within a MongoDB database instance. Our team champions a culture of inclusivity and collaboration. As a team member, you will contribute to crafting and maintaining the different server components, connecting its query system and distributed replication system to its underlying storage engines. **Storage Engines** The MongoDB Storage Team is building WiredTiger, a world-class open source storage engine. The WiredTiger storage engine manages how MongoDB stores data, both in-memory and on disk, and provides scalable parallel access that is leveraged by the higher layers of the MongoDB data platform stack. The Storage Team is a collaborative group working to keep MongoDB storage ahead of the most challenging customer expectations. As an intern, you will work with and learn from a highly collaborative team of engineers while developing production-level code. Storage interns enjoy dedicated mentors, a friendly and helpful team environment, and social activities with their peers and colleagues. Read what our past interns had to say about their experience here! **What we are looking for in you** - In the process of receiving a Bachelor’s or Master's degree in Computer Science, Computer Engineering, Applied Sciences, or a related field. - Have a minimum of one quarter/semester remaining in university studies after the internship concludes. Graduation date between Autumn 2026 - Summer 2027. - Familiarity with Python, Java, Go, C++, Javascript, Node.js or a comparable object-oriented programming language. - Have a foundation in computer science theory, with proficiencies in data structures, algorithms, and software design. - Communication skills, both verbal and written. - Curiosity with a desire to learn and adapt; you are a self-starter and thrive in ambiguity. - Must be authorized to work in Australia or New Zealand. Company sponsorship may be available for eligible candidates applying for certain roles **What you'll find at MongoDB** - Authentic Culture: A workplace where you are encouraged to bring your whole self to work, we believe that Embracing the Power of Differences is the best way to broaden our own perspectives and foster innovation. ility, please inform your Early Talent Recruiter. Req ID: 1263074192", "skills": [], "employment_type": "full-time", "exp_min": null, "exp_max": null, "seniority": "intern", "fit": "fit", "relevance": 1.0, "score": 42.0, "matched_skills": ["data structures", "java", "aws", "typescript", "javascript"], "missing_skills": ["mongodb", "artificial intelligence", "node.js", "generative ai", "gcp", "azure", "llm", "ai agents"], "also_on": [], "query": "software-engineer", "id": "wf3283386", "extra": {"company_size": "SIZE_5000_PLUS", "salary_stated": false, "semantic": 0.584, "score_confidence": "high"}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Junior Business Developer", "company": "Catawiki", "url": "https://wellfound.com/jobs/4546093-junior-business-developer", "country": "NL", "location": "Amsterdam", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "", "snippet": "# Your Mission As a Catawiki Live Business Developer, you will help scale Catawiki Live, a key growth initiative that extends Catawiki’s auction experience through live shopping events. You will build and develop a pipeline of high-potential sellers, support their onboarding, and help them grow successfully on the platform. Working closely with commercial teams, category experts and other stakehol", "description": "# Your Mission As a Catawiki Live Business Developer, you will help scale Catawiki Live, a key growth initiative that extends Catawiki’s auction experience through live shopping events. You will build and develop a pipeline of high-potential sellers, support their onboarding, and help them grow successfully on the platform. Working closely with commercial teams, category experts and other stakeholders, you will contribute to sustainable revenue growth by supporting sellers throughout the early stages of their journey on Catawiki Live. # What You’ll Do - Identify, qualify and develop new seller leads through online research, outreach and collabor ts, social initiatives, and underserved communities through digital transformation, artificial intelligence, data science, and international collaboration. Through initiatives such as: * **Volunteer Metrics Hub** — an AI-powered platform for volunteer management, analytics, and impact measurement. * **GreenVerde** — a data-driven agritech and environmental intelligence platform. * Additional AI-powered initiatives focused on education, sustainability, and nonprofit digital transformation. Our mission is to leverage technology, innovation, and collaboration to create scalable solutions that transform communities while advancing Kingdom-centered values worldwide. --- # Position Overview As a **Full Stack Developer**, you will play a key role in designing, developing, and maintaining modern web applications that support the Foundation's international initiatives. You will collaborate closely with UI/UX designers, AI engineers, data scientists, product managers, and project leadership to build scalable, secure, and high-performance software. We are looking for developers who enjoy working with modern technologies, AI-assisted development workflows, and agile methodologies in a collaborative remote environment. --- # Key Responsibilities ## Full-Stack Application Development * Design, develop, and maintain scalable full-stack web applications. * Build reusable frontend components and responsive user interfaces. * Develop secure backend APIs and business logic. * Optimize application performance, scalability, and maintainability. * Integrate third-party APIs and cloud services. --- ## AI & Intelligent Systems Integration * Collaborate on AI-powered features using Large Language Models (LLMs). * Integrate OpenAI, Claude, Gemini, or similar AI services into web applications. * Develop intelligent workflows, automation pipelines, and agentic systems. * Assist in implementing AI-driven dashboards and analytics. --- ## Backend Engineering & APIs * Design RESTful APIs and modern backend architectures. * Build authentication, authorization, and user management systems. * Work with relational and NoSQL databases. * Implement scalable server-side services and integrations. --- ## Frontend Development * Develop responsive and accessible interfaces using modern frameworks. * Translate UI/UX designs into production-ready applications. * Improve user experience through performance optimization and interactive features. * Ensure cross-browser compatibility and mobile responsiveness. --- ## Cloud & DevOps * Deploy and maintain cloud-based applications. * Work with Docker and containerized environments. * Support CI/CD pipelines and GitHub Actions workflows. * Collaborate on infrastructure improvements and application monitoring. --- ## Collaboration & Agile Development * Participate in sprint planning and agile development processes. * Manage development tasks through GitHub Issues and Pull Requests. * Collaborate with international volunteers and multidisciplinary teams. * Contribute to technical documentation and architecture discussions. --- # Technical Qualifications ## Required * Experience developing full-stack web applications. * Strong knowledge of JavaScript and TypeScript. * Experience with **React** and modern frontend development. * Experience with **Node.js** and backend development. * Familiarity with REST APIs. * Experience using Git and GitHub. * Understanding of responsive web development principles. * Ability to work independently in a remote environment. * Professional proficiency in English. --- ## Preferred Experience with one or more of the following: * Next.js * Express.js or NestJS * PostgreSQL, MySQL, MongoDB, or Firebase * Docker * GitHub Actions * Vercel, Railway, DigitalOcean, Azure, AWS, or Google Cloud * Prisma ORM * Tailwind CSS * AI APIs (OpenAI, Anthropic Claude, Gemini) * Python for AI or backend services * Data visualization libraries * Machine learning integrations * Experience contributing to open-source projects --- # Our Development Environment Our engineering team follows a modern AI-assisted development workflow, including: * GitHub Issues for task management * Pull Requests for code review * Agile Sprint planning * AI-assisted software development * Modular architecture * Component-based frontend development * API-first backend architecture * Collaborative remote engineering practices --- # What You'll Build You may contribute to projects such as: * AI-powered Volunteer Metrics Hub * Nonprofit Management Systems * Environmental Intelligence Platforms * Analytics Dashboards * Volunteer Engagement Applications * International Partnership Portals * AI Workflow Automation * Data Collection and Reporting Systems --- # Why Join Us? * Build software that creates measurable social impact across multiple countries. * Gain experience developing AI-powered applications. * Collaborate with professionals in software engineering, artificial intelligence, data science, and nonprofit innovation. * Work on projects with real-world users and international reach. * Expand your portfolio through modern cloud-native applications. * Receive a certificate of participation and a professional recommendation letter upon successful completion. * Become part of a global network committed to technology, innovation, and social impact. --- # Additional Information * **Position:** Full Stack Developer (Volunteer) * **Location:** Remote (Worldwide) * **Commitment:** Flexible schedule (minimum 15–20 hours per week) * **Meetings:** Biweekly (30–45 minutes) * **Duration:** Minimum 3-month commitment with potential extension * **Languages:** English required (Spanish is a plus) --- ## Ideal Candidate We're looking for curious builders who enjoy solving challenging technical problems, embracing AI-assisted software development, and creating technology that serves communities around the world. If you're excited about modern full-stack engineering, collaborative open-source practices, and building products with meaningful impact, we'd love to hear from you.", "skills": [], "employment_type": "internship", "exp_min": 0, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 38.8, "matched_skills": ["agile", "rest api", "docker", "github actions", "english", "performance optimization", "devops", "ci/cd", "javascript", "typescript", "react", "postgresql"], "missing_skills": ["artificial intelligence", "ui/ux", "data science", "llm", "openai", "team leadership", "scalability", "ai agents"], "also_on": [], "query": "software-developer", "id": "wf4414165", "extra": {"company_size": "SIZE_51_200", "salary_stated": false, "semantic": 0.391, "score_confidence": "high"}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Graduate Software Engineer - Engine by Starling", "company": "Starling Bank", "url": "https://www.adzuna.com.au/land/ad/5923683020?se=ltSNXq3G8RGDR4seZGtcvQ&utm_medium=api&utm_source=28f9775f&v=B56EE94CF8DE4BFA9B1F5ABB9670628D69A79C9C", "country": "AU", "location": "Sydney, Sydney Region", "remote": null, "posted": "2026-10-12", "posted_at": "2026-10-12T11:36:37+00:00", "posted_raw": "2026-10-12T11:36:37Z", "salary": "", "snippet": "Description Join Our Mission to Transform Banking Starling Bank is the UK’s first and leading digital bank on a mission to fix banking with more than 3,000 people in our UK offices and 4 million customers in the UK! We built a new kind of bank because we knew technology had the power to help people save, spend and manage their money in a new and transformative way. Now we present… Engine by Starli", "description": "", "skills": [], "employment_type": "permanent", "exp_min": null, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 38.5, "matched_skills": [], "missing_skills": [], "also_on": [], "query": "software engineer", "id": "8d6bc3e146dd", "extra": {"salary_stated": false, "semantic": 0.328, "score_confidence": "low"}}, {"source": "linkedin", "source_name": "LinkedIn", "t eate high-signal, high-quality tasks that genuinely test a model's ability to handle multilingual environments without relying on English translation crutches. **Note this is a remote, freelance opportunity** ## **What You’ll Deliver** - Task Engineering: Evaluating Coding Agents. - Asset Creation: Build realistic task environments using datasets and files in your native language. *Crucially, these assets must remain in the target language to genuinely measure multilingual handling.* - Prompting & Translation: finding failure points where AI does not work, in your native language - Implementation & Verification: Support the development of robust solutions (reference implementations) and write highly reliable, deterministic verifier scripts (using rubric-based judging only when strictly necessary). - Calibration & Execution: Analyze execution logs and calibrate task difficulty (Easy to Very Hard) using standard Terminal-Bench run configurations against various model tiers (Haiku, Sonnet, Opus). - Quality Assurance: Participate in a rigorous, 4-layer human quality control process (creation, human review, calibration review, and audit) alongside automated LLM-based checks to ensure fairness, grammatical accuracy, and benchmark integrity. ## **Qualifications** - **Experience:** 1+ years in software or prompt engineering. - **Background:** Proven track record at leading technology companies and/or graduation from top-tier engineering universities. - **Language:** Native or near-native fluency, with a deep understanding of its grammar, register, and phrasing rules. High English proficiency. - **Technical Stack:** Strong proficiency in Python, standard shell scripting, and data processing. - **Workflow:** Extensive experience with Terminal/CLI-based development workflows and a working familiarity with coding agents. - **Domain Expertise:** Deep technical understanding of multilingual text processing pitfalls, including: - Encoding/decoding robustness and Unicode normalization. - Locale-dependent conventions (collation, casing, non-Gregorian dates). - Text I/O, toolchain interoperability, and safe string operations. - *(For specific languages)* Bidirectional/RTL handling, font fallbacks, and rendering/typography in UI or artifacts. ## **Why Collaborate with Lilt?** - **Your schedule, your rules.** As an independent contractor, work when you want, as much or as little as you want. No fixed hours, no check-ins, no micromanaging. - **Get paid quickly and fairly.** We respect your time and your expertise. Competitive rates, prompt payments, no chasing invoices. - **Work on projects that actually matter**. Contribute to cutting-edge AI and language technology that is shaping how humans and machines communicate. - **Be part of something bigger.** Join a global community of linguists, subject matter experts, and language professionals who are advancing human knowledge together. - **Grow without limits.** As a Lilt contractor you get access to diverse, innovative projects that expand your portfolio and sharpen your skills across industries and domains. - **Have fun doing what you love.** Bring your language skills to life on projects that are as interesting as they are impactful.We are building a rigorous, verifiable evaluation suite of Terminal-Bench tasks designed to test the limits of large language models on multilingual software challenges. Our goal is to measure multilingual robustness across prompt language effects, non-English data processing, and complex locale/encoding edge cases in terminal workflows. ## **What to Consider Before Applying** - **Not ideal as a full time job or primary income source.** Work availability fluctuates with project demand, making this better suited as a supplemental income stream. As a 1099 contractor, you won't receive benefits such as health insurance, paid time off, or retirement contributions, and hours are not guaranteed. - **Requires reliable availability and commitment.** Once you accept a task, we ultiple languages, and is adapted to country and healthcare specialty requirements.<\/li> <li>Our stack is composed of Rails, TypeScript, Java, Python, Kotlin, Swift, and React Native.<\/li> <li>We leverage AI ethically across our products to empower patients and health professionals. Discover our AI vision <a href=\"https://careers.doctolib.com/ai-careers/\">here<\/a>.<\/li> <\/ul> <p><em>Want to learn more about our tech culture and environment? Visit the<\/em><a href=\"https://careers.doctolib.com/tech-doctolib/\"><em> <\/em><em>Doctolib Tech site<\/em><\/a><em>.<\/em><\/p> <h2><strong>What we offer<\/strong><\/h2> <ul> <li class=\"break-words text-foreground text-base leading-relaxed\">A<strong> <\/strong><span class=\"font-semibold text-foreground\">Deutschlandticket<\/span> sponsored by Doctolib if you work from the office or in a hybrid setup.<\/li> <li class=\"break-words text-foreground text-base leading-relaxed\"><span class=\"font-semibold text-foreground\">Company health insurance<\/span> with excellent additional benefits.<\/li> <li class=\"break-words text-foreground text-base leading-relaxed\">Free <span class=\"font-semibold text-foreground\">mental health and coaching sessions<\/span> provided through an external partner.<\/li> <li class=\"break-words text-foreground text-base leading-relaxed\">In addition to healthy snacks and a regular breakfast buffet, we offer <span class=\"font-semibold text-foreground\">meal vouchers<\/span>.<\/li> <li class=\"break-words text-foreground text-base leading-relaxed\">A subsidized sports program with our partner <span class=\"font-semibold text-foreground\">Urban Sports Club<\/span>.<\/li> <li class=\"break-words text-foreground text-base leading-relaxed\"><span class=\"font-semibold text-foreground\">Tech masterclasses<\/span> throughout the internship.<\/li> <li class=\"break-words text-foreground text-base leading-relaxed\"><span class=\"font-semibold text-foreground\">Free breakfast at the office<\/span>.<\/l ines to web apps and dashboards. This is a role with a high degree of autonomy. You'll take problems and opportunities, figure out how to build s", "description": "The role: You'll be the foundational hire in our technical team, working directly with the founder to build internal tools, automate manual processes, and develop the data infrastructure that powers our client work. Everything from scraping and data pipelines to web apps and dashboards. This is a role with a high degree of autonomy. You'll take problems and opportunities, figure out how to build solutions, and own them end to end. You'll be expected to be resourceful, using documentation, AI tools, and your own initiative to solve problems and continuously improve your craft. If you thrive with independence and ownership, this is the right environment for you. What you'll be building: A best-in-class suite of audience analysis and marketing tools includiing: - Internal data tools that scrape, process, and analyse social media audience data to surface insights for our clients. - Automated and AI-augmented workflows that replace manual processes across the agency incl. reporting, data collection and content pipelines. - Client-facing dashboards and internal apps using Python and lightweight web frameworks like Streamlit. - Data pipelines that pull from third-party APIs, clean and transform data, and store it for analysis. What we're looking for: - Strong Python skills - Experience or strong interest in web scraping and working with third-party APIs - Comfort building simple web applications and interfaces (Streamlit, Flask, FastAPI or similar) - Basic database skills - SQL, data modelling, working with something like BigQuery, PostgreSQL, or even SQLite - Strong maths and statistics skills to understand and implement established analytical methods (you'll be working with libraries like NetworkX and scipy) - Familiarity with or willingness to quickly learn data libraries like pandas and numpy - Experience us ", "posted_raw": "1791434653", "salary": "104,000 - 170,400 USD / annual", "snippet": "SpaceXAI’s mission is to create AI systems that can accurately understand the universe and aid humanity in its pursuit of knowledge.", "description": "SpaceXAI’s mission is to create AI systems that can accurately understand the universe and aid humanity in its pursuit of knowledge. Our team is small, highly motivated, and focused on engineering excellence. This organization is for individuals who appreciate challenging themselves and thrive on curiosity. We operate with a flat organizational structure. All employees are expected to be hands-on and to contribute directly to the company’s mission. Leadership is given to those who show initiative and consistently deliver excellence. Work ethic and strong prioritization skills are important. All employees are expected to have strong communication skills. They should be able to concisely and accurately share knowledge with their teammates. ABOUT THE ROLE: You will lead a team of AI Tutors (full-time employees and contractors) responsible for delivering high-quality training data and evaluations that power SpaceXAI's models. You will set the standard for data quality on your projects, review work in the domain, ensure the accuracy and consistency of the data produced, and build operational excellence at the team level. This is a hands-on leadership role — you will both execute labeling/review work and continuously improve processes as we scale. RESPONSIBILITIES: Own end-to-end quality and delivery for assigned Human Data projects — personally reviewing work in the domain, ensuring accuracy, consistency, guideline adherence, and high-quality data production at scale. Lead, coach, and performance-manage a team of AI Tutors, including conducting regular performance reviews, maintaining records, creating action plans, managing shadow sessions, and driving continuous improvement. Oversee and actively participate in labeling and reviewing tasks to maintain high standards and model best practices. Ensure strict guideline adherence, taxonomy management, and quality assurance processes. Drive efficiency by identifying and resolving operational bottlenecks, implementing process improvements, and tracking performance via KPI dashboards (e.g., quality metrics, throughput, send-back rates). Build, update, and deliver training materials, practice tasks, and certification benchmark tasks; manage certifications and workforce adjustments. Collaborate closely with Human Data Managers, fellow Team Leads, and Engineering to translate model needs into clear labeling strategies and requirements. Coach and develop talent while maintaining strong accountability and a high-performance culture; support disciplinary actions as needed. Document outcomes, suggest process iterations, and report project status, risks, and results. Act as the voice of your tutors while fostering strong collaboration across the broader Human Data organization. BASIC QUALIFICATIONS: 1+ years of hands-on experience in data labeling, annotation, AI training/evaluation, content quality, or similar operational domains. Professional experience building scalable, high-performance technology applications. Demonstrated experience with data quality metrics, annotation processes, and guideline-driven workflows (as evidenced by prior roles or projects). Basic understanding of AI and machine learning concepts and how high-quality training data impacts model performance. Experience with performance management, coaching, training program development, and certification frameworks. PREFERRED SKILLS AND EXPERIENCE: Previous experience leading small teams in data labeling, annotation, or related operations. Proven ability to manage multiple concurrent projects and prioritize effectively in a fast-paced environment. Strong track record of reviewing domain work, ensuring data quality, and improving operational processes. Proficiency in data analysis and associated tools (SQL a plus); ability to use metrics and KPIs to drive continuous improvement. Experience managing mixed employment types (full-time employees and contractors) or distributed teams. Excellent verbal and written communication skills with the ability to build rapport quickly and align stakeholders. Strong organizational skills, high attention to detail, proactive problem-solving mindset, and focus on continuous improvement. Strategic thinking combined with strong hands-on execution. Specialty or strong domain expertise in at least one of the following areas: Finance, STEM, Coding/Software Engineering, or other technical fields. Passion for building high-performing teams and scaling high-quality Human Data operations. ADDITIONAL REQUIREMENTS: Candidates must be based in one of the following countries where SpaceXAI has a physical office; remote work is also possible - United States - Dubai - Ireland - United Kingdom - Ireland - Japan - India - Indonesia - South Korea - Philippines - Singapore COMPENSATION AND BENEFITS: US based candidates: $104,000 - $170,400 USD depending on factors including relevant experience, skills, education, geographic location, and qualifications. International candidates: information will be provided to you during the recruitment process. Base salary is just one part of our total rewards package at SpaceXAI, which also includes equity, comprehensive medical, vision, and dental coverage, access to a 401(k) retirement plan, short & long-term disability insurance, life insurance, and various other discounts and perks. Benefits vary based on employment type, location and jurisdiction. Benefits for eligible U.S. based positions include health insurance, 401(k) plan, and paid sick leave. Specific details and role specific information will be provided to you during the interview process. SpaceXAI is an equal opportunity employer. For details on data processing, view our Recruitment Privacy Notice. Originally posted on Himalayas", "skills": ["AI s build products and features that improve the daily lives of healthcare professionals and patients. We work in feature teams within an agile environment, in close collaboration with Product, Design, Data Science, and Business teams.<\/p> <h2><strong>What you'll do<\/strong><\/h2> <p>We a", "description": "<p>Join a team of passionate and committed people working to improve healthcare.<\/p> <p>At Doctolib, our tech teams build products and features that improve the daily lives of healthcare professionals and patients. We work in feature teams within an agile environment, in close collaboration with Product, Design, Data Science, and Business teams.<\/p> <h2><strong>What you'll do<\/strong><\/h2> <p>We are looking for an <strong>AI Engineer Intern<\/strong> to join our Tech team and contribute to the development of AI-powered features at Doctolib.<\/p> <p>You will work closely with experienced AI and software engineers to explore, prototype, evaluate, and improve AI-based solutions. This internship will give you the opportunity to gain practical experience across the different stages of an AI product, from experimentation to integration into a production environment.<\/p> <p>Your responsibilities will include:<\/p> <ul> <li>Contribute to the development of AI features and services under the guidance of experienced engineers<\/li> <li>Write Python code to support prototypes, experiments, evaluation tools, and backend components<\/li> <li>Experiment with large language models, prompting techniques, retrieval, and tool integration<\/li> <li>Contribute to automated tests and documentation for the components you develop<\/li> <li>Investigate issues, analyse results, and suggest improvements to your team<\/li> <li>Participate in code reviews, technical discussions, and team rituals<\/li> <\/ul> <p>You will receive regular guidance from your mentor and teammates. The scope of your work will grow progressively as you become familiar with the codebase, the tools, and the technical challenges.<\/p> <h2><strong>Who you are<\/strong><\/h2> <p>Before you read on, if you do not have the exact profile described below but feel that this internship matches your skills and interests, we still encourage you to apply.<\/p> <p>You will be a great fit if you:<\/p> <ul> <li>Are in the final year of a degree in Computer Science, Artificial Intelligence, Software Engineering, or a related field<\/li> <li>Have basic experience with Python through coursework, personal projects, research, or previous internships<\/li> <li>Have a basic understanding of programming concepts, data structures, and software development<\/li> <li>Are curious about artificial intelligence and interested in understanding how AI systems work<\/li> <li>Are comfortable communicating in English, both written and spoken<\/li> <\/ul> <p>It would be fantastic if you:<\/p> <ul> <li>Have worked on a project involving machine learning, natural language processing, or large language models<\/li> <li>Have used agentic frameworks like Langchain or Google ADK.<\/li> <li>Have experimented with AI APIs, prompting, retrieval, or conversational interfaces<\/li> <li>Have experience in taking products to production and supporting them with real users.<\/li> <li>Have some experience with Git, APIs, testing, or data analysis<\/li> <li>Have an interest in healthcare, privacy, or responsible AI<\/li> <\/ul> <h2><strong>Life at Doctolib Tech<\/strong><\/h2> <p>Our products are built on a cloud-native platform that supports web and mobile applications across several countries and healthcare systems.<\/p> <p>Even if Doctolib uses technologies like Ruby on Rails, TypeScript, Java, Kotlin, Swift, React Native, and many cloud-related technologies, the principal language you'll work on is Python.You will also have the opportunity to use AI-assisted development tools within our engineering practices.<\/p> <p>Discover our AI vision<a href=\"https://careers.doctolib.com/ai-careers/\"> here<\/a> and learn more about our tech culture on the<a href=\"https://careers.doctolib.com/tech-doctolib/\"> Doctolib Tech site<\/a>.<\/p> <h2><strong>What we offer<\/strong><\/h2> <ul> <li>A structured internship with dedicated mentoring<\/li> <li>The opportunity to work on real AI projects in a healthcare environment<\/li> <li>Technical learning sessions and access to internal engineering communities<\/li> <li>Access to AI tools for coding, development, and learning<\/li> <li>Meal vouchers<\/li> <li>Free breakfast in the office<\/li> <li>Up to 2 days of remote work per week<\/li> <li>A flexible workplace policy, depending on the team and location<\/li> <li>A collaborative and international working environment<\/li> <\/ul> <h2><strong>The interview process<\/strong><\/h2> <ul> <li>Coding Game<\/li> <li>Recruiter Interview<\/li> <li>Technical Interview<\/li> <li>Behavioral Interview<\/li> <\/ul> <h2><strong>Job details<\/strong><\/h2> <ul> <li>Internship, 6 months, full-time<\/li> <li>Location: Berlin, Paris, Nantes, Milan, or Amsterdam<\/li> <li>Hybrid work setup, up to 2 remote days per week<\/li> <li>Start date: March 2027<\/li> <\/ul> <h2><strong>We welcome everyone<\/strong><\/h2> <p>At Doctolib, we are committed to improving access to healthcare for everyone. We evaluate candidates based on their qualifications, motivation, and potential, without discrimination.<\/p> <p>The more diverse ideas are heard, the better our products can serve patients and healthcare professionals. We welcome applications regardless of gender, religion, age, sexual orientation, ethnicity, disability, or place of origin.<\/p> <p>To support an inclusive recruitment process, we invite you to leave personal information such as pictures and age off your application. If you require an accommodation during the interview process, please let us know.<\/p> <p>Join us in building the healthcare we all dream of!<\/p> <h2><strong>Your data privacy<\/strong><\/h2> <p>All information provided through this application is processed by Doctolib for recruitment purposes. For more information about how Doctolib processes your application data, please consult the relevant privacy policy:<\/p> <ul> <li><a href=\"https://doctolib.legal/B2C-Privacy-Policy-Career-DE\">Germany<\/a><\/li> <li><a href=\"https://doctolib.legal/B2C-Privacy-Policy-Career-FR\">France<\/a><\/li> <li><a href=\"https://doctolib.legal/B2C-Privacy-Policy-Career-IT\">Italy<\/a><\/li> <li><a href=\"https://doctolib.legal/B2C-Privacy-Policy-Career-COM\">The Netherlands<\/a><\/li> <\/ul> <p>For questions or to exercise your rights, please contact hr.dataprivacy(at)<a href=\"http://doctolib.com/\">doctolib.com<\/a>.<\/p> Find more English Speaking Jobs in France on Arbeitnow", "skills": ["Engineering"], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "intern", "fit": "fit", "relevance": 1.0, "score": 31.8, "matched_skills": ["agile", "english", "code review", "data structures", "typescript", "java"], "missing_skills": ["artificial intelligence", "data science", "python", "llm", "machine learning", "nlp", "ai agents", "langchain"], "also_on": [], "query": "", "id": "4cacd4895baf", "extra": {"salary_stated": false, "semantic": 0.265, "score_confidence": "high"}}, {"source": "seek", "source_name": "JobsDB", "title": "Full Stack-developer (Contact 3 months)", "company": "Mercil Solution Co., Ltd.", "url": "https://th.jobsdb.com/job/95214921", "country": "TH", "location": "Phaya Thai, Bangkok", "remote": null, "posted": "2026-10-12", "posted_at": "2026-10-12T11:11:02+00:00", "posted_raw": "2026-10-12T11:11:02Z", "salary": "", "snippet": "Full Stack Developer (Golang) for healthcare projects. 1-2 years of experience. 3-month renewable contract. Hybrid work at Asok, Bangkok.", "description": "", "skills": [], "employment_type": "Contract/Temp", "exp_min": 1.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 31.7, "matched_skills": [], "missing_skills": ["golang"], "also_on": [], "query": "software engineer", "id": "50b7c4925cdf", "extra": {"category": "Developers/Programmers", "salary_stated": false, "semantic": 0.408, "score_confidence": "low"}}, {"source": "arbeitnow", "source_name": "Arbeitnow", "title": "Junior Computational Geometry Engineer", "company": "Saeki", "url": "https://www.arbeitnow.ch/jobs/companies/saeki/junior-computational-geometry-engineer-zurich-305768", "country": "DE", "location": "Zurich", "remote": false, "posted": "2026-10-11", "posted_at": "2026-10-11T11:09:16+00:00", "posted_raw": 1791716956, "salary": "", "snippet": "SAEKI - Manufacturing at software speed Europe's defense industrial base cannot respond at the speed modern conflict requires. Legacy suppliers operate on month-long timelines. Tribal knowledge is retiring. Supply chains are fragile. SAEKI is building the operating system for autonomous factories - the infrastructure that lets Europe manufacture mission-critical components at software speed. The R", "description": "SAEKI - Manufacturing at software speed Europe's defense industrial base cannot respond at the speed modern conflict requires. Legacy suppliers operate on month-long timelines. Tribal knowledge is retiring. Supply chains are fragile. SAEKI is building the operating system for autonomous factories - the infrastructure that lets Europe manufacture mission-critical components at software speed. The Role As a Junior Computational Geometry Engineer, you work on the geometry core of our Manufacturing Intelligence stack: the engine that takes an arbitrary customer CAD model, reasons about how to build it, and then proves that we built it right. You start on well-scoped parts of that engine, next to the engineers who built it, and grow into owning them. Your code runs in the factory. What We're Looking For Foundations . Degree in computer science, mathematics, mechanical engineering or a related field, with real depth in geometry, linear algebra and numerics. Internships, thesis work or serious side projects count. We do not expect years of production experience. B-rep Basics . You are comfortable with topology, NURBS, meshes and point clouds. You may never have shipped a robust boolean, and you still understand why floating-point robustness destroys naive implementations, and you want to learn how the field handles it. Kernel Exposure . You have worked with a geometry kernel and mesh libraries in at least one project: OpenCASCADE, CGAL, libigl, Open3D, PCL, Parasolid or comparable. Technical Ability . Solid modern C++ (17+) plus Python for tooling and rapid iteration. Rust is welcome. You write code others can read, test and maintain. Manufacturing Curiosity . You want to understand what happens once geometry meets a spindle, a nozzle or a fixture. CNC, additive or metrology exposure is a bonus, never a requirement. First Principles Thinker . You reason by physics and mathematics, not analogy. When an algorithm fails on a real part, you dig until you know whether the bug sits in the code, the model or the assumption. Learning Speed . You take direct feedback, apply it immediately, and close your own knowledge gaps without waiting to be taught. Industrial Grit . You want to stand next to the machine in Germany and watch your output run. The feedback loop between your code and cutting metal is the point. On - site . Ability to work in person at our HQ in Zurich, Switzerland. What we're not looking for Researchers who want to publish and hand off. You ship. CAD users. This is a role for people who build the tools, not drive them. Engineers who need a clean spec. The problem is defined by the part, the machine, and the customer - you'll help define it. People who treat “it works on the test model” as done. Real customer CAD is broken, degenerate, and adversarial. That is the job. Engineers who are uncomfortable with ambiguity or rapidly changing priorities. What we offer Mission : Rebuild the industrial sovereignty of the West. Your work directly enables production of mission-critical hardware for defense and space. Total Ownership : High-stakes autonomy in your domain. You own both the problems and the solutions - and have the authority to execute. The Environment : Access to a 8,000 m² state-of-the-art facility featuring 5-axis CNCs, industrial robots, and industrial 3D printers. Your algorithms run on real hardware from day one. The Team : \"Special Forces\" model. Everyone senior, everyone ships. No politics, no bureaucracy. Direct feedback, high standards. Compensation : Competitive salary + meaningful equity. Location : Zurich HQ, with occasional time at Factory ONE in Munich. Apply Resume : Focus on the geometry work you have actually done. Thesis, internships, projects, coursework. GitHub / Portfolio : Show us the hardest problem you have solved. Code, a write-up, or a part that came off a machine because of you. Cover letter : Why this mission? Why now? What would you build first? Find Jobs in Switzerland on Arbeitnow", "skills": [], "employment_type": "Entry, Permanent, Full time", "exp_min": null, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 31.4, "matched_skills": ["data structures"], "missing_skills": ["c++", "python", "rust", "r"], "also_on": [], "query": "", "id": "4ba943f6a5b0", "extra": {"salary_stated": false, "semantic": 0.416, "score_confidence": "high"}}, {"source": "arbeitnow", "source_name": "Arbeitnow", "title": "Software Engineer Internship (2027 Start)", "company": "Optiverus", "url": "https://www.arbeitnow.co.uk/jobs/companies/optiverus/software-engineer-internship-2027-start-london-474441", "country": "DE", "location": "London", "remote": false, "posted": "2026-10-12", "posted_at": "2026-10-12T09:55:15+00:00", "posted_raw": 1791798915, "salary": "", "snippet": "<p data-renderer-start-pos=\"29\"> <\/p> <p data-local-id=\"6618a4c09482\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\" data-pm-slice=\"1 1 []\">As a Software Engineering Intern, you will work side-by-side with your mentor and teammates to build software for Optiver’s real-time trading environment. You will work on <a href=\"https://www.opt", "description": "<p data-renderer-start-pos=\"29\"> <\/p> <p data-local-id=\"6618a4c09482\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\" data-pm-slice=\"1 1 []\">As a Software Engineering Intern, you will work side-by-side with your mentor and teammates to build software for Optiver’s real-time trading environment. You will work on <a href=\"https://www.optiver.com/join-us/stories/real-projects-real-impact-amsterdam-summer-tech-internship/\" data-prosemirror-content-type=\"mark\" data-prosemirror-mark-name=\"link\"><u data-prosemirror-content-type=\"mark\" data-prosemirror-mark-name=\"underline\">projects<\/u><\/a> that further develop and optimize our systems, testing and shipping code with guidance from experienced engineers and seeing how your work performs in production. In our business, where markets are always evolving, each day brings new engineering problems shaped by live conditions, performance requirements and system reliability.<\/p> <p data-local-id=\"6618a4c09482\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\" data-pm-slice=\"1 1 []\">Optiver is building with cutting edge AI technology in the most competitive, data rich landscapes in the world: financial markets. That means no two days are the same, and every day brings new, exciting technical challenges to solve.<\/p> <p data-local-id=\"e71efb55c8b9\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\"><strong data-prosemirror-content-type=\"mark\" data-prosemirror-mark-name=\"strong\">What you’ll do<\/strong><\/p> <p data-local-id=\"8afd6ffe29a0\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">During the ten-week internship, you will be mentored by Optiver engineers, play a key role in advancing our world-class trading systems and work on projects that push the boundaries of performance and efficiency. You will:<\/p> <ul class=\"ak-ul\" data-local-id=\"514e5e2c-2980-4193-ba6d-508c3f44edb6\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"bulletList\" data-prosemirror-node-block=\"true\"> <li data-local-id=\"dff1cc03-cbf1-4a5b-9422-b191262a2a98\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"listItem\" data-prosemirror-node-block=\"true\"> <p data-local-id=\"9cd8c58e269a\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">Build a strong foundation in trading fundamentals, from theoretical concepts and financial markets to strategies and the technology that supports them<\/p> <\/li> <li data-local-id=\"a86da618-d5c5-4001-a928-9fbe3de87832\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"listItem\" data-prosemirror-node-block=\"true\"> <p data-local-id=\"f21fa1514da3\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">Work closely with senior engineers and traders to design, develop, test, and ship your code to production<\/p> <\/li> <li data-local-id=\"da489c30-a1e3-44f9-8256-92296dfe6a39\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"listItem\" data-prosemirror-node-block=\"true\"> <p data-local-id=\"d0b1254a72a3\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">Tackle complex, real-world problems to enhance your critical thinking and problem-solving skills<\/p> <\/li> <li data-local-id=\"15cfdbcc-410e-48a2-91c4-068b27943eb6\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"listItem\" data-prosemirror-node-block=\"true\"> <p data-local-id=\"d5d7a4a71570\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">Learn how engineers collaborate with traders and researchers to understand requirements, respond to feedback and improve systems quickly<\/p> <\/li> <\/ul> <p data-local-id=\"552233c42154\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">Based on your performance during the internship, you could receive an offer to join our firm full-time after your studies, in either our London or Amsterdam office.<\/p> <p data-local-id=\"17cb781dde04\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\"><strong data-prosemirror-content-type=\"mark\" data-prosemirror-mark-name=\"strong\">What you’ll get<\/strong><\/p> <p data-local-id=\"ac017d07124a\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">You’ll join a culture of collaboration and excellence, where you’ll be surrounded by curious thinkers and creative problem solvers. Motivated by a passion for continuous improvement, you’ll thrive in a supportive, high-performing environment alongside talented colleagues, working collectively to tackle the toughest problems in the financial markets.<\/p> <p data-local-id=\"e3ab45fc48fd\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">In addition, you’ll receive:<\/p> <ul class=\"ak-ul\" data-local-id=\"daf8fa83-8083-4248-a62e-547eda7ad247\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"bulletList\" data-prosemirror-node-block=\"true\"> <li data-local-id=\"34ea4bfe-4d25-440d-bbd6-2d3838ebe553\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"listItem\" data-prosemirror-node-block=\"true\"> <p data-local-id=\"ceb1f6a7a16d\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">A highly competitive internship compensation package and accommodation included<\/p> <\/li> <li data-local-id=\"664b46bb-d7b6-4ee5-996b-8a66e725e708\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"listItem\" data-prosemirror-node-block=\"true\"> <p data-local-id=\"d168de618af2\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">Extensive office perks, including breakfast and lunch and world-class barista coffee.<\/p> <\/li> <li data-local-id=\"22bc1ab2-ce44-4729-8d79-54607d29696e\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"listItem\" data-prosemirror-node-block=\"true\"> <p data-local-id=\"d079a8620269\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\">The opportunity to participate in sports and leisure activities, along with social events<\/p> <\/li> <\/ul> <p data-local-id=\"c8780453dbe6\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\"> <\/p> <p data-local-id=\"bb2d211e8cba\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"paragraph\" data-prosemirror-node-block=\"true\"><strong data-prosemirror-content-type=\"mark\" data-prosemirror-mark-name=\"strong\">Who you are<\/strong><\/p> <ul class=\"ak-ul\" data-local-id=\"2e05bb9f-0140-4c79-9bf8-50f147104fe5\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"bulletList\" data-prosemirror-node-block=\"true\"> <li data-local-id=\"e7d32e4f-4843-4160-bb5f-be63b644451b\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"listItem\" data-prosemirror-node-block=\"true\"> <p data-local-id=\"23b57a94abd6\" data-prosemirror-content-type=\"node\" data-prosemirror-node-name=\"para
