 to deliver sustainable solutions for a more prosperous planet. Make your mark, on your career, your colleagues, your clients, your life and the world around you. Together, we can create a lasting legacy. Join Arcadis. Create a Legacy. Our Commitment to Equality, Diversity, Inclusion & Belonging We want you to be able to bring your best self to work every day, which is why we take equality and inclusion seriously and hold ourselves to account for our actions. Our ambition is to be an employer of choice and provide a great place to work for all our people. #GECPlacesDesign&Engineering #GECPlacesRomania #GECPlacesIndia", "skills": [], "employment_type": "Full-time", "exp_min": 1.0, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 63.5, "matched_skills": ["video analytics", "english"], "missing_skills": [], "also_on": [], "query": "engineer", "id": "li4486227372", "extra": {"linkedin_id": "4486227372", "seniority_level": "Mid-Senior level", "details_fetched": true, "salary_stated": false, "semantic": 0.115, "score_confidence": "high", "ai_summary": {"why": "Strong backend and data engineering skills in Java, Kafka, and PostgreSQL align with Arcadis' need for computational design and data-driven engineering solutions.", "gaps": "Lacks specific mechanical design software proficiency (Revit) and formal building services degree required for MEPF discipline."}, "is_mnc": false, "contacts": {"domain": "arcadis.com", "site": "", "emails": ["louis.marracci@arcadis.com", "megan.eves@arcadis.com", "brandon.murray@arcadis.com", "zac.payne@arcadis.com", "mark.knight@arcadis.com", "mark.harrop@arcadis.com", "emma.maltby@arcadis.com", "john.howarth@arcadis.com", "edel.christie@arcadis.com", "steef.swart@arcadis.com"], "people": [{"name": "Louis Marracci", "title": "Director of Technical Development and Digital Transformation", "company": "Arcadis", "location": "", "email": "louis.marracci@arcadis.com", "linkedin": "https://www.linkedin.com/in/louis-ma : "$20k – $32k", "snippet": "**Location**: 100% Remote from India, min. 4h overlap with CET (e.g. 9:00–13:00 CET). Fluent English, spoken and written. German is not required. **Compensation**: 20k-32k USD per year (depending on location) + Shares + Generous Benefits. We pay local rates that are at or above the market. We share this [philosophy with GitLab](https://about.gitlab.com/blog/2019/02/28/why-we-pay-local-rates/). **A", "description": "**Location**: 100% Remote from India, min. 4h overlap with CET (e.g. 9:00–13:00 CET). Fluent English, spoken and written. German is not required. **Compensation**: 20k-32k USD per year (depending on location) + Shares + Generous Benefits. We pay local rates that are at or above the market. We share this [philosophy with GitLab](https://about.gitlab.com/blog/2019/02/28/why-we-pay-local-rates/). **About Secfix** Secfix automates security compliance for SMBs and mid-market companies in Europe and gets them compliant with ISO 27001, GDPR, TISAX and SOC 2 in weeks instead of months. We’re a fast-growing team of 36 people, backed by a $12M Series A from Alstin Capital, Neosfer (Commerzbank) and Bayern Capital. **About the Role** You’ll be the **first engineer dedicated to our go-to-market team**. You build and own the backend systems our BDRs and AEs run on every day: data pipelines, integrations, internal services and AI agents. Today, everyone runs their own setup for data, outreach and communication. You’ll replace that with one central, reliable system that scales with us. This is a hands-on engineering role: you’ll write code (Python, SQL) every day, connect APIs and build data pipelines and AI workflows, not configure tools or run RevOps. You report to our Head of GTM, work closely with Sales and exchange with our Engineering team on architecture and best practices. We own products and outcomes, not Jira tickets. **What You'll Do** - **Data pipelines:** Design and build pipelines that pull account and contact data from multiple sources and APIs, clean, deduplicate and score it, and sync it to our CRM as the single source of truth. - **Data layer:** Design the data model and central database behind our GTM, connecting CRM, outreach and product data. - **Integrations & services:** Integrate internal and third-party tools via REST APIs and webhooks, and build small internal services and tools where off-the-shelf tools fall short. - **Signals & automation:** Build signal detection, lead scoring and routing, and alerts that tell the right rep which account to call today and why. - **AI agents:** Build AI-powered tools and agents that take repetitive work off our AEs, from research to proposals to CRM updates. - **Reliability:** Deploy, schedule, monitor and maintain everything you build: error handling, retries, rate limits, logging and alerts when something breaks. - **Ownership end-to-end:** Investigate problems, find the root cause, ship the fix and document it so nothing depends on one person. Your success: reps spend less time on manual work and more time with customers, and more pipeline comes from systems that run reliably and are actually used. **About You** You’re a backend engineer who loves building things real people use every day, and curious about the business: why a customer buys, which signal means a company is ready. You build systems that run reliably at 10x volume, not one-off scripts. - Recent graduate (0–2 years) in Computer Science or a related engineering field with a strong academic record. - 1+ years of backend experience through your first full-time job or internships in a startup environment. - Strong engineering fundamentals: solid Python (or another backend language), SQL and data modeling. - Experience building and consuming REST APIs and working with webhooks. - You know how to run code in production: Git, deployment, scheduling, testing, logging and debugging. - You think in systems: you understand how components depend on each other and what breaks when you change one part. - Hands-on experience with AI coding tools and LLM APIs (e.g. Claude Code or the Claude API). - You’ve built and shipped real things (a feature, service, data pipeline or internal tool) and can show them. - Smart, structured problem solver and fast learner: you pick up new tools on your own and bring complexity down. - Independent, proactive and comfortable communicating remotely, especially in writing. **Nice to have:** Experience with a cloud platform (AWS or GCP), a data warehouse, a CRM and its API, or GTM tools like Clay. You **should not apply** if: - You need detailed tickets telling you what to build. - You only want to write code and don’t care about business impact. - You don’t want to test, monitor and maintain what you ship. - You’d rather be led than lead your own projects. - You don’t want to work closely with Sales and the people who use your tools. **Interview Process** - ~30 min – Introductory call with our Talent team - Technical take home challenge (~8–10h, 7 days to submit) - ~90 min – Interview incl. live coding with our Head of GTM - Final interview with our co-founder and Head of GTM **What we offer** - **Remote Work:** 100% remote work with a virtual office in Gather. - **Competitive Salary:** Industry-competitive local salaries. We pay local rates that are at or above the market. We share this [philosophy with GitLab](https://about.gitlab.com/blog/2019/02/28/why-we-pay-local-rates/). - **Equity:** Generous equity package – we’re all owners of Secfix and beneficiaries of our collective success. - **Holidays**: 26 days holiday + local public holidays. - **Health Insurance:** Comprehensive health coverage. - **Development Budget:** €1,000 annual personal development budget. - **Workspace Budget:** Remote workspace budget and access to co-working spaces. - **Annual Retreat**: Annual retreat to build connections and inspire ideas (this year we’re headed to Alicante, Spain!). - **Tech Equipment**: Latest tech equipment (MacBook, monitors, headphones). - **Company Events:** Company-wide events to build relationships and have some fun! - **Mentorship:** We are backed by top VCs and accelerators and have direct access to world-class mentors. Our values: we are obsessed with our customers, we build smart, we create trust, we are hacky, we take ownership, and we are leaders of remote. *We are an equal-opportunity employer and remote-only company. We work in sync using Gather as our virtual office and therefore cannot support 100% asynchronous work.* [*Read more about our Remote Culture here*](https://app.notion.com/p/Remote-Culture-93bf571583904c5e814b7afd83c240f2?pvs=21)*.*", "skills": [], "employment_type": "full-time", "exp_min": 0.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 50.1, "matched_skills": ["english", "german", "sql", "rest api", "aws"], "missing_skills": ["data pipelines", "gitlab ci", "artificial intelligence", "ai agents", "python", "logging", "iso 27001", "gdpr"], "also_on": ["LinkedIn"], "query": "engineer", "id": "wf5008726", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 2688000, "salary_lpa": 26.9, "salary_text": "$20k – $32k", "semantic": 0.499, "score_confidence": "high", "ai_summary": {"why": "Strong Java/SQL background with Kafka and AWS experience aligns well with GTM's data pipeline and integration needs.", "gaps": "Lacks specific Python, GitLab CI, and AI agent skills required for the role."}, "is_mnc": false, "lpa": 26.9, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0, "contacts": {"domain": "secfix.com", "site": "", "emails": ["branko@secfix.com", "fabiola@secfix.com", "grigory@secfix.com", "marie-isabelle@secfix.com", "shreshtha@secfix.com", "rachit@secfix.com", "chris@secfix.com", "amreesh@secfix.com", "pattern: {first}@secfix.com"], "people": [{"name": "Branko Džakula", "title": "Co-Founder", "company": "Secfix", "location": "", "email": "branko@secfix.com", "linkedin": "https://www.l mates security compliance for SMBs and mid-market companies in Europe and gets them compliant with ISO 27001, GDPR, TISAX and SOC 2 in weeks instead of months. We’re a fast-growing team of 36 people, backed by a $12M Series A from Alstin Capital, Neosfer (Commerzbank) and Bayern Capital. **About the Role** You’ll be our first GTM Engineer and build the system our entire go-to-market team runs on, from BDRs to AEs. Today, everyone runs their own setup for data, outreach and communication. You’ll replace that with one central, automated system and keep it reliable as we grow. This is a hands-on engineering role: you’ll write code (Python, SQL) every day, connect APIs and build data pipelines and AI workflows, not configure tools or run RevOps. You report to our Head of GTM, talk to everyone in GTM, spot the biggest bottlenecks and decide together what to build next. We own products and outcomes, not Jira tickets. **What You'll Do** - **Data:** Make our CRM the single source of truth for every target account. Model accounts, contacts and buying committees, and build automated pipelines that pull data from multiple sources, deduplicate, score and write it back. - **Pipeline generation:** Build signal-based outbound, inbound scoring and routing, and alerts that tell the right rep which account to call today and why. - **Sales automation:** Build AI tools and agents that take repetitive work off our AEs, from research to proposals to CRM updates. - **GTM infrastructure:** Design our central data layer, integrate new tools via APIs and webhooks, and make sure everything runs reliably: scheduled jobs, error handling, monitoring and alerts when something breaks. - **Ownership end-to-end:** Investigate problems, find the root cause, ship the fix and document it so nothing depends on one person. Your success: reps spend less time on manual work and more time with customers, and more pipeline comes from systems that run reliably and are actually used. **About You** You’re an engineer who loves building things real people use every day, and are curious about the business. You build systems that run reliably at 10x volume, not one-off scripts. - Recent graduate (0–2 years) in Computer Science or another engineering field with a strong academic record. - 1+ years of experience through your first full-time job or internships in a startup environment. - Solid Python and hands-on experience with APIs and webhooks. - You know how to run code in production: version control (Git), scheduling, handling errors and rate limits, logging and debugging. - You think in systems: you understand how components depend on each other and what breaks when you change one part. - Smart, structured problem solver and fast learner: you pick up new tools and technologies on your own and bring complexity down. - Hands-on experience with Claude (incl. Claude Code or the API). This is a must-have. - You’ve built and shipped real things (an automation, scraper, data pipeline or internal tool) and can show them. - Independent, proactive and comfortable communicating remotely, especially in writing. **Nice to have:** SQL and data modeling, experience with a CRM, GTM tools like Clay, a data warehouse or a cloud platform. You **should not apply** if: - You need detailed tickets telling you what to build. - You only want to write code and don’t care about business impact. - You don’t want to test, monitor and maintain what you ship. - You’d rather be led than lead your own projects. - You don’t want to work closely with Sales and the people who use your tools. **Interview Process** - ~30 min – Introductory call with our Talent team - Technical take-home challenge (~8–10h, 7 days to submit) - ~90 min – Interview incl. live coding with our Head of GTM - Final interview with our co-founder and Head of GTM **What we offer** - **Remote Work:** 100% remote work with a virtual office in Gather. - **Competitive Salary:** Industry-competitive local salaries. We pay local rates that are at or above the market. We share this [philosophy with GitLab](https://about.gitlab.com/blog/2019/02/28/why-we-pay-local-rates/). - **Equity:** Generous equity package – we’re all owners of Secfix and beneficiaries of our collective success. - **Holidays**: 26 days holiday + local public holidays. - **Health Insurance:** Comprehensive health coverage. - **Development Budget:** €1,000 annual personal development budget. - **Workspace Budget:** Remote workspace budget and access to co-working spaces. - **Annual Retreat**: Annual retreat to build connections and inspire ideas (this year we’re headed to Alicante, Spain!). - **Tech Equipment**: Latest tech equipment (MacBook, monitors, headphones). - **Company Events:** Company-wide events to build relationships and have some fun! - **Mentorship:** We are backed by top VCs and accelerators and have direct access to world-class mentors. Our values: we are obsessed with our customers, we build smart, we create trust, we are hacky, we take ownership, and we are leaders of remote. *We are an equal-opportunity employer and remote-only company. We work in sync using Gather as our virtual office and therefore cannot support 100% asynchronous work.* [*Read more about our Remote Culture here*](https://app.notion.com/p/Remote-Culture-93bf571583904c5e814b7afd83c240f2?pvs=21)*.*", "skills": [], "employment_type": "full-time", "exp_min": 0.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 44.3, "matched_skills": ["english", "german", "sql"], "missing_skills": ["gitlab ci", "python", "data pipelines", "artificial intelligence", "iso 27001", "gdpr", "soc 2", "jira"], "also_on": [], "query": "engineer", "id": "wf5008727", "extra": {"company_size": "SIZE_11_50", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": true, "salary_inr": 2688000, "salary_lpa": 26.9, "salary_text": "$20k – $32k", "semantic": 0.333, "score_confidence": "high", "ai_summary": {"why": "Strong backend enginee ", "country": "IN", "location": "Gurgaon, Haryana, India", "remote": null, "posted": "2026-11-05", "posted_at": null, "posted_raw": "1 day ago", "salary": "", "snippet": "About This Role Your team Modern Workplace Engineering delivers and operates enterprise workplace technologies that enable secure and reliable access across managed devices. The team engineers and supports enterprise mobile services, with a strong focus on Apple iOS and iPadOS and hands-on ownership across Ivanti Endpoint Manager Mobile (EPMM) and Microsoft Intune. The team partners across securit", "description": "About This Role Your team Modern Workplace Engineering delivers and operates enterprise workplace technologies that enable secure and reliable access across managed devices. The team engineers and supports enterprise mobile services, with a strong focus on Apple iOS and iPadOS and hands-on ownership across Ivanti Endpoint Manager Mobile (EPMM) and Microsoft Intune. The team partners across security, identity, network, application and service-management functions to improve platform reliability, automation and the overall mobile experience. Your role and impact As an Associate in Modern Workplace Engineering, you will be an individual contributor responsible for delivering mobile-platform engineering and operational improvements from design through production support. You will help evolve enterprise mobile services by strengthening device-management capabilities, improving automation, resolving complex technical issues and supporting secure integration with identity, networking and adjacent platforms. iOS and iPadOS engineering will be the primary technical focus, with macOS and Jamf experience contributing to broader Apple-platform capabilities. The role combines engineering delivery with steady-state service ownership and cross-functional collaboration. Your responsibilities Responsibilities In every role at BlackRock, you'll be expected to apply sound judgement and critical thinking to solve complex problems, adapt as the business evolves, and combine the curiosity to explore new approaches and technologies with the rigor to challenge the results. The scope of this role also includes the following responsibilities: Engineer and operate enterprise mobile management services across Ivanti EPMM and Microsoft Intune, including enrollment, configuration, compliance, application management, testing, controlled releases, platform standards and technical documentation. Own the mobile-platform service lifecycle, delivering engineering backlog items and Level 3 troubleshooting while supporting controlled environments, incident and problem management, knowledge transfer and reliable day-to-day operations. Develop secure, supportable automation and reporting using PowerShell and other appropriate scripting, application programming interface (API) and source-control capabilities to reduce manual effort, improve data quality and increase visibility of platform health and performance. Lead iOS and iPadOS engineering and contribute to broader Apple-platform capabilities, including device enrollment, managed applications, certificates, macOS and Jamf collaboration, automation and lifecycle standards. Partner across security, identity, network, application and service-management teams to deliver secure and resilient mobile services, manage dependencies and communicate technical risks, decisions and status to stakeholders. Your experience Demonstrated experience in enterprise endpoint, mobility or modern workplace engineering, including hands-on enterprise mobile management and strong iOS and iPadOS engineering capabilities. Experience engineering enterprise device enrollment, configuration, compliance, managed applications, reporting and device lifecycle processes. Practical experience with scripting, automation, APIs and controlled source-management practices, including PowerShell and relevant experience with Python, shell scripting, Git or Azure DevOps. Strong A     visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {

      if (!hay.includes(q)) return false;

  function sorter(a, b) {

        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>

  /* the whole filter toolbar can be hidden: only its Filters button stays */

    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }

  .tb-toggle::after { content: "\25B4"; font-size: 0.7rem; }
  .tb-hidden .tb-toggle::after { content: "\25BE"; }

  /* thin scrollbars that follow the page's light / dark theme */
  :root { color-scheme: light dark; } :root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }

    --v2-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --v2-display: 'Archivo Black', Impact, system-ui, sans-serif;
  }

    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {

  :root[data-ui="v2"] body, :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea {

</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
