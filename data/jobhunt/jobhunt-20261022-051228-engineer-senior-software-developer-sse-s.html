oper tools is welcome. You do not need to know every technology listed to apply. ### Compensation Annual salary: **₹14–15 LPA (₹14,00,000–₹15,00,000 per year).** ### How to apply For faster processing, apply directly through **LinkedIn Easy Apply** at **https://www.linkedin.com/jobs/view/4480240151/** with your resume. Include a GitHub, portfolio, or project link in your resume if available, and highlight what you built and your contribution.", "skills": [], "employment_type": "full-time", "exp_min": 0, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 74.1, "matched_skills": ["data structures", "code review", "javascript", "typescript", "rest api", "sql", "react", "postgresql", "test automation"], "missing_skills": ["python", "git", "node.js", "next.js", "artificial intelligence"], "also_on": [], "query": "software-engineer", "id": "wf4867061", "extra": {"company_size": "SIZE_1_10", "salary_stated": true, "salary_inr": 1500000, "salary_lpa": 15.0, "salary_text": "₹14L – ₹15L", "semantic": 0.39, "score_confidence": "high", "ai_summary": {"why": "Strong Java/SQL background with React and Kafka experience aligns well with core responsibilities.", "gaps": "Lacks direct Python/Node.js and AI product exposure, though fundamentals are present."}, "is_mnc": false, "lpa": 15.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6.0, "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Taskwiser%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22New%20Delhi%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Taskwiser%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22New%20Delhi%22"}, "Engineering managers": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Taskwiser%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22New%20Delhi%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Taskwiser%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22New%20Delhi%22"}, "Head of Engineering / CTO": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Taskwiser%22%20%28%22Head%20of%20Engineering%22%20OR%20%22VP%20Engineering%22%20OR%20%22CTO%22%29%20%22New%20Delhi%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Taskwiser%22%20%28%22Head%20of%20Engineering%22%20OR%20%22VP%20Engineering%22%20OR%20%22CTO%22%29%20%22New%20Delhi%22"}, "Senior engineer": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Taskwiser%22%20%28%22Senior%20engineer%22%29%20%22New%20Delhi%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Taskwiser%22%20%28%22Senior%20engineer%22%29%20%22New%20Delhi%22"}}}}}, {"source": "wellfound", "source_name": "Wellfound", "title": "SDE-1", "company": "Zenskar", "url": "https://wellfound.com/jobs/4821657-sde-1", "country": "IN", "location": "Bengaluru", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "₹15L – ₹25L • No equity", "snippet": "# About Zenskar Zenskar is an AI-native revenue automation platform built to handle real-world complexity. It sits between your CRM and ERP automating everything in between: billing, revenue recognition, collections, usage metering, and analytics. Across any pricing model, any entity structure, any currency. **Our vision: Zero-Touch Finance.** Agents execute. Humans supervise. Finance teams set th", "description": "# About Zenskar Zenskar is an AI-native revenue automation platform built to handle real-world complexity. It sits between your CRM and ERP automating everything in between: billing, revenue recognition, collections, usage metering, and analytics. Across any pricing model, any entity structure, any currency. **Our vision: Zero-Touch Finance.** Agents execute. Humans supervise. Finance teams set the rules. Zenskar runs them. Founded by Apurv Bansal and Saurabh Agarwal, second-time founders whose previous startups were acquired by Snapdeal and Gaana. The team brings experience from Google, Deutsche Bank, Elevation Capital, IIT Bombay, IIT Delhi, and Harvard Business School. We have 5x'd revenue in the past year. We are default alive. ## Funding We raised **$15M in Series A** funding in April 2026, led by Susquehanna Venture Capital, Bessemer Venture Partners, Shine Capital, and Rho, with participation from Rocketship, J-Ventures, Future Back Ventures by Bain & Company, and Converge. The funding is being used to expand our **Agents Marketplace** and scale operations, not headcount. 📰 Read the announcement → https://youtu.be/jRb2ybvrSwU?si=vuLLgUY_MFdRzDMl See how Zenskar automates the full order-to-cash cycle, from contract to cash, without spreadsheets, workarounds, or engineering tickets.* ## The Problem We're Solving Finance teams aren't struggling because they lack AI tools. They're struggling because the systems underneath those tools were built for a simpler world. These systems label real-world complexity as edge cases and force teams into costly, error-prone workarounds: revenue leakage, delayed collections, audit risk, and finance teams buried in grunt work. Bolting AI onto these broken foundations is as good as a Ferrari engine on a horse-drawn carriage. Zenskar is purpose-built from the ground up: the architecture handles complexity natively, so AI actually works. It combines **foundational flexibility + deterministic calculation + purpose-built AI agents** to deliver end-to-end automation across the order-to-cash cycle - without workarounds, without engineering tickets. The B2B billing and revenue automation market is **$2B today, projected to reach $10B by 2030**. ## What Customers Say > *\"We're saving 200+ hours/quarter on invoicing and receivables by completely automating our recurring billing.\"* - **Noy Kalansky, Finance Controller, Pontera** > > *\"Zenskar automates revenue recognition accurately for our value-based billing: agents reducing manual hours by 70%.\"* - **Matt Barnard, VP Finance, Vertice** > > *\"Zenskar’s agents automated 90% of our billing, integrated with our CRM, and accelerated revenue collection by a month.\"* - **Ming Lui, VP Finance, Yembo** > > *\"Sardine had spent 4 years running billing in-house for high-volume, usage-based pricing. Zenskar took care of it all.\"* - **Sardine team** > > *\"We launched our product 4 months faster instead of building an in-house system for our usage-based pricing.\"* - **Kshitij Gupta, CEO, 100ms** > # About the role We’re looking for an early-career engineer who enjoys building things end to end. You might build an API in the morning, wire it into a product workflow in the afternoon, and spend the next day figuring out why one very determined edge case refuses to cooperate. This is a full-stack role, but not one where “full stack” means changing button colours and occasionally calling an API. You’ll work across product UI, backend services, data models and integrations. You can be stronger on one side: we don’t expect perfect symmetry - but you should be excited to learn and work across both. Our backend is primarily **Python and Postgres on AWS**. On the frontend, you’ll work with a modern JavaScript/TypeScript application. Familiarity with our exact stack helps, but it is not a requirement. **Also:** you do not need to know billing or accounting before joining. You will learn. Probably more than you ever planned to. ## What you'll walk into This is software that moves money, so correctness matters. A tiny-looking edge case can create a very real invoice, and customers tend to notice those. At the same time, the product needs to feel simple. Finance teams should not need to understand our database schema-or summon an engineer-to complete everyday work. That combination creates interesting full-stack problems: - Turning complex billing rules into workflows that are understandable in the UI. - Building APIs that remain predictable when customer configurations become complicated. - Showing useful errors instead of “Something went wrong. Please try again.” - Handling retries, duplicate requests and partial failures safely. - Making large datasets and long-running operations feel responsive. - Giving users visibility into what our AI agents did, why they did it and what needs human attention. You won’t spend your first three months watching onboarding videos. You’ll pair with the team, read real code and start shipping carefully scoped changes. ### **Projects you might work on** The exact project will depend on product priorities, but early SDE1 projects could look like: - **Make a product workflow truly end to end:** Build or improve a workflow spanning a frontend form, API validation, persistence and the final success/error experience. - *For example: configuring a pricing rule, creating a customer, reviewing an invoice adjustment or setting up a usage alert.* - **Make failures understandable:** Improve a workflow where backend validation is technically correct but the user has no idea what to do next. You might introduce structured errors in the API, map them to the right UI state and add enough observability to understand how often the failure occurs. - **Improve an integration experience:** Work on a CRM, ERP or payment integration: status tracking, retry behavior, duplicate handling, failure visibility and the UI through which a user understands what happened. - **Make a slow screen boringly fast:** Trace a slow product workflow from browser to database. Improve the query or API, introduce pagination where needed and make loading behavior sensible in the UI. - **Write an AI agent to solve a business usecase:** Write an AI agent on our internal platform to help solve customers’ usecases. ### **Your first 30 days** The goal of the first month is not to know everything. It is to become comfortable enough with one part of the system to make small useful, safe changes. By the end of your first 30 days, we expect you to have: - Set up the application locally and understood how code moves from your laptop to production. - Learned the basic journey from contract and usage data to invoices and revenue workflows. - Traced at least one product flow from the UI through the API and database. - Shipped a few small production changes—likely a bug fix or contained product improvement. - Written or updated tests for the behavior you changed. - Participated in code reviews and acted on feedback. - Debugged one real issue alongside another engineer. - Demoed something you shipped to the team. - Learned how we use logs, metrics and other tools to verify that a change is healthy. It is completely fine to ask a lot of questions. We would much rather answer an early question than investigate a confidently shipped mystery later. ### **By 90 days** By the end of your first 90 days, you should be able to own a small, well-scoped feature from discussion to production. That means you can: - Clarify the expected behavior and identify important edge cases. - Break the work into manageable pieces. - Make the necessary frontend, API and data-model changes. - Handle loading, empty, validation, permission and failure states. - Write useful tests without being reminded at the end. - Work with product and design when the expected experience is unclear. - Use code review feedback to improve the solution rather than only patching comments. - Deploy the feature and verify that it behaves correctly in production. - Investigate a production issue using logs and the codebase, with help when needed. - Explain what you built, why you built it that way and what you would improve next. You will not be expected to design the next five years of Zenskar’s architecture. You will be expected to take increasing ownership of your corner of it. A good 90-day outcome is not “never needed help.” It is “asked for help at the right time, learned quickly and became noticeably more independent.” ## **Who you are** - You have **1–3 years of professional software development experience**. Substantial internships and strong personal or open-source projects count. - You have built at least one non-trivial application or feature and can explain what you personally contributed. - You are comfortable programming in at least one mainstream language and are willing to work in Python. - You understand basic web concepts: HTTP, APIs, databases, validation and application state. - You can write ordinary, readable code using common data structures and control flow. - You enjoy figuring things out, but you also know when to ask for help. - You can explain your thinking without hiding behind framework terminology. - You care whether the feature works for the user—not only whether your pull request was merged. ### **Good to have** None of these are mandatory: - Python, Postgres or SQL experience. - Experience with a modern JavaScript or TypeScript frontend framework. - Building and consuming REST APIs. - Exposure to AWS, Docker, CI/CD or background jobs. - Experience at a startup or on a small product team. - A habit of writing unit and integration tests. - Personal projects that have real users—even if the number of users is your five very patient friends. - Experience using AI coding tools without outsourcing your understanding to them. - Any exposure to billing, payments, accounting or fintech. ## Location - Hybrid - 3 days per week - Office Location: Indiranagar, Bengaluru. - Address: 3rd Floor, A wing No 1, Carlton Towers, HAL Old Airport Rd, HAL 2nd Stage, Indiranagar, Bengaluru, Karnataka 560008. ## Interview process Our interviews are practical and evidence-based. No single round exceeds 60 minutes, and we are not interested in testing whether you memorised obscure Python behavior or 200 LeetCode problems. - **R0, Introductory conversation:** A short conversation about something you built, what you personally owned, what went wrong and what you learned. We’ll also align on the role, location and compensation. - **R1, Practical coding and debugging:** You’ll work in a small Python codebase with supplied tests. The goal is to understand the requirement, write working code and debug failures—not solve an algorithm puzzle. - **R2, Code-first design:** You’ll implement a small component with a few business rules and then adapt it when the requirement changes. - **R3, Hiring Manager:** A discussion about projects, learning, feedback, mistakes, ownership and the kind of environment in which you do your best work. During technical rounds, documentation and syntax search are allowed. AI can help with syntax or a small isolated utility, but it cannot be used to solve or debug the interview problem for you. We’ll explain the rules clearly before starting. No surprise gotchas. ## How to apply Interested? Click here to apply → https://evolve.keka.com/careers/jobdetails/91601 OR Write to nitya@zenskar.com", "skills": [], "employment_type": "full-time", "exp_min": 1, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 56.9, "matched_skills": ["postgresql", "aws", "javascript", "typescript", "code review", "observability", "data structures", "sql", "rest api", "docker", "ci/cd"], "missing_skills": ["artificial intelligence", "python", "ai agents", "integration testing", "payments", "fintech"], "also_on": [], "query": "senior-software-developer", "id": "wf4821657", "extra": {"company_size": "SIZE_51_200", "salary_stated": true, "salary_inr": 2500000, "salary_lpa": 25.0, "salary_text": "₹15L – ₹25L • No equity", "semantic": 0.365, "score_confidence": "high", "ai_summary": {"why": "Strong match with 2 years of production experience in Java, Kafka, PostgreSQL, and AWS, aligning with Zenskar's core tech stack and engineering rigor.", "gaps": "Limited exposure  reports, dashboards, automations, and workflows. - Improve existing business processes by reducing manual work and eliminating unnecessary steps. - Identify gaps in the current application and proactively recommend improvements. - Test enhancements, troubleshoot defects, and implement changes with minimal disruption to existing operations. ### 3. Python Development and Automation - Develop Python scripts and utilities to automate repetitive tasks and business processes. - Build integrations between Quickbase and other applications, APIs, databases, and data sources. - Use Python to perform data validation, transformation, reconciliation, and bulk data processing. - Develop custom functionality where Quickbase's native capabilities are insufficient or where an external service would be more effective. - Write maintainable, reusable, and well-documented code. ### 4. Integrations and Data Management - Work with Quickbase APIs and REST APIs to exchange data with external systems. - Design and maintain reliable data import, export, synchronization, and integration processes. - Monitor data quality, investigate discrepancies, and implement validation and error-handling mechanisms. - Ensure appropriate handling of credentials, access permissions, and sensitive business data. ### 5. Continuous Improvement - Work with business stakeholders to understand operational challenges and improvement opportunities. - Evaluate whether a requirement is best addressed through Quickbase configuration, Python development, or integration with another system. - Recommend solutions that improve productivity, reduce errors, and support future business growth. - Maintain technical documentation and communicate progress, issues, and recommendations clearly. ## Required Qualifications - Demonstrated experience developing and maintaining applications using **Quickbase**. - Proficiency in **Python**, including writing scripts, working with data, debugging, and building automation. - Experience wo     const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>
<style>

    opacity: .7; padding: 4px 2px; white-space: nowrap; }
  span.fgrp > .fbody { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* the whole filter toolbar can be hidden: only its Filters button stays */
  .tb-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: inherit; font-size: 0.75rem; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }
  .tb-toggle:hover { opacity: 1; }
  .tb-toggle::after { content: "\25B4"; font-size: 0.7rem; }
  .tb-hidden .tb-toggle::after { content: "\25BE"; }
  .tb-hidden > :not(.tb-toggle) { display: none !important; }
  .tb-hidden { padding-top: 4px !important; padding-bottom: 4px !important; }

  /* thin scrollbars that follow the page's light / dark theme */
  :root { color-scheme: light dark; } :root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }
  * { scrollbar-width: thin; }

  /* V2 skin (the site's portfolio look): one layer over each page's own variables */

    --ink: #11151A; --fg: #11151A; --muted: #4E575F; --line: #11151A; --line2: #C9CCC3;
    --accent: #EE3D28; --accent-on: #FFFFFF; --accent-soft: rgba(238,61,40,.12); --accent-bg: rgba(238,61,40,.12);
    --v2-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --v2-display: 'Archivo Black', Impact, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root[data-ui="v2"]:not([data-theme="light"]) {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); }
  :root[data-ui="v2"] body, :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea {
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  :root[data-ui="v2"] h1, :root[data-ui="v2"] h2, :root[data-ui="v2"] h3 { font-family: var(--v2-display); font-weight: 400; letter-spacing: -.01em; }
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tag, :root[data-ui="v2"] .pill, :root[data-ui="v2"] .ghost, :root[data-ui="v2"] .tb-toggle,
  :root[data-ui="v2"] details.fgrp > summary, :root[data-ui="v2"] span.fgrp > .flabel, :root[data-ui="v2"] .muted, :root[data-ui="v2"] th, :root[data-ui="v2"] code {
    font-family: var(--v2-mono); letter-spacing: .02em; }
  :root[data-ui="v2"] *:not(svg):not(path):not(circle) { border-radius: 0 !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea,
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle, :root[data-ui="v2"] details.fgrp, :root[data-ui="v2"] span.fgrp { border: 2px solid var(--line) !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle { box-shadow: 2px 2px 0 var(--line); font-weight: 700; }
  :root[data-ui="v2"] .chip[aria-pressed="true"], :root[data-ui="v2"] button[aria-pressed="true"] { background: var(--accent) !important; color: #fff !important; }
  :root[data-ui="v2"] [class*="card"], :root[data-ui="v2"] .app, :root[data-ui="v2"] .stat, :root[data-ui="v2"] section,
  :root[data-ui="v2"] .q, :root[data-ui="v2"] .row, :root[data-ui="v2"] article { border-color: var(--line) !important; box-shadow: 3px 3px 0 var(--line); }
</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
