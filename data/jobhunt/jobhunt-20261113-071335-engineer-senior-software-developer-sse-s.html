  <span class="fgrp" data-grp="report.sort"><span class="flabel">Sort</span><span class="fbody">
    <select id="sort"></select>
  </span></span>
  <span class="fgrp" data-grp="report.source"><span class="flabel">Source</span><span class="fbody">
    <select id="srcSel"><option value="">All sources</option></select>
  </span></span>
  <span class="fgrp" data-grp="report.via"><span class="flabel">Search</span><span class="fbody">

    </select>

    <span class="chips">

      <button class="chip" id="showHidden">Show removed</button>

ge and next-generation development environment. You will own slices of a live C# / .NET product spanning a headless graph engine, a cross-platform editor, backend and session transport, plugins and host interop, and AI-assisted authoring - design, implement, test, and ship. **What you'll do** * Extend the execution model: co", "description": "Join the in-person Gurugram team building ARPM's visual programming language and next-generation development environment. You will own slices of a live C# / .NET product spanning a headless graph engine, a cross-platform editor, backend and session transport, plugins and host interop, and AI-assisted authoring - design, implement, test, and ship. **What you'll do** * Extend the execution model: components, ports, wires, events, validation, and error propagation. * Improve the editor: canvas behaviour, responsiveness, and the line between local interaction and server sync. * Keep a strict split between core computation, transport, and UI - the engine should run headless. * Ship plugins and host-side runtimes so one graph can target Rhino, Revit, Unity, and similar applications. * Write tests that exercise runtime behaviour - event ordering, cross-thread events, and data-plus-event graphs - not only isolated functions. * Help design how agents propose graph edits, and how those edits are judged against explicit evaluations. * Work across ASP.NET, gRPC, and related transports between the editor, compute workers, and host runtimes. * Read existing architecture before adding surface area, then own the slice through to ship. **What we're looking for** * Professional fluency in C# and .NET. This is a C# product - this is not a pick-up-C#-on-the-job role. * Comfort with systems software, not only CRUD apps: graph data structures, execution order, concurrency, serialisation, plugin loading, and clear module boundaries. * Ability to work in a multi-process / client-server product (editor, backend, compute hosts) and decide what belongs o n AI-first engineering company focused on turning technology into measurable business outcomes. We build systems for complex enterprise challenges, including healthcare workflows, clinical intelligence, payment integrity and knowledge-intensive operations. We're looking for a strong backend engineer who combines technical depth, intellect", "description": "**Build systems that solve hard problems.** 8th Element is an AI-first engineering company focused on turning technology into measurable business outcomes. We build systems for complex enterprise challenges, including healthcare workflows, clinical intelligence, payment integrity and knowledge-intensive operations. We're looking for a strong backend engineer who combines technical depth, intellectual curiosity, ownership and the ability to lead through engineering. Someone who can reason through complex problems, make sound architectural decisions, take systems into production and help other engineers grow. You don't need to be an AI expert. Strong engineering fundamentals and the ability to learn new technologies matter more. **What you'll work on** * Backend systems and architecture: Design and build reliable backend services, APIs, data models, enterprise integrations and distributed workflows. * Technical exploration: Research unfamiliar technologies, evaluate approaches, develop proofs of concept and validate assumptions before committing to a solution. * Complex problem-solving: Investigate difficult technical issues, identify root causes and reason through trade-offs involving performance, reliability, scalability and cost. * End-to-end ownership: Take systems from problem definition and architecture through implementation, deployment, observability and production support. * Technical leadership: Guide design decisions, mentor engineers, conduct meaningful code reviews and raise the team's engineering standards. * AI-powered systems: Depending on the project, work on LLM applications, retrieval systems, AI ttps://bitwarden.com/blog/). As a Senior TypeScript/Electron Engineer on the Desktop Native team, you will build secure, reliable desktop experiences that connect the Bitwarden Electron application with native OS capabilities. You will focus on the TypeScript and Electron side of features such as Autotype, the SSH agent, and the DuckDuckGo integration, collaborating closely with Rust engineers and teams working on the vault and desktop platform. This role is primarily for someone strong in TypeScript, Electron, and modern application development who enjoys solving cross-platform challenges in a zero-knowledge, end-to-end encrypted product. Rust expertise is a plus, not a requirement. **WHAT YOU WILL DO** - Design, build, and maintain TypeScript/Electron components for Desktop Native features, including Autotype, the SSH agent, and the DuckDuckGo integration. - Develop end-to-end desktop workflows across Angular/TypeScript UI, Electron main and preload processes, and Node.js integrations. - Work with Rust engineers to integrate native modules, well-defined application interfaces, and OS-level capabilities on Windows, macOS, and Linux. - Design and maintain secure IPC and native integration boundaries, with particular care for sensitive credential data. - Partner with product, design, QA, Platform, and Vault teams to deliver reliable, user-friendly experiences across the desktop application. - Improve performance, reliability, accessibility, and maintainability through automated tests and cross-platform debugging. - Review pull requests and help raise the quality of TypeScript/Electron engineering, including community contributions on GitHub. - Identify technical debt and contribute to pragmatic refactoring, architecture improvements, and technical documentation. - Participate in technical design discussions, code reviews, and sharing knowledge across the team. - Independently plan, estimate, and deliver new feature work and bug fixes in a collaborative, distributed engineering environment. **WHAT YOU BRING TO BITWARDEN** - Strong production TypeScript/JavaScript experience — 4–6+ years of professional software engineering experience. - Hands-on experience developing Electron desktop applications, including main and renderer processes, preload scripts, and IPC. - Experience with Angular or a comparable modern front-end framework, and building maintainable user-facing applications. - Strong understanding of Node.js, asynchronous application code, and secure handling of sensitive data across process boundaries. - Experience testing, debugging, and shipping applications across desktop operating systems such as Windows, macOS, and Linux. - Experience using AI tooling in your development and testing workflow (Anthropic Claude preferred). - Familiarity with Rust, native Node.js modules (N-API), or OS-level integrations is a plus, not a requirement. - Collaborative and adaptable mindset. - Openness and authenticity combined with excellent communication skills. - Excitement and enthusiasm for open source and for better internet security. - Excellent problem-solving skills – you might not know all the answers, but you know how to find and communicate the solution. **WHY WORK WITH US** - Our user community loves us and we love them. Come to work each day with a sense of purpose as we bring a more secure internet experience to everyone from our friends and family to the world’s largest organizations. - Become an expert. You’ll get immersed in the prominent technology markets of security and open source software. - We are dedicated to building a diverse and talented team. Work remotely with motivated and supportive team members across the world. - Learn and grow. Take on new challenges with the support of your team, and join our #growth-club to continue personal and professional development. - At Bitwarden, we are passionate about what we do, but not necessarily everything we do. Our engineering team makes it a policy to carve out some time for personal growth, learning, skill building and pursuing personal passions that positively impact the team and company. To ensure that everyone has time to reaffirm their purpose and grow, you are encouraged to self-direct up to 15% of your week to what you feel is important for the company and for yourself. ## **Equal Opportunity Employer** We are committed to fostering an inclusive workplace where everyone can do their best work. We welcome applicants from all backgrounds and make employment decisions based on skills, experience, qualifications, and business needs.", "skills": [], "employment_type": "full-time", "exp_min": 4.0, "exp_max": 6.0, "seniority": "senior", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 52.9, "matched_skills": ["typescript", "angular", "linux", "qa", "code review", "javascript"], "missing_skills": ["electron", "rust", "node.js", "accessibility", "refactoring", "technical documentation", "artificial intelligence", "anthropic"], "also_on": [], "query": "senior-software-developer", "id": "wf4995334", "extra": {"company_size": "SIZE_51_200", "salary_stated": true, "salary_inr": 3528000, "salary_lpa": 35.3, "salary_text": "$42k – $42k", "semantic": 0.323, "score_confidence": "high", "is_mnc": false, "lpa": 35.3, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0, "contacts": {"domain": "bitwarden.com", "site": "", "emails": ["aaberg@bitwarden.com", "kmoore@bitwarden.com", "scoleman@bitwarden.com", "bfalzarano@bitwarden.com", "bgentry@bitwarden.com", "msullivan@bitwarden.com", "kspearrin@bitwarden.com", "vkrishnia@bitwarden.com", "ohinton@bitwarden.com", "iinuwa@bitwarden.com"], "people": [{"name": "Anders Åberg", "title": "Director of Innovation", "company": "Bitwarden", "location": "", "email": "aaberg@bitwarden.com", "linkedin": "https://www.linkedin.com/in/abergs", "source": "hunter", "confidence": 85}, {"name": "Kristi Moore", "title" n office, 1 day from home each week, plus flexibility to work remotely for 2 weeks per quarter ## About Loopr AI At Loopr AI, we build AI-powered products that help manufacturers improve quality and production processes. Our platform, **LooprIQ Inspect**, uses computer vi", "description": "# Full Stack Engineer — React, TypeScript & NestJS **Experience:** 4–5 years **Location:** Pune, hybrid **Work model:** 4 days in office, 1 day from home each week, plus flexibility to work remotely for 2 weeks per quarter ## About Loopr AI At Loopr AI, we build AI-powered products that help manufacturers improve quality and production processes. Our platform, **LooprIQ Inspect**, uses computer vision to detect product defects, verify assembly, and monitor production processes in real time. It brings together AI inference, scalable backend services, and intuitive interfaces to turn factory-floor data into actionable insights. We also integrate with customer ERP systems to make production data more useful across the business. ## About the Role We’re looking for a **Full Stack Engineer with 4–5 years of experience** to help build and scale our product across the frontend and backend. You’ll work with React, TypeScript, Node.js, and NestJS to deliver features used in real manufacturing environments. You’ll collaborate with product and AI/ML teams, solve problems across the stack, and own your work from technical design through deployment. This role is a good fit for someone who enjoys the pace of a startup, thinks beyond individual tickets, and cares about building reliable, maintainable software. ## What You’ll Do - Build and maintain end-to-end product features across frontend and backend systems. - Create responsive, intuitive interfaces using **React and TypeScript**. - Develop scalable backend services and REST APIs using **Node.js and NestJS**. - Design data models and optimize queries using **MongoDB, Prisma, and Redis**. - Integrate application features with AI inference services, real-time data pipelines, and external systems. - Own features throughout the development lifecycle: design, implementation, testing, deployment, and monitoring. - Write clean, maintainable code and contribute to automated tests and code reviews. - Troubleshoot issues across the stack and improve application performance and reliability. - Work closely with AI/ML engineers, product teams, and other developers to turn requirements into production-ready solutions. ## What We’re Looking For - **4–5 years of professional experience** building and shipping full-stack applications. - Strong hands-on experience with **React, TypeScript, JavaScript, and Node.js**. - Experience building backend applications with **NestJS** or a similar Node.js framework. - Experience with **MongoDB** or a similar database, including schema design and query optimization. - Familiarity with **Redis** or similar caching technologies. - A solid understanding of **REST APIs, asynchronous programming, and microservices**. - Experience writing automated tests with tools such as Jest or Vitest. - Familiarity with **AWS, Docker, and CI/CD pipelines**. - Strong fundamentals in debugging, data structures, performance optimization, and clean code. - Experience with Git, code reviews, technical documentation, and collaborative development. - Clear communication and the ability to independently own and deliver features. ## Nice to Have - Experience with **Python** for backend services, automation, or data processing. - Experience with **Prisma** or similar database access tools. - Experience with real-time or high-throughput applications. - Familiarity with WebSockets, event-driven systems, or message queues. - Exposure to computer vision, AI/ML applications, or video processing. - Experience deploying and monitoring applications on AWS. - Experience working in an early-stage startup. ## Why Join Loopr AI? - **Own meaningful work:** Take features from an idea through to production. - **Build real-world AI products:** See your work make an impact on manufacturing operations and quality. - **Solve interesting problems:** Work across real-time data, distributed services, AI integrations, and modern interfaces. - **Grow with the team:** Join a small, driven team where you’ll have room to learn, contribute, and take responsibility. - **Make a visible impact:** Your work will directly shape our product and customer experience. If you enjoy building across the stack and want to help bring AI into real-world industrial workflows, we’d love to hear from you.", "skills": [], "employment_type": "full-time", "exp_min": 4, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 51.8, "matched_skills": ["react", "typescript", "rest api", "code review", "aws", "javascript", "microservices", "docker", "ci/cd", "data structures", "performance optimization", "websockets"], "missing_skills": ["artificial intelligence", "nestjs", "node.js", "machine learning", "computer vision", "mongodb", "redis", "monitoring"], "also_on": [], "query": "software-engineer", "id": "wf4967239", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 3000000, "salary_lpa": 30.0, "salary_text": "₹25L – ₹30L • 0.05% – 0.1%", "semantic": 0.481, "score_confidence": "high", "is_mnc": false, "lpa": 30.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0, "contacts": {"domain": "loopr.ai", "site": "", "emails": ["priyansha@loopr.ai", "eric@loopr.ai", "namrata.shirdhankar@loopr.ai", "mahendra.pamidi@loopr.ai", "vijay.misal@loopr.ai", "shashank.harikripa@loopr.ai", "ashish.soni@loopr.ai", "arvind.shelke@loopr.ai", "alan.perry@loopr.ai", "pattern: {first}.{last}@loopr.ai"], "people": [{"name": "Priyansha Bagaria", "title": "CEO", "company": "Loopr AI", "location": "", "email": "priyansha@loopr.ai", "linkedin": "https://www.linkedin.com/in/priyanshabagaria", "sou y using our products, and we are scaling rapidly. The next phase requires engineers who can build reliable systems, move quickly, and take ownership beyond just completing assigned tasks. ## THE ROLE As a Senior Software Engineer at Clara AI, you will be a hands-on engineer responsible for building and scaling AI-native products from concept to production. You will work closely with product, engineering, and customers to understand problems, design solutions, and ship production-quality software. This is not a role where you simply execute predefined technical tasks. We are looking for engineers who can identify problems, make sound technical decisions, and own solutions end-to-end. ## WHAT YOU'LL OWN ### Build AI-native products You will work on products where AI is a core capability. You may work across: * AI agents and autonomous workflows * LLM-powered applications * Intelligent automation systems * Knowledge retrieval and reasoning systems * AI evaluation and improvement frameworks ### Own technical problems end-to-end You will: * Design and build production systems * Make technical decisions and evaluate tradeoffs * Build scalable APIs and backend systems * Work across the stack where required * Debug complex technical problems * Improve system reliability, performance, and maintainability * Take ownership of features from idea to production ### Work closely with product and customers You will work closely with product and business teams to understand real customer problems and translate them into technical solutions. You will be expected to think beyond the implementation and understand the business impact of what you build. ### Stay hands-on This is a highly hands-on engineering role. You will: * Write production-quality code * Prototype and test new ideas * Participate in architecture and system design discussions * Review code and improve engineering practices * Use AI tools extensively to improve engineering velocity * Continuously learn and adapt to new ifications into reliable, performant, production-ready code - Manage Vercel deployments and backend infrastructure, keeping the live site fast, stable, and technically sound - Implement UI design changes end-to-end, bridging the gap between what's designed and what goes live - Write Python-based queries to surface insights across the self-serve portal and support data-driven decisions across the team - Identify and act on opportunities to improve conversion across the self-serve funnel through well-timed, well-designed product experiences - Collaborate closely with product, design, and data teams in a cross-functional, async-friendly way, working closely together to remove blockers and unlock opportunities - Own the ongoing improvement of site performance, loading speed, and technical reliability **What you'll need** - Proficiency in JavaScript and TypeScript for website backend development, with a track record of shipping and maintaining production code - Hands-on Python experience, particularly for data queries - Demonstrable experience with LLM and AI-first development workflows, tools like Claude, Cursor, or similar - Experience in a product-led growth or self-serve SaaS environment, with a clear understanding of conversion funnels and how engineering choices affect them - The ability to operate with significant autonomy, you’ll thrive with ambiguity and finding creative solutions - Exceptionally strong communication skills, with a habit of being proactive, transparent, and thorough in async and cross-functional settings - A pragmatic, shipping-first mindset, you default to iterating in production - Experience managing and deploying to platforms like Vercel, or equivalent modern hosting and deployment infrastructure", "skills": [], "employment_type": "full-time", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 42.1, "matched ou'll Own Manual functional and exploratory testing across the iOS and Android apps (shared React Native codebase, platform-divergent native behavior) End-to-end validation of continuous background location tracking during active rides — permission flows, tracking continuity, foreground service / background mode behavior, and recovery after signal loss or app backgrounding Validation of single-point location check-ins (pickup confirmation, arrival detection, etc.) Writing clear, reproducible bug reports (repro steps, expected vs. actual, severity, device/OS/build version, logs) Building and maintaining a device/OS/OEM test matrix relevant to the Canadian market Regression testing across app releases, with particular attention to permission and background-execution behavior, which changes materially between OS versions Collaborating with engineering to distinguish app bugs from OS-level or OEM-level battery/background restrictions Over time: working alongside AI-assisted QA tooling as it's introduced (test case generation, log triage, etc.) — training provided **Must-Have Requirements ** 2+ years of manual QA experience on mobile apps (iOS and Android) Direct prior experience testing an app with continuous background location tracking or a background service — rideshare, delivery/logistics, fleet management, or fitness/activity tracking apps all qualify. This is non-negotiable: it's the highest-risk, highest-impact bug class in this app, and it doesn't transfer well from testing apps that only use location as a single check-in.** Working knowledge of iOS location permission tiers (\"Always\" vs. \"While Using the App\") and how backgrounding/throttling can affect tracking Working knowledge of Android location permission tiers (\"Allow all the time\" vs. \"While using the app\"), foreground service requirements for background tracking, and permission auto-reset behavior on unused apps Comfortable diagnosing whether a tracking failure is an app bug, a stock-OS restriction, or an OEM battery manager (e.g., Samsung's aggressive background app management) — or knows how to isolate this with engineering Ability to write clear, technically precise bug reports that engineers can act on without back-and-forth Comfortable with basic technical tooling: reading device logs (Xcode/Android Studio), using ADB commands, configuring simulator/emulator location mocking (GPX/KML routes) Strongly Preferred Testing experience specific to ride-share, delivery, or logistics apps Familiarity with real-device testing constraints — why simulators/emulators cannot fully validate background tracking (GPS multipath, carrier handoff, real elapsed-time battery/OS behavior) Exposure to cloud device farms (BrowserStack, Sauce Labs, Firebase Test Lab, AWS Device Farm) for cross-device regression coverage Awareness of urban GPS challenges relevant to Canadian cities (indoor/underground signal loss, downtown multipath, highway carrier handoff between cities) Basic scripting or config-file comfort (JSON, GPX editing) — a strong signal for how quickly they'll adapt to AI-assisted tooling later Nice-to-Have (Not Required) Prior use of AI-assisted QA tools (test case generators, triage copilots, self-healing test automation) Automation scripting experience (Appium, Detox, XCUITest/Espresso) — not required for this role today, but a plus for growth into hybrid manual/automation work Familiarity with PIPEDA or general data-consent/retention testing considerations for location data (we'll provide specifics; general awareness is the plus)", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 41.7, "matched_skills": ["qa", "aws", "test automation"], "missing_skills": ["react native", "artificial intelligence", "ios", "android", "manual testing", "mobile development", "xcode", "android studio"], "also_on": [], njoys working close to hardware, solving challenging technical problems, and building reliable embedded systems. You will develop real-time firmware for drone gimbals, stabilization systems, avionics, and communication subsystems. The role covers the complete embedded development lifecycle, including architecture, implementation, hardware bring-up, debugging, testing, optimization, and production support. ### What You’ll Do **Real-Time Firmware Development** - Develop and maintain embedded firmware using C and C++. - Build real-time firmware for drone gimbals, stabilization systems, avionics, and related subsystems. - Develop bare-metal and RTOS-based applications for STM32, ESP32, and similar microcontrollers. - Design concurrent firmware components, interrupt-driven systems, and timing-critical control functions. - Optimize firmware for execution speed, memory usage, power consumption, and reliability. **Drone Communication and Subsystem Integration** - Develop communication interfaces between flight controllers, gimbals, sensors, payloads, motor controllers, and onboard computers. - Implement and debug communication protocols such as UART, SPI, I2C, CAN, and RS-485. - Support integration with wireless communication technologies such as Bluetooth Low Energy and Wi-Fi. - Develop reliable data handling, device management, error detection, and recovery mechanisms. - Diagnose communication and integration issues across multiple embedded subsystems. **Gimbal and Motor-Control Systems** - Develop firmware for gimbal control, stabilization, sensing, and motor-drive systems. - Integrate IMUs, encoders, motor drivers, and other motion-control sensors. - Work with BLDC motors, motor controllers, and electronic speed controllers. - Support the implementation and tuning of control algorithms for stabilization and motor control. - Diagnose timing, vibration, sensor, communication, and control-related issues. **Hardware Bring-Up and Device Drivers** - Develop and maintain board support packages, hardware-abstraction layers, and device drivers. - Bring up new microcontroller-based boards and validate clocks, memory, power sequencing, peripherals, and communication interfaces. - Port firmware to new hardware platforms and microcontroller variants. - Read electronic schematics and component datasheets to support firmware development and debugging. - Collaborate with hardware engineers to diagnose board-level and hardware-software integration issues. **Bootloaders and Firmware Updates** - Develop and maintain bootloaders and firmware-update mechanisms. - Support wired and wireless firmware-update workflows. - Implement firmware validation, rollback, recovery, and fail-safe mechanisms. - Improve the reliability and usability of production programming and update processes. **Debugging, Testing, and Validation** - Debug firmware using hardware debuggers, oscilloscopes, logic analyzers, and other laboratory instruments. - Develop unit, integration, hardware-in-the-loop, and system-level tests. - Investigate firmware defects, timing issues, memory corruption, communication failures, and hardware faults. - Perform root-cause analysis and implement corrective actions. - Support bench testing, field testing, flight trials, and production validation. - Maintain test procedures, debugging records, and technical documentation. **Production and Engineering Support** - Improve firmware build, programming, calibration, and production-test workflows. - Support manufacturing teams during board programming, testing, and failure analysis. - Use Git for version control, collaboration, code review, and release management. - Work with hardware, avionics, controls, and flight-test teams to resolve system-level issues. - Maintain clear documentation for firmware architecture, interfaces, configuration, and releases. ### Required Qualifications and Skills - Strong hands-on experience with Embedded C/C++ and low-level programming. - Experience with bare-metal development and microcontrollers such as STM32, ESP32, or similar platforms. - Understanding of microcontroller peripherals, interrupts, timers, ADCs, DMA, memory, and watchdogs. - Experience with UART, SPI, I2C, CAN, RS-485, and related embedded communication protocols. - Understanding of RTOS concepts, task scheduling, synchronization, concurrency, and inter-process communication. - Experience developing device drivers, board support packages, and hardware-abstraction layers. - Knowledge of bootloader development and firmware-update mechanisms. - Strong firmware debugging and root-cause analysis skills. - Experience using hardware debuggers, oscilloscopes, logic analyzers, and other laboratory instruments. - Ability to read electronic schematics, component datasheets, and technical documentation. - Basic hardware fault-finding and board bring-up skills. - Familiarity with Git and software version-control practices. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience with drones, UAV avionics, autopilots, or gimbal systems. - Knowledge of BLDC motors, motor drivers, electronic speed controllers, and motor-control techniques. - Experience integrating IMUs, encoders, cameras, or other UAV sensors and payloads. - Experience with Bluetooth Low Energy, Wi-Fi, or other wireless communication technologies. - Familiarity with control systems, sensor fusion, and stabilization algorithms. - Experience with PX4, ArduPilot, MAVLink, or similar UAV technologies. - Exposure to FPGA development and FPGA-microcontroller integration. - Experience taking embedded products from prototype through manufacturing and production. **Experience:** 2+ years in embedded software or firmware development. **Education:** B.E./B.Tech in Electronics and Communication, Electrical and Electronics, Instrumentation, Computer Science, or a related field.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "   }).join('');

    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '', j.exp_class || '', j.freshness || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'

        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;

    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();

<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
