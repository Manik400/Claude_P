w alongside an emerging enterprise technology company. ## Open Positions - React.js Developer Trainee – Frontend Development - React Native Developer Trainee – Mobile Applications - Node.js Developer Trainee – Backend Development - Python Developer Trainee – Backend, Automation and AI - Full-Stack Developer Trainee – React.js + Node.js/Python ## Technical Requirements **Frontend Development** - Basic to intermediate React.js and JavaScript knowledge - HTML5, CSS3, TypeScript and responsive UI development - REST API integration - Component-based architecture and state management **Mobile Development** - React Native for Android and iOS applications - API integration, navigation and mobile UI development - Basic understanding of mobile authentication and notifications **Backend Development** - Node.js, Express.js and REST APIs - Python, FastAPI or Django - Authentication, authorization and role-based access - Database operations, validations and error handling **Database Knowledge** - PostgreSQL, MySQL or other relational databases - Basic SQL queries, joins and database relationships - Understanding of database design and data integrity **Code Repositories and Cloud** - Git and GitHub fundamentals - Branching, pull requests, merging and conflict resolution - Basic understanding of Azure Repos / Azure DevOps - Basic understanding of AWS cloud services - Familiarity with CI/CD, deployment and debugging is an advantage **Additional Advantages** - AI/LLM API integration - Workflow automation - SaaS and multi-tenant application architecture - ERP, HRMS, Payroll or business application exposure - Docker and cloud deployment knowledge Applicants are not expected to be experts in every technology, but must demonstrate practical skills in at least one relevant development stack. ## Mandatory Application Requirements Applicants must share: 1. Updated resume 2. GitHub or GitLab profile 3. Links to completed projects or working applications 4. Brief explanation of their individual contributions 5. Technologies used in their projects 6. Availability to commit to a 12-month internship **A GitHub repository or demonstrable project portfolio is mandatory.** Academic, personal, internship and open-source projects are accepted. ## Internship and Compensation Transparency We want to be completely transparent with every applicant. Opland ERP is a growing product business with a developing customer base. While we have paying customers, building predictable recurring revenue takes time. At present, this opportunity is structured as a **12-month unpaid internship**, subject to applicable laws and eligibility requirements. We intend to review opportunities for paid engagement after six months, depending on customer revenue, business growth, performance and available positions. **There is no guarantee of compensation after six months or employment after the internship.** Our existing team members have contributed significantly to building our products and developing their careers with us. We hope to welcome individuals who share that commitment to learning, ownership and product engineering. ## What You Will Gain - Hands-on exposure to enterprise ERP and HXM development - Experience contributing to real product features - Practical exposure to React.js, React Native, Python and Node.js - Experience with Git, Azure Repos and AWS environments - Exposure to APIs, databases, testing and deployment - Mentorship, technical reviews and collaborative development - Opportunities to build a demonstrable professional portfolio - Consideration for future paid roles based on business needs and performance ## Who Should Apply? We welcome fresh graduates, current interns and developers with up to one year of experience who have already built projects and want meaningful product-development exposure. This opportunity is best suited to candidates who understand the unpaid structure, can commit to the agreed duration and are primarily seeking practical learning and expe enior Software Engineer at Clara AI, you will be a hands-on engineer responsible for building and scaling AI-native products from concept to production. You will work closely with product, engineering, and customers to understand problems, design solutions, and ship production-quality software. This is not a role where you simply execute predefined technical tasks. We are looking for engineers who can identify problems, make sound technical decisions, and own solutions end-to-end. ## WHAT YOU'LL OWN ### Build AI-native products You will work on products where AI is a core capability. You may work across: * AI agents and autonomous workflows * LLM-powered applications * Intelligent automation systems * Knowledge retrieval and reasoning systems * AI evaluation and improvement frameworks ### Own technical problems end-to-end You will: * Design and build production systems * Make technical decisions and evaluate tradeoffs * Build scalable APIs and backend systems * Work across the stack where required * Debug complex technical problems * Improve system reliability, performance, and maintainability * Take ownership of features from idea to production ### Work closely with product and customers You will work closely with product and business teams to understand real customer problems and translate them into technical solutions. You will be expected to think beyond the implementation and understand the business impact of what you build. ### Stay hands-on This is a highly hands-on engineering role. You will: * Write production-quality code * Prototype and test new ideas * Participate in architecture and system design discussions * Review code and improve engineering practices * Use AI tools extensively to improve engineering velocity * Continuously learn and adapt to new technologies ## WHAT SUCCESS LOOKS LIKE ### First 30 Days * Build strong context around Clara AI's technology and customers * Understand existing systems and engineering practices * Start shipping meaningfu ering is next: the chips, boards, radios and power systems that everything else runs on are still designed with decades-old tools, by intuition, a few iterations at a time. Models that can reason over a design, run the physics and check their own work will change that, and the stack that makes it possible is being built now. **About Faraday Loop** We build AI for physical engineering. We work at the point where learned models, physics simulation and real engineering design meet, with real design teams, on problems where the answer has to hold up against physics. We are backed by Founders, Inc. and are part of NVIDIA Inception. **About the role** You'd be one of the first engineers, and you'd shape what we build as much as how. We need physics, electrical engineering and machine learning in some combination. Nobody has all three at depth; we expect real depth in one, working fluency in a second, and curiosity about the third. **What you'll do** - Build and validate simulation and modelling systems, and check them against references and measurement. - Train models on physics, and design the evaluations that show where they can and can't be trusted. - Build agents that do real engineering work and verify their own results. - Work directly with engineers at design partners on their real problems. - Own a problem end to end, from the physics to the thing a customer runs. **You should have** - Deep, hands-on experience in at least one of: computational physics or numerical simulation; electrical engineering design (RF, signal or power integrity, analog, packaging); machine learning for physical systems. - Working fluency in a second of those. - A track record of taking something from idea to a working result that someone else used. - Strong Python, and the habit of checking a result against a second method before believing it. - Comfort with an early company: ambiguous problems, few people, direct customer contact. **Nice to have** - You've written, contributed to or validated a solver. - Experience training models on simulation data. - HPC or GPU experience, or numerical linear algebra. - A PhD or equivalent research experience, publications, or open-source scientific software. - Experience building LLM agents with tools and verification. **How to apply** Apply here with your CV or LinkedIn, and a link to or description of one thing you built. Tell us what was hard about it. If you don't match every line above, apply anyway; we would rather read about the thing you built.", "skills": [], "employment_type": "full-time", "exp_min": 0, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 26.3, "matched_skills": [], "missing_skills": ["machine learning", "artificial intelligence", "python", "llm"], "also_on": [], "query": "engineer", "id": "wf5078012", "extra": {"company_size": "SIZE_1_10", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": true, "salary_inr": 6720000, "salary_lpa": 67.2, "salary_text": "$50k – $80k • 0.5% – 2.0%", "semantic": 0.146, "score_confidence": "high", "is_mnc": false, "lpa": 67.2, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0}}, {"source": "instahyre", "source_name": "Instahyre", "title": "AI Engineer", "company": "Goldcast", "url": "https://www.instahyre.com/job-448842-ai-engineer-at-goldcast-bangalore/", "country": "IN", "location": "Bangalore", "remote": null, "posted": "2026-11-02", "posted_at": null, "posted_raw": "", "salary": "", "snippet": "Virtual events that feel like a Netflix show", "description": "Responsibilities: AI Runtime, Multi-Agent Framework, Enterprise Context Engine, Knowledge Graph, RAG and Hybrid Retrieval, Prompt Management, Tool Registry, Model Routing Layer, AI Evaluation Framework, Human-in-the-Loop Framework, AI Guardrails, Continuous Learning Framework Engineering Challenges: Build enterprise-grade agentic systems. Design reasonin  and related UAV tools. - Collaborate with avionics, embedded software, controls, hardware, and flight-test teams. **Testing and Validation** - Conduct software-in-the-loop and hardware-in-the-loop simulations. - Develop test datasets, test scenarios, and acceptance criteria for perception systems. - Perform bench testing, field testing, and flight trials. - Evaluate system performance under representative operating and environmental conditions. - Diagnose sensor, communication, model, software, and system-level issues. - Perform root-cause analysis and implement corrective actions. - Maintain testing procedures, integration records, model documentation, and validation reports. **Application and Interface Development** - Develop supporting applications, visualization tools, and operator interfaces. - Build tools for model configuration, telemetry monitoring, data recording, playback, and analysis. - Support Qt-based software development when required. - Implement clear logs, diagnostics, and system-health reporting. - Maintain modular, testable, and documented software. ### Required Qualifications and Skills - Strong proficiency in Python. - Working proficiency in C/C++ for performance-critical and hardware-integrated applications. - Experience developing and deploying computer-vision or deep-learning models. - Experience with OpenCV and real-time image-processing pipelines. - Familiarity with GStreamer or similar multimedia frameworks. - Experience with a deep-learning framework such as PyTorch or TensorFlow. - Understanding of model training, validation, dataset preparation, augmentation, and performance evaluation. - Experience deploying AI models on edge-computing platforms. - Familiarity with ROS/ROS2 and robotic software architectures. - Experience integrating cameras, sensors, and onboard computing systems. - Understanding of Linux-based development environments, networking, and system debugging. - Ability to profile and optimize inference latency, throughput, memory usage, and power consumption. - Strong analytical, debugging, and problem-solving skills. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience with NVIDIA Jetson, CUDA, TensorRT, ONNX, or GPU-accelerated computing. - Experience with Raspberry Pi or other embedded Linux platforms. - Knowledge of object detection, tracking, segmentation, visual odometry, SLAM, or sensor fusion. - Experience with ROS/ROS2, Gazebo, and robotics simulation. - Knowledge of MAVLink, QGroundControl, and Mission Planner. - Hands-on experience with PX4, ArduPilot, or a similar flight stack. - Understanding of UAV flight dynamics and multirotor or fixed-wing architectures. - Experience with Qt software development. - Experience with camera calibration, synchronization, streaming, and recording. - Familiarity with MLOps, experiment tracking, dataset versioning, and automated model evaluation. - Experience taking perception or AI systems from research prototypes through field deployment. **Experience:** 3–5 years in computer vision, robotics perception, AI/ML, or edge computing. **Education:** Degree in Electronics, Electrical Engineering, Computer Science, Artificial Intelligence, Robotics, or a related engineering discipline.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 24.8, "matched_skills": ["linux", "data structures"], "missing_skills": ["ros", "robotics", "artificial intelligence", "embedded", "python", "object detection", "opencv", "gstreamer"], "also_on": [], "query": "software-engineer", "id": "wf4867019", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 1600000, "salary_lpa": 16.0, "salary_text": "₹12L – ₹16L • No equity", "semantic": 0.236, "score_confidence": "high", "is_mnc": false, "lpa": ng basis for substitutions. - Design protection, monitoring, and fault-detection circuits for reliable operation. **Motor Controllers and Power Electronics** - Develop, modify, and validate motor controllers and electronic speed controllers. - Work with BLDC and PMSM motors, three-phase inverters, switching devices, gate drivers, and current- and voltage-sensing circuits. - Evaluate motor-control hardware under different loads, operating conditions, and transient events. - Measure and optimize RPM, torque, voltage, current, power, efficiency, and thermal performance. - Diagnose switching, power-delivery, control, and electromagnetic-noise issues. **UAV Avionics and Gimbal Systems** - Design and integrate avionics hardware for UAV platforms. - Develop electronics for gimbal control, stabilization, motor drive, sensing, and camera integration. - Integrate flight controllers, sensors, payloads, power systems, and onboard computing hardware. - Support hardware bring-up and flight integration of avionics and gimbal subsystems. - Investigate system-level issues involving power, communication, sensing, and control. **FPGA and Digital Systems** - Support FPGA-based hardware development and integration. - Develop or integrate FPGA interfaces for high-speed data acquisition, signal processing, control, and communication. - Work with microcontrollers, processors, memory devices, and programmable logic. - Validate digital interfaces, timing, signal integrity, and hardware-software interactions. **RF Communication Systems** - Develop and integrate RF communication hardware for UAV and ground systems. - Support wireless telemetry, command-and-control links, and payload communication systems. - Evaluate RF modules, transceivers, interfaces, power requirements, and system compatibility. - Conduct bench and field testing to diagnose connectivity, interference, range, and reliability issues. **PCB Development and Manufacturing** - Read, review, and develop electronic schematics using KiCad. - Support PCB layout for high-power, low-power, mixed-signal, RF, motor-control, FPGA, and avionics designs. - Review PCB layouts for power integrity, signal integrity, grounding, thermal performance, manufacturability, and testability. - Prepare and maintain bills of materials, component specifications, assembly documentation, and test reports. - Coordinate with PCB fabrication, assembly, and manufacturing teams during prototyping and production. - Apply design-for-manufacturing and design-for-test principles to improve product reliability and testability. **Hardware Prototyping, Testing, and Validation** - Build prototypes and perform hardware bring-up, bench testing, and system integration. - Create test setups for motor controllers, avionics, gimbal systems, RF systems, power electronics, and camera hardware. - Use oscilloscopes, multimeters, current probes, logic analyzers, power supplies, electronic loads, and related laboratory instruments. - Conduct controlled tests across different loads, temperatures, operating conditions, and transient events. - Perform root-cause analysis across hardware, firmware, and system interfaces. - Implement corrective actions and verify their effectiveness. - Prepare test procedures, validation reports, and technical documentation. ### Required Qualifications and Skills - Strong understanding of analog, digital, mixed-signal, and power-electronic design. - Practical experience with high-power and low-power electronic systems. - Experience with Embedded C/C++ and microcontroller-based systems. - Familiarity with ARM-based microcontrollers, STM32, or similar platforms. - Understanding of BLDC/PMSM motors, three-phase inverters, motor controllers, and ESC architecture. - Knowledge of switching devices, gate drivers, current sensing, voltage sensing, power conversion, and protection circuits. - Understanding of UAV avionics, gimbal systems, sensors, payloads, and onboard electronics. - Familiarity with FPGA hardware, programmable logic, or high-speed digital interfaces. - Understanding of RF communication systems and wireless hardware integration. - Experience with communication protocols such as CAN, UART, SPI, I2C, and RS-485. - Experience with PCB design, component selection, hardware bring-up, and laboratory testing. - Ability to read and interpret electronic schematics and technical documentation. - Strong analytical, debugging, and problem-solving skills. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience developing hardware for drones, autonomous systems, robotics, or aerospace platforms. - Experience with FPGA development tools and hardware-description languages such as Verilog or VHDL. - Knowledge of RF testing, antenna integration, telemetry systems, or long-range communication links. - Experience with camera interfaces, image sensors, and high-speed data links. - Knowledge of electromagnetic compatibility, signal integrity, power integrity, and thermal design. - Experience taking electronic products from prototype through manufacturing and production. **Education:** Bachelor’s degree in Electrical Engineering, Electronics Engineering, Computer Engineering, or a related field.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 20.3, "matched_skills": [], "missing_skills": ["fpga", "embedded", "prototyping", "technical documentation", "monitoring", "firmware", "c++", "stm32"], "also_on": [], "query": "software-engineer", "id": "wf4867010", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 1600000, "salary_lpa": 16.0, "salary_text": "₹12L – ₹16L • No equity", "semantic": 0.188, "score_confidence": "high", "is_mnc": false, "lpa": 16.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6 <script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const META = DATA.meta || {};
  const JOBS = DATA.jobs || [];

  const STATE_KEY = 'jobhunt:state';
  const UI_KEY = 'jobhunt:ui:' + (META.run_id || 'run');

  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  const S = Object.assign({ applied: {}, saved: {}, hidden: {} }, load(STATE_KEY, {}));
  const ui = Object.assign({
    country: 'ALL', q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any',

  }, load(UI_KEY, {}));
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // theme
  const savedTheme = load('jobhunt:theme', null);

    document.documentElement.setAttribute('data-theme', next); save('jobhunt:theme', next);
  };

  // header
  const roles = (META.roles || []).join(', ');
  const exp = META.experience_label ? ` · <b>${esc(META.experience_label)}</b> experience` : '';

  $('criteria').innerHTML = `<b>${esc(roles)}</b>${exp} · ${esc(cs)}${META.resume_name ? ' · scored against <b>' + esc(META.resume_name) + '</b>' : ''} · ${esc(META.generated || '')}`;
  const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));
  const blocked = new Set((DATA.sources || []).filter(s => s.status !== 'ok').map(s => s.source_name));
  $('stats').innerHTML = `<b>${JOBS.length}</b> jobs · <b>${okSources.size}</b> sources${blocked.size ? ` · <span title="${esc([...blocked].join(', '))}">${blocked.size} unavailable</span>` : ''}`;

  // sources panel
  const grid = $('srcGrid');
  const bySrc = {};
  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });
  grid.innerHTML = Object.keys(bySrc).sort().map(name => {
    const rows = bySrc[name];
    const total = rows.reduce((a, r) => a + (r.count || 0), 0);
    const bad = rows.filter(r => r.status !== 'ok');
    const cls = bad.length === rows.length ? (bad[0].status) : 'ok';
    const detail = rows.map(r => `${r.country}${r.status === 'ok' ? ':' + r.count : ' ' + r.status}`).join(' ');
    return `<div><span class="${cls}">●</span> ${esc(name)} <b>${total}</b> <span class="cc" title="${esc(bad.map(b => b.error || '').join('\n'))}">${esc(detail)}</span></div>`;
  }).join('');

  // fit chips

  function renderFitChips() {

    const b = e.target.closest('[data-fit]'); if (!b) return;

  $('sort').innerHTML = SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (!SCORED) $('scoreRange').style.display = 'none';

  // source select

  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs

    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src; $('viaSel').value = ui.via || '';
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  $('viaSel').onchange = () => { ui.via = $('viaSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly', 'mncOnly', 'highPay'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; $('viaSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'via', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved', 'exp_class', 'freshness']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '', j.exp_class || '', j.freshness || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {

      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);

  }
  function expLabel(j) {

    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;

  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';

    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }

    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">

      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}

<script>

  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
</body>
</html>
