 alumni (S21) and elite product and software talent, builds some of the most advanced flexibility solutions in the market. Kapacity.io, previously backed by Y Combinator and acquired by EnergyHub in 2024, focuses on the European energy market, offering an energy management platfor", "description": "About The Job We are looking for a Software Engineer to join the Kapacity.io team at EnergyHub! Our team, made up of YC alumni (S21) and elite product and software talent, builds some of the most advanced flexibility solutions in the market. Kapacity.io, previously backed by Y Combinator and acquired by EnergyHub in 2024, focuses on the European energy market, offering an energy management platform to energy companies, allowing them to connect residential heat pumps, EVs and batteries to a Virtual Power Plant. EnergyHub is the leading residential Virtual Power Plant provider in North America, with over 2.5 million connected residential devices. Virtual Power Plants (VPP) allow energy companies to adjust their customers’ power consumption to reduce grid congestion and benefit from price volatility. VPPs reduce the need for peak power generation, reducing investment needs and carbon emissions of the grid. Residential users are compensated for participation with reduced energy costs and/or direct compensation. Join us in building high impact solutions for energy grid flexibility. If you’re a growth minded individual who has a passion for tech and energy, this team is for you! Here's What You'll Do... Design, build, and maintain the software that sits at the core of Kapacity.io’s optimization products. Become a core contributor to our codebase, actively participating in work planning, retrospectives, and overall team improvement. Work directly with sales, translating business needs into viable technical solutions. We use Go, React, Typescript, Python, Django, PostgreSQL and Docker. We’re on AWS and communicate on Slack. Here's What We're Looking For... We’re seeking a Softwar null, "posted": "2026-09-30", "posted_at": "2026-09-30T14:12:52.878522+00:00", "posted_raw": "8 hours ago", "salary": "", "snippet": "Wil jij bouwen aan software die dagelijks door honderden organisaties wordt gebruikt? Als Junior Software Developer bij Tools4ever werk je mee aan HelloID, onze Identity & Access Management-cloudsoftware. Je komt terecht in een team waar je kunt leren van ervaren developers en waar je stap voor stap meer verantwoordelijkheid krijgt. Je werkt aan echte software die door veel organisaties wordt gebr", "description": "Wil jij bouwen aan software die dagelijks door honderden organisaties wordt gebruikt? Als Junior Software Developer bij Tools4ever werk je mee aan HelloID, onze Identity & Access Management-cloudsoftware. Je komt terecht in een team waar je kunt leren van ervaren developers en waar je stap voor stap meer verantwoordelijkheid krijgt. Je werkt aan echte software die door veel organisaties wordt gebruikt. Daarbij denk je mee over slimme oplossingen, los je technische puzzels op en blijf je jezelf ontwikkelen. Zo groei je in je rol, zonder dat je alles al hoeft te weten. Bij Tools4ever werk je in een omgeving waar duidelijkheid, kwaliteit en samenwerking belangrijk zijn. Je krijgt heldere doelen en weet wat er van je wordt verwacht. Tegelijk krijg je de ruimte om zelfstandig te werken en je eigen keuzes goed te onderbouwen. Je denkt mee over praktische oplossingen, schrijft nette en onderhoudbare code en leert steeds beter hoe je software bouwt die betrouwbaar is in de praktijk. Je werkt zelfstandig, maar staat er niet alleen voor: je werkt samen met ervaren collega’s en kunt vragen stellen wanneer dat nodig is. Zo ontwikkel je jezelf verder, terwijl je vanaf het begin echt meedraait in het team. Wat ga je doen? In je gestructureerde en zelfsturende team ontwikkel je hoogwaardige cloud software namelijk HelloID. Onze SaaS cloud oplossing HelloID is voor veel bedrijven dé oplossing op hun Identity Management vraagstukken. Samen zorgen de teams ervoor dat er software wordt geleverd waar onze klanten met plezier mee werken; wat altijd in de lucht is en wat veilig is. Taken en verantwoordelijkheden Ontwikkelen en onderhouden van hoogwaardige C# .NET cloudsoftware Werken als junior developer binnen een moderne SaaS-architectuur Schrijven van schone, onderhoudbare en goed geteste code Nauwkeurig inschatten van de werklast in een stand up meeting elke ochtend Leren over cloud based webapplicaties Je weet wanneer je hulp en advies nodig hebt en biedt dit ook aan anderen. Na elke sprint lever je de software op (DevOps) en kun je zelfstandig releases beheren. Je draagt bij aan de sprint review (demo) voor de stakeholders. Voor meer inzicht in de werkzaamheden van onze softwareontwikkelaars, lees dan hier onze roadmap: roadmap.helloid.com. Onze tech-stack Talen: C#, TypeScript Frameworks: .NET (Core), Angular Cloud & infrastructuur: Google Cloud, Azure, Kubernetes Databases: MongoDB, SQL Tools & methodieken: Visual Studio, Git, DevOps, Agile/Scrum Wie zijn wij? Bij Tools4ever draait alles om slimme oplossingen, teamwork en plezier. Met meer dan 800 actieve klanten is Tools4ever marktleider in Nederland op het gebied van Identity Governance & Administration. Onze oplossingen worden gebruikt door organisaties van 200 tot 30.000 medewerkers in alle sectoren, zoals de zorg, detailhandel, (semi)overheid en commerciële sectoren. Onze klanten zijn onder andere de gemeente Amsterdam, Revant, Naturalis en Codarts. Maar die sfeer proef je ook op ons kantoor in Baarn: we lunchen samen, organiseren regelmatig leuke uitjes (minstens één per kwartaal), bieden verschillende sportieve activiteiten aan en doen in de zomer én winter iets gezelligs met elkaar, zoals samen skiën. Bij Tools4ever krijg je vrijheid en verantwoordelijkheid in een gedreven en pragmatische cultuur. We kijken altijd naar de impact op onze belangrijkste drijfveren: medewerkerstevredenheid en klanttevredenheid. We ontwikkelen ons product volledig in eigen beheer, zonder externe investeerders. Dat geeft rust, focus en ruimte voor kwaliteit en innovatie. Software development is bij ons geen ondersteunende afdeling, maar het hart van de organisatie. Jouw team Onze developers zijn verdeeld in drie gestructureerde teams: één Service Automation-team en twee Provisioning-teams, elk bestaande uit ongeveer zes collega’s. Daarnaast zijn er twee Product Owners die betrokken zijn bij alle drie de teams. Onze Developers voeren gemiddeld 1-2 taken per dag uit, afhankelijk van de complexiteit van de taak. Deze taken worden gezamenlijk en nauwkeurig besproken tijdens de dagelijkse stand-up meeting. In deze teams zijn zelfstandigheid, pragmatisme en samenwerking essentieel. Samen zorgen we ervoor dat ons product HelloID efficiënt en optimaal functioneert. Wie ben jij? Je hebt al wat ervaring als developer en wilt je verder ontwikkelen. Je werkt zelfstandig aan je taken, neemt verantwoordelijkheid voor je werk en denkt praktisch mee. Ook werk je nauwkeurig en draag je graag bij aan een team waar samenwerking en kwaliteit belangrijk zijn. Daarnaast Beschik Je Over Een afgeronde hbo-opleiding Minimaal één jaar werkervaring als Developer, buiten stages om Het vermogen om zelfstandig te werken, met de ondersteuning van je team wanneer dat nodig is Het sollicitatieproces Wij streven ernaar om binnen 48 uur na jouw sollicitatie contact met je op te nemen. Komt jouw profiel in aanmerking en word je uitgenodigd voor een gesprek streven wij dit binnen 3 weken af te handelen. Betrouwbaarheid en integriteit zijn voor ons essentieel. Daarom vragen wij voor deze functie een Verklaring Omtrent het Gedrag (VOG).", "skills": [], "employment_type": "Full-time", "exp_min": null, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 61.9, "matched_skills": ["c#", ".net", "devops", "typescript", "angular", "sql", "agile", "scrum"], "missing_skills": ["gcp", "azure", "kubernetes", "mongodb", "git", "rust", "elk"], "a er (m/f/d) with a strong interest and capability in technical documentation, regulatory compliance and safety systems, to join our Battery Energy Storage System (BESS) product development team. This hybrid role bridges engineering in various fields with compliance and customer success by ensuring that our system designs not only perform but are also well-documented and compliant with international standards such as CE and other applicable directives especially german laws and standards. Your mission System Engineering Support the end-to-end system development of containerized BESS products, from concept to deployment. Collaborate cross-functionally with electrical, mechanical, software, and testing to ensure system integration. Perform design reviews and system-level testing validation. Safety Systems Integration Take ownership of safety system design and documentation, including: Fire detection (smoke, heat, aerosol suppression systems). Gas detection (e.g., hydrogen, VOCs). Explosion protection (e.g., venting strategies). Emergency shutdown systems and HVAC/fire interlocks. Collaborate with suppliers and internal specialists to evaluate and select compliant safety components. Ensure that safety systems meet applicable regulatory and customer requirements. Technical Documentation & Customer-Facing Documentation Develop and maintain technical documents, including risk assessments and test reports. Coordinate with external testing labs and notified bodies as required. Prepare high-quality, accurate documentation packages for customers (Fire load calculation, Static load documentation, Foundation requirements and load plans, etc.). Ensure that documentation aligns with regional building codes, standards, and customer-specific requirements. Regularly update documentation based on design changes and field feedback. Your profile Degree in Systems Engineering, Mechanical/Electrical Engineering, or a related technical field. Minimum of 3 years of experience in system engin ndset combined with practical platform automation. Ability to reason about reliability, resilience, security and operability. Collaborative working style and confidence partnering with platform engineers. Added bonus: AWS certification. Experience supporting MySQL or SQL Server instances. Database automation and PostgreSQL replication experience. Monitoring experience with Redgate Monitor, Honeycomb or comparable tools. Pragmatic use of AI in day-to-day engineering work. #LI-AP1 At Zopa we value flexible ways of working. We value face-to-face collaboration and a good work-life balance. This hybrid role requires you to come to our London office 2-3 days a week. You'll also have the option of working from abroad for up to 120 days a year!* But no matter where you are, we’ll make sure you’ve got everything you need to thrive, both in your work and home life, from day one. *Subject to having the right to work in the country of choice Diversity Statement Zopa is proud to offer a workplace free from discrimination. Diversity of experience, perspectives, and backgrounds leads to better products for our customers and a unique company culture for our people. We are made up of nearly 50 nationalities, have a DE&I forum made up of Zopians wanting to make a difference and we are proud of our culture where everyone can bring their full self to work. Our approach to DE&I is reflected in our hiring process so please let us know if you require any reasonable adjustments. Our approach to AI in interviews At Zopa, AI isn't something we're testing out — it's part of how we work every day. As a proud partner of Jobs 2030 , we're committed to building AI fluency across our workforce, and we expect Zopians to use AI as part of how they do their jobs. Because of that, we want to be transparent about how we think about AI use during our hiring process. Behavioural and competency-based interviews : please don't use AI . These conversations are designed to understand you — your experiences, ke care of the details that matter. Drive. You’re extremely ambitious in everything you do—and your initiative, effort, and tenacity match the intensity of your ambition. You feel deeply responsible for your work. You hold yourself to a high—and rising—bar. Team spirit. You give generously and without the expectation of receiving in return. You support the best idea, not your idea. You're always happy to get your hands dirty to help your team. You’re reliable, honest, and transparent. Proficiency in English. You read, write, and speak proficiently in English. What we offer Incredibly talented, entrepreneurial teams. You’ll work in small, result-oriented, autonomous teams alongside some of the brightest people in your field. An exceptional opportunity for growth. We go to great lengths to hire individuals of outstanding potential—then, our priority is to put them in the ideal position to thrive. Spooners in their 20s lead products worth hundreds of millions of dollars. And if you’ve got what it takes, you’ll soon be playing an essential role in major projects, too. All. These. Benefits. Flexible hours, remote working, unlimited backing for learning and training, top-of-the-market health insurance, a rich relocation package, generous parental support, and a yearly retreat to a stunning location. We help each Spooner set up the conditions to do their best work. A flexible start date and part-time options. You don't need to wait until graduation to apply. We offer flexible start dates and the possibility to begin part-time, transitioning to full-time as you complete your degree. Many Spooners joined before graduating and progressively took on greater responsibility, with arrangements that allowed them to do so without compromising their education. Competitive pay and access to company equity at a discount. Typical annual salary offers range from £85,797 to £151,436 in London and from €66,065 to €107,837 elsewhere in Europe. The lower end of these ranges applies to candidates with little or no relevant experience, while exceptionally experienced candidates may receive offers of up to £316,052 in London or €240,330 elsewhere in Europe. Candidates offered a permanent contract may choose to receive part of their compensation in discounted company equity. Commitment & contract Permanent or fixed-term. Full-time. Location Milan (Italy), London (UK), Madrid (Spain), Warsaw (Poland), or fully remote from eligible countries. The selection process In our screening process, we prioritize verifiable signals of excellence, regardless of seniority. There are no preferential paths beyond what your application demonstrates, and we evaluate every candidate through the same process. Some people hold back because they feel they lack experience or have an “imperfect” CV. If you like the role and believe you could excel over time, don’t self-reject. All applications go through our careers page, which is the only way to be considered. If you pass our screening, you’ll be asked to complete one or more tests. They are challenging, may involve unfamiliar problems, and can take several hours. To learn more about what to expect throughout the selection process, you can find additional information here. We set the bar high and won’t extend an offer until we’re confident we’ve found the right candidate. This is why a job may remain open for months or be reposted several times. We consider all applicants for employment and provide reasonable accommodations for individuals with disabilities—please let us know through this form. Before you apply If you’ve applied before but didn't receive an offer, we recommend waiting at least one year before applying again. Bending Spoons is a demanding environment. We’re extremely ambitious and we hold ourselves—and one another—to a high standard. While this tends to lead to extraordinary learning, achievement, and career growth, it also requires significant commitment. To help you ramp up quickly and set yourself up for success, we expect you to spend most days in our Milan office during your first few months with us, regardless of your long-term work location. It’s the best way to rapidly absorb our company culture and build trust with your new teammates. We’ll support you with generous travel and accommodation assistance. After that, you’re welcome to work from one of our offices, or remotely from approved countries—depending on what we agree at the offer stage. If the role speaks to you and you’re excited to give your best, we’d love to hear from you. Apply now—we can’t wait to meet you.", "skills": [], "employment_type": "Full-time", "exp_min": null, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 1.0, "score": 45.4, "matched_skills": ["english", "microservices", "docker"], "missing_skills": ["artificial intelligence", "grpc", "kubernetes", "python", "rust"], "also_on": [], "query": "software developer", "id": "li4473775071", "extra": {"linkedin_id": "4473775071", "seniority_level": "Entry level", "details_fetched": true, "semantic": 0.336, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "IoT & DevOps Engineer (TypeScript & Azure)", "company": "Eneco", "url": "https://www.linkedin.com/jobs/view/4445170249", "country": "NL", "location": "Rotterdam, South Holland, Netherlands", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T11:13:30.368791+00:00", "posted_raw": "11 hours ago", "salary": "", "snippet": "", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 45.2, "matched_skills": ["devops", "typescript"], "missing_skills": ["iot", "azure"], "also_on": [], "query": "software developer", "id": "li4445170249", "extra": {"linkedin_id": "4445170249", "semantic": 0.413, "score_confidence": "medium"}}, {"source": "arbeitnow", "source_name": "Arbeitnow", "title": "Software Engineer", "company": "Andurilindustries", "url": "https://www.arbeitnow.co.uk/jobs/companies/andurilindustries/software-engineer-sydney-australia-225465", "country": "DE", "location": "Sydney, Australia", "remote": false, "posted": "2026-09-30", "posted_at": "2026-09-30T18:55:47+00:00", "posted_raw": 1790794547, "salary": "", "snippet": "<div class=\"content-intro\"><p>Anduril Industries is a defense technology company with a mission to transform U.S. and allied military capabilities with advanced technology. By bringing the expertise, technology, and business model of the 21st century’s most innovative companies to the defense industry, Anduril is changing how military systems are designed, built and sold. Anduril’s family of syste", "description": "<div class=\"content-intro\"><p>Anduril Industries is a defense technology company with a mission to transform U.S. and allied military capabilities with advanced technology. By bringing the expertise, technology, and business model of the 21st century’s most innovative companies to the defense industry, Anduril is changing how military systems are designed, built and sold. Anduril’s family of systems is powered by Lattice OS, an AI-powered operating system that turns thousands of data streams into a realtime, 3D command and control center. As the world enters an era of strategic competition, Anduril is committed to bringing cutting-edge autonomy, AI, computer vision, sensor fusion, and networking technology to the military in months, not years.<\/p><\/div><h3>About the Team<\/h3> <p>Anduril’s Maritime Division has assembled a diverse team of experts in software, robotics, artificial intelligence, sensor fusion, and data analysis to create software and hardware solutions that radically evolve the capabilities of our customers. We are fielding the next generation of autonomous systems to tackle the extremely challenging industry demands of maritime operations. Anduril has brought to market a unique, ultra-long-range, full-ocean-depth underwater vessel platform and a completely refreshed maritime vehicle and flexible manufacturing architecture that scales from \"small\" to \"extra-large\" vehicle sizes. Today, Anduril is executing on billion-dollar contracts while simultaneously performing Robot-as-a-Service (RaaS) AUV operations.<br><br>We are seeking to sustain our early successes with deep investment in an expanded product portfolio. These products, including Dive-XL, Dive-LD, Copperhead, Seabed Sentry, and other unannounced systems, will deliver a coherent system-of-systems, enabling the end-to-end conduct of a variety of autonomous missions in the maritime domain. If you are passionate about solving problems that have real impact and working on systems that directly contribute to achieving national strategic priorities, we want you to join Anduril’s Maritime Division and help us build the future of defence capability.<\/p> <h3>About the Job<\/h3> <p>Software Engineers contribute to the delivery of a variety of software integrated in to our products. This includes autonomy, simulation, data processing, payload integration, and off-board command and control and decision support. We expect Software Engineers to demonstrate end-to-end outcome ownership of their projects, contributing as a member of a team to the rapid architecting, design, delivery, support, and evolution of next generation autonomous platforms through their entire product life-cycle.<\/p> <h3>What You’ll Do<\/h3> <ul> <li>Empathize with end-users and drive solutions that balance their needs with external constraints, restrictions and requirements in a multi-stakeholder environment<\/li> <li>Own software enabled solutions that are deployed to customers, optimizing for the delivery of value to the end-user<\/li> <li>Implement software that rapidly delivers capability beyond the scope of current platforms, with a clear path for both architecture and capability evolution over time<\/li> <li>Contribute to the development of existing software services across Anduril, with the aim of developing components that are re-usable across multiple Anduril product lines<\/li> <li>Develop software that runs on- and off- robotic platforms, using a variety of technologies<\/li> <li>Work as part of team to develop, then iteratively enhance, vehicle and mission software, including full lifecycle testing, monitoring and operation<\/li> <li>Create test and simulation fixtures that operate with both software- and hardware-in-the-loop<\/li> <li>Support vehicle manufacturing and deployment<\/li> <li>Work as a member of a multi-disciplinary engineering team<\/li> <li>Travel to co-locate with end-users and/or other teams up to 20% of the time<\/li> <\/ul> <h3>Required Qualifications<\/h3> <ul> <li>Bachelor’s degree in Robotics, Mechatronics, Computer Science, Engineering, a relevant field, or equivalent experience<\/li> <li>Professional experience working as a Software Engineer with one or more domains and/or technologies of competence<\/li> <li>Systems and/or application programming skills including algorithms, data structures, concurrency, scaling, testing and software design<\/li> <li>Experience troubleshooting and analyzing remotely deployed software systems<\/li> <li>Capacity to work holistically on software enabled capabilities up and down the software stack and through lifecycle through design, implementation, operation and sustainment<\/li> <li>Capacity to learn and grow rapidly, building personal and team capacity, growing your skills to the standard of Senior Software Engineer<\/li> <li>Ability to obtain and maintain an Australian Government Security Clearance<\/li> <\/ul> <h3>Preferred Qualifications<\/h3> <ul> <li>Experience in the delivery of a military mission system<\/li> <li>Experience writing backend services or embedded software in C++, Rust and/or Go<\/li> <li>Experience writing frontend applications using Typescript and React<\/li> <li>Experience with the implementation and operation of horizontally scaled cloud technologies<\/li> <li>Experience with the implementation and support of embedded software, particularly in the field of robotics<\/li> <li>Experience with modeling and simulation<\/li> <li>Experience with development of high assurance safety critical software<\/li> <li>Experience within the product delivery lifecycle including manufacturing, system acceptance, deployment, and sustainment.<\/li> <li>Familiarity with Systems Engineering concepts<\/li> <\/ul><div class=\"content-conclusion\"><p><span data-contrast=\"auto\">The salary range for this role is an estimate based on a wide range of compensation factors, inclusive of base salary only. Actual salary offer may vary based on (but not limited to) work experience, education and/or training, critical skills, and/or business considerations. Highly competitive equity grants are included in the majority of full time offers; and are considered part of Anduril's total compensation package. Additionally, Anduril offers top-tier benefits for full-time employees, including:<\/span><span data-ccp-props=\"{\"134233117\":false,\"134233118\":false,\"335551550\":0,\"335551620\":0,\"335559738\":240,\"335559739\":240}\"> <\/span><\/p> <p> <\/p> <h3 class=\"detailElios\"><strong>Benefits<\/strong><\/h3> <p><span data-contrast=\"auto\">At Anduril, we invest in our people. Our comprehensive, competitive benefits package (available at little to no cost to employees) ensures you’re supported in health, recovery, and whatever comes next. <\/span><em><span data-contrast=\"auto\">For more information, <a href=\"https://www.anduril.com/careers\">Explore Our Benefits<\/a>.<\/span><\/em><\/p> <p> <\/p> <div class=\"RichText column1\"> <h3 class=\"detailElios\"><strong>Protecting Yourself from Recruitment Scams<\/strong><\/h3> <p class=\"detailElios\">Anduril is committed to maintaining the integrity of our Talent acquisition process and the security of our candidates. We've observed a rise in sophisticated phishing and fraudulent schemes where individuals impersonate Anduril representatives, luring job seekers with false interviews or job offers. These scammers often attempt to extract payment or sensitive personal information.<\/p> <\/div> <div class=\"RichText column2\"> <p class=\"detailElios\">To ensure your safety and help you navigate your job search with confidence, please keep the following critical points in mind:<\/p> <ul> <li> <p class=\"detailElios\"><strong>No Financial Requests: <\/strong>Anduril will never solicit payment or demand personal financial details (such as banking information, credit card numbers, or social security numbers) at any stage of our hiring process. Our legitimate recruitment is entirely free for candidates.<\/p> <\/li> <li><strong>Please always verify communications:<\/strong> <ul> <li>Direct from Anduril: If you receive an email from one of our recruiters, it will <em>only<\/em> come from an ----- address.<\/li> <li>Via Agency Partner: If contacted by a recruiting agency for an Anduril role, their email will clearly identify their agency. If you suspect any suspicious activity, please verify the agency's authenticity by reaching out to <a ---------- <\/ul> <\/li> <li> <p class=\"detailElios\"><strong>Exercise Caution with Unsolicited Outreach:<\/strong> If you receive any communication that appears suspicious, contains grammatical errors, or makes unusual requests, do not engage. Always confirm the sender's email domain is ----- before providing any personal information or clicking on links.<\/p> <\/li> <li> <p class=\"detailElios\"><strong>What to Do If You Suspect Fraud:<\/strong> Should you encounter any questionable or fraudulent outreach claiming to be from Anduril, please report it immediately to <a ---------- Your proactive caution is invaluable in protecting your personal information and upholding the security and trustworthiness of our recruitment efforts.<\/p> <\/li> <\/ul> <\/div> <h3> <\/h3> <h3><strong>Data Privacy<\/strong><\/h3> <p><span data-contrast=\"auto\">To view Anduril's candidate data privacy policy, please visit <\/span><span data-contrast=\"none\"><span data-ccp-charstyle=\"Hyperlink\"><a href=\"https://anduril.com/applicant-privacy-notice/\">https://anduril.com/applicant-privacy-notice/<\/a><\/span><\/span><span data-contrast=\"auto\">.<\/span><span data-ccp-props=\"{\"134233117\":false,\"134233118\":false,\"335551550\":0,\"335551620\":0,\"335559738\":240,\"335559739\":240}\"> <\/span><\/p> <p> <\/p> <p><span data-ccp-props=\"{\"134233117\":false,\"134233118\":false,\"335551550\":0,\"335551620\":0,\"335559738\":240,\"335559739\":240}\">By submitting your application, you consent to Anduril Industries using a third-party service provider to conduct pre-employment risk, integrity, and due diligence screening and assessing potential risks as part of your application process. This third-party service provider provides risk-intelligence services that may include analysis of sanctions and watchlists, adverse media, public-record information, and other lawful open-source or commercial data sources. This third-party service provider does not act as a consumer reporting agency. Use of this provider helps to ensure compliance with applicable laws and protect technology, intellectual property, and organizational security.<\/span><\/p><\/div> Find more English Speaking Jobs in United Kingdom on Arbeitnow", "skills": ["Maritime & Maneuver Dominance : Maneuver Dominance Engineering : Mission Software Engineering"], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 45.1, "matched_skills": ["data structures", "concurrency", "typescript", "react", "english"], "missing_skills": ["artificial intelligence", "robotics", "embedded", "computer vision", "data analysis", "monitoring", "c++", "rust"], "also_on": [], "query": "", "id": "aba168a30214", "extra": {"semantic": 0.257, "score_confidence": "high"}}, {"source": "adzuna", "source_name": "Adzuna", "title": "C++ obs/companies/zopa/platform-engineer-manchester-23118", "country": "DE", "location": "Manchester", "remote": false, "posted": "2026-09-30", "posted_at": "2026-09-30T15:24:32+00:00", "posted_raw": 1790781872, "salary": "", "snippet": "Our Story Hello there. We’re Zopa. We started our journey back in 2005, building the first ever peer-to-peer lending company. Fast forward to 2020 and we launched Zopa Bank. A bank that listens to what our customers don’t like about finance and does the opposite. We’re redefining what it feels like to work in finance. Our vision for a new era of banking puts people front and centre — we’ve built a", "description": "Our Story Hello there. We’re Zopa. We started our journey back in 2005, building the first ever peer-to-peer lending company. Fast forward to 2020 and we launched Zopa Bank. A bank that listens to what our customers don’t like about finance and does the opposite. We’re redefining what it feels like to work in finance. Our vision for a new era of banking puts people front and centre — we’ve built a business that empowers everyone to aim high, every day, to move finance forward. Find out more about our fantastic offerings at Zopa.com ! We’re incredibly proud of our achievements and none of it would be possible without the amazing team here. It’s not just industry awards we’re winning, we’ve also been named in the top three UK’s Most Loved Workplaces. If you embrace unconventional challenges, are unafraid to think differently and are driven to make an outsized impact, you’ll thrive here at Zopa, so join us, and make it count. Want to see us in action? Follow us on Instagram @zopalife The Team Cloud Infrastructure is part of Zopa’s Platform Tribe, working alongside DBA and Dev X colleagues. Our customers are the engineers who build Zopa’s products, and we are making it easier for them to deliver safely and independently. In the near term, the team is completing a major migration. Beyond that, we are bringing platform capabilities together and creating more self-service tooling and clear engineering guardrails. You will join early enough to make a tangible contribution to how the platform evolves, not simply maintain what already exists. A Day In The Life: Own delivery of meaningful cloud infrastructure and migration work. Build and improve infrastructure-as-code, containers and cloud automation. Work with engineers to understand needs and improve the developer experience. Help make platform services secure, reliable, observable and maintainable. Learn and apply Zopa’s AWS, Kubernetes and CI/CD patterns. Contribute to shared standards, documentation, code review and continuous improvement. Support business-critical services through the shared on-call rota . About You: Practical cloud experience in AWS, GCP, Azure or another major cloud environment. Container experience, such as Kubernetes or ECS. Infrastructure-as-code experience, ideally Terraform or a comparable tool. Experience contributing to CI/CD and reliable software delivery. Ability to take ownership of a project with support and work through ambiguity. A collaborative approach to enabling application engineers and improving their experience. Evidence of quality thinking across reliability, maintainability, security and operational readiness. Experience participating in an on-call rota or supporting production services. Added Bonus: AWS experience and exposure to Kubernetes/EKS, Terraform, Helm and GitHub Actions. Experience with service discovery, secrets management, networking, monitoring or scripting. Observability tooling such as Honeycomb, OpenTelemetry , Prometheus, Splunk . Pragmatic use of AI-assisted engineering tools. #LI-AP1 At Zopa we value flexible ways of working. We value face-to-face collaboration and a good work-life balance. This hybrid role requires you to come to our Manchester office 2-3 days a week. (WeWork, Dalton Place, 29 John Dalton Street, M2 6WF) Please note this office is dog friendly so you might see so > Test and integrate software on real robotic hardware, working with firmware, control, backend, QA, and DevOps engineers when problems cross those boundaries.<\/li> <\/ul> <h3><strong>Essential Skills<\/strong><\/h3> <ul> <li><strong>Background:<\/strong> Degree in Computer Science, Software Engineering, or a related field, or an equivalent combination of training and experience, with initial professional experience building production C++ software, typically up to about three years and excluding internships or working-student positions.<\/li> <li><strong>Modern C++:<\/strong> Hands-on experience writing C++ using modern practices (C++17/C++20), gained through professional work, internships, or substantial project experience.<\/li> <li><strong>Systems Programming:<\/strong> Working understanding of Linux system programming — processes, threads, synchronization, IPC, and sockets — along with asynchronous programming concepts.<\/li> <li><strong>Debugging:<\/strong> Practical debugging experience using tools such as GDB, sanitizers (ASan/TSan/UBSan), or Valgrind, applied to problems that span multiple interacting software or hardware components.<\/li> <li><strong>Testing:<\/strong> Experience writing automated tests with frameworks such as GoogleTest, including meaningful unit and integration test coverage.<\/li> <\/ul> <h3><strong>Beneficial Skills<\/strong><\/h3> <ul> <li><strong>Robotics & Industrial Background:<\/strong> Experience with robotics, industrial automation, or embedded systems, including industrial communication protocols such as EtherCAT, CAN, or similar.<\/li> <li><strong>Hardware-in-the-Loop Testing:<\/strong> Experience with hardware-in-the-loop, simulation, fault-injection, or other automated system-testing approaches.<\/li> <li><strong>Embedded Linux:<\/strong> Experience with real-time or performance-sensitive Linux systems, or with the deployment side of embedded Linux.<\/li> <li><strong>Python Tooling:<\/strong> Experience using Python for testing, automation, or developer tooling.<\/li> <li><strong>AI-Assisted Development:<\/strong> Experience using AI-assisted development tools, combined with critically reviewing and validating the generated output.<\/li> <\/ul><div class=\"content-conclusion\"><h3 class=\"TranslationField-module__fieldItemName___Q0F_7 TranslationField-module__aboutUsWrapper___WXJpq\"><strong>What we offer<\/strong><\/h3> <ul> <li> <div>A dynamic high-tech company, combined with financial soundness and world-class investors.<\/div> <\/li> <li> <div>Join an interdisciplinary, international team with 60+ different nationalities in a collaborative work environment.<\/div> <\/li> <li> <div>Lots of development opportunities as we continue to grow.<\/div> <\/li> <li> <div>Challenging tasks and impactful projects alongside experts that enable professional and personal growth.<\/div> <\/li> <li> <div>Corporate Benefits Program covering health, mobility, and learning for 100€ net per month.<\/div> <\/li> <li> <div>Modern office facilities with a rooftop terrace overlooking Munich, free drinks & fruits, and regular company events contribute to a good working environment<\/div> <\/li> <\/ul> <h3><strong>About us<\/strong><\/h3> <div class=\"TranslationField-module__fieldItemValue___c0djd\"> <p><strong>Agile Robots SE<\/strong> is an international high-tech company based in Munich, Germany with a production site in Kaufbeuren and more than <strong>3500<\/strong> employees worldwide. Our mission is to bridge the gap between artificial intelligence and robotics by developing systems that combine state-of-the-art force-moment-sensing and world-leading image-processing technology. This unique combination of technologies allows us to provide user-friendly and affordable robotic solutions that enable intelligent precision assembly. <\/p> <p>This is made possible by our employees, who bring out the best in each and every day with creativity and enthusiasm. Become part of this team and shape the future of at delight their customers. The team is developing 3D Live Navigation , an advanced navigation system that enhances traditional maps by integrating high-resolution 3D lane models, real-time sensor data, environmental models, and dynamic lighting conditions. We are leveraging feedback from millions of vehicles and aerial imagery to create a detailed and immersive 3D navigation experience. Additionally, we are working on integration with in-vehicle sensors and ADAS to provide precise lane-level guidance, hazard warnings, and improved situational awareness, helping drivers navigate complex roads more safely and efficiently. Learn more: mapbox.com/blog/mapbox-3d-navigation What You'll Do Develop real-time visualization of ADAS sensor data and HD lane-level navigation for Mapbox Navigation SDK, including implementation of simulation tools for testing various driving scenarios and sensor data playback. Assess minimum requirements for our automotive solutions and align them with reference platforms. Write clean, fast C++ code to integrate various data inputs required for our automotive navigation system product offerings, or provide custom-tailored solutions as needed. Implement and collaborate on new rendering and navigation features. Own full-stack development from data to navigation experience across various platforms and stacks. Fine-tune the automotive navigation experience through profiling and debugging techniques to extract the best performance from customer platforms. Work with technical counterparts at customers and partners to discover requirements, provide implementation recommendations, and debug integrations. Collaborate with internal teams to ensure best practices for cross-platform API design and performance tuning for specific hardware and software combinations. Improve the product’s performance, stability, maintainability, and simplicity. What We Believe Are Important Traits For This Role Broad experience in software development, customer engagements, and automotive compliance standards. Strong technical expertise in modern and embedded C++. Proficient in rendering with a strong foundation in algorithms and performance optimization. Strong understanding of various ADAS features (ACC, LKA, etc.) and their corresponding visual representation in displays/HMI systems. Skilled in sensor fusion and various filtering techniques. Experienced with build systems like CMake and Gradle, and developing frameworks/developer tools. Excellent communication skills, capable of working effectively with distributed teams, customers, and partners (Fluent in English). Nice To Have Automotive operating systems: AGL, AOSP, Android Automotive, QNX. Automotive CAN bus experience. HD mapping domain knowledge (lane level geometry, road topology, map data formats). Orchestration: Yocto, Docker. Cross-platform UI toolkits like Qt or Flutter. Experience in Kotlin, Shell Script, JavaScript, Python. What We Value In addition to our core values, which are not unique to this position and are necessary for Mapbox leaders: We value high-performing creative individuals who dig into problems and opportunities. We believe in individuals being their whole selves at work. We commit to this through supportive health care, parental leave, flexibility for the things that come up in life, and innovating on how we think about supporting our people. We emphasize an environment of teaching and learning to equip employees with the tools needed to be successful in their function and the company. We strongly believe in the value of growing a diverse team and encourage people of all backgrounds, genders, ethnicities, abilities, and sexual orientations to apply. How We Support You Hybrid/Remote Options: Enjoy flexibility to work comfortably from home or periodically from an office where applicable. Country-Specific Care & Coverage: Private health, dental, and income protection plans tailored to elevate your regional statutory benefits. Family-First Support: Family care, maternity and paternity leave policies to support your growing family. Lifestyle Spending Account: Contributions to support your health, wellness, and personal growth. Balance & Brainpower: Mental health support for you and your dependents. Rest & Recharge: Paid time away, company holidays, and generous absence policies. Time Off to Give Back: Dedicated paid volunteering time in addition to your standard PTO. By applying for this position, you acknowledge that you have received the Mapbox Non-US Privacy Notice for applicants, which is linked here. Completing this application requires you to provide personal data, such as your name and contact information, which is mandatory for Mapbox to process your application. We are committed to a fair and equitable hiring process. We do not discriminate against any protected class.", "skills": [], "employment_type": "Full-time", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 41.5, "matched_skills": ["performance optimization", "api design", "data structures", "english", "docker", "javascript"], "missing_skills": ["c++", "embedded", "android", "can bus", "flutter", "kotlin", "bash", "python"], "also_on": [], "query": "software developer", "id": "li4473789813", "extra": {"linkedin_id": "4473789813", "seniority_level": "Not Applicable", "details_fetched": true, "semantic": 0.282, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Engineer, Test Development (Software)", "company": "Celestica", "url": "https://www.linkedin.com/jobs/view/4388645249", "country": "TH", "location": "Laem Chabang, Thailand", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T14:13:32.077374+00:00", "posted_raw": "8 hours ago", "salary": "", "snippet": "", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 41.2, "matched_skills": [], "missing_skills": []  opportunities, generating links, tracking performance, and growing their partnerships on the go.<\/p> <p>The role is focused primarily on the creator-focused mobile app. You will lead two teams that bring it to life:<\/p> <ul> <li><strong>Pegasus Mobile<\/strong>, building our Flutter-based mobile application.<\/li> <li><strong>Pegasus Platform<\/strong>, providing the APIs and backend services that power the mobile app and our publisher web experience.<\/li> <\/ul> <p>This is a leadership role, not a hands-on coding role, but we expect strong technical depth so you can guide the team and unblock delivery when needed.<\/p> <p><strong>Key Tasks<\/strong><\/p> <ul> <li>Coach and mentor engineers, fostering their growth and career development.<\/li> <li>Drive recruitment efforts and ensure successful onboarding for new team members.<\/li> <li>Conduct performance reviews, track individual development plans, and provide regular feedback.<\/li> <li>Collaborate closely with the Product Manager to define team objectives and OKRs.<\/li> <li>Enable the team to take ownership of the software delivery lifecycle and drive continuous improvement.<\/li> <li>Facilitate discussions and decision-making processes within the team, resolving conflicts when necessary.<\/li> <li>Coordinate with Product, UX and other engineering teams to deliver on shared goals.<\/li> <li>Champion AI-assisted development, code generation and agentic coding workflows to accelerate delivery across the team.<\/li> <li>Contribute to knowledge sharing and promote a culture of learning within the team.<\/li> <li>Contribute to the strategic direction of the Engineering Management group.<\/li> <\/ul> <p><strong>Skills & Expertise<\/strong><\/p> <p><strong>Required:<\/strong><\/p> <ul> <li>Minimum 2 years of experience as an Engineering Manager, Technical Lead or equivalent leadership position, with a clear servant-leadership and empowering management style.<\/li> <li>Deep, hands-on experience building and shipping mobile applications in a commercial setting, ideally apps you have helped launch and scale.<\/li> <li>Strong product mindset, comfortable collaborating with Product and UX on discovery and shaping outcomes, not just executing requirements.<\/li> <li>Backend and cloud literacy sufficient to lead the Platform team (backend, API, AWS).<\/li> <li>Hands-on experience with AI-assisted development, code generation and agentic coding workflows to accelerate delivery.<\/li> <li>Strong communicator across technical and non-technical audiences, comfortable adopting language based on the room.<\/li> <li>Comfortable working in an Agile setup (Scrum or Kanban), facilitating ceremonies and supporting the team through change.<\/li> <\/ul> <p><strong>Nice to Have<\/strong><\/p> <ul> <li>Hands-on experience with Flutter.<\/li> <li>Product experience in the creator economy, for example creator tooling, affiliate or creator monetisation platforms, or influencer-facing products.<\/li> <li>Experience orchestrating multi-agent AI workflows for engineering or product use cases.<\/li> <\/ul> <p> <\/p> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Our Offer<\/strong><\/div> <ul class=\"RichTextList-bulleted\"> <li> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Flexi-Week<\/strong>: We prioritise your mental health and wellbeing by offering you a four-day Flexi-Week (with one lighter or completely disconnected day per week) at full pay, with no reduction to your annual holiday allowance.<\/div> <\/li> <li> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Flexi-office<\/strong>: We offer an international culture and flexibility through our hybrid/remote working scheme which is designed to foster a culture of mutual trust and working flexibility.<\/div> <\/li> <li> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Work Expense Contribution & Remote Working Furniture<\/strong>: You will receive a monthly allowance to cover part of your running costs, as well as a furniture package to support you in setting up a comfortable workspace when working from home.<\/div> <\/li> <li> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Health and Wellbeing<\/strong>: With our support and access to various initiatives and sports offers, you can focus on your mental and physical wellbeing.<\/div> <\/li> <li> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Development<\/strong>: We’ve built our extensive training suite, Awin Academy, to cover a wide range of skills that support your professional and personal growth, with trainings conveniently packaged to help your overall development.<\/div> <\/li> <li> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Appreciation<\/strong>: Thank and reward colleagues by sending them a voucher through our peer-to-peer recognition programme.<\/div> <\/li> <\/ul> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><em>We are hiring in multiple countries for this role. Additional benefits, including health and wellbeing offerings, will be discussed during the initial interview.<\/em><\/div> <p>Established in 2000, Awin is proud of our dynamic, social and inclusive culture.<\/p> <p>Like all businesses, we’ve had to adapt and nurture our culture in a virtual environment. Our virtual ‘Life @ Awin’ hub brings our colleagues from across the globe together for various social activities.<\/p> <p>Diversity & Inclusion are paramount to us, and we proudly pursue and hire diverse team members. We champion uniqueness and authenticity; this is who we are at our core. Our network of affiliate partnerships are diverse and transparent, as are the employees powering our vision to build the world’s leading open partner ecosystem. We welcome all backgrounds, identities, and experiences. If you need support at any point in the application or interview process, please let us know.<\/p> <p><span class=\"TextRun Highlight SCXW55218471 BCX0\" lang=\"EN-GB\" data-contrast=\"auto\"><span class=\"NormalTextRun SCXW55218471 BCX0\">Awin is part of the Axel Springer group.<\/span><\/span> <span class=\"TextRun Highlight SCXW55218471 BCX0\" lang=\"EN-GB\" data-contrast=\"auto\"><span class=\"NormalTextRun SCXW55218471 BCX0\">Learn more at <\/span><\/span><a class=\"Hyperlink SCXW55218471 BCX0\" href=\"https://www.axelspringer.com/en/\" target=\"_blank\"><span class=\"TextRun Highlight Underlined SCXW55218471 BCX0\" lang=\"EN-GB\" data-contrast=\"none\"><span class=\"NormalTextRun SCXW55218471 BCX0\" data-ccp-charstyle=\"Hyperlink\">axelspringer.com/<\/span><span class=\"NormalTextRun SCXW55218471 BCX0\" data-ccp-charstyle=\"Hyperlink\">en<\/span><span class=\"NormalTextRun SCXW55218471 BCX0\" data-ccp-charstyle=\"Hyperlink\">/<\/span><\/span><\/a><span class=\"TextRun Highlight SCXW55218471 BCX0\" lang=\"EN-GB\" data-contrast=\"auto\"><span class=\"NormalTextRun SCXW55218471 BCX0\">, and explore the Axel Springer Essentials here:<\/span><\/span> <a class=\"Hyperlink SCXW55218471 BCX0\" href=\"https://www.axelspringer.com/ ition to maintaining legacy control platforms that remain critical for lon", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 40.5, "matched_skills": [], "missing_skills": ["embedded"], "also_on": [], "query": "software developer", "id": "6026e7dbf532", "extra": {"semantic": 0.188, "score_confidence": "low"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Senior Digital Twin Software Engineer", "company": "ReOrbit", "url": "https://www.linkedin.com/jobs/view/4413148294", "country": "FI", "location": "Helsinki, Uusimaa, Finland", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T18:12:59.129655+00:00", "posted_raw": "4 hours ago", "salary": "", "snippet": "ReOrbit is looking for a Senior Digital Twin Software Engineer to join the ReOrbit team and support the software campaigns for our current satellite product lines UKKO, SILTA and future missions. It's an exciting chance to join a dynamic start-up, with the opportunity to make a real impact, to reach our goal of pushing the boundaries of space data transfer. Responsibilities Co-design and implement", "description": "ReOrbit is looking for a Senior Digital Twin Software Engineer to join the ReOrbit team and support the software campaigns for our current satellite product lines UKKO, SILTA and future missions. It's an exciting chance to join a dynamic start-up, with the opportunity to make a real impact, to reach our goal of pushing the boundaries of space data transfer. Responsibilities Co-design and implement networked digital twin software systems. Build telemetry, messaging, networking layers. Develop simulation and system-control components. Implement distributed and real-time system components. Co-own technical architecture and platform direction. Rapidly prototype, iterate, and ship features. Write clean, testable, production-oriented code. Skills And Requirements Bachelors or Masters degree in Physics, Computer Science, Sofware Engineering or similar. Strong (4+ yrs) experience in simulation sofware development including system architecture, code review, CI/CD pipelines, software testing and V&V. Strong capability in object-oriented C++ for developing simulators. Knowledge of integrating hardware and software in the loop. Experience developing high fidelity, high frequency, real-time software solutions. Self-motivated and driven, with a proven ability to develop and analyse independent projects. What does ReOrbit do? ReOrbit builds the foundation for the next generation of space applications by transforming satellites into truly intelligent, interconnected platforms, defined by software. Our satellite design philosophy revolves around the idea that satellites must network, communicate with each other and thus improve mission efficiency. How can this be achieved? Thanks to a flexible software-first architecture, where all these aspects are dealt with upfront in the mission concept, as integrated functionalities. ReOrbit’s top-notch team of software engineers and system architects develop in-house software, procure hardware from the best-in-class suppliers, and seamlessly integrate the components to create flexible and secure satellites. Today, we are a rapidly growing company building a very strong multidisciplinary team to support our activities. We are headquartered in Helsinki, Finland with a subsidiary in Bariloche, Argentina. Working at ReOrbit At ReOrbit, we are focused on building a strong team as we believe nothing can be accomplished without innovative, humble and curious minds working together on a common goal. We’re all about fostering an inclusive, dynamic environment where equality and diversity are our strength. We offer Challenging but rewarding environment – you will thrive if you are always reflecting on how to make things better. Your ideas will be heard. Ambitious and supportive network of people, who are motivated to change the space industry, bringing expertise from both classic and new space. Benefits such as lunch vouchers, events, parties, occupational health care and additional health insurance - but most importantly a possibility to be a part of a unique and diverse team, connected by similar mindset and sense of humor. We like to spend time together! You can choose activities whichever is to your liking – runOrbit, climbOrbit; become ping pong or board games champion. We support relocation and integration into Finnish society, find some experiences about relocation here. Please, submit your application as soon as possible - we are excited to hear from you and can’t wait to discover your unique skills and experiences. The Company may require a security clearance for certain positions. Any such security clearance will be conducted in accordance with applicable law and the Company's relevant policies For agencies: We do not accept unsolicited CVs for our open vacancies. Any CV sent to our team unsolicited will reserve us the right to pursue a candidate without obligation to the sender. All candidate submissions must be conducted through our official channels and in accordance with our terms of engagement.", "skills": [], "employment_type": "Full-time", "exp_min": 4.0, "exp_max": null, "seniority": "senior", "fit": "stretch", "relevance": 1.0, "score": 40.5, "matched_skills": ["code review", "ci/cd"], "missing_skills": ["object-oriented", "c++", "finnish"], "also_on": [], "query": "software developer", "id": "li4413148294", "extra": {"linkedin_id": "4413148294", "seniority_level": "Not Applicable", "details_fetched": true, "semantic": 0.413, "score_confidence": "high"}}, {"source": "apify-indeed", "source_name": "Indeed (Apify)", "title": "QA Automation Intern", "company": "Titan OS", "url": "https://apply.workable.com/j/DAF4B7EFC0", "country": "ES", "location": "Barcelona, CT, Spain", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T15:20:12+00:00", "posted_raw": "2026-09-30T15:20:12.021Z", "salary": "", "snippet": "Is this you? Titan Operating System S.L. (Titan OS), the Barcelona-based technology, entertainment, and advertising company, is looking for you! At TitanOS, we live by three core values: Make things happen – We take ownership, move fast, and deliver impact. No ego – We collaborate with respect and humility to reach shared goals. Show genuine passion – We love what we do and never stop learning. Cu", "description": "Is this you? Titan Operating System S.L. (Titan OS), the Barcelona-based technology, entertainment, and advertising company, is looking for you! At TitanOS, we live by three core values: Make things happen – We take ownership, move fast, and deliver impact. No ego – We collaborate with respect and humility to reach shared goals. Show genuine passion – We love what we do and never stop learning. Culture and environment are at the heart of our ethos. If the above resonates with you, keep reading because we believe you could be a perfect addition to our incredible team! Role overview We are looking for a QA Automation Intern to join our engineering team and support the quality of our products. As a QA Intern, you will help test new features, report bugs, and work closely with engineers and product managers. This is a great opportunity to learn about quality assurance in real-world software development. Key responsibilities: Assist in running manual tests on Smart TVs and web platforms Help write and organize test cases Report bugs and issues clearly, with steps to reproduce Work with engineers and product managers to understand new features Support in preparing test data Learn how to use tools like Playwright, Postman, and others Gain experience in automation and continuous integration testing Requirements What makes you a great fit: Interest in software testing and technology Basic knowledge of HTML, CSS, JSON, or XML, Javascript is a plus Curiosity and attention to detail Eagerness to learn QA tools and ", "description": "Do you want to build software used behind the scenes of live television, sports and entertainment? At MXMZ Media, you’ll help develop a platform that enables production teams to design, manage and broadcast realtime graphics. About MXMZ MXMZ (pronounced: Maximize) is a next-generation, cloud-native graphics platform built for broadcasters, sports organizations and live event companies. As a modern alternative to traditional graphics systems, MXMZ combines realtime graphics creation, playout, automation and collaboration in a single scalable platform. With its cloud-based editor, teams can design, manage and deploy graphics from anywhere, while integrating with newsroom systems, automation platforms, live data sources and production workflows. Whether delivering graphics for live sports, news, entertainment or digital content, MXMZ enables organizations to work faster, more efficiently and at scale. MXMZ Media B.V. is part of the Banijay Group, combining the agility of a fast-growing technology company with the backing of one of the world’s leading media and content production organizations. The Role As a Medior+ Full-Stack Developer, you’ll help shape how users interact with the MXMZ platform, making complex graphics workflows intuitive and easy to use. You’ll work closely with our design and development teams, taking ownership of features from initial idea through to delivery. The role is primarily front-end focused, but experience with Node.js and back-end development is essential, enabling developers to work independently across the stack. Key Responsibilities Translating Figma designs into polished, responsive interfaces using React, Vite, TypeScript, and Tailwind CSS within the MXMZ stack. Building and maintaining reusable, well structured components with consistent styling, behaviour and attention to usability. Developing and integrating Node.js back-end functionality where needed, as well as connecting interfaces to existing APIs and real-time data sources. Taking ownership of features across the stack, from front-end implementation and back-end integration through testing, debugging, and refinement. Working closely with designers and developers to deliver reliable, user-friendly features while maintaining a high standard of implementation quality. What We’re Looking For You’re an experienced front-end developer who can work independently and knows when to involve others. We’re looking for: Professional front-end development experience at a strong mid-level or above, with a track record of independently delivering production-ready features. Solid React experience, including components, hooks, routing, and data fetching. Strong TypeScript skills, alongside a solid understanding of JavaScript, HTML and CSS. Experience using Tailwind CSS, design systems and front-end libraries to build responsive layouts and maintain consistent styling across components. Experience with Node.js and back-end development, with the ability to build or modify APIs and supporting functionality when needed. Confidence translating Figma designs into maintainable interfaces within an existing application. A strong eye for visual detail and a good understanding of responsive design and accessibility. Experience with API integrations, real-time data, Git, testing, debugging and code reviews. The ability to work self-sufficiently across a feature, from front-end implementation to back-end integration, without requiring deep DevOps expertise. A practical, collaborative, approach: you ask the right questions, explain your choices, and follow through, taking ownership through to completion. Experience with SVG, animation or WebSockets is welcome. You can develop your knowledge of broadcasting and video production on the job. What We Offer A key role in a fast-growing media technology company, building software for leading broadcasters, sports organizations and production companies worldwide. A flexible, remote-first working environmen , "remote": false, "posted": "2026-09-30", "posted_at": "2026-09-30T16:56:05+00:00", "posted_raw": 1790787365, "salary": "", "snippet": "<h3><\/h3> <h3><strong>Notre équipe Data Exchange recherche un·e Software Integration Engineer basé·e à Lille.<\/strong><\/h3> <p>Au sein de Decathlon Digital, l’équipe Data Exchange assure le transport de la donnée entre les différentes applications du SI. Avec une équipe composée de passionné·es (développeur·euses, ingénieur·es support, responsable d’applications), nous garantissons des échanges fi", "description": "<h3><\/h3> <h3><strong>Notre équipe Data Exchange recherche un·e Software Integration Engineer basé·e à Lille.<\/strong><\/h3> <p>Au sein de Decathlon Digital, l’équipe Data Exchange assure le transport de la donnée entre les différentes applications du SI. Avec une équipe composée de passionné·es (développeur·euses, ingénieur·es support, responsable d’applications), nous garantissons des échanges fiables, performants et disponibles (via Boomi, Kafka, webMethods, Talend). Dans un contexte de transformation majeure (SAP, IA, réduction de la dette technique), nous relevons au quotidien des défis stratégiques pour délivrer une qualité de service d'excellence.<\/p> <h3> <\/h3> <h3><strong>TA FUTURE CONTRIBUTION <\/strong><\/h3> <p> <\/p> <p>Afin de renforcer le pôle d’expertise data exchange et de construire une stratégie durable, nous recherchons un Software Integration Engineer sur notre périmètre d'outils d'échange de données : webMethods, Boomi, Talend, SAP PO et kafka.<\/p> <h3><strong>1. Gestion des Flux et Développement<\/strong><\/h3> <ul> <li><strong>Développer et modifier les flux :<\/strong> Créer, faire évoluer, et configurer les liens (flux) qui permettent aux différentes applications de communiquer entre elles (inclut le <em>mapping<\/em> des données).<\/li> <li><strong>Participer aux Projets :<\/strong> Intégrer les nouvelles solutions et briques techniques au système d'information existant.<\/li> <\/ul> <h3><strong>2. Support et Opérations<\/strong><\/h3> <ul> <li><strong>Analyser et résoudre les incidents :<\/strong> Gérer et corriger les problèmes complexes sur les plateformes et les flux d'intégration.<\/li> <li><strong>Maintenir les plateformes :<\/strong> Effectuer les opérations courantes d'exploitation (démarrages, arrêts de serveurs, gestion des composants) pour assurer la continuité de service.<\/li> <li><strong>Surveiller l'activité :<\/strong> Utiliser les outils de monitoring pour suivre les flux en temps réel et détecter les anomalies.<\/li> <\/ul> <h3><strong>3. Documentation et Accompagnement<\/strong><\/h3> <ul> <li><strong>Rédiger la documentation :<\/strong> Créer et mettre à jour les documents techniques (procédures, schémas de flux) pour l'équipe.<\/li> <li><strong>Aider les utilisateurs :<\/strong> Accompagner et informer les équipes utilisatrices sur le fonctionnement des systèmes.<\/li> <\/ul> <h3><strong>4. Engagement d'Équipe<\/strong><\/h3> <ul> <li><strong>Collaboration quotidienne :<\/strong> Participer activement aux réunions d'équipe pour coordonner les tâches.<\/li> <li><strong>Assurer l'astreinte :<\/strong> Contribuer au planning de roulement pour garantir la gestion des urgences en dehors des heures de bureau.<\/li> <\/ul> <p> <\/p> <p><strong>STACK TECHNIQUE <\/strong><\/p> <ul> <li>Solutions middleware : Boomi, webMethods, SAP PO<\/li> <li>ETL : Talend <\/li> <li>Streaming : kafka <\/li> <li>Protocoles : JMS, SFTP, API, JDBC, S3, GCP Storage, RFC<\/li> <li>Tools : Datadog, Gravitee, Github, Splunk, Vault, kafka UI<\/li> <\/ul> <h3> <\/h3> <h3><strong>CE QUE TU APPORTES<\/strong><\/h3> <p> <\/p> <ul> <li>Expérience dans le développement et l’exploitation des produits d'échange de données.<\/li> <li>La connaissance des outils suivants serait un plus : Rundeck, Ansible, OpenTelemetry.<\/li> <\/ul> <p> <\/p> <h3><strong>CE QUE NOUS T’OFFRONS<\/strong><\/h3> <ul> <li>2 jours de télétravail par semaine ;<\/li> <li>Possibilité de travailler dans l'un des bureaux de Decathlon Digital à Lille, Paris ou Amsterdam ;<\/li> <li>Matériel fourni en accord avec tes missions et nos engagements sociétaux (Mac, Windows, ou Chromebooks) ;<\/li> <li>Une équipe de projet locale au sein d'un réseau mondial (possibilité de carrière internationale) ;<\/li> <li>Développement des compétences et accompagnement (diversité des projets, certifications techniques dès la première année, formations internes et externes, etc.) ;<\/li> <li>Package de rémunération (participation des employés aux actions de l'entreprise, bonus mensuels/trimestriels).<\/li> <\/ul><div class=\"content-conclusion\"><p><strong>DECATHLON DIGITAL <\/strong><\/p> <p>Imaginez si la technologie nous permettait de repousser les frontières et d'offrir des expériences sportives inédites. C'est précisément notre ambition chez Decathlon Digital ! Nous sommes une équipe de plus de 5 000 experts en ingénierie logicielle, gestion de produits, données, cloud et cybersécurité, répartis à Paris, Lille et Amsterdam. Ensemble, nous créons la plus vaste plateforme sportive numérique, en exploitant les innovations technologiques pour optimiser la chaîne de valeur, concevoir des expériences connectées et donner une seconde vie à nos produits.<\/p> <p><strong>Changeons la donne pour de bon.<\/strong> Notre passion du sport nous guide et nous voulons qu’elle perdure. C’est pourquoi nous nous engageons à bâtir un modèle technologique plus durable, en réduisant notre impact direct sur l'environnement, et en créant un espace sûr et inclusif pour apprendre et nous épanouir ensemble. Rejoins l’équipe et façonnons le futur du sport.<\/p><\/div> Find Jobs in France on Arbeitnow", "skills": ["Engineering"], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 39.8, "matched_skills": ["kafka", "c", "s3"], "missing_skills": ["sap", "monitoring", "etl", "gcp", "datadog", "splunk", "ansible", "opentelemetry"], "also_on"  customers and the global team. Demonstrable experience contributing to open-source projects on GitHub (PRs, reviews, issue-driven development). Preferred Qualifications Background in AMO physics and/or neutral-atom quantum computing concepts relevant to shuttling and gate-model execution. Experience with compiler infrastructure (IR design, SSA-based approaches, LLVM/MLIR-style concepts) or DSL/eDSL development. Experience with Rust in addition to Python. Familiarity with quantum error correction workflows and hardware/software co-design in hybrid quantum-classical settings. 科学ソフトウェアエンジニア - シャトルコンパイル（日本） 職務内容 QuEra Computing, Inc.では、最先端の中性原子量子コンピュータへの高レベルアプリケーションの統合という独自のソフトウェア課題の解決を支援する、創造性と協調性を兼ね備えた科学ソフトウェアエンジニアを募集しています。活気ある科学ソフトウェアチームや、産学の協力者コミュニティと共に働き、古典的なコンパイラ技術から低レベルハードウェアコンポーネントとの直接統合に至るまで、多様な専門家からなる成長中のチームが取り組む魅力的な課題の解決に貢献する機会を得られます。当社のオープンソースツールチェーン「Kirin」を活用し、実験物理学者や計算物理学者と共に、低レベルのハードウェア命令から高レベルのプログラミング言語に至るまで、QuEraのコンパイラパイプラインを構築していただきます。これには、ハードウェア実行のための新機能やインフラの開発が含まれます。最先端の中性原子技術や量子エラー訂正技術を用いて、次世代量子コンピューティングのためのコンパイラおよびハードウェアインフラを共同設計していただきます。この新たな方向性は、工学と科学の両面で斬新な課題をもたらします。 日本を拠点とするこの役割では、 移動／シャトル対応のコンパイルおよび最適化 に注力し、産業技術総合研究所（AIST）の ABCI-Q ハイブリッド量子・古典計算環境に統合されたQuEraの Gemini クラス 中性原子システムのユーザー支援を行います。 職務内容 原子シャトル／移動対応コンパイルのためのコンパイラコンポーネントおよびAPIを開発・保守し、Bloqade ShuttleおよびBloqade Lanesに直接貢献します。 シャトルワークフローに関連する最適化手法（例：ルーティング／スケジューリング／プランニングのヒューリスティック、制約を考慮した変換、コストモデル主導のコンパイル決定）を実装し、改善します。 科学者やハードウェア／制御チームと協力し、実験上の制約を堅牢なコンパイラ抽象化および実行可能な命令ストリーム（シャトルや関連する低レベル機能を含む）に変換します。 日本国内の顧客および協力者へのサポートを提供します。これには、課題の優先順位付け、バグの再現、修正の提供、およびABCI-Q / AIST展開における統合・運用サポートが含まれます。 公開リポジトリにおいて、コードレビュー、CI/テスト、リリース管理、そして慎重なAPIの進化といった、堅実なエンジニアリングプラクティスを維持します。 応募資格 コンピュータサイエンス、物理学、応用数学、または関連分野の修士号、あるいは同等の実務経験。 Python（型ヒント、テスト、パッケージング、ツール）における強力なソフトウェアエンジニアリングスキル、および科学分野のコードベースでの作業に慣れていること。 最適化、グラフアルゴリズム、ルーティング／スケジューリング、経路計画、または関連するアルゴリズム分野のいずれか1つ以上の経験。 分野（ソフトウェア、AMO／実験物理学、ハードウェア／制御、アプリケーション）を越えて効果的に協働できる能力。 顧客やグローバルチームとの技術的なコミュニケーションのために、日本語と英語に堪能であること。 GitHub上のオープンソースプロジェクトへの貢献実績（プ ng unserer Linux-Server und Deployment -Prozesse mit. Du übersetzt Anforderungen aus unterschiedlichen Bereichen in klare technische Lösungen. Du bringst Struktur in komplexe oder noch nicht vollständig definierte Aufgaben und sorgst dafür, dass aus Ideen umsetzbare Produkte werden. Du arbeitest eng mit Stakeholdern, Produktverantwortlichen, Redaktion und Geschäftsführung zusammen. Unser Tech-Stack - Wir arbeiten unter anderem mit: PHP und Laravel Statamic PostgreSQL Livewire HTML, CSS und JavaScript RESTful APIs Linux-Servern und modernen Deployment -Prozessen Large Language Models und Coding Agents Du musst unseren Tech-Stack nicht bereits vollständig beherrschen – wichtiger sind uns dein technisches Verständnis, deine Kommunikationsstärke und deine Fähigkeit, komplexe Anforderungen schnell in gute Lösungen zu übersetzen. Du solltest aber Lust haben, mit unseren Technologien zu arbeiten und dich schnell in neue Systeme und Themen einzuarbeiten. Wir suchen keine Person, die jedes Tool schon einmal eingesetzt hat, sondern jemanden, der gute technische Entscheidungen trifft, Zusammenhänge versteht und Verantwortung übernimmt. Qualifikation Du hast fundierte Erfahrung in der Softwareentwicklung und beherrschst mindestens eine relevante Programmiersprache sicher. Du hast idealerweise Erfahrung mit Webanwendungen, APIs und Datenbanken. Du interessierst dich für unseren Tech-Stack und hast Lust, dich in Laravel , Statamic , PostgreSQL und Livewire einzuarbeiten oder darin weiterzuentwickeln. Du verstehst, wie man LLMs und Coding Agents sinnvoll und verantwortungsvoll in der Softwareentwicklung einsetzt – oder möchtest es lernen. Du kennst dich mit Linux-Servern, Deployment und grundlegenden Fragen der IT-Sicherheit aus oder bist bereit, dich in diese Themen einzuarbeiten. Du kannst komplexe Probleme schnell erfassen, priorisieren und in konkrete nächste Schritte übersetzen. Du kommunizierst klar und gerne – auch mit Menschen, die nicht technisch arbeiten. Du kannst unter n) for technical collaboration with Japan-based stakeholders and QuEra's global teams Preferred Qualifications Ph.D. in Computer Science with focus on quantum computation/architecture/programming language/compiler, or equivalent professional experience Experience with FPGA programming knowledge in quantum physics and AMO physics Experience in programming language design, especially programming language theory knowledge in quantum error correction Contribution to existing open-source libraries 科学ソフトウェアエンジニア - ハードウェアコンパイル（日本） 職務内容 QuEra Computing, Inc.では、最先端の中性原子量子コンピュータへの高レベルアプリケーションの統合という独自のソフトウェア課題の解決を支援する、創造性と協調性を兼ね備えた科学ソフトウェアエンジニアを募集しています。活気ある科学ソフトウェアチームや産学の協力者コミュニティと共に働き、古典的なコンパイラ技術から低レベルハードウェアコンポーネントとの直接統合に至るまで、多様な専門家からなる成長中のチームが取り組む魅力的な課題の解決に貢献する機会を得られます。当社のオープンソースツールチェーン「Kirin」を活用し、実験物理学者や計算物理学者と共に、低レベルのハードウェア命令から高レベルのプログラミング言語に至るまで、QuEraのコンパイラパイプラインを構築していただきます。これには、ハードウェア実行のための新機能やインフラの開発が含まれます。最先端の中性原子技術や量子エラー訂正技術を用いて、次世代量子コンピューティングのためのコンパイラおよびハードウェアインフラを共同設計していただきます。この新たな方向性には、工学と科学の両面で数多くの新たな課題が伴います。 この日本拠点での役割には、 産業技術総合研究所（ AIST ） に配備された Gemini クラス のマシン（ABCI-Q）向けの 内部実行ソフトウェアパイプラインの保守および更新 も含まれます。これらのツールやワークフローの主な利用者は 内部の研究者や実験担当者 であり、業務はハードウェア／制御電子機器や実験室での実行要件と密接に関連しています。 職務内容 パルスレベルプログラム用のドメイン特化言語（DSL）および関連するコンパイルスタックの開発・保守 複数の量子コンピュータ構築へのパルスコンパイルの統合を支援 量子エラー訂正（QEC）の科学者やハードウェア制御チームと協力し、QECアルゴリズムの実行に必要なハードウェア機能の計画・開発を行う 科学ソフトウェアチームの他のメンバーと協力し、ゲートレベルおよび原子移動のコンパイルを統合する 産業技術総合研究所（AIST）に配備されたGeminiクラスマシン（ABCI-Q）向けの内部実行ソフトウェアパイプラインを維持・更新し、進化するハードウェア／制御機能および内部の研究ワークフローとの互換性を確保する 応募資格 量子計算／アーキテクチャ／プログラミング言語／コンパイラを専門とするコンピュータサイエンスの修士号、または同等の実務経験 ソフトウェア開発者以外が使用するツールの構築に熱意があること Pythonのセマンティクス、Pythonの型ヒント、CPythonインタプリタに関する経験 最新のC++プロジェクトおよびそれらに関連するツールに関する経験 静的単一代入（SSA）中間表現ベースのコンパイラに関する経験 バージョン管理、コードレビュー、テスト、CI/CD、ロギング、プロファイリング、デバッグ、ドキュメント作成を含む、ソフトウェア開発の全ライフサイクルに関する知識 日本国内のステークホルダーおよびQuEraのグローバルチームとの技術的な連携を行うための、日本語および英語（会話・文章）におけるビジネスレベルの習熟度 望ましい資格 量子計算/アーキテクチャ/プログラミング言語/コンパイラを専門とするコンピュータサイエンスの博士号、または同等の実務経験 FPGA プログラミングの経験 量子物理学および AMO 物理学の知識 プログラミング言語の設計、特にプログラミン
