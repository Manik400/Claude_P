ients and colleagues across all six offices. It will provide the systems needed for internal processes and client-facing applications, with integrations across the technology used by the group. Tasks • Design and build services, integrations and client-facing applications across the platform. • Work across different parts of the technology stack rather than being limited to one area of development. • Take responsibility for your work through design, development, testing, deployment and operation. • Use AI-assisted development tools as part of your normal engineering workflow, while applying the judgement needed to check their output and recognise where they should not be relied on. • Work closely with the Group CIO and colleagues across the business to understand problems and turn them into practical solutions. • Contribute to the technical decisions and engineering standards that will shape the platform. Profile • Software engineering experience across a modern technology stack, with depth in at least one area. • Experience building and running cloud-based applications. Azure experience is preferred. • Practical experience with managed cloud services, infrastructure as code and automated deployment. • Practical experience using AI-assisted development tools in software engineering. We want to understand how you use them, where they save time and where you know the output needs to be challenged. • The ability to work with requirements that are still developing. Some of the early work will involve understanding the business and helping decide what should be built. • Fluent English. German is useful but not required. • Based in Germany and able to work on a hybrid basis. We expect the team to spend roughly half of the working week together in the office, depending on location and the work being undertaken. We offer • The opportunity to help build a new platform without having to work around an existing technology estate. • A small engineering team with direct access to the Group CIO and senior decision-makers. • Responsibility across the build, with the opportunity to influence the technology choices and engineering approach. • A proper budget for the development tools and technology needed to do the job well. • The opportunity to develop expertise in specialist insurance and build technology around the way brokers and clients work. • A family-owned international business with short decision-making lines and offices across Europe and Australia. Additional Information - Please send your application to karriere@duboisgroup.com. - Dubois Versicherungsmakler GmbH Bahnstraße 9 40212 Düsseldorf, Germany +49 (0) 211 210210-0 duboisgroup.com - We welcome applications from all qualified candidates regardless of origin, gender, age, disability, religion or sexual identity.", "skills": [], "employment_type": "Vollzeit", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 37.2, "matched_skills": ["english", "german"], "missing_skills": ["artificial intelligence", "azure", "infrastructure as code"], "also_on": [], "query": "software developer", "id": "dc6546ef79c9", "extra": {"via": "Stepstone", "semantic": 0.29, "score_confidence": "high"}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Oracle Developer", "company": "Powered Recruitment Pty", "url": "https://www.adzuna.com.au/details/5903339987?utm_medium=api&utm_source=28f9775f", "country": "AU", "location": "Australian Capital Territory, Australia", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T12:45:54+00:00", "posted_raw": "2026-09-30T12:45:54Z", "salary": "", "snippet": "Job Description: Description Oracle developer to work in an agile team. Tasks include but are not limited to: · Engage with stakeholders to define work packages/technical requirements for sprint planning. · Design and implement maintainable solutions · Provide and accept constructive feedback in code reviews · Contribute to a positive collaborative team culture Essential Criteria A high level of s", "description": "", "skills": [], "employment_type": "permanent", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 37.0, "matched_skills": ["agile", "code review"], "missing_skills": ["oracle"], "also_on": [], "query": "software developer", "id": "55c273c0b23c", "extra": {"semantic": 0.119, "score_confidence": "medium"}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Medior AI-Assisted Software Engineer / Consultant - Port Logistics", "company": "CGI", "url": "https://www.adzuna.nl/details/5904119615?utm_medium=api&utm_source=28f9775f", "country": "NL", "location": "Nederland", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T18:57:21+00:00", "posted_raw": "2026-09-30T18:57:21Z", "salary": "1,396 - 1,396", "snippet": "CGI Netherlands - Welkom bij CGI – Leer ons kennen in 90 seconden By playing this video you consent to Google/YouTube processing your data and using cookies – Learn more . Position Description: Please note: Due to mandatory screening requirements, we are currently only considering EU nationals who are already based in the Netherlands and fluent in Dutch. Wil jij met AI-ondersteunde softwareontwikk", "description": "CGI Netherlands - Welkom bij CGI – Leer ons kennen in 90 seconden By playing this video you consent to Google/YouTube processing your data and using cookies – Learn more. Position Description: Please note: Due to mandatory screening requirements, we are currently only considering EU nationals who are already based in the Netherlands and fluent in Dutch. Wil jij met AI-ondersteunde softwareontwikkeling bijdragen aan efficiënte, veilige en duurzame logistieke processen in havens en supply chains? Kun jij prototypes vertalen naar betrouwbare applicaties en neem je verantwoordelijkheid voor de kwaliteit van gegenereerde code? Dan is deze rol bij CGI iets voor jou. Jouw rol in ons team Als Medior AI-Assisted Software Engineer / Consultant ben je zelfstandig verantwoordelijk voor het ontwikkelen, beoordelen en productierijp maken van software binnen het Ports & Logistics-domein. Je werkt met Product Owners, architecten en engineers aan oplossingen voor onder andere terminaloperaties, planning, ketenintegratie en data-uitwisseling. Daarbij combineer je consultancy- en engineeringervaring met aantoonbare praktijkervaring in AI-ondersteunde softwareontwikkeling. Je gebruikt goedgekeurde AI-codeassistenten, ontwikkelomgevingen en workspaces voor requirements, codegeneratie, refactoring, tests en documentatie, uitsluitend met toegestane context en data. Je vertaalt prototypes naar onderhoudbare ontwerpen en maakt bedrijfsregels, afhankelijkheden en technische keuzes expliciet. Binnen de Enterprise AI Application Landing Zone werk je aan domeingerichte oplossingen, met API's als uitgangspunt en aandacht voor events. Je beoordeelt gegenereerde code, afhankelijkheden en beveiligingsgevoelige logica op kwaliteit, testbaarheid, complexiteit, intellectueel eigendom en ongedocumenteerde afhankelijkheden. Je werkt met repositories van de organisatie, branches, pull requests, peer reviews en herleidbare goedkeuringen voor samenvoeging van code. Ook review je het werk van collega's en richt je CI/CD-kwaliteitscontroles in voor geautomatiseerde tests, statische codeanalyse, afhankelijkheden, beveiliging en builds. Je borgt identiteits- en toegangsbeheer, secrets management, privacy, data-eigenaarschap, logging, controleerbaarheid en gecontroleerde integraties vanaf het ontwerp. Met architectuur, security en operations draag je bij aan AI App Intake, risicoclassificatie, beslismomenten, niet-functionele eisen en criteria voor pilots en productie. Je levert monitoring, deploymentdocumentatie, runbooks en supportinformatie op, draagt kennis over en begeleidt junior engineers. Hoe jij ons team versterkt Je werkt zelfstandig en gestructureerd en voelt je verantwoordelijk voor het geheel. Je maakt technische keuzes inzichtelijk, neemt stakeholders daarin mee en helpt junior collega's verder. Dit ben jij: • Hbo- of wo-werk- en -denkniveau, bij voorkeur in Software Engineering, Informatica, Computer Science, Artificial Intelligence of een vergelijkbare richting • Minimaal vijf jaar relevante ervaring als IT-consultant, waarvan een substantieel deel in professionele softwareontwikkeling of het realiseren van IT-oplossingen binnen complexe omgevingen • Aantoonbare early-adopterervaring met generatieve AI via opdrachten, pilots, communities of eigen toepassingen; de ervaringseis van vijf jaar betreft consultancy en softwareontwikkeling • Sterke programmeervaardigheden in één of meer talen, zoals Python, TypeScript/JavaScript, C#, Java of een vergelijkbare technologieomgeving • Ruime ervaring met Git, pull requests, code reviews, CI/CD en geautomatiseerd testen; ervaring met Infrastructure as Code is een pré • Kennis van cloud-native architectuur, API's, events, containers of serverless runtimes, identiteitsbeheer, secrets management en observability • Het vermogen om AI-gegenereerde code zelfstandig te beoordelen op onderhoudbaarheid, beveiliging, testbaarheid, herleidbaarheid, overdraagbaarheid tussen omgevingen en beheerbaarheid • Ervaring met veilige softwareontwikkeling, afhankelijkheden- en kwetsbaarhedenbeheer, privacy, logging, auditing en niet-functionele eisen • Ervaring met minimaal één enterprise-cloudplatform; ervaring met Microsoft Azure, Azure DevOps of GitHub is een pré • Sterke consultancy- en communicatieve vaardigheden en het vermogen om junior engineers te begeleiden Pré: ervaring met of affiniteit voor het Ports, Logistics, Maritime of Supply Chain-domein. Waar kom je terecht Je komt te werken binnen een CGI-unit gericht op Ports & Logistics, met sterke binding aan onder andere de Rotterdamse havenregio. Je werkt aan de modernisering en doorontwikkeling van bestaande systemen en aan nieuwe oplossingen die cruciaal zijn voor logistieke ketens en integratie tussen partijen. Binnen Ports & Logistics combineren we diepgaande domeinkennis met technologische expertise om kritieke processen in havens en supply chains te digitaliseren en te verbeteren. AI & Futureproof Binnen CGI kijken we continu naar de impact van nieuwe technologieën op onze dienstverlening en de oplossingen die we voor onze klanten ontwikkelen. Ook ontwikkelingen op het gebied van AI en automatisering spelen hierin een steeds grotere rol. Bevat de applicatie zelf AI-functionaliteit, dan implementeer je gecontroleerde modeltoegang, beveiliging van prompts en context, evaluatiesets, uitvoervalidatie, monitoring en menselijk toezicht. Waarom CGI CGI is één van 's werelds grootste IT-consultancy bedrijven. Onze mensen houden Nederland draaiende. Overheidsinstellingen, banken, lucht- en ruimtevaart, infrastructurele organisaties en energie-, transport- en productiebedrijven zijn klanten van CGI. We werken aan interessante projecten die het alledaagse leven van miljoenen mensen raken. We zijn regionaal aanwezig, versterkt met wereldwijde domeinkennis, ons ecosysteem en collega's verspreid over de hele wereld. We zijn trots op de impactvolle projecten die we samen met onze collega’s tot een succes maken. Bij CGI hechten we veel waarde aan diversiteit en inclusie, omdat dit niet alleen de samenwerking bevordert, maar ook vaak leidt tot betere resultaten. We kijken uit naar jouw bijdrage aan ons team! Werken in kleine zelfsturende teams bestaande uit experts in je vakgebied. Bij CGI combineren we uitdagende projecten met uitstekende arbeidsvoorwaarden: • Werken aan systemen met directe impact op internationale logistiek en havenoperaties; • Projecten met hoge complexiteit en eisen aan betrouwbaarheid en beschikbaarheid; • Regie over je eigen carrière, met ruime mogelijkheden voor technische verdieping of doorgroei richting architectuur of leiderschap; • Werken met moderne technologieën binnen uitdagende IT-landschappen; • Direct een vast dienstverband; • Mogelijkheden om parttime te werken; • Een concurrerend salaris passend bij jouw senioriteit; • 8% vakantiegeld; • Bonus- en winstdelingsregeling; • 20 wettelijke en 5 bovenwettelijke vakantiedagen (op basis van fulltime); • Leasebudget / mobiliteitsbudget; • NS Business Card; • Fietsplan via CGI; • 3% mogelijkheid om te sparen in CGI-aandelen; • De mogelijkheid om mede-eigenaar van CGI te worden; • Zorgverzekeringsvergoeding van €116,35 bruto per maand; • €40 netto thuiswerkvergoeding per maand; • Goede pensioenregeling; • Hybride werken. Sluit je aan bij ons team van experts en solliciteer direct! We nemen dan zo snel mogelijk contact met je op! Heb je nog vragen over de inhoud van de vacature, stel ze aan Director Consulting Services, Sebastiaan van Hengel via sebastiaan.van.hengel@cgi.com of +31 6 21 89 82 49. Vragen over de sollicitatieprocedure? neem contact op met Recruitment Business Partner, Ferhun Dogan via ferhun.dogan@cgi.com of +31 6 11484743. We werken niet samen met externe recruitment bureau’s. Acquisitie wordt daarom niet op prijs gesteld. #LI-FD6 What you can expect from us: Together, as owners, let’s turn meaningful insights into action. In 1976 opgericht als een familiebedrijf, is CGI vandaag de dag een van de grootste onafhankelijke zakelijke en ICT-dienstverleners ter wereld. Bij ons draait het om ownership, teamwork en respect. Je krijgt de ruimte om al je talenten volledig te ontplooien. Vanaf je eerste werkdag ben je mede-eigenaar van CGI. We profiteren samen van ons succes en je krijgt de kans én verantwoordelijkheid om actief bij te dragen aan de koers en strategie van ons bedrijf. Jouw inzet voegt waarde toe. Je werkt aan innovatieve oplossingen en bouwt aan je netwerk van collega's en klanten. Je hebt toegang tot wereldwijde kansen om je ideeën te realiseren, mogelijkheden te benutten en te profiteren van onze kennis van de industrie en technologische expertise. Ontdek bij ons de mogelijkheden voor jouw persoonlijke ontwikkeling en zet de volgende stap in je carrière. Hier staat jouw succes centraal!", "skills": [], "employment_type": "['Full Time']", "exp_min": null, "exp_max": null, "seniority": "mid", "fit": "fit", "relevance": 1.0, "score": 36.8, "matched_skills": ["ci/cd", "typescript", "javascript", "c#", "java", "code review", "observability"], "missing_skills": ["artificial intelligence", "dutch", "logging", "monitoring", "refactoring", "python", "git", "infrastructure as code"], "also_on": [], "query": "software engineer", "id": "54badf7b2d2b", "extra": {"details_fetched": true, "semantic": 0.29, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Software Developer Intranet", "company": "Bundesdruckerei-Gruppe", "url": "https://www.linkedin.com/jobs/view/4473770833", "country": "DE", "location": "Berlin, Berlin, Germany", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T14:13:19.978841+00:00", "posted_raw": "8 hours ago", "salary": "", "snippet": "", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 36.3, "matched_skills": [], "missing_skills": [], "also_on": [], "query": "software developer", "id": "li4473770833", "extra": {"linkedin_id": "4473770833", "semantic": 0.275, "score_confidence": "low"}}, {"source": "arbeitnow", "source_name": "Arbeitnow", "title": "Product Engineer (Backend/AI) @Briink", "company": "Merantix", "url": "https://www.arbeitnow.com/jobs/companies/merantix/product-engineer-backend-ai-at-briink-berlin-497158", "country": "DE", "location": "Berlin", "remote": false, "posted": "2026-09-30", "posted_at": "2026-09-30T20:09:07+00:00", "posted_raw": 1790798947, "salary": "", "snippet": "What we do At Briink , we’re building AI technology for the global sustainability economy. We work with the world’s largest climate organizations, including CDP and PRI, and multinational companies such as Bayer, Siemens, Commerzbank, E.ON, and Heidelberg Materials. Our technology helps automate how sustainability data is collected, analyzed, verified, and acted on. Through our work with global cl", "description": "What we do At Briink , we’re building AI technology for the global sustainability economy. We work with the world’s largest climate organizations, including CDP and PRI, and multinational companies such as Bayer, Siemens, Commerzbank, E.ON, and Heidelberg Materials. Our technology helps automate how sustainability data is collected, analyzed, verified, and acted on. Through our work with global climate organizations, what you build at Briink will directly impact the sustainability workflows of more than 30,000 companies, investors, and cities worldwide. We’re a small team working at enormous scale. Your code won’t sit behind an internal tool or an experimental demo — it will help shape how some of the world’s largest organizations understand and act on their environmental impact. Based at Berlin’s AI Campus, with a second office in London, and backed by over €7 million in funding, we want to prove that some of the world’s most powerful technology can also be a powerful force for good. Application requirement: Intro video As part of your application, please submit a short intro video (max 2 minutes) answering: Who you are and what you have done/built that is relevant for this role. Why you’re excited about owning and shipping AI-powered products at Briink. Why Briink’s sustainability mission resonates with you. Upload your video using this form (YouTube unlisted, Loom, or any other solution is fine). We do this to get a better sense of candidates before continuing the process. Any application without a video will not be considered ;) Your role As Briink’s Backend/AI Product Engineer , you’ll join a small, high-ownership product and engineering team building AI-powered products for sustainability professionals. This is not a narrowly scoped backend role. You’ll take meaningful product problems from initial discovery and user conversations through technical design, implementation, and iteration to deploy them at scale across the ESG market. You’ll combine strong backend and AI/LLM engineering with product judgement and the initiative to work out what should be built - not just how to action a predefined ticket. You will: Own product features end to end , from understanding the user problem and defining the right approach through to delivery, measurement, and improvement. Design and build scalable backend systems , including APIs, data models, workflows, and infrastructure for complex enterprise products. Build and ship applied AI/LLM features , such as LLM chains, RAG systems, tool-using agents, structured-output pipelines, and evaluation workflows Create reusable, extensible platform building blocks that support multiple user journeys and reporting workflows rather than solving each problem in isolation. Improve the robustness of our systems , strengthening reliability, testing, observability, performance, and maintainability as we scale. Work directly with users, product, and data , using qualitative feedback and product data to understand the real problem and evaluate whether a solution works. Prototype and test new AI capabilities , turning promising ideas into practical product improvements that accelerate our roadmap. Bring thoughtful opinions and constructive challenge , helping the team make better product and technical decisions. Collaborate closely with other engineers , including through pair programming, technical design discussions, and shared problem-solving. Your profile Technical requirements Strong professional backend engineering experience , with a track record of designing and shipping reliable production systems. Experience in a small, high-ownership product team , ideally within a startup or scale-up engineering organisation of roughly 5–20 engineers. Evidence that you have shipped meaningful products end to end , rather than owning only a narrow component within a much larger organisation. Strong experience in Python (or another modern backend language such as Java, Ruby, or TypeScript, combined with the ability and willingness to become productive in Python quickly). Strong API, database, and systems design skills , with the ability to model complex workflows and build maintainable foundations for enterprise products. Applied AI/LLM experience : you have experience or a strong interest in LLM-powered features, ideally involving RAG or retrieval, tool use, agents, structured outputs, or evaluation systems. A solid software-quality mindset , including testing, code review, CI/CD, observability, and pragmatic approaches to reliability and security. Cloud and container experience , with an understanding of how to deploy, operate, and scale production workloads. Fluent English (C1+) , both written and spoken. Nice to have Experience building workflow, reporting, questionnaire, or other complex B2B SaaS products . Familiarity with backend technologies such as FastAPI, PostgreSQL, background queues Any experience with LangChain, LangSmith, or other LLM frameworks Deeper experience with RAG, retrieval, agents, LLM evaluation, and production AI systems . Experience improving latency, cost, and reliability for AI workloads. Knowledge of ESG, sustainability, climate tech, or corporate reporting . German language skills. Who you are Kind and collaborative : You treat people well, communicate clearly, and help create a supportive, low-ego team environment. Mission-driven : You care about using technology to accelerate sustainability and climate action. Sharp and curious : You learn quickly, ask good questions, and enjoy getting to the root of difficult product and technical problems. A product-minded builder : You think beyond the task in front of you, focus on the user’s real problem, and care about whether what you ship creates value. Highly self-directed : You thrive in a fast-moving environment with 88", "country": "JP", "location": "Tokyo, Japan", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T16:12:56.072232+00:00", "posted_raw": "6 hours ago", "salary": "", "snippet": "About Woven By Toyota Woven by Toyota is enabling Toyota’s once-in-a-century transformation into a mobility company. Inspired by a legacy of innovating for the benefit of others, our mission is to challenge the current state of mobility through human-centric innovation — expanding what “mobility” means and how it serves society. Our work centers on four pillars: AD/ADAS, our autonomous driving and", "description": "About Woven By Toyota Woven by Toyota is enabling Toyota’s once-in-a-century transformation into a mobility company. Inspired by a legacy of innovating for the benefit of others, our mission is to challenge the current state of mobility through human-centric innovation — expanding what “mobility” means and how it serves society. Our work centers on four pillars: AD/ADAS, our autonomous driving and advanced driver assist technologies; Arene, our software development platform for software-defined vehicles; Woven City, a test course for mobility; and Cloud & AI, the digital infrastructure powering our collaborative foundation. Business-critical functions empower these teams to execute, and together, we’re working toward one bold goal: a world with zero accidents and enhanced well-being for all. ========================================================================= TEAM The Enterprise AI team is dedicated to empowering Toyota and its affiliates with a robust platform for AI innovation. Our mission is to provide a comprehensive, end-to-end machine learning ecosystem that propels the development of groundbreaking projects, such as autonomous driving, within the Toyota Group. As a standardized machine learning platform under Woven by Toyota, we aim to streamline every facet of AI development, from training and inference to MLOps, thereby enhancing the safety, convenience, and autonomy of Toyota vehicles. Within this dynamic environment, the Data Platform Engineering team plays a pivotal role. We design and implement scalable, globally distributed data delivery solutions tailored for Toyota and its partners. Our team is at the forefront of developing both human-assisted and automated data labeling services, and we engage collaboratively across various model development and AI solution initiatives. Through these efforts, we ensure that data is not only accessible but also actionable, driving innovation and efficiency across the enterprise. WHO ARE WE LOOKING FOR? As a Software Engineer, you will help develop the platform that enables creation and management of labeled datasets while working with seasoned engineers in various fields, such as Software Engineers, ML Engineers, Data Scientists, delivering and maintaining software for data distributed across different regions. Expect large datasets, shipping them globally. We aim to change data acquisition and delivery of human/machine-labeled data to expedite development of machine learning projects. You will have both technical and communicational skills. As a part of the team, you are a believer in healthy, constructive, and optimistic feedback, as we encourage each other to improve our development practices; refactoring, rewriting legacy code, profiling, code style, and code reviews. Responsibilities Design, implement, and deploy features from inception to completion Help solve complex problems, deliver state of the art solutions Collaborate with the team lead and software engineers to develop the backend of labeling suites, ensuring both functional and non-functional requirements of the product are met Enable support for multiple machine learning training data formats and facilitate on-the-fly conversions Integrate with various data sinks, including machine learning data visualization solutions, to manage datasets owned by the Data Annotations Engineering team Work closely with frontend developers to establish and maintain API contracts Report directly to the manager overseeing the Data Annotation Engineering team Minimum Qualifications A minimum of 4 years of experience in Python development, with at least 2 year dedicated to asynchronous Python programming, and a foundational understanding of machine learning Proficiency in working with large datasets, including databases with extensive rows or documents, and a solid grasp of concurrency, distributed computing, and blob storage Familiarity with event-driven architectures utilizing multiple message queues (channels) Knowledge of major RDBMS and NoSQL databases, such as PostgreSQL and MongoDB Hands-on experience with Kubernetes Ability to work in the office 3 days per week in accordance with our hybrid work model Proficiency in English at a business level NICE TO HAVES Contributions to open-source projects and the ability to analyze open-source software Familiarity with spatial/geometry information or experience with vector databases Experience with PyTorch data loaders and working with 2D/3D-based machine learning training data formats Understanding of machine learning, with a focus on deep learning Knowledge of image and point cloud processing techniques Proficiency in one or more programming languages commonly used in machine learning or massively parallel computing environments ========================================================================= Important Points ・All interviews will be arranged via Google Meet, unless otherwise stated. ・The same job descriptions are available in both English and Japanese; therefore, we kindly ask that you apply to only one version. ・We kindly request that you submit your resume in English, if possible. However, Japanese resumes are also acceptable. Please note that, depending on the English proficiency requirements of the role, we may request an English version of your resume later in the process. What We Offer ・Competitive Salary - Based on experience ・Work Hours - Flexible working time ・Paid Holiday - 20 days per year (prorated) ・Sick Leave - 6 days per year (prorated) ・Holiday - Sat & Sun, Japanese National Holidays, and other days defined by our company ・Japanese Social Insurance - Health Insurance, Pension, Workers’ Comp, and Unemployment Insurance, Long-term care insurance ・Housing Allowance ・Retirement Benefits ・Rental Cars Support ・In-house Training Program (software study/language study) Our Commitment ・We are an equal opportunity employer and value diversity. ・Any information we receive from you will be used only in the hiring and onboarding process. Please see our privacy notice for more details.", "skills": [], "employment_type": "Full-time", "exp_min": 4.0, "exp_max": null, "seniority": "", "fit": "stretch", "relevance": 1.0, "score": 34.1, "matched_skills": ["english", "code review", "concurrency", "postgresql", "vector databases"], "missing_skills": ["machine learning", "artificial intelligence", "japanese", "python", "mlops", "platform engineering", "refactoring", "event-driven"], "also_on": [], "query": "software developer", "id": "li4445493288", "extra": {"linkedin_id": "4445493288", "seniority_level": "Not Applicable", "details_fetched": true, "semantic": 0.279, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "CFD software enginner", "company": "Cadence", "url": "https://www.linkedin.com/jobs/view/4463542378", "country": "JP", "location": "Osaka, Japan", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T19:13:05.554252+00:00", "posted_raw": "3 hours ago", "salary": "", "snippet": "At Cadence, we hire and develop leaders and innovators who want to make an impact on the world of technology. Overview We are seeking a talented CFD Software Development Engineer to join our CFD R&D team in Japan. This role focuses on the development and enhancement of next-generation GPU accelerated CFD simulation technologies which also include AI assisted simulation methods. The successful cand", "description": "At Cadence, we hire and develop leaders and innovators who want to make an impact on the world of technology. Overview We are seeking a talented CFD Software Development Engineer to join our CFD R&D team in Japan. This role focuses on the development and enhancement of next-generation GPU accelerated CFD simulation technologies which also include AI assisted simulation methods. The successful candidate will contribute to solver development and helping evolve the product toward modern AI-enabled engineering workflows. This position offers a unique opportunity to work at the intersection of computational physics, high-performance computing, and AI-assisted engineering systems. Responsibilities In the context of CFD Solver Development, you will do Design, implement, and maintain CFD solver capabilities on GPU platforms. Investigate and resolve complex technical issues reported by customers and internal teams. Develop and maintain AI-ready product and services. Design structured APIs and tool interfaces that enable AI systems to interact with simulation products safely and effectively. Build software components that expose product functionality to AI agents and intelligent workflows. Support integration of simulation technologies into modern AI ecosystems. Contribute to the adoption of AI-native software engineering practices across the product portfolio. Participate in architecture discussions and long-term platform evolution. Develop automated testing, validation, and CI/CD workflows. Produce high-quality, maintainable, and well-documented software. Collaborate effectively across geographically distributed teams. Required Qualifications PhD in: Mechanical Engineering, Aerospace Engineering, Applied Mathematics, Computational Science, Artificial Intelligence, or a related discipline Strong software development skills in: C++ and Python. One of GPU computing languages such as CUDA, OpenCL, OpenACC, OpenMP offloadin ion et la maintenance des rôles et profils d'autorisations SAP.<\/li> <li><strong>Support utilisateurs<\/strong> : Traiter les demandes d'accès et de support liées aux autorisations SAP en veillant au respect de la qualité de service.<\/li> <li><strong>Projets SAP Access<\/strong> : Contribuer aux projets transversaux liés à la gouvernance et au déploiement des accès applicatifs.<\/li> <li><strong>Transition S/4HANA<\/strong> : Participer aux chantiers stratégiques d'autorisations liés à la migration vers S/4HANA et au contrôle des accès critiques.<\/li> <li><strong>Sécurité & Conformité<\/strong> : Assister à l'application des règles de sécurité des SI et aux contrôles de séparation des pouvoirs (Segregation of Duties).<\/li> <\/ul> <h4><strong>CE QUE TU APPORTES<\/strong><\/h4> <ul> <li>Tu prépares un diplôme de niveau <strong>Master (Bac+4/Bac+5)<\/strong> en École d'ingénieur ou Université avec une spécialisation en informatique, SI ou cybersécurité.<\/li> <li>Tu as une véritable <strong>curiosité pour l'écosystème SAP<\/strong> et les enjeux d'architecture logicielle.<\/li> <li>Tu possèdes une première compréhension ou un intérêt marqué pour la <strong>gestion des accès, la sécurité des données et la conformité<\/strong>.<\/li> <li>Tu maîtrises l'<strong>anglais professionnel<\/strong> (oral et écrit) pour évoluer aisément dans notre environnement international.<\/li> <li>Tu fais preuve de rigueur, d'un esprit logique et d'une bonne capacité de communication.<\/li> <\/ul> <h4><strong>STACK TECHNIQUE<\/strong><\/h4> <ul> <li>SAP ECC / SAP S/4HANA (Gestion des autorisations : PFCG, SU24, SU53)<\/li> <li>SAP GRC Access Control / Identity Access Solutions<\/li> <li>Ticketing & Collaboration : ServiceNow, JIRA<\/li> <\/ul> <h4><strong>CE QUE NOUS T’OFFRONS<\/strong><\/h4> <p>Chez Decathlon, nous mettons un point d’honneur à offrir un cadre de travail épanouissant et motivant.<\/p> <p>🚀 <strong>Un environnement de travail stimulant<\/strong> : entreprise certifiée <s xpertise et notre engagement en matière de recherche et développement. Nous recherchons notre prochain Ingénieur Electronique (H/F) sur notre agence de Bron (69) ou au siège à Veyras (07). VOTRE MISSION : Au sein du Département Recherche et Développement, votre mission sera d'imaginer et de concevoir l'électronique des produits d'aujourd'hui et de demain, en assurant leur fiabilité, leur performance et leur conformité aux exigences techniques et réglementaires. VOTRE QUOTIDIEN : Conception et développement : Rédaction de spécifications techniques et de cahiers des charges. Conception de cartes électroniques (architecture, schématique, routage) en intégrant les contraintes d'industrialisation, des processus de production, mécaniques, environnementales et normatives (CEM, sécurité électrique, Ex et ML). Programmation des drivers bas niveau et de firmwares de tests. Validation fonctionnelle et qualification des prototypes. Contribution à l'élaboration des plannings de développement. Recherche et développement : Participation à des projets d'innovation dans l'objectif de concevoir l'électronique de nouveaux produits, d'ajouter de nouvelles fonctionnalités, d'améliorer les performances, de réduire les coûts des produits existants. Traitement du signal et conception analogique du conditionnement des signaux capteurs. Veille technologique et réglementaire. Support technique : Participation à la vie du laboratoire (besoins matériels et consommables, suivi des instruments de mesure...). Support aux essais environnementaux. Garant du respect des exigences réglementaires produits. Implication active au SMQ du département R&D. Investigation technique des retours clients et terrain. Des déplacements sont à prévoir en France et à l'étranger (5-6 fois par an). VOTRE PROFIL : Première expérience professionnelle dans le secteur industriel (0 à 2 ans) Connaissances en électronique analogique et numérique Compétences en simulation, tests et diagnostics Programmation (langages C / C++). Connaissances en informatique industrielle, notamment sur les bus et interfaces : I2C, SPI, UART, RS485, etc. Maîtrise des outils de CAO électronique, tels qu’Altium Designer. Compétences en analyse de données et traitement du signal Bonne connaissance des normes de sécurité électrique et de compatibilité électromagnétique (CEM) Familiarité avec les contraintes liées aux standards ATEX / IECEx Anglais professionnel : maîtrise à l’écrit et à l’oral (niveau B2 minimum). Savoir-être : Rigueur, curiosité technique et autonomie Capacité à résoudre des problèmes complexes avec méthode et créativité Bon relationnel et sens du travail en équipe Find Jobs in France on Arbeitnow", "skills": ["Recherche & Développement"], "employment_type": "Entry, fulltime permanent", "exp_min": 2.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "relevance": 0.7, "score": 33.0, "matched_skills": ["c"], "missing_skills": ["machine learning", "c++"], "also_on": [], "query": "", "id": "720711ffd4d6", "extra": {"semantic": 0.189, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Senior Digital Design Engineer for ASIC Development", "company": "Murata", "url": "https://www.linkedin.com/jobs/view/4472171821", "country": "FI", "location": "Vantaa, Uusimaa, Finland", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T13:13:16.684061+00:00", "posted_raw": "9 hours ago", "salary": "", "snippet": "Take digital ASIC designs from early concepts all the way to mass production. We are strengthening our ASIC Design Team at Murata Finland and are looking for a Senior Digital Design Engineer to join us in Vantaa, Finland. We work in a hybrid model, so partial remote work is possible. Murata Finland develops leading-edge gyroscope and accelerometer safety-critical sensors for global automotive, ind", "description": "Take digital ASIC designs from early concepts all the way to mass production. We are strengthening our ASIC Design Team at Murata Finland and are looking for a Senior Digital Design Engineer to join us in Vantaa, Finland. We work in a hybrid model, so partial remote work is possible. Murata Finland develops leading-edge gyroscope and accelerometer safety-critical sensors for global automotive, industrial and healthcare markets. We design full-custom mixed-mode ASICs from concept to volume production, including wafer-level testing. Your role As a Senior Digital Design Engineer, you will work on digital ASIC design from early concept development through to mass production ramp-up . You will collaborate with design partners, Murata lead engineers, product managers and the design team throughout the development process. What you bring We are looking for an experienced digital design professional with: Technical education (e.g. B.Sc., M.Sc., Ph.D. or D.Sc.) with an emphasis on digital microelectronics 3+ years of experience in digital design Experience in Verilog (or VHDL) RTL coding Experience in design verification using digital design tools Understanding of the RTL-to-GDSII flow A proactive, systematic and careful way of working Fluent communication skills in English Good communication skills and the ability to understand various requirements and communicate effectively with external partners and internal teams An innovative mindset and interest in working in an international environment Additional experience we value Experience in any of the following areas is considered an advantage: Architecture planning and functional specification Implementation of DSP algorithms, such as FIR or IIR filters and floating-point MAC (Multiply and Accumulate) calculations Digital interfaces: SPI, I2C, I3C or PSI5 Test bench reference models using e.g. Matlab, Simulink or Python Verification environments: UVM (Universal Verification Methodology) based on SV (SystemVerilog) or CocoTB (Coroutine cosimulation testbench) based on Python ATPG (Automatic Test Pattern Generation) and LBIST (Logic Built-In Self-Test) FPGA, e.g. as a development environment, for customer emulator use or test support Digital backend design, including synthesis, timing analysis, DFT, layout and power analysis How we work Our culture is based on two values: employee satisfaction and customer satisfaction . Together, we have defined what these values mean in practice in what we call our cultural etiquette. For us, employee satisfaction means helping each other, treating each other equally and in a friendly manner, and maintaining an open discussion culture. Customer satisfaction means being proactive and innovative and considering our customers’ needs in what we do. Would this kind of work community suit you? Small technology, real-world impact We believe that the tiniest things can have the greatest impact. With our innovative sensor technology, cars remain in their lanes, people’s hearts keep beating and bridges do not collapse. In this role, you will have the opportunity to work with cutting-edge technology that contributes to the advancement of society. The combination of our Finnish and Japanese capabilities will enable safe and autonomous driving – in all places. Interested? For more information, please contact the hiring manager Teemu Salo tel. +358 50 327 8984 or e-mail teemu.salo@murata.com, who will be happy to tell you more about Murata and the position. Please send your application, resume and salary expectations by 18 October 2026 via the application link. The position will be filled as soon as a suitable candidate is found. Read more about Murata at www.muratafinland.com and follow us in LinkedIn (Murata), Instagram (@muratafinland) and Facebook (@MurataFinland). From our News & Stories, you can read more about what it's like to work at Murata and find out if Murata is the right workplace for you! You can read about the different teams, the study and career path opportunities, as well as how development and growth appear at Murata, from product development to production work. Research MEMS Semicondu escription": "<div class=\"content-intro\"><p>GitLab is the intelligent orchestration platform for DevSecOps. GitLab enables organizations to increase developer productivity, improve operational efficiency, reduce security and compliance risk, and accelerate digital transformation. More than 50 million registered users and more than 50% of the Fortune 100* trust GitLab to ship better, more secure software faster.<\/p> <p>The same principles built into our products are reflected in how our team works: we embrace AI as a core productivity multiplier, with all team members expected to incorporate AI into their daily workflows to drive efficiency, innovation, and impact. GitLab is where careers accelerate, innovation flourishes, and every voice is valued. Our high-performance culture is driven by our values and continuous knowledge exchange, enabling our team members to reach their full potential while collaborating with industry leaders to solve complex problems. <a href=\"https://www.youtube.com/watch?v=OuZIb5zszQI\">Co-create the future with us<\/a> as we build technology that transforms how the world develops software.<\/p> <p>*<em>Fortune 500® is a registered trademark of Fortune Media IP Limited, used under license. Claim based on GitLab data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500 list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated with, and do not endorse products or services of GitLab.<\/em><\/p><\/div><h2><strong>Staff Forward Deployed Engineer, Agentic SDLC - (EMEA Only)<\/strong><strong><br><\/strong><strong><br><\/strong><strong>An overview of this role<\/strong><\/h2> <p>GitLab’s Forward Deployed Engineering team is a field-situated product engineering function focused on strategic customer outcomes, artificial intelligence (AI) adoption, and direct contributions to GitLab’s product. This isn't a traditional field engineering, solutions architecture, or professional services role. As a Staff Forward Deployed Engineer, you'll work closely with customers while maintaining the technical standards and contribution discipline of a Staff-level product engineer.<\/p> <p>You'll work where strategic customer urgency, complex technical ambiguity, and GitLab product execution intersect. You'll partner directly with strategic customers and teams across Product, Engineering, Support, Site Reliability Engineering (SRE), Solutions Architecture (SA), Customer Success Architecture (CSA), Customer Success Management (CSM), and Professional Services. You'll diagnose and resolve high-impact adoption blockers, contribute production-quality fixes and features, and turn what you learn into repeatable patterns for GitLab and its customers.<\/p> <h2><strong>Why this role exists<\/strong><\/h2> <p>Strategic customers sometimes encounter challenges that are too broad, deep, urgent, or cross-functional for any single team to own from start to finish. These challenges may involve product gaps, performance degradation, scale bottlenecks, AI governance, adoption blockers, architectural constraints, Git usage patterns, continuous integration and continuous delivery (CI/CD) complexity, application programming interface (API) automation, security requirements, or operational instability.<\/p> <p>Forward Deployed Engineering provides technical stewardship in these moments. The team doesn't simply observe, report, or escalate. You'll engage directly, diagnose the underlying technical problem, collaborate with the right teams, contribute code or technical solutions where appropriate, and transition the outcome into normal ownership once the customer is stable and the learning can be reused.<\/p> <h2><strong>What you’ll do<\/strong><\/h2> <h3><strong>Product contribution<\/strong><\/h3> <ul> <li>Contribute production-quality code to GitLab’s product and adjacent systems.<\/li> <li>Develop bug fixes, features, integrations, tooling, and performance improvements when strategic customer outcomes require direct engineering work.<\/li> <li>Work within GitLab’s product and engineering processes, including issue discovery, merge request creation, testing, review, documentation, and maintainability.<\/li> <li>Partner with Product and Engineering so customer-driven solutions support long-term product direction rather than becoming one-off customizations.<\/li> <li>Turn blockers discovered in the field into durable product improvements, reference architectures, documentation, and repeatable implementation patterns.<\/li> <\/ul> <h3><strong>Strategic technical stewardship<\/strong><\/h3> <ul> <li>Engage with strategically important customers when adoption, retention, executive confidence, or public trust is materially at risk.<\/li> <li>Diagnose complex problems across GitLab product behavior, customer architecture, Git internals, CI/CD workflows, API usage, observability, infrastructure, networking, and cloud environments.<\/li> <li>Coordinate across Product, Engineering, SRE, Support, SA, CSA, CSM, Professional Services, and customer technical teams to drive resolution from discovery through handoff.<\/li> <li>Provide recommendations grounded in data, traces, and systems analysis to improve GitLab usage, workflows, automation, and architecture.<\/li> <li>Create durable outcomes without establishing permanent dependency on Forward Deployed Engineering.<\/li> <\/ul> <h3><strong>AI adoption and agentic software development lifecycle<\/strong><\/h3> <ul> <li>Drive governed, measurable, and production-oriented adoption of GitLab Duo Agent Platform with strategic customers.<\/li> <li>Identify and resolve AI adoption blockers involving governance, usage controls, auditability, security, compliance, operating models, workflow design, and integrations.<\/li> <li>Develop customer-safe adoption patterns for the agentic software development lifecycle (SDLC), AI-assisted development, intent-based review, AI governance, and human-in-the-loop software delivery.<\/li> <li>Partner with Product, Engineering, Field, and Customer Success teams to turn AI adoption learning into reusable guidance and product improvements.<\/li> <\/ul> <h3><strong>Thought leadership<\/strong><\/h3> <ul> <li>Create technical narratives grounded in customer experience and product reality that can help shape the industry’s approach.<\/li> <li>Contribute to Well-Architected Frameworks, whitepapers, webinars, reference architectures, technical strategy memos, and adoption frameworks.<\/li> <li>Guide ideas through discovery, formulation, validation, amplification, and adoption across GitLab.<\/li> <li>Partner with SA, CSA, Product, Engineering, Marketing, Product Marketing Management, CSM, Support, and executive stakeholders to make technical thought leadership a shared company capability.<\/li> <\/ul> <h2><strong>What you’ll bring<\/strong><\/h2> <ul> <li>Staff-level experience building, operating, or improving complex production software systems.<\/li> <li>Experience contributing to large, mature product codebases with high standards for testing, maintainability, performance, and security.<\/li> <li>Strong Ruby on Rails or Go experience and the ability to contribute directly to GitLab’s product and adjacent systems.<\/li> <li>Experience with AI-assisted software development, agentic workflows, AI governance, model evaluation, context management, prompt and workflow design, or AI adoption in enterprise environments.<\/li> <li>Experience diagnosing complex system behavior across application code, data stores, infrastructure, observability, networking, APIs, and customer usage patterns.<\/li> <li>Deep knowledge of modern DevSecOps workflows, including Git, merge requests, CI/CD, security controls, compliance needs, and enterprise software delivery.<\/li> <li>Experience working with strategic customers or senior technical stakeholders in ambiguous, high-impact situations.<\/li> <li>The ability to coordinate across product, engineering, field, and customer teams without formal authority.<\/li> <li>Strong written communication and sound judgment, including the ability to create technical narratives and distinguish reusable product work from customer-specific customization.<\/li> <\/ul> <h2><strong>Strongly preferred qualifications<\/strong><\/h2> <ul> <li>Direct experience with GitLab as a platform, including GitLab.com, GitLab Dedicated, or GitLab Self-Managed.<\/li> <li>Production experience with Ruby on Rails, Go, PostgreSQL, Redis, Sidekiq, Vue, TypeScript, Kubernetes, Docker, Linux, or observability tools.<\/li> <li>Deep familiarity with Git internals, repository performance, large-scale Git usage patterns, or GitLab Runner behavior.<\/li> <li>Experience creating technical thought-leadership materials, such as whitepapers, technical talks, architecture frameworks, requests for comments, public technical writing, or internal strategy documents.<\/li> <li>A background in performance engineering, site reliability engineering, platform engineering, infrastructure engineering, or distributed systems.<\/li> <li>Experience working in open source or highly asynchronous engineering environments.<\/li> <\/ul> <h2><strong>Technologies and domains<\/strong><\/h2> <p>Directly relevant technologies and domains include:<\/p> <ul> <li>Ruby on Rails<\/li> <li>Go<\/li> <li>AI-assisted development and the agentic SDLC<\/li> <li>PostgreSQL<\/li> <li>Redis and Sidekiq<\/li> <li>Git internals<\/li> <li>GitLab CI/CD and Runner architecture<\/li> <li>Kubernetes and containers<\/li> <li>Terraform<\/li> <li>Linux, networking, observability, and performance analysis<\/li> <li>Vue and TypeScript<\/li> <li>APIs and automation<\/li> <li>DevSecOps governance, security, and compliance<\/li> <\/ul> <h2><strong>What this role is not<\/strong><\/h2> <p>This role isn't:<\/p> <ul> <li>A generic field engineering role.<\/li> <li>A proof-of-concept factory.<\/li> <li>A replacement for Solutions Architecture, Customer Success Architecture, Customer Success Management, Professional Services, Support, SRE, Product, or Engineering.<\/li> <li>A customer-specific customization function.<\/li> <li>Unbilled Professional Services.<\/li> <li>A requirements-gathering role that only escalates to Product.<\/li> <li>An AI evangelism role disconnected from product execution.<\/li> <\/ul> <h2><strong>Success measures<\/strong><\/h2> <p>Success in this role may include:<\/p> <ul> <li>Stabilizing strategic customer adoption or retention risks.<\/li> <li>Fixing product bugs or contributing features.<\/li> <li>Removing AI adoption blockers for strategic accounts.<\/li> <li>Creating reusable implementation patterns and transitioning them to long-term owners.<\/li> <li>Producing or enabling Well-Architected Frameworks, whitepapers, webinars, or technical narratives.<\/li> <li>Resolving cross-functional customer challenges without creating permanent dependency on Forward Deployed Engineering.<\/li> <li>Equipping Product, Engineering, Support, CSA, CSM, Professional Services, and SA teams with better guidance based on learning from the field.<\/li> <li>Increasing adoption and effective use of GitLab capabilities, especially GitLab Duo and GitLab Duo Agent Platform, in targeted accounts.<\/li> <\/ul> <h2><strong>About the team<\/strong><\/h2> <p>The Forward Deployed Engineering team connects strategic customer needs with GitLab product execution. The team works directly with customers and across GitLab to resolve complex adoption challenges, contribute durable product improvements, and create reusable technical guidance. Its goal is to stabilize urgent situations, improve the product, and transition ongoing ownership to the appropriate team rather than create a permanent dependency.<\/p> <h2><strong>Ideal candidate profile<\/strong><\/h2> <p>You're a Staff-level product or platform engineer who can operate in the field without becoming field-only. You're comfortable reading traces, writing production code, debugging architecture, discussing AI governance, leading a customer technical session, opening a merge request, outlining a whitepaper, and coordinating across teams to achieve a strategic customer outcome.<\/p> <p>You're not simply a strong communicator with technical awareness. You're a credible engineer with the judgment, presence, and narrative ability to turn customer reality into product contributions, adoption guidance, and company-level thought leadership.<\/p> <p>We welcome candidates with different backgrounds and levels of experience. Many successful candidates don't meet every qualification. If you're excited about this role, we encourage you to apply and let our recruiting team assess your application.<\/p> <div class=\"c-message_actions__container c-message__actions\"> <\/div> <div><span style=\"font-size: xx-small;\"><span style=\"color: white;\">Remote-Global<\/span><\/span><\/div><div class=\"content-conclusion\"><h4><strong>How GitLab Supports Full-Time Employees<\/strong><\/h4> <ul> <li><a href=\"https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/\">Benefits to support your health, finances, and well-being<\/a><\/li> <li><a href=\"https://handbook.gitlab.com/handbook/people-group/time-off-and-absence/time-off-types/#flexible-paid-time-off-pto\">Flexible Paid Time Off <\/a><\/li> <li><a href=\"https://handbook.gitlab.com/handbook/company/culture/inclusion/tmrg-tmag/\">Team Member Resource Groups<\/a><\/li> <li><a href=\"https://handbook.gitlab.com/handbook/total-rewards/stock-options/\">Equity Compensation & Employee Stock Purchase Plan<\/a><\/li> <li><a href=\"https://handbook.gitlab.com/handbook/people-group/learning-and-development/growth-and-development/\">Growth and Development Fund<\/a><\/li> <li><a href=\"https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave\">Parental Leave<\/a> <\/li> <\/ul> <p>Please note that we welcome interest from candidates with varying levels of experience; many successful candidates do not meet every single requirement. Additionally, studies have shown that people from <a href=\"https://about.gitlab.com/company/culture/inclusion/#examples-of-select-underrepresented-groups\">underrepresented groups<\/a> are less likely to apply to a job unless they meet every single qualification. If you're excited about this role, please apply and allow our recruiters to assess your application.<\/p> <hr> <p><strong>Country Hiring Guidelines: <\/strong>GitLab hires new team members in countries around the world. All of our roles are remote, however some roles may carry specific location-based eligibility requirements. Our Talent Acquisition team can help answer any questions about location after starting the recruiting process. <\/p> <p><strong>Privacy Policy: <\/strong>Please review our <a href=\"https://handbook.gitlab.com/handbook/hiring/candidate-faq/recruitment-privacy-policy/\" target=\"_blank\">Recruitment Privacy Policy.<\/a> Your privacy is important to us.<\/p> <p>GitLab is proud to be an equal opportunity workplace and is an affirmative action employer. GitLab’s policies and practices relating to recruitment, employment, career development and advancement, promotion, and retirement are based solely on merit, regardless of race, color, religion, ancestry, sex (including pregnancy, lactation, sexual orientation, gender identity, or gender expression), national origin, age, citizenship, marital status, mental or physical disability, genetic information (including family medical history), discharge status from the military, protected veteran status (which includes disabled veterans, recently separated veterans, active duty wartime or campaign badge veterans, and Armed Forces service medal veterans), or any other basis protected by law. GitLab will not tolerate discrimination or harassment based on any of these characteristics. See also <a href=\"https://about.gitlab.com/handbook/people-policies/inc-usa/#equal-employment-opportunity-policy\" target=\"_blank\">GitLab’s EEO Policy<\/a> and <a href=\"https://about.gitlab.com/handbook/labor-and-employment-notices/#eeoc-us-equal-employment-opportunity-commission-notices\" target=\"_blank\">EEO is the Law<\/a>. If you have a disability or special need that requires <a href=\"https://about.gitlab.com/handbook/people-policies/inc-usa/#reasonable-accommodation\" target=\"_blank\">accommodation<\/a>, please let us know during the <a href=\"https://about.gitlab.com/handbook/hiring/interviewing/#adjustments-to-our-interview-process\" target=\"_blank\">recruiting process<\/a>.<\/p><\/div> Find more English Speaking Jobs in Germany on Arbeitnow", "skills": ["Customer Experience"], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 0.7, "score": 31.0, "matched_skills": ["ci/cd", "observability", "postgresql", "typescript", "linux", "docker", "distributed systems", "english"], "missing_skills": ["gitlab ci", "artificial intelligence", "git", "ai agents", "site reliability", "team leadership", "rails", "redis"], "also_on": [], "query": "", "id": "3324d5bb4c06", "extra": {"semantic": 0.431, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Supply Chain Production WIP management system development & system operation support", "company": "Renesas Electronics", "url": "https://www.linkedin.com/jobs/view/4464935420", "country": "JP", "location": "Tokyo, Tokyo, Japan", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T18:13:27.916243+00:00", "posted_raw": "4 hours ago", "salary": "", "snippet": "", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 0.7, "score": 30.8, "matched_skills": [], "missing_skills": [], "also_on": [], "query": "software developer", "id": "li4464935420", "extra": {"linkedin_id": "4464935420", "semantic": 0.163, "score_confidence": "low"}}, {"source": "linkedin"  "2026-09-30", "posted_at": "2026-09-30T14:55:03+00:00", "posted_raw": 1790780103, "salary": "", "snippet": "<p><strong>Purpose of Position<\/strong><\/p> <p>Your role is to establish and lead an AppSec program within the Product and Technology department, acting as an evangelist for AppSec, trusted by engineers and managers alike.<\/p> <p>As a member of the core security team, you will engage in assessing application design proposals, to identify improvements to enable our engineers to create secure produc", "description": "<p><strong>Purpose of Position<\/strong><\/p> <p>Your role is to establish and lead an AppSec program within the Product and Technology department, acting as an evangelist for AppSec, trusted by engineers and managers alike.<\/p> <p>As a member of the core security team, you will engage in assessing application design proposals, to identify improvements to enable our engineers to create secure products.<\/p> <p>You will own the existing training program, redesign it to better equip engineers with the knowledge needed to develop secure applications, and create a Security Champions program to scale and embed a DevSecOps mindset across P&T. <\/p> <p> <\/p> <p><strong>What you'll be responsible for<\/strong><\/p> <ul> <li><strong>Secure the SDLC<\/strong>: Integrate security tooling (e.g. SAST, DAST, dependency scanning) into CI/CD pipelines and IDEs. Automate and optimise checks so teams can identify and fix issues early and efficiently.<\/li> <li><strong>Threat modelling & secure design<\/strong>: Collaborate with product and engineering teams during the design phase to conduct threat modelling sessions and pre-implementation security reviews.<\/li> <li><strong>Code & architecture reviews<\/strong>: Guide developers on secure coding practices, perform targeted code reviews, and help resolve vulnerabilities with actionable remediation support.<\/li> <li><strong>Vulnerability lifecycle management<\/strong>: <ul> <li>Identify, triage, track and report on vulnerabilities across internal and external apps and systems.<\/li> <li>Collaborate with engineers to close gaps efficiently.<\/li> <li>Support the bug bounty process with finding validation.<\/li> <li>Present vulnerability management reports to our heads of department.<\/li> <\/ul> <\/li> <li><strong>AI/ML & LLM security<\/strong>: <ul> <li>Provide guidance on secure development of AI/LLM-powered features.<\/li> <li>Help teams manage risks such as prompt injection, model misuse, and data leakage.<\/li> <li>Lead threat modelling exercises for AI components and advise on secure integration patterns.<\/li> <\/ul> <\/li> <li><strong>Incident response collaboration<\/strong>: Support investigation and root cause analysis of application-layer incidents. Contribute to post-incident reviews and longer-term mitigation strategies.<\/li> <li><strong>Security culture & enablement<\/strong>: <ul> <li>Act as a security champion for development teams.<\/li> <li>Be an enthusiastic and vocal advocate for application security across all engineering and product teams.<\/li> <li>Nurture and report on our application security training program for our code contributors.<\/li> <li>Deliver workshops and technical deep-dives on secure development practices.<\/li> <li>Contribute to playbooks, documentation, and internal standards.<\/li> <\/ul> <\/li> <li><strong>Research & innovation<\/strong>: <ul> <li>Stay ahead of industry threats and attack trends. Propose and test innovative ideas to reduce risk across our software supply chain and platforms.<\/li> <li>Showcase how to use AI and AI-powered tools to enhance productivity and improve our security posture.<\/li> <\/ul> <\/li> <\/ul> <p> <\/p> <p><strong>Your skills<\/strong><\/p> <ul> <li>5+ years in application security, product security or related technical roles.<\/li> <li>Experience working directly with software engineer and product managers to secure web applications.<\/li> <li>Experience in working within an Agile environment. ext3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Health and Wellbeing<\/strong>: With our support and access to various initiatives and sports offers, you can focus on your mental and physical wellbeing.<\/div> <\/li> <li> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Development<\/strong>: We’ve built our extensive training suite, Awin Academy, to cover a wide range of skills that support your professional and personal growth, with trainings conveniently packaged to help your overall development.<\/div> <\/li> <li> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><strong>Appreciation<\/strong>: Thank and reward colleagues by sending them a voucher through our peer-to-peer recognition programme.<\/div> <\/li> <\/ul> <div class=\"TypographyPresentation TypographyPresentation--medium RichText3-paragraph--withVSpacingNormal RichText3-paragraph HighlightSol HighlightSol--buildingBlock\"><em>We are hiring in multiple countries for this role. Additional benefits, including health and wellbeing offerings, will be discussed during the initial interview.<\/em><\/div> <p> <\/p> <p> <\/p> <p>Established in 2000, Awin is proud of our dynamic, social and inclusive culture.<\/p> <p>Like all businesses, we’ve had to adapt and nurture our culture in a virtual environment. Our virtual ‘Life @ Awin’ hub brings our colleagues from across the globe together for various social activities.<\/p> <p>Diversity & Inclusion are paramount to us, and we proudly pursue and hire diverse team members. We champion uniqueness and authenticity; this is who we are at our core. Our network of affiliate partnerships are diverse and transparent, as are the employees powering our vision to build the w ering activities across multiple programs. Assist in the integration of electronic subsystems into larger aerospace systems. Participating actively in test preparation including setup of hardware, instrumentation, and test configurations. Provide hands-on support during testing activities, including execution, monitoring, and basic troubleshooting. Collect, organize, and analyze test data to support engineering evaluations and design improvements. Help identify issues during testing and collaborate with senior engineers to investigate root causes. Contribute to the creation, update, and maintenance of technical documentation and test reports. Support continuous improvement initiatives within the engineering and testing processes. Coordinate with multidisciplinary teams such as software, mechanical, and test engineers to ensure smooth system integration. Gradually take ownership of defined tasks and subsystems as technical knowledge and confidence grows. Learn system engineering principles through real project exposure with a clear path toward becoming a system engineer. Requirements What You’ll Need Academic background in Electronics Engineering or a closely related field. Fluency in both Spanish and English with the ability to work confidently in technical environments. A proactive attitude, mindset and strong desire to learn in a fast-moving engineering environment. Would be a plus Familiar with avionics and systems such as autopilot, radar altimeter, air data units, magnetometers, AHRS, GPS, anti jamming and anti spoofing solutions, and servos. Availability to support Ground and Flight-testing activities. Experienced in updating firmware in avionics and system components. Able to create electrical drawings to support engineering upgrades using tools such as AutoCAD Electrical, Zuken E3, or similar CAD software. Familiar with version control systems. Knowledge of networking concepts including TCP and UDP. Basic experience with Python scripting and Linux Ubuntu commands. Familiar with serial communication protocols such as RS232, RS422, RS485, and Ethernet. Hands on experience with ground support equipment including multimeter, megohmmeter, oscilloscope, spectrum analyzer, power meter, and data loggers. Experience with radio control or FPV drones as a personal hobby. Who You Are You are at the beginning of your engineering journey and hungry to learn. You enjoy working alongside experienced engineers, asking questions, and getting your hands dirty with real hardware. You are adaptable, curious, and comfortable switching between theory and practice. When faced with something new, you lean in instead of stepping back.", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "junior", "fit": "fit", "relevance": 0.7, "score": 27.9, "matched_skills": ["english", "linux"], "missing_skills": ["monitoring", "technical documentation", "spanish", "firmware", "python", "ubuntu"], "also_on": [], "query": "software engineer", "id": "in881b4c2a0047d104", "extra": {"indeed_key": "881b4c2a0047d104", "company_site": "", "semantic": 0.024, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Senior Robotics Software Engineer – Fleet & Navigation Systems - AGF Team", "company": "Telexistence", "url": "https://www.linkedin.com/jobs/view/4473925373", "country": "JP", "location": "Tokyo, Tokyo, Japan", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T18:13:05.554252+00:00", "posted_raw": "4 hours ago", "salary": "", "snippet": "We are looking for a Robotics Software Engineer to develop the software that enables multiple autonomous robots to operate efficiently, safely, and reliably in logistics and industrial environments. The primary focus of this role is Fleet Management System (FMS), robot orchestration, task management, fleet coordination, and traffic management , with additional involvement in navigation and path pl", "description": "We are looking for a Robotics Software Engineer to develop the software that enables multiple autonomous robots to operate efficiently, safely, and reliably in logistics and industrial environments. The primary focus of this role is Fleet Management System (FMS), robot orchestration, task management, fleet coordination, and traffic management , with additional involvement in navigation and path planning . The ideal candidate combines strong C++/ROS2 software engineering skills with a solid understanding of autonomous mobile robotics and real-world robot deployment. Key Responsibilities Design and develop Fleet Management System (FMS) software for autonomous mobile robots. Develop task allocation, dispatching, scheduling, robot coordination, and fleet monitoring. Implement fleet-level traffic management, resource reservation, deadlock detection, and recovery. Develop interfaces between the FMS and individual robot autonomy stacks. Develop and integrate navigation and path-planning capabilities, including route planning, obstacle avoidance, and navigation behaviors. Integrate FMS, navigation, localization, perception, control, and robot hardware into a complete autonomous system. Develop and maintain ROS/ROS2-based robotics software and system interfaces. Integrate third-party robotics software and technologies. Diagnose complex fleet-level and robot-level failures using logs, telemetry, simulation, and real-robot testing. Improve system reliability, scalability, performance, and fault tolerance for production deployment. Required Qualifications Bachelor's or Master's degree in Computer Science, Robotics, Electrical Engineering, or related field. 3+ years of experience developing software for robotics, autonomous systems, or mobile robots. Strong C++ and Linux/Ubuntu development skills. Strong hands-on experience with ROS/ROS2. Solid understanding of mobile robot navigation and autonomous systems. Experience with AMRs, AGVs, AGFs, autonomous vehicles, or similar robotic systems. Understanding of fleet management, multi-robot coordination, task planning, or traffic management. Good understanding of path planning, route planning, obstacle avoidance, and navigation. Strong system integration and debugging skills. Experience deploying and debugging software on real robots. Good English communication skills. Preferred Qualifications Experience in one or more of the following is a plus: Fleet Management Systems / multi-robot coordination Task allocation, scheduling, dispatching, or fleet optimization Traffic management, resource reservation, and deadlock handling Nav2 / ROS2 Navigation Stack Global/local path planning and motion planning LiDAR or camera-based perception Robot/system orchestration and behavior planning Low-level vehicle control Gazebo, Isaac Sim, or other robotics simulation platforms Production deployment of autonomous robots in logistics or industrial environments What We Are Looking For A strong robotics software engineer with depth in fleet management and breadth across autonomous robotics . You should be able to understand how fleet decisions affect individual robot behavior , and how navigation, localization, perception, and control affect fleet-level performance. For example, when a robot becomes blocked, the candidate should be able to reason across task assignment, traffic management, route planning, localization, perception, and robot execution to identify the appropriate solution. Fleet Management → Robot Orchestration → Navigation → System Integration → Production Deployment We may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses and identifying potential inconsistencies or verification signals in application materials based on available information. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data i s and are off to a strong start: One of the UK’s most exciting unicorns with a team of over 800 people Among the fastest-growing tech companies in the UK Profitable since 2017 Backed by top investors including Balderton Capital and Goldman Sachs Loved by customers with the best reviews in the market (4.9 across 10,000s of reviews on Trustpilot ) So far, we’ve rebuilt the Big Three consumer finance products from scratch: loans, credit cards and car finance . We get money into our customers’ hands in minutes instead of days. We’re growing fast, and there’s a lot more to do: we’re going after the two biggest Western markets (UK and US) where trillions worth of financial products are held by big banks with dated systems and painful processes. Join us if you want to Take ownership: you are trusted to make decisions that drive a material impact on the direction and success of Lendable from day 1 Work in small teams of exceptional people: Lendies are relentlessly resourceful. We challenge the status quo to solve problems and find smarter solutions Build the best technology in-house : we use new data sources, machine learning and AI to make machines do the heavy lifting About the role We're looking for an analytics engineer to contribute to the analytical foundation of the UK Cards team, a growing area of the business. You’ll work closely with analysts, product teams, backend engineers, and business stakeholders to improve how data is structured, transformed, and consumed across the company. The role is fundamentally about building a strong analytical foundation: making it easier for teams to move from question to insight quickly, while maintaining high standards around data quality, scalability, and maintainability. You'll contribute to the modelling layer, help improve how the business work with data, and support the team in keeping our warehouse a reliable, strategic asset for the business. What you'll be doing Building and improving the data models that support lending
