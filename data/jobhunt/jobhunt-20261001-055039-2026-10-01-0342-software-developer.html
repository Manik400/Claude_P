ion": "Embedded Software Engineer (m/f/d) – ADAM Audio GmbH Location: Berlin offices / hybrid Term: Full-time, permanent Salary: Depending on experience Start date: as soon as possible Are you passionate about engineering and its application to acoustics and audio reproduction? Are you an Embedded Software Engineer looking to join an innovative team for creating audio products? If the answer to these questions is yes, then we’d love to hear from you! At ADAM Audio, our profound passion for audio and acoustics drives our pursuit for excellence. We are pushing the boundaries of innovation in the field of audio and acoustics. Our commitment to excellence and cutting-edge engineering drives our mission to deliver ground-breaking solutions to our customers. The successful candidate with have previous experience in audio electronics. Your Role and Responsibilities: You will be collaborating closely with cross-functional and multi-cultural teams across the company and external partners, to define, prototype and develop products from early sketches on to market introduction and maintenance. On a day-to-day basis you’ll be responsible for providing the firmware code for our hardware products, including evaluation of new technologies, debugging prototype hardware and ensuring your code is suitable for mass production and complies with latest market regulations (CE, FCC, CRA etc.). You'll have the opportunity to shape the direction of our embedded projects and you’ll be involved in the project's lifecycles. You’ll be refining product specifications, producing innovative designs and solutions and engaging with a multi-discipline team. You’ll be planning your activities, estimating your work and collaborating to meet deadlines and product requirements as well as working hands-on at functional prototypes and evaluation boards to debug and test electronic hardware designs with your code on it. Individual and team development is important, and we’ll support you as you look for ways to grow and improve your personal knowledge and skills. We’ll also be looking for you to own and help improve our approach to embedded software engineering, including best practices, processes, and tools. There will also be opportunities to share knowledge and practices with all companies across the Focusrite group. Skills and Experience Required: Expert experience with micro-controllers and audio DSP (Digital Signal Processing) in general Mastery in low-level programming at ARM-based-microcontrollers (STM32, NXP, etc.) and RTOS Experience in C and modern C++ programming and common frameworks like Zephyr Experience in working at systems with hard real-time constraints Mastering a range of test equipment: oscilloscopes, logic analysers, bus analysers and audio analysers (Audio Precision) Experience with meeting compliance regulations and standards (CE, FCC, EMC, RED, LVD etc.) for USB-, wireless- and Ethernet-connectivity, and battery powered devices Experience with common Bluetooth and RF SoCs like Qualcomm, Airoha, Bestec etc. Experience with networking protocols and chips/modules for Ethernet, WiFi and BLE Strong ability to analyse and present trade-offs between cost, quality, and development time Hands-on problem-solving and debugging skills, including lab work (test equipment, soldering etc.) Excellent communication skills and ability to collaborate effectively with multi-disciplinary teams Good English language skills (spoken and written) and ideally good German language skills. Beneficial: A Bachelor’s or Master’s degree in Information Technology, Electronics Engineering (or other relevant technical disciplines) Familiarity with electronics and/or audio engineering. What can you expect from us? Well, our colleagues are fantastic, of course! Here are some more good reasons to join our team: Flexible working hours for a better work-life balance A healthy mix of remote and office work A harmonious and appreciative working atmosphere Work on exciting projects in a unique industry as part of an international brand group Employee discounts, including on Focusrite, Novation and Sequential products Opportunities for professional development ADAM Audio bonus programme – our employees share in the company's joint success! Company pension scheme, ADAM Audio health programme, mental health first aiders, FeelGood Manager, Business Bike programme, regular staff events and much more. You don’t have all the experience we’ve asked for? Our priority is to find the right fit for the team and for the company, and we will always do what we can to support your individual development. In other words, if you don’t quite have all the experience listed above, we’d still be interested in hearing from you. Let us know what you would bring to the role, and why you’d be a great fit for the team. We look forward to receiving your application! About us ADAM Audio GmbH is a rapidly growing, internationally positioned Focusrite plc company based in Berlin Adlershof. We are one of the market-leading manufacturers of professional monitoring solutions. Our customers include renowned recording studios and well-known music producers all over the world, and our products have also been used to soundtrack numerous Oscar-nominated films in recent years. Since 2019, ADAM Audio has been part of Focusrite plc which houses other, highly respected pro audio brands like Martin Audio, Optimal Audio, Sequential, Focusrite, Focusrite Pro, Novation and Ampify. Our international team at the Berlin-based HQ and the office in China live our passion for music. We constantly drive ourselves to bring fresh ideas and new technologies to our high-quality products to meet the needs of pro audio enthusiasts and recording professionals alike. We pride ourselves in providing some of the tools that empower creatives all over the world to bring their visions to life. Covering a wide range of products for different levels and budgets, we engage with artists, producers and engineers to become a companion throughout the various stages of their journey. Our whole business is structured to let everyone contribute and be heard at all levels, and we make sure it’s a great place to work. As a team, we work hard and support each other to master our individual tasks, building and developing the skills of talented and passionate people – to achieve a common goal. So, if you think you can bring something new to the mix, we look forward to hearing from you. ADAM Audio is an equal opportunity employer. Our employees span a wide range of diverse backgrounds, and we believe that embracing diversity is one of the keys to our future success. If you want to learn more about the ADAM Audio brand, please go to www.adam-audio.com Find more English Speaking Jobs in Germany on Arbeitnow", "skills": ["ADAM Audio", "Engineering", "Music"], "employment_type": "Full time", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 25.7, "matched_skills": ["english", "german", "c"], "missing_skills": ["embedded", "bluetooth", "plc", "firmware", "stm32", "rtos", "c++", "monitoring"], "also_on": [], "query": "", "id": "6d3b3a0c5a9c", "extra": {"semantic": 0.164, "score_confidence": "high"}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Software test engineer - motion control", "company": "ASML", "url": "https://www.adzuna.nl/details/5904129935?utm_medium=api&utm_source=28f9775f", "country": "NL", "location": "Nederland", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T19:02:48+00:00", "posted_raw": "2026-09-30T19:02:48Z", "salary": "", "snippet": "Introduction to the job As a software test engineer, you are responsible for validating the quality, reliability, and performance of a distributed software platform that forms the foundation of advanced real-time control systems. The role focuses on testing software integration, platform behavior, communication mechanisms, and timing-critical functionality across multip pi&utm_source=28f9775f", "country": "AU", "location": "Melbourne, Melbourne Region", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T12:50:04+00:00", "posted_raw": "2026-09-30T12:50:04Z", "salary": "", "snippet": "Leads and/or participates in the design, development, and implementation of complex system engineering activities involving cross-functional technical support, systems programming and data center capabilities. Responsible for components of highly complex engineering and/or analytical tasks and activities. Establishes input/output processes and working parameters for hardware/software compatibility", "description": "", "skills": [], "employment_type": "permanent", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 0.0, "score": 24.2, "matched_skills": ["java"], "missing_skills": [], "also_on": [], "query": "software developer", "id": "069132067035", "extra": {"semantic": 0.172, "score_confidence": "low"}}, {"source": "arbeitnow", "source_name": "Arbeitnow", "title": "Manufacturing Test Automation Engineer", "company": "Andurilindustries", "url": "https://www.arbeitnow.co.uk/jobs/companies/andurilindustries/manufacturing-test-automation-engineer-sydney-australia-291923", "country": "DE", "location": "Sydney, Australia", "remote": false, "posted": "2026-09-30", "posted_at": "2026-09-30T18:55:46+00:00", "posted_raw": 1790794546, "salary": "", "snippet": "<div class=\"content-intro\"><p>Anduril Industries is a defense technology company with a mission to transform U.S. and allied military capabilities with advanced technology. By bringing the expertise, technology, and business model of the 21st century’s most innovative companies to the defense industry, Anduril is changing how military systems are designed, built and sold. Anduril’s family of syste", "description": "<div class=\"content-intro\"><p>Anduril Industries is a defense technology company with a mission to transform U.S. and allied military capabilities with advanced technology. By bringing the expertise, technology, and business model of the 21st century’s most innovative companies to the defense industry, Anduril is changing how military systems are designed, built and sold. Anduril’s family of systems is powered by Lattice OS, an AI-powered operating system that turns thousands of data streams into a realtime, 3D command and control center. As the world enters an era of strategic competition, Anduril is committed to bringing cutting-edge autonomy, AI, computer vision, sensor fusion, and networking technology to the military in months, not years.<\/p><\/div><p>At Anduril we are building multi-domain unmanned systems that will leverage unsupervised autonomy for the delivery of integrated multi-mission capability to our customers. Dive-XL is a large-displacement AUV program designed and built in Australia, all in-house. Our Manufacturing engineering team is growing and now seeking a Manufacturing Test Engineer with an Electronic, Mechatronic or Computer Science background to join our team as a Test Systems Engineer to enable rapid testing of cutting-edge defence hardware for undersea and flight vehicles. As a Manufacturing Test Engineer, you will have responsibility for optimizing Anduril’s manufacturing test operations for best-in-class quality, reliability, speed, and asset utilization, all while meeting critical customer and internal development timelines.<br><br><strong>About the role<\/strong><br>As a Test Systems Engineer you will own the technical backbone of Manufacturing Test for Dive-XL — the frameworks, GUIs, automation, and tester integrations that the production team uses to bring up PCBAs, build bottles, check out systems, and accept vehicles at FAT. Hardware-meets-software work, on the floor, in production.<br><br>Concretely, the two flagship things you'll build:<\/p> <ul> <li>The manufacturing-line console. Pre-programmed for PCBA bring-up and bottle bring-up. Technicians execute curated, version-controlled tests through a GUI. They do not author command-line.<\/li> <li>The vehicle-level test base. A pre-programmed console for vehicle Factory Acceptance Test and system check-out. Same as manufacturing-line console.<\/li> <\/ul> <p>Behind both: one framework, one config-managed toolchain, one OS target for test execution, and a CI/CD discipline for test code that today doesn't exist.<br><br><br><strong>WHAT YOU’LL DO<\/strong><\/p> <ul> <li>Design and build a production utility suite of tools. From requirements through architecture, through GUI development, through deployment to the floor. These are the two consoles that the production team will live in.<\/li> <li>Test framework architecture. The shared substrate underneath both consoles — test runners, instrumentation drivers, data logging, traceability hooks, error-code library, configuration management.<\/li> <li>Toolchain standardisation. NixOS-based, declarative, reproducible. Drive the move off mixed Linux/ Windows/ Mac/ NixOS dev environments to a single config-managed target.<\/li> <li>CI/CD for test code. Test software ships through pipelines, not over USB sticks. Stand it up, maintain it, hold the line on review and version control.<\/li> <li>Integration with Anduril's factory systems: MES (work instructions, routings, defect capture), Oracle ERP, Teamcenter PLM where relevant. Test results should land in the systems where they're traced and acted on, not in spreadsheets.<\/li> <li>Technician-facing usability. GUIs that lower the entry-skill bar. Curated, version-controlled tests. Clear pass/fail. Helpful error codes that point at the actual problem, not at a stack trace.<\/li> <li>Cross-site codebase convergence with other Anduril production sites. You're part of converging the AU and US Manufacturing Test stacks — shared framework, shared XL Utility code, common error-code library. You'll work with the US team to make that real.<\/li> <li>Floor support. When a test fails and it's not clear whether it's the product, the tester, or the test code — you debug it. You're the one called when the GUI throws an unexpected error and the build's stopped.<\/li> <\/ul> <p><br><strong>REQUIRED QUALIFICATIONS<\/strong><\/p> <ul> <li>Engineering fundamentals. Degree in Software, Computer, Electrical, Mechatronic, or related engineering — or equivalent demonstrable experience. You can read a schematic and reason about what the test code is actually exercising.<\/li> <li>Strong software fluency for test automation. Python first, with real experience building, maintaining, and debugging test frameworks — not just scripts. You write code other people can read, change, and ship.<\/li> <li>Linux + command line as a primary environment. You live in a shell. You write Bash where it makes sense. You're comfortable with system-level configuration, process management, and network debugging — not as a special skill, just as how you work.<\/li> <li>Hardware-software interface fluency. You've written software that drives test instruments and hardware-under-test through real interfaces — USB, Ethernet, RS232/RS485, CAN, I2C, SPI, GPIB, or equivalent.<\/li> <li>Electronics troubleshooting hands-on. You can pick up an oscilloscope, a multimeter, or a logic analyser and isolate whether a problem is in the product, the tester, or the cable between them. You don't escalate the question — you get hands on and answer it.<\/li> <li>GUI development experience. You've built user-facing test consoles or operator interfaces — frameworks vary (PyQt, Tkinter, web stacks, LabVIEW front panels) but you understand what makes a tech-facing GUI usable vs frustrating, and you can ship one.<\/li> <li>Software-engineering discipline. You version-control test code. You write tests for the test code where it matters. You think about reproducibility, configuration management, and rollback before they bite.<\/li> <li>Bias to action and ownership. You see a fragmented toolchain and your reaction is to fix it, not to log a ticket. You're comfortable being the one who decides what the framework looks like.<\/li> <li>Clearance eligibility. Ability to obtain and maintain an Australian Government NV2 Security Clearance (Australian citizen).<\/li> <\/ul> <p><br><strong>PREFERRED QUALIFICATIONS<\/strong><\/p> <ul> <li>Production test environments — not just R&D test benches. Building software that has to survive a production floor, technicians under time pressure, and shift handovers is its own discipline.<\/li> <li>NixOS or other declarative-configuration systems (Ansible, Puppet, Chef). The target is NixOS; coachable from any solid declarative-config background.<\/li> <li>Test frameworks like LabVIEW, TestStand, pytest-based test harnesses, or equivalent — exposure to more than one is a plus.<\/li> <li>Experience working with — or building toward — common test metrics: first-pass yield, false-fail rate, tester utilisation, GR&R, test coverage.<\/li> <li>MES (Solumina, Ae), ERP (Oracle / SAP / NetSuite), or PLM (Teamcenter) integration experience.<\/li> <li>Subsea robotics or AUV/UUV domain experience.<\/li> <li>AS9100 / ISO 9001 environments and the configuration-management discipline that comes with them.<\/li> <li>Embedded firmware — flashing, debugging, reading datasheets, talking to bootloaders.<\/li> <li>Experience integrating with hazardous systems (high voltage up to 400V, hydraulics, compressed gas) — and the safety design that goes with it.<\/li> <\/ul><div class=\"content-conclusion\"><p><span data-contrast=\"auto\">The salary range for this role is an estimate based on a wide range of compensation factors, inclusive of base salary only. Actual salary offer may vary based on (but not limited to) work experience, education and/or training, critical skills, and/or business considerations. Highly competitive equity grants are included in the majority of full time offers; and are considered part of Anduril's total compensation package. Additionally, Anduril offers top-tier b d requirements and supporting go-live and early-life support. Keeping clear documentation of requirements, data flows, configurations and technical decisions, and helping build reusable delivery patterns. What We're Looking For Experience in a client-facing technical, consulting or software implementation role. Experience gathering client requirements and translating them into technical deliverables. Experience supporting software implementations or integrations. An understanding of APIs, JSON, data mappings and software integrations. Excellent written and verbal communication, and strong client and stakeholder management. Strong organisation, problem-solving and attention to detail. The ability to learn new technical concepts and tools quickly, and to take ownership while asking for support when needed. Nice to Have Experience in SaaS, AI or financial services. Experience working with Engineering teams or external development partners. Familiarity with authentication, webhooks, CRM integrations or cloud services. Experience with scripting, source control or software configuration. Experience supporting quality assurance and user acceptance testing. An interest in AI, machine learning and financial services. Why Join Aveni? You'll play a central part in getting AI into production at financial services firms, working on real integrations with real client systems. You'll get broad exposure across Sales, Product and Engineering, and support to deepen your hands-on technical skills as you go. Benefits at Aveni Remote-first working across the UK Work abroad policy Co-working spaces available 34 days holiday (including flexible bank holidays) and your birthday off Company-wide off-sites Optional Personal Development Plan Flexible benefits platform Protection essentials including Life Insurance, Income Protection, Critical Illness cover, and Pension (up to 5% matched employer contribution with optional increased contributions) Private health and dental care Potential share Fi, Sutter Health, and SoftBank — to transform how they serve customers and grow their businesses. We are primarily an in-person company based in San Francisco, with growing offices across North America, Europe, and Asia. We are guided by a set of values that are at the core of our actions and define our culture: Trust, Customer Obsession, Craftsmanship, Intensity, and a commitment to balancing Family along the way. These values are the foundation of our work, and we are committed to upholding them in everything we do. Our co-founders are Bret Taylor and Clay Bavor . Bret currently serves as Board Chair of OpenAI. Previously, he was co-CEO of Salesforce (which had acquired the company he founded, Quip) and CTO of Facebook. Bret was also one of Google's earliest product managers and co-creator of Google Maps. Before founding Sierra, Clay spent 18 years at Google, where he most recently led Google Labs. Earlier, he started and led Google’s AR/VR effort, Project Starline, and Google Lens. Before that, Clay led the product and design teams for Google Workspace. What you’ll do Design and deliver production-grade AI agents: You'll build and ship highly performant, reliable, and intuitive AI agents that are central, mission-critical and drive revenue directly to Sierra's growth. These aren't prototypes—they are powerful, scalable systems running in production environments across industries like finance, healthcare, and commerce. Drive the Agent Development Life Cycle (ADLC) : You'll have complete ownership and autonomy from initial pilot through deployment and continuous iteration. You'll be responsible for building, tuning, and evolving AI agents in production environments, defining the standard for ADLC best practices along the way. Partner with large enterprises and cutting-edge startups: You’ll work directly with leaders at some of the world’s largest enterprises to understand their most pressing business challenges, and build AI agents that transform how they operate at scale. You'll also partner with the most cutting-edge startups in Silicon Valley, embedding AI agents across their entire business stack to drive innovation and efficiency. Build the future of the platform: Your direct work with customers will guide the evolution of Sierra's core platform. You'll surface unmet needs, prototype new tools and features, and collaborate with research, product, and platform to shape the future of AI agent development and Sierra's product. Example projects These are some examples of projects that engineers on our team have worked on recently: Design and build AI agents for large telecommunications and media companies that consistently outperform human agents in managing subscription churn Develop and refine AI agents capable of navigating complex customer interactions, like troubleshooting a broken device and personalizing product recommendations Create generalizable AI agent frameworks tailored for industry-specific use cases. See some examples in our financial services blog! Facilitate design partnerships for new product initiatives, such as new agent architectures, self-service capabilities, and generative agent development Experiment with the latest voice models and figure out how to integrate them at scale to enterprise-grade customers What you'll bring Experience building and scaling end-to-end production systems Strong technical problem-solving skills, especially in fast-changing, ambiguous environments A builder and tinkerer’s mindset with high agency - you find creative ways to overcome obstacles and ship Comfort working directly with customers to understand their needs and solve real-world problems Excellent communication skills - clear, direct, and persuasive across technical and non-technical audiences Native-level Japanese proficiency, with the ability to communicate fluently and effectively in customer-facing and technical discussions Even better... Experience building or deploying AI/LLM systems in production Have been a founder or founding engineer - you know what it means to balance craft, ownership, and speed Familiarity with tools that power today's AI agents: eval frameworks, agent tooling, RAG pipelines, and prompt engineering Prior experience with React, TypeScript, and/or Go Previous roles where you interfaced with customers or led technical projects with external stakeholders Our values Trust: We build trust with our customers with our accountability, empathy, quality, and responsiveness. We build trust in AI by making it more accessible, safe, and useful. We build trust with each other by showing up for each other professionally and personally, creating an environment that enables all of us to do our best work. Customer Obsession: We deeply understand our customers’ business goals and relentlessly focus on driving outcomes, not just technical milestones. Everyone at the company knows and spends time with our customers. When our customer is having an issue, we drop everything and fix it. Craftsmanship: We get the details right, from the words on the page to the system architecture. We have good taste. When we notice something isn’t right, we take the time to fix it. We are proud of the products we produce. We continuously self-reflect to continuously self-improve. Intensity: We know we don’t have the luxury of patience. We play to win. We care about our product being the best, and when it isn’t, we fix it. When we fail, we talk about it openly and without blame so we succeed the next time. Family: We know that balance and intensity are compatible, and we model it in our actions and processes. We are the best technology company for parents. We support and respect each other and celebrate each other’s personal and professional achievements. What we offer We want our benefits to reflect our values and offer the following to full-time employees: Flexible (unlimited) paid time off Medical, dental, and vision benefits for you and your family Life insurance and disability benefits Retirement plan dependent on country of employment Parental leave Fertility and family building benefits through Carrot Lunch, as well as delicious snacks and coffee to keep you energized Discretionary benefit stipend giving people the ability to spend where it matters most Free alphorn lessons These benefits are further detailed in Sierra's policies, may vary by region, and are subject to change at any time, consistent with the terms of any applicable compensation or benefits plans. Eligible full-time employees can participate in Sierra's equity plans subject to the terms of the applicable plans and policies. Be you, with us We're working to bring the transformative power of AI to every organization in the world. To do so, it is important to us that the diversity of our employees represents the diversity of our customers. We believe that our work and culture are better when we encourage, support, and respect different skills and experiences represented within our team. We encourage you to apply even if your experience doesn't precisely match the job description. We strive to evaluate all applicants consistently without regard to race, color, religion, gender, national origin, age, disability, veteran status, pregnancy, gender expression or identity, sexual orientation, citizenship, or any other legally protected class.", "skills": [], "employment_type": "Full-time", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 1.0, "score": 22.7, "matched_skills": ["react", "typescript"], "missing_skills": ["ai agents", "artificial intelligence", "japanese", "openai", "salesforce", "telecommunications", "llm", "rag"], "also_on": [], "query": "software developer", "id": "li4473775010", "extra": {"linkedin_id": "4473775010", "seniority_level": "Mid-Senior level", "details_fetched": true, "semantic": 0.256, "score_confidence": "high"}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Detection and SOAR Engineer, Mandiant Consulting, G chnical, remote environment focused on pushing the boundaries of efficient AI systems. Accountabilities Design and deploy advanced model-serving architectures optimized for high throughput, low latency, and efficient memory utilization. Develop inference pipelines capable of operating effectively across diverse environments, including resource-constrained mobile devices and edge platforms. Establish clear performance targets covering response latency, token generation speed, throughput, memory footprint, and reliability. Build and execute controlled inference benchmarks in simulated and production environments, tracking latency, throughput, memory consumption, and error rates. Create and maintain representative datasets and simulation scenarios for evaluating model performance under real-world and resource-constrained conditions. Identify computational and memory bottlenecks across inference pipelines and implement solutions involving batching, networking, memory management, and other system-level optimizations. Develop custom GPU kernels and compute shaders for mobile hardware, including solutions written in Metal Shading Language (MSL). Apply advanced inference optimization techniques such as pruning, quantization, Flash Attention, KV caching, and speculative decoding. Design and optimize distributed inference systems using approaches such as tensor parallelism, pipeline parallelism, and expert parallelism for large-scale GPU workloads. Work with cross-functional engineering and research teams to integrate optimized inference frameworks into production and edge-device applications. Define evaluation methodologies, document experimental results, compare performance against established benchmarks, and continuously refine optimization strategies. Monitor production performance and use empirical research to identify opportunities for further improvements in scalability, efficiency, and reliability. Requirements: Degree in Computer Science or a related technical field; s": [], "missing_skills": [], "also_on": [], "query": "software developer", "id": "li4473759164", "extra": {"linkedin_id": "4473759164", "semantic": 0.158, "score_confidence": "low"}}, {"source": "arbeitnow", "source_name": "Arbeitnow", "title": "Security Engineer - GRC", "company": "Alan", "url": "https://www.arbeitnow.fr/jobs/companies/alan/security-engineer-grc-anywhere-in-france-2281", "country": "DE", "location": "Anywhere in France", "remote": false, "posted": "2026-09-30", "posted_at": "2026-09-30T16:40:11+00:00", "posted_raw": 1790786411, "salary": "", "snippet": "Health can’t wait . Not for symptoms to get worse. Not for a six‑month appointment. Not for a system to catch up. But that’s exactly how healthcare works today. You wait, until you can’t. Alan exists to end the wait. Health is a universal right, and we believe this right can only become real when it’s coupled with prevention. We need to stop treating health as something we repair and start treatin", "description": "Health can’t wait . Not for symptoms to get worse. Not for a six‑month appointment. Not for a system to catch up. But that’s exactly how healthcare works today. You wait, until you can’t. Alan exists to end the wait. Health is a universal right, and we believe this right can only become real when it’s coupled with prevention. We need to stop treating health as something we repair and start treating it as something we build, every day. It’s not solely a question of willpower. It’s the healthcare system itself that needs to work for everyone, in a sustainable way. So we are building the new standard in prevention insurance. Alan is the first company that integrates insurance, prevention, and care into a single, acclaimed user experience. We are on an incredible journey to build a global leading company, with a unique culture . We already partner with 40K+ companies of all sizes, serving more than 1M+ members, and have reached €800M+ in ARR. Prevention as the new norm. That's what we're building with our team of 1000+ people. If it speaks to you: we're hiring across France, Spain, Belgium, and Canada. And beyond. Alan operates at the intersection of health insurance, prevention, and regulated data. The person in this role owns the security governance and risk posture of a company that handles sensitive health data for 1M+ members, operates under DORA and HDS certification requirements, and is regulated by the ACPR. They work in close partnership with Legal, Internal Audit, and the broader Risk function. It's a highly collaborative role. 🛡️ Your mission: Governance, risk & compliance Own and operate the ISO 27001 ISMS. You are the accountable owner of the Information Security Management System: scope definition, Statement of Applicability, internal audit programme, and management review. You've led at least one full certification or recertification cycle and know what breaks down in the months between audits. Be the security expert on regulatory and privacy matters. Legal leads on DORA, HDS, RGPD, PGSSI-S, and regulatory relationships. Your role is to bring the technical and operational security substance: translating regulatory requirements into controls, flagging implementation gaps, and making sure the security programme is solid when the regulatory team negotiates with the ACPR or ANS. Run risk as an ongoing programme, in partnership with the broader risk function. You lead security risk cartography using EBIOS RM and ensure it feeds into, and is informed by, the company-wide risk framework. You facilitate risk workshops, produce treatment plans, and bring the security lens to forums where non-security risks are also on the table. You know when a security risk is really a business risk. Own the controls framework, but distribute ownership of controls themselves. You define the framework, set the standards, and track coverage, but the controls live with the teams who build and run the things they protect. You work closely with Infrastructure, Platform, and Engineering to ensure foundational building blocks (identity, network, secrets management, logging) are designed with security requirements built in from the start. You work alongside those teams as a partner. Run audit cycles with rigour, in close partnership with Internal Audit. You manage the security audit programme and coordinate with certification bodies. You work with Internal Audit to align scopes, avoid duplication, and present a coherent picture of control effectiveness to the board. You've sat in joint audit planning sessions and know how to make that relationship work well. Manage third-party risk. You run vendor security assessments and define contractual security requirements (security annexes, DPAs). You partner with our Risk team, which oversees third-party risk, and own the security dimension. Bring the health sector context. You understand the ANS framework, CERT Santé requirements, and what it means to handle sensitive health data in day-to-day operations. You're a useful partner to Legal when the question is \"what does this regulation actually require us to do technically?\" Own incident governance and support DORA reporting. You classify and escalate ICT incidents internally, own BCP and DRP governance, and provide the security substance for DORA incident reports. 🚀 What you'll build and who you'll work with Compliance Framework : ISO 27001, DORA, HDS, NIS2. Multiple regulators, multiple countries, one coherent governance backbone. Build the system that lets Alan scale from 1M to many millions of members without rebuilding compliance every time. Automated Audit & Evidence Engine : Replace manual evidence collection with scripted pipelines plugged directly into engineering systems. Turn audit cycles into a continuous capability instead of a quarterly rush. Risk Cartography : Risk treated as an operational signal that feeds directly into business and engineering decisions, with EBIOS RM at the core. You'll work closely with Legal, DPO, Internal Audit, and the broader Risk function, and partner day-to-day with Infrastructure, Platform, Engineering, Product, and Operations. You're the bridge between regulatory complexity and operational simplicity. ⚡ Why this role is special Direct Impact : You own the trust foundation that lets Alan handle health data for 1M+ members and operate in highly regulated markets. Your work is the precondition for everything else Alan does. Complex Problems : 4 regulators across 4 countries, sensitive health data, and a regulatory landscape that keeps shifting (DORA, NIS2, AI Act), all to be modeled into a single, coherent control system. Ownership & Growth : Board and executive exposure, real influence on company-wide risk decisions, and the autonomy to shape Alan's security culture across 800+ people. 🤝 What you will also do: Technical enablement Automate compliance work wherever possible. You script evidence collection, automate control testing, and connect GRC tooling to engineering pipelines. You've used Python or similar to reduce the manual work of an audit cycle, and you actively look for the next process to streamline. Configure and own GRC tooling. You can administer platforms like CISO Assistant, ServiceNow GRC, or Archer, designing workflows, building dashboards, and making them genuinely useful for the teams that feed them data. Speak cloud governance fluently. You understand shared responsibility in HDS-qualified environments, know what CSPM tools surface and what they miss, and can reason about policy-as-code (OPA, SCP) without needing an engineer to translate. Read architecture well enough to challenge it. You can review a proposed architecture, identify control gaps in identity, network segmentation, encryption, or logging, and push back credibly with engineers even though you're not one. Interpret vulnerability data and drive prioritisation. You read scan outputs, work with engineering teams to prioritise remediation by business impact over CVSS score alone, and track resolution KPIs over time. ⭐️ Qualifications, mindset and soft skills You translate risk into business language. You can brief a board or an audit committee and leave them genuinely informed. You know the difference between a finding that requires an emergency board call and one that belongs in a quarterly report. You influence without authority. You align Legal, DPO, Risk, Engineering, Product, and Operations on security requirements without creating blockers or adversarial dynamics. People come to you early because you make their work easier. You manage programmes with audit-grade rigor. You run structured, traceable roadmaps. You know where every commitment is, who owns it, and when it's due. You escalate proactively and don't let dependencies surprise you. You build a genuine security culture. Your awareness programmes land because they're relevant to the people who take them. You foster proportionate risk ownership across the company, so teams make better day-to-day decisions. You think in principles when frameworks shift. DORA is live. NIS2 transposition pace varies. The AI Act is arriving. When the regulatory landscape moves, you reason from first principles and adapt without waiting to be told what to do. 🌍 How we work Location: You must be legally eligible to work from France, Belgium or Spain. Remote work: We offer remote work flexibility, but we value in-person collaboration 🎯 Important note: we hire people, not roles. If you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success. If you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements? Remember, this is just a guide, not a checklist. We'll be thrilled to receive your application! 🔖 Check out our About Alan and Career pages, as well as our Medium , blog and Glassdoor page for more u entw", "description": "About The Role And Potential Progression Mit unserer Intelligence Management Plattform lösen wir eine der größten Herausforderungen der kommenden Dekade: Wie Unternehmen ihr Expertenwissen bewahren , bevor es durch Ruhestand oder Fluktuation verloren geht. Als Founding AI Engineer übernimmst du Verantwortung für ein visionäres Produkt an der Schnittstelle von KI, UX und Wissensmanagement . Du entwirfst, implementierst und verbesserst ein KI-basiertes System, das Fachexperten vollautomatisiert interviewt, ihr implizites Wissen erfasst und dieses Wissen über verschiedene Formate und Schnittstellen im Unternehmen nutzbar macht. Du arbeitest eng mit internen Stakeholdern und Pilotkunden zusammen, um reale Bedürfnisse zu verstehen, Hypothesen zu testen und früh funktionierende Prototypen auf den Markt zu bringen. Diese Rolle ist nicht einfach ein Job - sie ist eine Gelegenheit, ein Produkt mit großem Impact von Grund auf mitzugestalten . What's in it for you Beteiligung mit echtem Einfluss: Als Founding Engineer hast du direkten Einfluss auf Produkt, Technologie und Strategie und profitierst durch echte Beteiligungsmöglichkeiten am Unternehmenserfolg. Dein Beitrag ist sichtbar, messbar und langfristig wertvoll. Wirkung statt Politik: Bei uns zählen Fakten mehr als Egos. Du bekommst unternehmerische Freiheit und die Verantwortung, dich an Ergebnissen messen zu lassen. Wachstum auf Augenhöhe: Entwicklung hört bei uns nicht an der Führungsebene auf. Individuelles Coaching, Sparring mit dem Leadership-Team oder Zugang zu Premium-Lernressourcen – du investierst nicht nur in das Unternehmen, sondern das Unternehmen investiert auch in dich. Kultur echter Exzellenz: Du arbeitest mit ambitionierten Kolleginnen und Kollegen in einem mehrfach ausgezeichneten Unternehmen. Wir schaffen Raum für Leistung, Vertrauen und Wertschätzung und verzichten auf leere Phrasen. Flexibles Arbeiten mit Teamspirit: Wir kombinieren das Beste aus beiden Welten: Du arbeitest flexibel im Home Office, bist aber regelmäßig im Büro, um gemeinsam mit dem Team Ideen zu testen, Entscheidungen zu treffen und Tempo aufzubauen. Momentum trifft Vision: Wir stehen an einem strategischen Wendepunkt: mit einem marktreifen Produkt, klarer Positionierung und einem Setup, das auf Skalierung ausgelegt ist. Die nächsten Monate werden entscheidend und bieten den perfekten Moment, um einzusteigen und das nächste Kapitel aktiv mitzugestalten. How you can make an impact Konzipiere und implementiere den KI-Interviewprozess , der mithilfe von AI Voice Agents dynamisch sinnvolle Fragen stellt und tiefes Fachwissen erfasst. Baue und orchestriere eine Transcript-to-Knowledge-Pipeline , die in Interviews erfasstes Expertenwissen strukturiert, aufbereitet, nachhaltig speichert und bereitstellt. Entwerfe und implementiere KI-Agenten , um das erfasste Wissen über unterschiedliche Formate und Schnittstellen im Unternehmen verfügbar zu machen. Führe Nutzerinterviews mit Fachexperten und Wissensmanagern, um Bedürfnisse zu validieren und das System kontinuierlich zu verbessern. Übernimm die Verantwortung für das End-to-End-Produkt – von KI-Agenten über Datenpipelines bis hin zu einem intuitiven Frontend. Arbeite eng mit dem Produkt- und Entwicklungsteam an Zielen, Experimenten und Vision. Du bist gleichzeitig hands-on Entwickler und produktgetriebener Denker . Skills to be successful Tiefes technisches Verständnis : Du kannst komplexe KI- und Softwarelösungen eigenständig und End-to-End konzipieren, implementieren und skalierbar betreiben. (Tech Stack: Next.js, LiveKit, LangGraph/LangChain, Azure, OpenAI, TypeScript, Python) Konzeptionelle Stärke : Du kannst technische Lösungsansätze für anspruchsvolle Probleme entwerfen, bewerten und in tragfähige Architekturen überführen. Produktdenken : Du denkst nicht nur in Codezeilen, sondern in Nutzerbedürfnissen und Mehrwert. Ownership & Hands-on-Mentalität: Du arbeitest selbstständig und proaktiv, übernimmst Verantwortung und kommunizierst klar. User Empathy: Du hast bereits Erfahrung mit Nutzerinterviews und bringst echtes Interesse daran mit, wie Menschen denken und arbeiten. Bonus: Erfahrung mit Knowledge Graph, Wissensmanagement oder Knowledge Engineering. Find Jobs in Germany on Arbeitnow", "skills": ["Project Management"], "employment_type": "berufserfahren", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "relevance": 0.7, "score": 14.2, "matched_skills": ["typescript"], "missing_skills": ["artificial intelligence", "ui/ux", "project management", "team leadership", "next.js", "langchain", "azure", "openai"], "also_on": [], "query": "", "id": "18880706bf14", "extra": {"semantic": 0.14, "score_confidence": "high"}}, {"source": "apify-indeed", "source_name": "Indeed (Apify)", "title": "Partner Solution Engineer – EMEA Central", "company": "ServiceNow", "url": "https://jobs.smartrecruiters.com/ServiceNow/744000152732358-partner-solution-engineer-emea-central", "country": "DE", "location": "München, BY, Deutschland", "remote": null, "posted": "2026-09-30", "posted_at": "2026-09-30T16:58:08+00:00", "posted_raw": "2026-09-30T16:58:08.027Z", "salary": "", "snippet": "Company Description It all started when engineer Fred Luddy wrote code that automated a tedious task for his coworker, Phyllis. She cried tears of joy. That moment inspired Fred to build a company that could do that for everyone—freeing people from busywork so they could focus on meaningful work. Today, ServiceNow is the AI control tower for business reinvention. Our ServiceNow AI platform brings", "description": "Company Description It all started when engineer Fred Luddy wrote code that automated a tedious task for his coworker, Phyllis. She cried tears of joy. That moment inspired Fred to build a company that could do that for everyone—freeing people from busywork so they could focus on meaningful work. Today, ServiceNow is the AI control tower for business reinvention. Our ServiceNow AI platform brings together any AI, any data, and any workflow— helping 85% of the Fortune 500® work smarter, faster, and better. We're building an AI-native culture where technology and talent are unstoppable together. And we're just getting started. Join us to put AI to work for people. Job Description The ServiceNow Partner Design Studio is looking for a Partner Solution Engineer with a passion for innovation, design standards, and cutting-edge architecture practices. This is a unique opportunity to shape partner-branded solutions using an AI-first approach — where AI is embedded into every step of design and solutioning. You will help partners design, validate, and accelerate differentiated solutions on the Now Platform through design thinking, deep technical architecture, and go-to-market alignment, ensuring every solution is AI-ready, scalable, and outcome-driven. As a pooled, forward-deployed engineering authority, you will work across partners as a force multiplier focused on standards, reuse, and quality, certifying into Practices to bring domain depth where it’s needed. By applying the FLIGHT design thinking framework and maintaining architectural rigor, you will accelerate partner time-to-value by up to 2x while establishing reusable patterns and reference architectures that scale across the entire partner ecosystem. What You’ll Do As a Partner Solution Engineer, you will define the reference architectures, design standards, and validated patterns that partners build to — serving as the forward-deployed technical authority for AI-infused ServiceNow solutions that address real-world business challenges. AI-First Solution Blueprints & Design Workshops Lead design workshops using the FLIGHT framework to define AI-native reference patterns and set the solution standards partners build to on the Now Platform. Apply an AI-first mindset in all partner engagements — from design workshops to solution architecture — ensuring partners are equipped to lead in an AI-driven market. Translate partner ideas and industry opportunities into actionable blueprints, validated architectures, and minimum viable product specifications. Drive conversations around market positioning, industry opportunities, and how AI can create differentiated solutions. Technical Architecture & Validation Provide expert architecture and AI readiness guidance ensuring partner solutions meet ServiceNow standards for quality, performance, and simplicity. Conduct deep architectural reviews for net-new patterns, complex multi-product integrations, and advanced AI/agentic scenarios. Evaluate solution architectures against the Partner Co-Innovation Framework including upgrade survivability, security posture, and scalability. Collaborate with Product and Engineering teams to align partner innovations with ServiceNow platform priorities and AI strategy. Reusable Patterns & Standards Capture, document, and publish repeatable patterns, architectures, and design frameworks (Orbital, FLIGHT) to scale partner innovation across the ecosystem. Develop industry-specific reference architectures for verticals including Financial Services, Healthcare, Manufacturing, and Public Sector. Contribute validated patterns to the Pattern Library for use by partners across all Co-Innovation Maturity Tiers. Continuously refine design frameworks and delivery methods to enhance partner experience and measurable business outcomes. Partner Enablement & Strategic Alignment Mentor partner design and solution teams, building capability in AI-native solution development and Now Platform extensibility. Provide educational design reviews for Foundation-tier partners to accelerate learning and capability development. Support partners in defining go-to-market strategies, technical goals, and measurable outcomes through the lens of AI-enhanced capabilities. Promote partner success stories, highlighting business impact and thought leadership through structured design and standards engagements. Qualifications Required: 8+ years in solution architecture, technical sales, pre-sales, or similar roles with deep platform architecture experience. Significant experience working with technology partners at either a partner or OEM level, including solution design and reference-architecture definition. Strong grasp of cloud platform architecture including SaaS, PaaS, automation, and multi-tenancy patterns. Proven ability to guide partners through complex solution designs and business strategy discussions. Deep curiosity and expertise in AI technologies, emerging trends, and design thinking methodologies. Clear communicator comfortable engaging at the CxO level, translating complex technical topics into actionable business insights. Experience facilitating workshops, design sessions, and collaborative innovation exercises that produce tangible outcomes. Experience in leveraging or critically thinking about how to integrate AI into work processes, decision-making, or problem-solving. Preferred & Standout Experience: ServiceNow platform development experience and/or ServiceNow certifications (CSA, CAD, CIS, architectural certifications). Design Thinking training or certification; experience applying human-centered design principles in partner-facing design and standards work. AI and automation expertise: knowledge of generative AI, predictive analytics, or automation tools in enterprise solutions. Business development background: experience developing partner go-to-market plans or new solution plays. Industry experience in Financial Services, Healthcare, Manufacturing, or Public Sector. Familiarity with competitive cloud or enterprise software platforms. What This Role Does Not Do Perform platform configuration, development, or solution delivery for partners (guides architecture, does not build). Own commercial contracts, pricing, or financial program management. Serve as dedicated partner-assigned resource (operates as pooled, forward-deployed engineering authority). Replace Partner Technology Architects for holistic partner strategy or business development. Manage day-to-day partner relationships (pooled resource; forward-deployed where solution-engineering depth is required). Travel for partner, customer, and organizational activities up to 25%. Additional Information Work Personas We approach our distributed world of work with flexibility and trust. Work personas (flexible, remote, or required in office) are categories that are assigned to ServiceNow employees depending on the nature of their work and their assigned work location. Learn more here. To determine eligibility for a work persona, ServiceNow may confirm the distance between your primary residence and the closest ServiceNow office using a third-party service. Equal Opportunity Employer ServiceNow is an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, national origin, age, disability, gender identity, veteran status, or any other category protected by law. In addition, all qualified applicants with arrest or conviction records will be considered for employment in accordance with legal requirements. Accommodations We strive to create an accessible and inclusive experience for all candidates. If you require a reasonable accommodation to complete any part of the application process, or are unable to use this online application and need an alternative method to apply, please contact globaltalentss@servicenow.com for assistance. Export Control Regulations For positions requiring access to controlled technology subject to export control regulations, including the U.S. Export Administration Regulations (EAR), ServiceNow may be required to obtain export control approval from government authorities for certain individuals. All employment is contingent upon ServiceNow obtaining any export license or other approval that may be required by relevant export control authorities. From Fortune. ©2026 F <script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);

  const S = Object.assign({ applied: {}, saved: {}, hidden: {} }, load(STATE_KEY, {}));

  // theme

  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

    const cur = document.documentElement.getAttribute('data-theme');

    document.documentElement.setAttribute('data-theme', next); save('jobhunt:theme', next);
  };

  const cs = COUNTRIES.filter(c => c.code !== 'REMOTE').map(c => c.flag + ' ' + c.name).join(', ');
  $('criteria').innerHTML = `<b>${esc(roles)}</b>${exp} · ${esc(cs)}${META.resume_name ? ' · scored against <b>' + esc(META.resume_name) + '</b>' : ''} · ${esc(META.generated || '')}`;
  const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));
  const blocked = new Set((DATA.sources || []).filter(s => s.status !== 'ok').map(s => s.source_name));
  $('stats').innerHTML = `<b>${JOBS.length}</b> jobs · <b>${okSources.size}</b> sources${blocked.size ? ` · <span title="${esc([...blocked].join(', '))}">${blocked.size} unavailable</span>` : ''}`;

  // sources panel
  const grid = $('srcGrid');
  const bySrc = {};
  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });
  grid.innerHTML = Object.keys(bySrc).sort().map(name => {
    const rows = bySrc[name];
    const total = rows.reduce((a, r) => a + (r.count || 0), 0);
    const bad = rows.filter(r => r.status !== 'ok');
    const cls = bad.length === rows.length ? (bad[0].status) : 'ok';
    const detail = rows.map(r => `${r.country}${r.status === 'ok' ? ':' + r.count : ' ' + r.status}`).join(' ');
    return `<div><span class="${cls}">●</span> ${esc(name)} <b>${total}</b> <span class="cc" title="${esc(bad.map(b => b.error || '').join('\n'))}">${esc(detail)}</span></div>`;
  }).join('');
  $('srcSummary').textContent = `Sources (${Object.keys(bySrc).length}) — click to see per-country counts; blocked platforms have direct search links under each country tab`;

  // fit chips
  const FITS = [['fit', 'Fit'], ['stretch', 'Stretch'], ['unknown', 'Unknown'], ['over', 'Overqualified'], ['no', 'Too senior']];
  function renderFitChips() {
    $('fitChips').innerHTML = FITS.map(([k, l]) => `<button class="chip ${ui.fits.includes(k) ? 'on' : ''}" data-fit="${k}">${l}</button>`).join('');
  }
  $('fitChips').onclick = e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;
    const k = b.dataset.fit; ui.fits = ui.fits.includes(k) ? ui.fits.filter(x => x !== k) : ui.fits.concat(k); persist(); render();
  };

  // sort options
  const SORTS = SCORED ? [['score', 'Best match'], ['date', 'Newest'], ['fit', 'Experience fit'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']]
                       : [['fit', 'Experience fit'], ['date', 'Newest'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']];
  $('sort').innerHTML = SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (!SCORED) $('scoreRange').style.display = 'none';

  // source select
  const srcNames = [...new Set(JOBS.map(j => j.source_name))].sort();
  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs
  function renderTabs(counts) {
    const tabs = [{ code: 'ALL', name: 'All', flag: '' }].concat(COUNTRIES);
    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src;
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  function card(j) {

    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>

    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }

  /* thin scrollbars that follow the page's light / dark theme */

    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }

</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
