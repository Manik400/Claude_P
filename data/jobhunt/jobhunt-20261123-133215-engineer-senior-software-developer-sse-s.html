al. We're growing fast and expanding into new markets. We trade options and delta one around the clock on the largest crypto venues. Our platform runs on a Linux bare-metal fleet alongside cloud deployments in the regions where exchanges run, with services written in Python and Rust. What will you do? You will make sure everything works, and works properly. Most problems don't stay inside one team's boundaries: a strange fill might come from a network issue, a config change, or an exchange that changed its behavior without telling anyone. You understand what each service does for trading, what it costs when it breaks, and which fix matters most right now. You own an issue from the first alert to the long-term fix that stops it coming back. You will: Own the live environment. Monitor trading across all our venues, take charge of incidents, and own both the immediate fix and the long-term one. Bridge infrastructure, engineering, and trading. Translate a trader's “something looks off” into a root cause, and a root cause into a priority the right team can act on. Partner with the desk. Work closely with traders and quants, so reliability work is driven by what actually matters for PnL and risk. Debug across the full stack. Linux and network performance, exchange connectivity, messaging and databases (Kafka, NATS, Redis, PostgreSQL/TimescaleDB, ClickHouse), and the Python and Rust trading services themselves. Own our hybrid infrastructure. Run the bare-metal fleet and cloud deployments, plus their configuration management and deployment pipelines across environments. Build observability. Use Prometheus/VictoriaMetrics, Grafana, Sentry, and Kibana to catch a problem before the trading desk does. Change things safely. Plan and run maintenance, upgrades, and releases without trading going dark. Raise the bar. Cut toil with automation, and spread SRE practices across Tech so every team builds reliable systems from the start. What we're looking for You'll need: 5+ years running production systems where uptime and correctness matter, in an SRE, DevOps, systems, or software engineering role. At least 2 years of that in a trading environment (a trading firm, exchange, or broker), working directly with live trading systems and traders. A working understanding of how trading systems operate: order and quote flow, positions and PnL, exchange connectivity, and why latency and correctness matter. A commercial mindset. You can weigh technical trade-offs against business impact and explain them clearly to traders and engineers alike. Strong Linux skills, including troubleshooting performance at the OS and kernel level. Solid networking fundamentals: TCP/IP, UDP, and multicast, plus comfort reading a packet capture. Hands-on experience running production workloads in a public cloud (AWS or similar): networking (VPCs, peering, cross-region latency), compute choices, and infrastructure as code (Terraform or similar). Proficiency in Python, and the ability to read and debug code you didn't write, including our Rust services. Hands-on experience with configuration management (Ansible or similar) and CI/CD. Experience operating at least some of our stack: Kafka, NATS, PostgreSQL, ClickHouse, Redis, Prometheus, or Grafana. Calm, structured incident handling, and clear communication in English under pressure. Bonus points for: Experience with options or crypto markets. Exchange connectivity experience (WebSocket or FIX APIs). Low-latency or market-making environments. Hands-on Rust experience. Much of our platform is written in it. Network hardware (Arista, Cisco), routing protocols, or packet capture tooling. Server hardware and kernel tuning for low latency. Running data-heavy systems such as time-series databases. Pay, location, and relocation Compensation: a competitive base salary plus a performance bonus based on individual and company results. Trading fund: outstanding performance is rewarded with the opportunity to buy into the trading fund. Location: On-site at our Amsterdam office Visa: BlockTech sponsors the Dutch highly skilled migrant visa. Relocation: All-in relocation package and Dutch classes for international hires. Eligible hires may qualify for the 30% ruling. What else is in it for you Pension plan, company laptop, and home internet reimbursement An extensive in-house training program and an annual learning and development budget An environment that embraces AI, both to speed up your work and to advance our systems Gym reimbursement and sports during working hours: kickboxing, CrossFit, fitness, and soccer Weekly Friday drinks, monthly outings, quarterly sports competitions, and two trips abroad a year Daily breakfast and warm lunch, plus snacks and drinks all day How we work We're a team of trading and tech enthusiasts with a flat hierarchy. Have an idea today, and it can ship tomorrow. The best idea wins, whoever it comes from. This role comes with a high degree of autonomy. You'll own hard problems from the first alert to the long-term fix and solve them your way. We promote reverse leadership, give everyone an equal playing field, and invest in personal and professional development. Ready to keep a 24/7 trading firm running? Make your move and apply! You can expect to hear back from us within 5 working days. Our culture At our core, we are a team of passionate trading and tech enthusiasts committed to revolutionizing trading through automation. Our collaborative approach ensures that everyone contributes to achieving our ambitious goals. In this role, you will be both challenged and stretched, with ample opportunities for growth and development, both within and beyond your main responsibilities. We invest in our people by offering competitive compensation and benefits, fostering innovation, and celebrating success. Our commitment to personal development transcends traditional norms; we provide an equal playing field, promote reverse leadership, and offer boundless growth opportunities for all our employees. Join us to unlock your potential and drive innovation in the exciting world of algorithmic trading. Find Jobs in Netherlands on Arbeitnow", "skills": ["Tech"], "employment_type": "Full Time", "exp_min": 2.0, "exp_max": null, "seniority": "senior", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 46.3, "matched_skills": ["linux", "kafka", "postgresql", "prometheus", "grafana", "timescaledb", "observability", "devops", "aws", "ci/cd", "english", "websockets"], "missing_skills": ["site reliability", "python", "rust", "redis", "clickhouse", "trading systems", "dutch", "team leadership"], "also_on": [], "query": "", "id": "0c8eaa55680c", "extra": {"salary_stated": false, "reloc": {"label": "yes", "relocation": "yes", "visa": "unknown", "evidence": "…Relocation: All-in relocation package and Dutch classes for international hires.…"}, "semantic": 0.377, "score_confidence": "high", "ai_summary": {"why": "Strong experience with Kafka, PostgreSQL, and AWS aligns with BlockTech's core infrastructure needs.", "gaps": "Lacks direct trading system experience and Python/Rust proficiency required for live trading environments."}, "is_mnc": false, "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Blocktech%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Amsterdam%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Blocktech%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Amsterdam%22"}, "Engineering managers": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Blocktech%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22Amsterdam%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Bl ssage, minus the manual work. We're 400+ people across three continents behind the leading platform for conversational growth, with AI skills shaping how we build, how we work, and how we grow. WHO WE'RE LOOKING FOR 🌟 Want to own how the backend works for everyone, not just one corner of it? We’re looking for a Senior Backend Engineer who works across PHP and Python and wants a say in the bigger picture. You’ll lead company-level projects like our Auth Service: one authorization layer for PHP and Python, so Python products can handle their traffic directly instead of going through PHP. When things are unclear, you’ll research first, weigh the trade-offs and write them down. Then you’ll ship in small, safe steps. You’ll also decide where code should live based on what’s best for the system, not on which language you know best. Product teams will come to you for advice, reviews, and a way through when they're stuck. The team is still taking shape, so you'll also help define ownership, standards, and how we work. If that mix of deep technical work and influence across teams sounds like you, keep reading. YOUR FUTURE TEAMMATES 👋 Meet the Backend Platform team: We're a small team of engineers from core PHP, Infra, and AI backgrounds. We lead technical initiatives across the whole backend and own its health. Product teams build and run their own components, and we give them the tools, standards, and expertise to do it well. Each of us leads our own project, from planning to agreeing with other teams to production. We work in weekly cycles and write our decisions down. Right now we're bringing PHP and Python platform work together into one common backend platform. WHAT YOU'LL DO 🚀 Lead company-level technical projects end to end, from design and planning to rollout and support, such as completing our Auth Service development and shaping authorization as a separate layer for PHP and Python. Shape the shared PHP and Python platform, and decide where each module should live based on the needs of the whole system. Build the foundations that let new Python products launch and scale without being wired through PHP each time. Define clear ownership of technical components across the backend, including who owns monitoring and knowledge for each. Improve how we spot and handle problems: bug and incident management, less noise in alerts and error tracking, and Grafana Cloud dashboards for how services interact. Find root causes across PHP and Python services using metrics, logs, and distributed tracing. Make performance part of everyday work, not something we fix after incidents: clear performance metrics, tools that show where things slow down, and analysis of unusual user behavior that causes degradation. Make architecture decisions with high load in mind, working with databases, servers, proxies, and DNS alongside the Infra team. Work with the Security team to fix vulnerabilities, build in security practices, and keep libraries and dependencies up to date. Improve developer experience: dev environment, CI/CD, routine automation, one documentation approach for PHP and Python, and tools for AI coding assistants. Turn product teams' requests into solutions: find what really hurts, propose the best fix, and support them with architecture advice and reviews in shared components. TO SHINE IN THIS ROLE 💥 You'll need: Production backend experience in PHP or Python, and the ability to read and work with the other. You'll write production code in both. Experience with high-load production systems and improving their performance. Experience designing multi-component systems with clear boundaries, planning for failures, rollout, and rollback, with security in mind. Experience comparing technical options, naming the trade-offs, and explaining your choice in writing (ADRs, Design Docs). Hands-on observability experience: metrics, dashboards, alerts, logs, and distributed tracing, and using them to find root causes. Experience leading a project that spans several teams: breaking it into small, testable steps, getting other teams on board, and taking it to production. A track record of improving engineering quality beyond your own tasks, for example setting up error monitoring, or a new process when things kept breaking. Enough infrastructure knowledge (databases, servers, proxies, DNS) to work well with Infra and see how your changes affect them. Clear communication: you explain your point of view, find the real problem behind a request, and flag risks early. Experience leading work independently while supporting your team: taking feedback, helping colleagues grow, and changing your mind when the arguments are good. It would be great if you have: Experience on a Platform or Core team. Strong production experience in both PHP and Python. Experience with authentication and authorization systems (for example, JWT or Ory Oathkeeper). Experience defining SLOs and building symptom-based alerts. Experience running incidents and blameless post-mortems. Experience with Grafana Cloud, Rollbar, or similar tools. Experience building developer tooling, CI/CD, or tools for AI coding assistants. Experience mentoring engineers or leading knowledge sharing across teams. WHAT WE OFFER 🤗 We care deeply about your growth, well-being, and comfort: 🌍 Hybrid onboarding to start work remotely and relocation support for you and your family. 💙 Comprehensive health insurance for both you and your family. 📚 Professional development budget for conference tickets, online courses, and other relevant resources to help you grow. 🫶 Flexible benefits package: no one-size-fits-all perks here. You get a budget and you decide where it goes, from health and wellbeing to family and setting up your home office. 🪴 Hybrid work and generous, flexible time off — planned with your team, not rationed by a rigid quota. 🍽️ In-office perks, including free meals and snacks. 🤝 Company-funded sport activities, annual offsites and team-building events. 🤖 AI isn't a perk here — it's how we work. Claude, OpenAI, and more are on by default from day one, and we back teams in adopting whatever makes them faster. Manychat is an Equal Opportunity Employer. We’re committed to building a diverse and inclusive team. We do not discriminate against qualified employees or applicants because of race, color, religion, gender identity, sex, sexual preference, sexual identity, pregnancy, national origin, ancestry, citizenship, age, marital status, physical disability, mental disability, medical condition, military status, or any other characteristic protected by local law or ordinance. This commitment is also reflected through our candidate experience. If you have individual needs that may require an accommodation during the interview process, please indicate this in your application. We will do our best to provide assistance throughout your interview process to ensure you’re set up for success. By submitting my application I acknowledge that I have read and understood the company’s Candidate Privacy Statement available at Candidate Privacy Statement Find Jobs in Netherlands on Arbeitnow", "skills": ["Engineering"], "employment_type": "Full Time", "exp_min": null, "exp_max": null, "seniority": "senior", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Very fresh", "relevance": 1.0, "score": 39.1, "matched_skills": ["grafana", "ci/cd", "observability"], "missing_skills": ["php", "python", "artificial intelligence", "monitoring", "dns", "jwt", "mentoring", "openai"], "also_on": [], "query": "", "id": "717e4b0e829b", "extra": {"salary_stated": false, "reloc": {"label": "yes", "relocation": "yes", "visa": "unknown", "evidence": "…WE OFFER 🤗 We care deeply about your growth, well-being, and comfort: 🌍 Hybrid onboarding to start work remotely and relocation support for you and your family.…"}, "semantic": 0.578, "score_confidence": "high", "ai_summary": {"why": "Strong experience with Kafka, PostgreSQL, and AW ", "country": "DE", "location": "Bordeaux, France", "remote": false, "posted": "2026-11-22", "posted_at": "2026-11-22T15:40:13+00:00", "posted_raw": 1795362013, "salary": "", "snippet": "Here at The Exploration Company, we are building spacecraft for humanity. The heart of a spacecraft lies in its propulsion system, and that's why we, at The Exploration Company, are dedicated to developing our own cutting-edge Propulsion Systems ensuring the highest level of efficiency and reliability in our space endeavours. We want you as a talented Propulsion Functional Systems Engineer to cont", "description": "Here at The Exploration Company, we are building spacecraft for humanity. The heart of a spacecraft lies in its propulsion system, and that's why we, at The Exploration Company, are dedicated to developing our own cutting-edge Propulsion Systems ensuring the highest level of efficiency and reliability in our space endeavours. We want you as a talented Propulsion Functional Systems Engineer to contribute to the development, testing, analysis, prediction and refinement of the functional architecture for Nyx Earth Propulsion System Development Models. In order to derisk and gain confidence on the flight propulsion system, different development models are being built in order to run a multitude of tests spanning from functional tests, cold flows to system level hot fires. This testing will allow for the verification and validation of all the propulsion subsystems. You will be responsible for bridging the gap between design and hardware testing for the Nyx spacecraft propulsion system. As such, you will work closely with both the design and testing teams to ensure seamless integration and validation of propulsion subsystems. You will report to the Propulsion Development Models Principal Engineer. Key responsibilities: In your capacity as a Propulsion Functional Systems Engineer, you will be responsible for the development of analysis, post processing, and prediction tools that can support testing and design activities linked to the propulsion sub-systems. Your role will be continuously evolving, but day-to-day responsibilities will include: During the Design Phase: Work closely with the pressure and feed system engineers to define the best configuration of the test setups, ensuring a high level of representativeness and testability to conduct all fluid modelling and analyses to verify repeatability of the test rigs with the flight systems and to perform test predictions. Support on the creation of test plans for propulsion subsystems (from a modeling perspective), including data acquisition, analysis, and reporting to ensure the performance of the system can be assessed. Design and develop propulsion analysis and post processing tools, to support testing activities and design maturation Work in close collaboration with the pressure and feed system engineers to ensure the anchoring of the different fluidic models and assess against test data During testing phase: Provide on-site support during propulsion test campaigns, working closely with the test operator and test conductor. Perform test campaigns, analysing in real-time, through different test parameters and ensure test results with timely resolution of any anomaly arising during testing. Conduct pre-test and post-test reviews and elaborate the test reports. Update and correlate the fluidic models based on test results. Provide actionable insights to identify key performance indicators and potential critical scenarios What we would love to see from you: A minimum of a bachelor's degree in a related Engineering discipline. +3 years of related experience in complex fluid systems, fluidic modeling, data analysis and data post processing. Strong engineering fundamentals in thermodynamics, fluid dynamics, and combustion principles. Familiarity with test facilities, or storable propulsion systems is an asset Experience in propulsion systems storable or cryogenic fluidic systems is a plus. Proficiency in python for fluid analyses, data post processing and model anchoring. Experience in EcosimPro (or similar software) for the high fidelity analysis of numerical twins. Proficiency in conducting fluid analyses using classical hand calculations Excellent collaboration skills for working effectively across multidisciplinary teams. Fluency in English. Skills and Behaviours: Strong oral and written communication skills. Strong analysis and problem-solving skills. Strong organizing and prioritization of tasks. Strong team player with a proactive mindset. Positive and flexible attitude to get the job done. Ability to communicate at all levels of the business. Demonstrates behaviours consistent with The Exploration Company’s core values of Mission, Vision, Integrity, Excellence and Teamwork. Space enthusiast, ready to change the European space industry. Nice to have, Ecosim experience Why you should join us! What makes us special here at The Exploration Company and why we think you will enjoy working here is: We’re Agile - we make decisions fast whilst keeping our goals and systems in mind We’re Open and Collaborative - we are transparent about risks and obstacles, so that we can cooperate to overcome them We have a lot of Fun - we refuel our energy knowing we are democratising space. It’s a wonderful and rare opportunity, are YOU up for the challenge? We'd love to hear from you if you wish to be a part of our journey. Please submit your CV now for immediate consideration and we will be in touch shortly. The Exploration Company is an equal opportunity employer and values diversity. We do not discriminate based on race, religion, colour, national origin, gender, sexual orientation, age, marital status or disability status. Relocation assistance is provided for those willing to relocate including visa sponsorship where applicable. All offers are contingent upon the successful completion of a background check, which will be subject to the country, role, and project       <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>

    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }

  .tb-toggle::after { content: "\25B4"; font-size: 0.7rem; }
  .tb-hidden .tb-toggle::after { content: "\25BE"; }

  /* thin scrollbars that follow the page's light / dark theme */
  :root { color-scheme: light dark; } :root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }

  }

    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {

</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
