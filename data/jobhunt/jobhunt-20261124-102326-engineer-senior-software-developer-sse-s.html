ery hiring decision explainable, auditable, and fair. We are a small, product-focused team in Mumbai running a live production platform used in real hiring workflows. Our product spans a proctored web coding IDE, a recruiter decision console, isolated code-execution pipelines, and automated integrity and code-quality analysis services. Everything is built and owned in-house, end to end. THE ROLE We’re looking for a Software Engineer to work across the full stack rather than a single siloed layer. Our system combines event-driven workflows, service-to-service APIs, and real-time client communication—so your work will span React interfaces, TypeScript and Python backend services, PostgreSQL data models, and asynchronous job queues. At this stage of our growth, the core engineering focus is scale, reliability, and hardening—driving down end-to-end latency, optimizing database queries, refining access controls, and strengthening distributed concurrency. This role fits someone who reads how a production system actually behaves before changing it, and who ships verified fixes over quick guesses. WHAT YOU’LL OWN • Candidate Coding Experience: Build and harden our browser-based IDE—editing workflows, resilient autosave, live execution feedback over WebSockets, pre-assessment environment checks, and reliable media uploads. • Recruiter Decision Console: Develop the dashboard hiring managers rely on under time pressure—candidate reports, code-quality and integrity breakdowns, session timelines, review queues, and synchronized media playback. • Core Backend & Orchestration: Design and scale APIs and state machines handling assessment lifecycles, candidate sessions, RBAC, usage accounting, and asynchronous workflows with clean contracts and idempotent failure handling. • Analysis & Scoring Pipelines: Extend our code-quality and integrity pipelines across deterministic scoring rules, telemetry processing, computer-vision signals, and bounded LLM integrations—keeping results accurate and explainable. • Reliability & Observability: Improve resilience across execution sandboxes, PostgreSQL databases, Redis queues, and object storage. Debug issues with distributed traces and metrics, and back every fix with regression tests. OUR STACK You don't need prior fluency in every tool, but you should be strong in TypeScript and comfortable moving across frontend state, backend APIs, SQL query plans, and Python services: • Frontend: React, TypeScript, Vite, Tailwind CSS, TanStack Query, Monaco Editor, Socket.IO, browser media/WASM APIs • Backend: Node.js (NestJS, Prisma, Express), Python (FastAPI) • Data & Async: PostgreSQL, Redis, S3-compatible object storage, BullMQ, Celery, Server-Sent Events • Infra & Observability: Docker, Linux, GitHub Actions, OpenTelemetry, Prometheus, Grafana, k6 WHAT WE’RE LOOKING FOR • 1–4 years of production experience shipping full-stack web applications (or equivalent demonstrated depth). • Strong TypeScript & React fundamentals—able to reason across UI state, API lifecycles, and relational schemas in the same afternoon. • Solid backend engineering: Practical grasp of HTTP semantics, auth/RBAC, idempotency, transactions, and fault-tolerant queue retries. • PostgreSQL beyond CRUD: Comfortable with joins, indexing, migrations, and reading EXPLAIN plans. • High engineering rigor: You verify changes with tests, traces, or benchmarks before calling them done. • Immediate availability to join our Mumbai office (Hybrid). Bonus points for: A live project or readable GitHub repo with real users; experience debugging distributed race conditions or retry storms; production LLM or media/computer-vision integrations; Python async services (FastAPI/Celery); or work in audited domains like HR tech or fintech. HOW WE ENGINEER • Contract-first APIs: Shared schemas, pagination standards, and permission models are strictly typed across services. • Verification by default: Bug fixes ship with regression tests; auth changes include negative (403) tests; performance work includes measurements. • Zero-downtime evolution: Database and API changes roll out via staged, backward-compatible migrations. • Safe rollouts & CI guardrails: Feature flags, shadow-mode validation for automated scoring, and automated CI checks for timeouts and bounded queries. HOW TO APPLY Please apply at https://qualifycode.com/careers (and include the following in your application or Wellfound note): 1. A working link to something you built (a live product, open-source contribution, or GitHub repo we can read). 2. One line on which part of our stack or problem space you’d most want to own.", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 72.8, "matched_skills": ["typescript", "postgresql", "react", "observability", "concurrency", "websockets", "sql", "s3", "docker", "linux", "github actions", "prometheus"], "missing_skills": ["python", "artificial intelligence", "llm", "redis", "fastapi", "event-driven", "vite", "tailwind"], "also_on": [], "query": "software-engineer", "id": "wf5081971", "extra": {"company_size": "SIZE_1_10", "salary_stated": true, "salary_inr": 2000000, "salary_lpa": 20.0, "salary_text": "₹12L – ₹20L • No equity", "semantic": 0.455, "score_confidence": "high", "ai_summary": {"why": "Strong match in event-driven architecture, PostgreSQL optimization, and distributed systems. Experience with Kafka, TimescaleDB, and AWS aligns with core backend requirements.", "gaps": "Candidate lacks Python, AI/LLM skills, and specific frontend tools like Vite/Tailwind, which are critical for this role."}, "is_mnc": false, "lpa": 20.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0, "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keyword ole. * Comfort with systems software, not only CRUD apps: graph data structures, execution order, concurrency, serialisation, plugin loading, and clear module boundaries. * Ability to work in a multi-process / client-server product (editor, backend, compute hosts) and decide what belongs on which side of the wire. * Solid git hygiene, willingness to write unit and behavioural tests, and the habit of reading before rewriting. * Clear written and spoken English, and the ability to discuss design trade-offs in person. * Comfort working full-time on-site in Gurugram. This is not a remote or hybrid-by-default role; relocate to NCR if you are not already here. * Demonstrated work. A computer-science degree is not required. * Willingness to show skill through an open-ended assignment or a research/prototype proposal you suggest - we do not hire on timed algorithm drills. **Nice to have** * AEC technology: Grasshopper, RhinoCommon, Revit API, Dynamo, ShapeDiver, Speckle, or shipping plugins and configurators. * AI agent loops: tool-calling agents, MCP servers or clients, eval harnesses, or spec-driven agentic products - not only using a chatbot. * IDE / language tooling: editors, language servers, compilers, REPLs, debuggers, node canvases, or developer-tool UX. * Visual / dataflow programming: node-wire environments, event-driven runtimes, or comparable graph UIs. * Avalonia, WPF, canvas/Skia, WebAssembly, gRPC, Protocol Buffers, or ASP.NET Core. * C++, Unity, Python for embedding, or collaborative editing (CRDT or OT).", "skills": [], "employment_type": "full-time", "exp_min": 1, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 63.8, "matched_skills": ["c#", ".net", "data structures", "concurrency", "english"], "missing_skills": ["artificial intelligence", "unity", "grpc", "ai agents", "node.js", "git", "ui/ux", "event-driven"], "also_on": [], "query": "software-eng OS capabilities. You will focus on the TypeScript and Electron side of features such as Autotype, the SSH agent, and the DuckDuckGo integration, collaborating closely with Rust engineers and teams working on the vault and desktop platform. This role is primarily for someone strong in TypeScript, Electron, and modern application development who enjoys solving cross-platform challenges in a zero-knowledge, end-to-end encrypted product. Rust expertise is a plus, not a requirement. **WHAT YOU WILL DO** - Design, build, and maintain TypeScript/Electron components for Desktop Native features, including Autotype, the SSH agent, and the DuckDuckGo integration. - Develop end-to-end desktop workflows across Angular/TypeScript UI, Electron main and preload processes, and Node.js integrations. - Work with Rust engineers to integrate native modules, well-defined application interfaces, and OS-level capabilities on Windows, macOS, and Linux. - Design and maintain secure IPC and native integration boundaries, with particular care for sensitive credential data. - Partner with product, design, QA, Platform, and Vault teams to deliver reliable, user-friendly experiences across the desktop application. - Improve performance, reliability, accessibility, and maintainability through automated tests and cross-platform debugging. - Review pull requests and help raise the quality of TypeScript/Electron engineering, including community contributions on GitHub. - Identify technical debt and contribute to pragmatic refactoring, architecture improvements, and technical documentation. - Participate in technical design discussions, code reviews, and sharing knowledge across the team. - Independently plan, estimate, and deliver new feature work and bug fixes in a collaborative, distributed engineering environment. **WHAT YOU BRING TO BITWARDEN** - Strong production TypeScript/JavaScript experience — 4–6+ years of professional software engineering experience. - Hands-on experience developing Electron desktop applications, including main and renderer processes, preload scripts, and IPC. - Experience with Angular or a comparable modern front-end framework, and building maintainable user-facing applications. - Strong understanding of Node.js, asynchronous application code, and secure handling of sensitive data across process boundaries. - Experience testing, debugging, and shipping applications across desktop operating systems such as Windows, macOS, and Linux. - Experience using AI tooling in your development and testing workflow (Anthropic Claude preferred). - Familiarity with Rust, native Node.js modules (N-API), or OS-level integrations is a plus, not a requirement. - Collaborative and adaptable mindset. - Openness and authenticity combined with excellent communication skills. - Excitement and enthusiasm for open source and for better internet security. - Excellent problem-solving skills – you might not know all the answers, but you know how to find and communicate the solution. **WHY WORK WITH US** - Our user community loves us and we love them. Come to work each day with a sense of purpose as we bring a more secure internet experience to everyone from our friends and family to the world’s largest organizations. - Become an expert. You’ll get immersed in the prominent technology markets of security and open source software. - We are dedicated to building a diverse and talented team. Work remotely with motivated and supportive team members across the world. - Learn and grow. Take on new challenges with the support of your team, and join our #growth-club to continue personal and professional development. - At Bitwarden, we are passionate about what we do, but not necessarily everything we do. Our engineering team makes it a policy to carve out some time for personal growth, learning, skill building and pursuing personal passions that positively impact the team and company. To ensure that everyone has time to reaffirm their purpose and grow, you are encouraged sential operating layer for commercial service businesses. We are past zero. Customers are actively using our products, and we are scaling rapidly. The next phase requires engineers who can build reliable systems, move quickly, and take ownership beyond just completing assigned tasks. ## THE ROLE As a Senior Software Engineer at Clara AI, you will be a hands-on engineer responsible for building and scaling AI-native products from concept to production. You will work closely with product, engineering, and customers to understand problems, design solutions, and ship production-quality software. This is not a role where you simply execute predefined technical tasks. We are looking for engineers who can identify problems, make sound technical decisions, and own solutions end-to-end. ## WHAT YOU'LL OWN ### Build AI-native products You will work on products where AI is a core capability. You may work across: * AI agents and autonomous workflows * LLM-powered applications * Intelligent automation systems * Knowledge retrieval and reasoning systems * AI evaluation and improvement frameworks ### Own technical problems end-to-end You will: * Design and build production systems * Make technical decisions and evaluate tradeoffs * Build scalable APIs and backend systems * Work across the stack where required * Debug complex technical problems * Improve system reliability, performance, and maintainability * Take ownership of features from idea to production ### Work closely with product and customers You will work closely with product and business teams to understand real customer problems and translate them into technical solutions. You will be expected to think beyond the implementation and understand the business impact of what you build. ### Stay hands-on This is a highly hands-on engineering role. You will: * Write production-quality code * Prototype and test new ideas * Participate in architecture and system design discussions * Review code and improve engineering practices * Use AI tools extensively to improve engineering velocity * Continuously learn and adapt to new technologies ## WHAT SUCCESS LOOKS LIKE ### First 30 Days * Build strong context around Clara AI's technology and customers * Understand existing systems and engineering practices * Start shipping meaningful improvements * Identify opportunities to improve product or engineering velocity ### First 60 Days * Own significant technical initiatives * Deliver production features independently * Improve system quality, reliability, or performance * Contribute meaningfully to architecture and technical decisions ### First 90 Days * Independently own important areas of the product * Ship meaningful AI-native capabilities * Raise engineering quality and technical standards * Become a reliable technical owner within the team ## WHO WE'RE LOOKING FOR ### Must Have * **3–7 years of software engineering experience** * Strong hands-on engineering background * Experience building and scaling production systems * Strong problem-solving and engineering fundamentals * Experience owning features or technical initiatives end-to-end * Strong understanding of backend systems and APIs * Product mindset and ability to understand customer problems * Comfortable working in ambiguity and fast-changing environments ### Strong Signals * Has been an early engineer or worked in a startup environment * Has built products or features from zero to one * Experience with AI-powered products or LLM applications * Uses AI tools extensively to improve engineering velocity * Strong full-stack experience * Has worked closely with product or customers * Demonstrates strong ownership beyond their defined role * Has a track record of learning new technologies quickly ## TECHNICAL EXPECTATIONS Experience with some of the following: * MERN stack: React, Node.js, TypeScript * Backend architecture and APIs * Databases and distributed systems * Cloud infrastructure * AI/LLM applications * Agentic workflows * System design and scalability We value strong engineering judgment and the ability to learn quickly over specific technology keywords. ## THIS IS NOT FOR YOU IF * You prefer only executing predefined technical tasks * You need a highly structured or mature engineering environment * You avoid product or customer discussions * You are not excited about building with AI * You are uncomfortable taking ownership beyond your immediate task * You prefer optimizing for technical complexity over solving real customer problems ## WHAT WE OFFER ### High Ownership Own meaningful technical problems and see your work directly impact the product. ### Build with AI Work on products where AI is fundamentally changing how businesses operate. ### Direct Impact Your work will power products used by real businesses every day. ### High Autonomy Identify problems, propose solutions, make technical decisions, and build. **Bangalore · Full-time · AI-native environment**", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "senior", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 50.5, "matched_skills": ["system design", "react", "typescript", "distributed systems"], "missing_skills": ["artificial intelligence", "ai agents", "llm", "node.js", "scalability"], "also_on": [], "query": "software-engineer", "id": "wf4735247", "extra": {"company_size": "SIZE_51_200", "salary_stated": false, "semantic": 0.337, "score_confidence": "high", "is_mnc": false}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Senior Software Engineer – Java / Golang", "company": "SWITS DIGITAL Private Limited", "url": "https://www.linkedin.com/jobs/view/4493631965", "country": "IN", "location": "Pune/Pimpri-Chinchwad Area", "remote": null, "posted": "2026-11-23", "posted_at": "2026-11-23T12:10:38.180773+00:00", "posted_raw": "22 hours ago", "salary": "", "snippet": "", "description": "", "skills": [], "emp the biggest brands in ecommerce, such as Sephor", "snippet": "## **About Us:** Constructor is the only search and product discovery platform tailor-made for enterprise ecommerce where conversions matter. Constructor's AI-first solutions make it easier for shoppers to discover products they want to buy and for ecommerce teams to deliver highly personalized experiences that drive impressive results. Optimizing specifically for ecommerce metrics like revenue, c", "description": "## **About Us:** Constructor is the only search and product discovery platform tailor-made for enterprise ecommerce where conversions matter. Constructor's AI-first solutions make it easier for shoppers to discover products they want to buy and for ecommerce teams to deliver highly personalized experiences that drive impressive results. Optimizing specifically for ecommerce metrics like revenue, conversion rate and profit, Constructor generates consistent $10M+ lifts for some of the biggest brands in ecommerce, such as Sephora, Petco, home24, Maxeda Brands, Birkenstock and The Very Group. Constructor is a U.S. based company that was founded in 2015 by Eli Finkelshteyn and Dan McCormick. ## **About the Team** We're a passionate team that loves challenges and wants to make people’s lives better. We value openness, curiosity, and continuous improvement. We believe that empowering everyone in a company to do what they think is best can lead to great things. ## **Role Overview** As a Sales Engineer, you will lead the technical components of the sales process. You will partner closely with Account Executives and prospective customers to design integration approaches, evaluate technical fit, and demonstrate how Constructor’s platform drives measurable business impact. This role combines technical architecture design, consultative discovery, and cross-functional collaboration. You will act as a bridge between customer engineering teams and Constructor’s Product and Engineering teams. This is **_not_** a demo-heavy role. Account Executives perform the majority of demonstrations at Constructor. This role requires **architectural thinking, integration planning, and consultative problem-solving.** ## **Key Responsibilities** ### **Technical Sales & Solution Design** - Lead technical discovery and solution design for prospective customers - Design and document integration architectures (APIs, ecommerce platforms, PIM, CMS, data pipelines) - Develop and support tailored Proof Schedules *(deeply tailored, data-backed custom demo, similar to a “proof of value”)* - Deliver technical presentations to both business and technical stakeholders - Serve as primary technical advisor during evaluation cycles - Troubleshoot and triage APIs, SDKs, and integration patterns - Willingness to tinker and build demo prototypes and tooling - Build and present compelling custom technical demonstrations and integration blueprints tailored to each sales opportunity - Support RFP and RFI responses ### **Cross-Functional Collaboration** - Partner with Product and Engineering to surface prospective customer feedback to influence product roadmap and integration strategy - Contribute insights to the roadmap and the go-to-market strategy - Support enablement and training for sales teams - Help refine documentation, processes, and best practices within the SE function ### **Market & Industry Engagement** - Stay current on ecommerce trends, AI/ML advancements, and the competitive landscape - Represent Constructor in prospect meetings, partner engagements, field events, and other industry engagements - Build strong relationships with prospective customer technical stakeholders (architects, engineers, delivery teams) ## **Required Qualifications & Skills** - 3+ years of experience in technical Solutions Engineering, Sales Engineering, Pre-Sales Architect, or Technical Pre-Sales roles - Deep hands-on experience with API-first platforms: comfortable working directly with REST APIs, JSON data structures, webhooks, and SDK integration patterns, and able to troubleshoot them with Postman or similar tools - Working knowledge of JavaScript, TypeScript, Python, or similar languages, enough to read integration code, debug client-side implementations, and build lightweight prototypes or demo tooling - Experience designing and running custom demos or pilots with clear, business-aligned success criteria - Hands-on experience with coding agents to automate workflows, amplify impact, and execute at scale - Ability to read the room, tailor your communication to diverse audiences, and identify detractors, champions, and key decision-makers - Strong written and verbal communication, with a track record of producing clear technical documentation and explaining complex ideas to developers, architects, and C-suite executives alike - Ability to effectively articulate complex ideas to both technical and non-technical audiences - Ability to empathize with prospects’ challenges and goals - Skilled listener with innate curiosity - Passionate about innovative technology, technical sales, and articulating value to prospects - Enjoys working with prospects and is comfortable interacting with C-suite executives from both technical and business perspectives ## **Preferred Qualifications** - Experience in enterprise ecommerce or retail technology environments - Hands-on familiarity with at least two major ecommerce platforms, including how each handles catalog structure, extensions, and headless versus templated frontends - Deep understanding of data mapping between backend systems such as PIM, ERP, or legacy search indexes into a new target schema, possibly including product and variant structures, facets, attributes, and pricing logic - Working knowledge of search and discovery concepts - Experience supporting security reviews and procurement requirements, including GDPR, data processing agreements, data residency, and ISO 27001 or SOC 2 questionnaires - Ability to build business value models that connect search improvements to revenue, conversion, or average order value - Exposure to conversational or agentic shopping experiences, or retail media and sponsored product programs ## **What Success Looks Like** - Prospects clearly understand technical integration paths - Proof Schedules*(deeply tailored, data-backed custom demo, similar to a “proof of value”)* align tightly with business outcomes - Technical objections are addressed proactively and effectively - Sales cycles are accelerated through a strong technical partnership - Product and Engineering receive actionable, structured market feedback - Qualitative (peer and prospect feedback) and quantitative (sales metrics and customer health scores) feedback will be positive and ideally, excellent ## **Working Style** - Comfortable operating in a remote, distributed, and highly cross-functional environment - Able to manage multiple sales engagements and priorities simultaneously - A builder mindset that is proactive in creating structure in ambiguous environments - Highly collaborative with a strong sense of ownership and autonomy - Commercially aware and aligned with revenue and sales growth goals - Resourceful self-starter who can operate autonomously **You’ll Thrive Here If…** You’re a curious, skilled listener who genuinely enjoys untangling a prospect’s technical challenges. You get energy from tinkering and building, whether that’s a quick prototype, an integration blueprint, or a better internal process. You’re as comfortable whiteboarding with an engineering team as you are presenting to a CTO. And you have a competitive streak—not just to win the technical evaluation, but to show how the right technical decisions drive meaningful business results. ## **Benefits** - 🏝️ Unlimited vacation time -we strongly encourage all of our employees take at least 3 weeks per year - 💰 A competitive compensation package including stock options - 🌎 Fully remote team - choose where you live - 🛋️ Work from home s rs the complete embedded development lifecycle, including architecture, implementation, hardware bring-up, debugging, testing, optimization, and production support. ### What You’ll Do **Real-Time Firmware Development** - Develop and maintain embedded firmware using C and C++. - Build real-time firmware for drone gimbals, stabilization systems, avionics, and related subsystems. - Develop bare-metal and RTOS-based applications for STM32, ESP32, and similar microcontrollers. - Design concurrent firmware components, interrupt-driven systems, and timing-critical control functions. - Optimize firmware for execution speed, memory usage, power consumption, and reliability. **Drone Communication and Subsystem Integration** - Develop communication interfaces between flight controllers, gimbals, sensors, payloads, motor controllers, and onboard computers. - Implement and debug communication protocols such as UART, SPI, I2C, CAN, and RS-485. - Support integration with wireless communication technologies such as Bluetooth Low Energy and Wi-Fi. - Develop reliable data handling, device management, error detection, and recovery mechanisms. - Diagnose communication and integration issues across multiple embedded subsystems. **Gimbal and Motor-Control Systems** - Develop firmware for gimbal control, stabilization, sensing, and motor-drive systems. - Integrate IMUs, encoders, motor drivers, and other motion-control sensors. - Work with BLDC motors, motor controllers, and electronic speed controllers. - Support the implementation and tuning of control algorithms for stabilization and motor control. - Diagnose timing, vibration, sensor, communication, and control-related issues. **Hardware Bring-Up and Device Drivers** - Develop and maintain board support packages, hardware-abstraction layers, and device drivers. - Bring up new microcontroller-based boards and validate clocks, memory, power sequencing, peripherals, and communication interfaces. - Port firmware to new hardware platforms and microcontroller variants. - Read electronic schematics and component datasheets to support firmware development and debugging. - Collaborate with hardware engineers to diagnose board-level and hardware-software integration issues. **Bootloaders and Firmware Updates** - Develop and maintain bootloaders and firmware-update mechanisms. - Support wired and wireless firmware-update workflows. - Implement firmware validation, rollback, recovery, and fail-safe mechanisms. - Improve the reliability and usability of production programming and update processes. **Debugging, Testing, and Validation** - Debug firmware using hardware debuggers, oscilloscopes, logic analyzers, and other laboratory instruments. - Develop unit, integration, hardware-in-the-loop, and system-level tests. - Investigate firmware defects, timing issues, memory corruption, communication failures, and hardware faults. - Perform root-cause analysis and implement corrective actions. - Support bench testing, field testing, flight trials, and production validation. - Maintain test procedures, debugging records, and technical documentation. **Production and Engineering Support** - Improve firmware build, programming, calibration, and production-test workflows. - Support manufacturing teams during board programming, testing, and failure analysis. - Use Git for version control, collaboration, code review, and release management. - Work with hardware, avionics, controls, and flight-test teams to resolve system-level issues. - Maintain clear documentation for firmware architecture, interfaces, configuration, and releases. ### Required Qualifications and Skills - Strong hands-on experience with Embedded C/C++ and low-level programming. - Experience with bare-metal development and microcontrollers such as STM32, ESP32, or similar platforms. - Understanding of microcontroller peripherals, interrupts, timers, ADCs, DMA, memory, and watchdogs. - Experience with UART, SPI, I2C, CAN, RS-485, and related embedded communication protocols. - Understanding of RTOS concepts, task scheduling, synchronization, concurrency, and inter-process communication. - Experience developing device drivers, board support packages, and hardware-abstraction layers. - Knowledge of bootloader development and firmware-update mechanisms. - Strong firmware debugging and root-cause analysis skills. - Experience using hardware debuggers, oscilloscopes, logic analyzers, and other laboratory instruments. - Ability to read electronic schematics, component datasheets, and technical documentation. - Basic hardware fault-finding and board bring-up skills. - Familiarity with Git and software version-control practices. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience with drones, UAV avionics, autopilots, or gimbal systems. - Knowledge of BLDC motors, motor drivers, electronic speed controllers, and motor-control techniques. - Experience integrating IMUs, encoders, cameras, or other UAV sensors and payloads. - Experience with Bluetooth Low Energy, Wi-Fi, or other wireless communication technologies. - Familiarity with control systems, sensor fusion, and stabilization algorithms. - Experience with PX4, ArduPilot, MAVLink, or similar UAV technologies. - Exposure to FPGA development and FPGA-microcontroller integration. - Experience taking embedded products from prototype through manufacturing and production. **Experience:** 2+ years in embedded software or firmware development. **Education:** B.E./B.Tech in Electronics and Communication, Electrical and Electronics, Instrumentation, Computer Science, or a related field.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 38.2, "matched_skills": ["data structures", "code review", "concurrency", "c"], "missing_skill hi", "remote": true, "posted": "2026-11-23", "posted_at": "2026-11-23T12:47:12+00:00", "posted_raw": "", "salary": "$13k – $20k • No equity", "snippet": "- **Company:** Wisetr Technology Pvt. Ltd. (FunnelKit and Sublium are brands of Wisetr Technology Pvt. Ltd.) - **Websites:** [www.funnelkit.com](https://www.funnelkit.com) | [www.sublium.com](https://www.sublium.com) - **Location:** Remote (candidates across the globe can apply) - **Employment type:** Full-time, permanent - **Experience:** 3+ years building and running AI/ML or LLM-based features", "description": "- **Company:** Wisetr Technology Pvt. Ltd. (FunnelKit and Sublium are brands of Wisetr Technology Pvt. Ltd.) - **Websites:** [www.funnelkit.com](https://www.funnelkit.com) | [www.sublium.com](https://www.sublium.com) - **Location:** Remote (candidates across the globe can apply) - **Employment type:** Full-time, permanent - **Experience:** 3+ years building and running AI/ML or LLM-based features inside production software used by paying customers (prototypes alone do not count) - **Education:** B.E./B.Tech in Computer Science, Information Technology, Electronics or a related field, or an equivalent strong engineering background. Proficiency in Python, PostgreSQL and TypeScript is required. - **Working days and hours:** 5 days, Monday to Friday ## About FunnelKit FunnelKit builds powerful no-code funnel and marketing automation products for businesses worldwide. Our mission is to help small businesses grow profitably by giving them the right tools to increase conversions and revenue, without unnecessary complexity. We are a product-first, customer-driven team that values ownership, simplicity, kindness, and excellence. ## Role Overview This role is ideal for someone who: - Treats AI as an engineering discipline: you design for results a store owner can rely on, and you test that reliability instead of stopping once the model responds. - Has spent 3+ years putting AI/ML and LLM features in front of paying customers in a live product. - Picks up an ambiguous problem, decides how to attack it, and delivers without close direction. - Writes and speaks clear English, and can walk engineers, designers, product managers and support colleagues through a technical trade-off. At FunnelKit and Sublium, AI sits inside the tools merchants use every day: suggesting funnel and checkout improvements, drafting email and on-site copy, grouping customers into segments, and automating routine marketing work. You will build these capabilities, along with the internal AI tooling our own teams use for reporting and decision support. You will carry a project from first data exploration through model choice, evaluation, API and interface work, release and production monitoring, working daily with Product, Engineering, Design, QA and Customer Success. ## Key Responsibilities **Build AI Features for Merchants** - Ship AI capabilities inside FunnelKit and Sublium, such as funnel and checkout recommendations, email and SMS copy drafting, customer segmentation, revenue forecasting and agent-style automations. - Take a merchant's goal and store data and produce suggestions concrete enough to act on. After launch, study real usage and plan the next iteration. - Agree success metrics and event tracking with the Product Manager before you build. **Design the LLM Layer** - Create prompt templates, schema-validated responses, tool calls, retrieval (RAG) and safety checks, and chain them into multi-step agent flows where they add value. - Compare models, frameworks and hosting options for each use case against quality, response time and spend. - Add fallback providers, response caching and spend limits so features stay dependable at scale. **Work with Data** - Prepare imperfect store, funnel and event data for analysis and for use as model input. - Anchor generated text to real figures from the merchant's account, so AI output never contains invented numbers. - Run the pipelines that collect, transform and serve this data to AI features and internal reports. **Measure and Protect Quality** - Build evaluation sets and monitoring so you can show that each release beats the previous one and catch regressions before merchants do. - Report quality, latency and per-request cost on dashboards shared with the team. - Help QA design tests for output that changes from run to run. **Own Delivery End to End** - Implement the backend services (Python or TypeScript) and the TypeScript and React interface that carry a result to the merchant, and deploy them. **Build Internal AI Tools** - Create AI-assisted reporting, analytics and workflow tools for Support, Marketing and Product teams, simple enough that non-engineers use them without help. **Engineering Habits and Sharing** - Deliver tested, maintainable code with error handling, logging and tracing. - Use AI coding assistants daily, and check their output before it is merged. - Write down how each solution works and how AI helped build it, so colleagues can reuse the approach. - Follow developments in models and tooling, and propose what is worth adopting. **Collaboration and Customer Support** - Work with Product, Design, QA and Customer Success to turn customer problems into improvements. - Set privacy, safety and compliance rules for AI features, with legal and security input where needed. - Make features explainable to L1/L2 support teams, and help diagnose serious production problems. ## Required Skills and Experience - **Production AI experience:** 3+ years shipping ML or LLM-based functionality that customers actually use. Prototypes and hackathon projects alone are not enough. - **Python (required):** production-quality code with tests, type annotations, packaging and async where it fits. - **TypeScript (required):** production-quality TypeScript with strict typing and tests, for Node.js services and for React interfaces. - **Full-stack range:** comfortable on both sides, with backend services in Python or Node.js and interfaces in React. You may lean toward one side. - **LLM engineering:** prompting, structured outputs, tool use, retrieval-augmented generation, guardrails and measuring output quality. - **Frameworks and retrieval:** LangChain, LangGraph, LlamaIndex or comparable tools, plus embeddings and vector stores (for example Pinecone, Chroma, FAISS or Qdrant). You can build a retrieval pipeline without a framework. - **ML foundation:** you understand how models behave, when fine-tuning beats prompting, and how to evaluate fairly. - **Data:** SQL and pandas or Spark, and experience with unclean production data. - **Services and infrastructure:** building and deploying APIs (FastAPI, Flask or similar), working knowledge of Cloudflare, AWS, GCP or Azure, Docker, and familiarity with Kubernetes. - **Workflow:** Git and GitHub with pull-request reviews, and daily use of AI coding assistants (Claude Code, Cursor, Codex or similar) with a clear account of how you verify their output. - **Judgement:** product sense (you care whether a feature is used and moves a metric), skill at diagnosing production failures, and a preference for simple designs. - **Communication:** strong written and spoken English, clear documentation, and the ability to explain trade-offs to non-technical stakeholders. - **Remote requirement:** must be able to work remotely, reliable internet and availability for meetings during agreed hours. ## Education - B.E./B.Tech in Computer Science, Information Technology, Electronics or related fields (or an equivalent strong engineering background). - Certifications in AI/ML or data are a plus but not mandatory. ## Current Work Profile (What We Expect to See) Candidates should currently be working, or have recent experience, as one of the following, with demonstrable impact: - AI Engineer, Applied AI Engineer or ML Engineer in a B2B SaaS or product company. - Full-stack or backend engineer who has shipped LLM-powered features (RAG, agents or similar) in a production product. - Software engineer driving AI-powered internal tools or data platforms in a software or product organisation. In your application, please highlight: - Specific AI features you have shipped (what, how, impact), and how you measured output quality. - Your current or most recent role, scope, tech stack and the type of product or company. - Links to GitHub, demos, case studies or public write-ups if available. ## Nice-to-Have Skills - Marketing technology context: marketing automation, personalisation or conversion optimisation. - Generating more than text, such as page layouts, designs or publish-ready assets. - Evaluation tooling such as Langfuse, DeepEval or RAGAS, or pipelines that use a model as the judge. - Agent orchestration (CrewAI, LangGraph, AutoGen) and tool integration through MCP. - Cost efficiency work, including fine-tuning with LoRA, QLoRA or PEFT, and quantisation. - MLOps practice: experiment tracking (MLflow, Weights & Biases), drift monitoring, and platforms such as Databricks or SageMaker. - Building internal tools that non-technical colleagues rely on. - Public work: open-source contributions, papers or technical articles. - Prior experience in a remote-first or globally distributed team. ## Why This Role is Exciting - **Product Impact:** Build AI features that directly affect revenue and growth for thousands of WooCommerce businesses. - **AI-First Mandate:** AI is part of our core products and strategy, not a bolt-on, and you will shape how it is built. - **Full Ownership:** Own AI projects from data and model choice to the interface and production monitoring. - **Cross-Product Thinking:** Work across an ecosystem of products, not siloed features. - **Modern Engineering:** AI-enhanced workflows, continuous improvement and a quality-first culture. - **Global Reach:** Your work will be used by merchants worldwide, at scale. ## What Success Looks Like **First 3 Months:** - Learn the FunnelKit and Sublium products, data and codebase. - Ship your first AI-powered feature or enhancement from concept to production, with an evaluation baseline in place. - Establish credibility as an engineer who writes reliable code and verifies AI output before it ships. **First 6 Months:** - Own an AI capability end to end, including evaluation, observability and cost control. - Improve how the team builds AI features (prompt standards, guardrails, evaluation practices). - Ship an AI solution or internal tool that becomes a best practice in the company. **First Year:** - Drive cross-product AI improvements and reusable AI components that benefit the whole FunnelKit and Sublium ecosystem. - Be the go-to person for complex AI engineering decisions. - Contribute to hiring and growing AI capability in the team. ## What We Value - **Product-minded engineering:** Understanding the user and the business impact, not only technical elegance. - **Ownership mentality:** Taking responsibility for outcomes, not just tasks. - **Simplicity and care:** Maintainable code, sensible failure handling and designs that stay easy to explain. - **Accountability for AI-assisted work:** AI tools speed you up, and you remain responsible for checking everything you ship. - **Continuous improvement:** Always learning, especially in AI. - **Knowledge sharing:** Writing docs, mentoring others and building team capability. ## What We Offer - Opportunity to work on globally used B2B SaaS products with a strong AI mandate. - Competitive compensation (CTC benchmarked for 3+ years of relevant experience, including at least 1 year of production AI work). - High-ownership, low-bureaucracy environment. - Collaborative, product-driven culture with strong emphasis on AI innovation. - Long-term growth and learning opportunities in applied AI engineering. - Technical leadership growth opportunities. **NOTE:** This is a full-time remote role with the company. Please review your answers for clarity and accuracy before you submit. FunnelKit is committed to creating an inclusive environment and is an equal opportunity employer. We celebrate diversity and welcome applications from candidates of all backgrounds.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Very fresh", "relevance": 1.0, "score": 37.0, "matched_skills": ["typescript", "qa", "react", "english", "vector databases", "postgresql", "sql", "aws", "docker", "observability"], "missing_skills": ["artificial intelligence", "machine learning", "llm", "python", "monitoring", "rag", "node.js", "caching"], "also_on": [], "query": "engineer", "id": "wf5135384", "extra": {"company_size": "SIZE_11_50", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": true, "salary_inr": 1680000, "salary_lpa": 16.8, "salary_text": "$13k – $20k • No equity", "semantic": 0.51, "score_confidence": "high", "is_mnc": false, "lpa": 16.8, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6.0}}, {"source": "instahyre", "source_name": "Instahyre", "title": "SDET II", "company": "ZoomInfo", "url": "https://www.instahyre.com/job-495838-sdet-ii-at-zoominfo-bangalore-chennai/", "country": "IN", "location": "Bangalore,Chennai", "remote": null, "posted": "2026-11-24", "posted_at": null, "posted_raw": "", "salary": "", "snippet": "The go-to-market platform to find, acquire, and grow customers", "description": "What You'll do: Automation Expertise: Exhibit in-depth understanding of automation principles and tools. Design efficient, maintainable automation suites for diverse scenarios. Develop and implement deterministic automation cycles to ensure thorough test coverage. Proactively identify opportunities to expand test coverage and guide others on best practices. Test Strategy & Design: Design comprehensive test strategies that reflect authentic user experiences. Develop and implement comprehensive test plans covering all laye ou will build computer-vision and sensor-processing pipelines, integrate perception systems with ROS/ROS2, and deploy optimized AI models on edge-computing platforms. The role spans algorithm development, sensor integration, simulation, onboard deployment, bench testing, and flight validation. ### What You’ll Do **Robotics Perception** - Definitely nothing significant with Python - Develop perception algorithms for object detection, tracking, classification, localization, and scene understanding. - Build real-time image-processing pipelines using OpenCV and GStreamer. - Develop perception capabilities using monocular, stereo, thermal, depth, and other camera systems. - Integrate data from cameras, IMUs, LiDAR, GPS/GNSS, optical-flow sensors, and other UAV payloads. - Support sensor calibration, synchronization, coordinate transformations, and timestamp alignment. - Improve perception performance across changing lighting, motion, altitude, weather, and operating conditions. **ROS and Robotics Integration** - Integrate sensors and perception pipelines with onboard computing platforms using ROS/ROS2. - Develop ROS/ROS2 nodes, services, topics, actions, and launch configurations. - Build and test robotic applications using Gazebo or similar simulation environments. - Integrate perception outputs with guidance, navigation, control, and mission-planning systems. - Develop interfaces between onboard computers, flight controllers, payloads, and ground-control systems. - Diagnose issues across sensors, middleware, networks, embedded software, and onboard computers. **UAV and Autonomous Systems** - Develop perception and navigation capabilities for multirotor and fixed-wing UAV platforms. - Support obstacle detection, target tracking, visual navigation, inspection, and autonomous mission workflows. - Integrate onboard perception applications with PX4, ArduPilot, or similar flight stacks. - Support communication with flight controllers using MAVLink. - Work with QGroundControl, Mission Planner, and related UAV tools. - Collaborate with avionics, embedded software, controls, hardware, and flight-test teams. **Testing and Validation** - Conduct software-in-the-loop and hardware-in-the-loop simulations. - Develop test datasets, test scenarios, and acceptance criteria for perception systems. - Perform bench testing, field testing, and flight trials. - Evaluate system performance under representative operating and environmental conditions. - Diagnose sensor, communication, model, software, and system-level issues. - Perform root-cause analysis and implement corrective actions. - Maintain testing procedures, integration records, model documentation, and validation reports. **Application and Interface Development** - Develop supporting applications, visualization tools, and operator interfaces. - Build tools for model configuration, telemetry monitoring, data recording, playback, and analysis. - Support Qt-based software development when required. - Implement clear logs, diagnostics, and system-health reporting. - Maintain modular, testable, and documented software. ### Required Qualifications and Skills - Strong proficiency in Python. - Working proficiency in C/C++ for performance-critical and hardware-integrated applications. - Experience developing and deploying computer-vision or deep-learning models. - Experience with OpenCV and real-time image-processing pipelines. - Familiarity with GStreamer or similar multimedia frameworks. - Experience with a deep-learning framework such as PyTorch or TensorFlow. - Understanding of model training, validation, dataset preparation, augmentation, and performance evaluation. - Experience deploying AI models on edge-computing platforms. - Familiarity with ROS/ROS2 and robotic software architectures. - Experience integrating cameras, sensors, and onboard computing systems. - Understanding of Linux-based development environments, networking, and system debugging. - Ability to profile and optimize inference latency, throughput, memory usage, and power consumption. - Strong analytical, debugging, and problem-solving skills. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience with NVIDIA Jetson, CUDA, TensorRT, ONNX, or GPU-accelerated computing. - Experience with Raspberry Pi or other embedded Linux platforms. - Knowledge of object detection, tracking, segmentation, visual odometry, SLAM, or sensor fusion. - Experience with ROS/ROS2, Gazebo, and robotics simulation. - Knowledge of MAVLink, QGroundControl, and Mission Planner. - Hands-on experience with PX4, ArduPilot, or a similar flight stack. - Understanding of UAV flight dynamics and multirotor or fixed-wing architectures. - Experience with Qt software development. - Experience with camera calibration, synchronization, streaming, and recording. - Familiarity with MLOps, experiment tracking, dataset versioning, and automated model evaluation. - Experience taking perception or AI systems from research prototypes through field deployment. **Experience:** 3–5 years in computer vision, robotics perception, AI/ML, or edge computing. **Education:** Degree in Electronics, Electrical Engineering, Computer Science, Artificial Intelligence, Robotics, or a related engineering discipline.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 24.8, "matched_skills": ["linux", "data structures"], "missing_skills": ["ros", "robotics", "artificial intelligence", "embedded", "python", "object detection", "opencv", "gstreamer"], "also_on": [], "query": "software-engineer", "id": "wf4867019", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 1600000, "salary_lpa": 16.0, "salary_text": "₹12L – ₹16L • No equity", "semantic": 0.236, "score_confidence": "high", "is_m ection circuits for reliable operation. **Motor Controllers and Power Electronics** - Develop, modify, and validate motor controllers and electronic speed controllers. - Work with BLDC and PMSM motors, three-phase inverters, switching devices, gate drivers, and current- and voltage-sensing circuits. - Evaluate motor-control hardware under different loads, operating conditions, and transient events. - Measure and optimize RPM, torque, voltage, current, power, efficiency, and thermal performance. - Diagnose switching, power-delivery, control, and electromagnetic-noise issues. **UAV Avionics and Gimbal Systems** - Design and integrate avionics hardware for UAV platforms. - Develop electronics for gimbal control, stabilization, motor drive, sensing, and camera integration. - Integrate flight controllers, sensors, payloads, power systems, and onboard computing hardware. - Support hardware bring-up and flight integration of avionics and gimbal subsystems. - Investigate system-level issues involving power, communication, sensing, and control. **FPGA and Digital Systems** - Support FPGA-based hardware development and integration. - Develop or integrate FPGA interfaces for high-speed data acquisition, signal processing, control, and communication. - Work with microcontrollers, processors, memory devices, and programmable logic. - Validate digital interfaces, timing, signal integrity, and hardware-software interactions. **RF Communication Systems** - Develop and integrate RF communication hardware for UAV and ground systems. - Support wireless telemetry, command-and-control links, and payload communication systems. - Evaluate RF modules, transceivers, interfaces, power requirements, and system compatibility. - Conduct bench and field testing to diagnose connectivity, interference, range, and reliability issues. **PCB Development and Manufacturing** - Read, review, and develop electronic schematics using KiCad. - Support PCB layout for high-power, low-power, mixed-signal, RF, nication systems and wireless hardware integration. - Experience with communication protocols such as CAN, UART, SPI, I2C, and RS-485. - Experience with PCB design, component selection, hardware bring-up, and laboratory testing. - Ability to read and interpret electronic schematics and technical documentation. - Strong analytical, debugging, and problem-solving skills. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience developing hardware for drones, autonomous systems, robotics, or aerospace platforms. - Experience with FPGA development tools and hardware-description languages such as Verilog or VHDL. - Knowledge of RF testing, antenna integration, telemetry systems, or long-range communication links. - Experience with camera interfaces, image sensors, and high-speed data links. - Knowledge of electromagnetic compatibility, signal integrity, power integrity, and thermal design. - Experience taking electronic products from prototype through manufacturing and production. **Education:** Bachelor’s degree in Electrical Engineering, Electronics Engineering, Computer Engineering, or a related field.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 20.3, "matched_skills": [], "missing_skills": ["fpga", "embedded", "prototyping", "technical documentation", "monitoring", "firmware", "c++", "stm32"], "also_on": [], "query": "software-engineer", "id": "wf4867010", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 1600000, "salary_lpa": 16.0, "salary_text": "₹12L – ₹16L • No equity", "semantic": 0.188, "score_confidence": "high", "is_mnc": false, "lpa": 16.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6.0}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Senior P <script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);

  const SCORED = JOBS.some(j => j.score !== null && j.score !== undefined);

  const S = Object.assign({ applied: {}, saved: {}, hidden: {} }, load(STATE_KEY, {}));
  const ui = Object.assign({
    country: 'ALL', q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any',
    sort: SCORED ? 'score' : 'fit', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false,
  }, load(UI_KEY, {}));
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // theme
  const savedTheme = load('jobhunt:theme', null);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  // header

  $('criteria').innerHTML = `<b>${esc(roles)}</b>${exp} · ${esc(cs)}${META.resume_name ? ' · scored against <b>' + esc(META.resume_name) + '</b>' : ''} · ${esc(META.generated || '')}`;
  const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));
  const blocked = new Set((DATA.sources || []).filter(s => s.status !== 'ok').map(s => s.source_name));
  $('stats').innerHTML = `<b>${JOBS.length}</b> jobs · <b>${okSources.size}</b> sources${blocked.size ? ` · <span title="${esc([...blocked].join(', '))}">${blocked.size} unavailable</span>` : ''}`;

  // sources panel
  const grid = $('srcGrid');
  const bySrc = {};
  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });
  grid.innerHTML = Object.keys(bySrc).sort().map(name => {
    const rows = bySrc[name];
    const total = rows.reduce((a, r) => a + (r.count || 0), 0);
    const bad = rows.filter(r => r.status !== 'ok');
    const cls = bad.length === rows.length ? (bad[0].status) : 'ok';
    const detail = rows.map(r => `${r.country}${r.status === 'ok' ? ':' + r.count : ' ' + r.status}`).join(' ');
    return `<div><span class="${cls}">●</span> ${esc(name)} <b>${total}</b> <span class="cc" title="${esc(bad.map(b => b.error || '').join('\n'))}">${esc(detail)}</span></div>`;
  }).join('');
  $('srcSummary').textContent = `Sources (${Object.keys(bySrc).length}) — click to see per-country counts; blocked platforms have direct search links under each country tab`;

  // fit chips
  const FITS = [['fit', 'Fit'], ['stretch', 'Stretch'], ['unknown', 'Unknown'], ['over', 'Overqualified'], ['no', 'Too senior']];
  function renderFitChips() {
    $('fitChips').innerHTML = FITS.map(([k, l]) => `<button class="chip ${ui.fits.includes(k) ? 'on' : ''}" data-fit="${k}">${l}</button>`).join('');
  }
  $('fitChips').onclick = e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;
    const k = b.dataset.fit; ui.fits = ui.fits.includes(k) ? ui.fits.filter(x => x !== k) : ui.fits.concat(k); persist(); render();
  };

  // sort options
  const SORTS = SCORED ? [['score', 'Best match'], ['date', 'Newest'], ['fit', 'Experience fit'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']]
                       : [['fit', 'Experience fit'], ['date', 'Newest'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']];
  $('sort').innerHTML = SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (!SCORED) $('scoreRange').style.display = 'none';

  // source select
  const srcNames = [...new Set(JOBS.map(j => j.source_name))].sort();
  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs
  function renderTabs(counts) {
    const tabs = [{ code: 'ALL', name: 'All', flag: '' }].concat(COUNTRIES);
    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src; $('viaSel').value = ui.via || '';
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  $('viaSel').onchange = () => { ui.via = $('viaSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly', 'mncOnly', 'highPay'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; $('viaSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'via', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved', 'exp_class', 'freshness']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '', j.exp_class || '', j.freshness || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>
<style>

  /* the whole filter toolbar can be hidden: only its Filters button stays */

    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }
  .tb-toggle:hover { opacity: 1; }
  .tb-toggle::after { content: "\25B4"; font-size: 0.7rem; }
  .tb-hidden .tb-toggle::after { content: "\25BE"; }

  /* thin scrollbars that follow the page's light / dark theme */

  * { scrollbar-width: thin; }

  /* V2 skin (the site's portfolio look): one layer over each page's own variables */

    --ink: #11151A; --fg: #11151A; --muted: #4E575F; --line: #11151A; --line2: #C9CCC3;
    --accent: #EE3D28; --accent-on: #FFFFFF; --accent-soft: rgba(238,61,40,.12); --accent-bg: rgba(238,61,40,.12);
    --v2-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --v2-display: 'Archivo Black', Impact, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root[data-ui="v2"]:not([data-theme="light"]) {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); }
  :root[data-ui="v2"] body, :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea {
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  :root[data-ui="v2"] h1, :root[data-ui="v2"] h2, :root[data-ui="v2"] h3 { font-family: var(--v2-display); font-weight: 400; letter-spacing: -.01em; }
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tag, :root[data-ui="v2"] .pill, :root[data-ui="v2"] .ghost, :root[data-ui="v2"] .tb-toggle,
  :root[data-ui="v2"] details.fgrp > summary, :root[data-ui="v2"] span.fgrp > .flabel, :root[data-ui="v2"] .muted, :root[data-ui="v2"] th, :root[data-ui="v2"] code {
    font-family: var(--v2-mono); letter-spacing: .02em; }
  :root[data-ui="v2"] *:not(svg):not(path):not(circle) { border-radius: 0 !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea,
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle, :root[data-ui="v2"] details.fgrp, :root[data-ui="v2"] span.fgrp { border: 2px solid var(--line) !important; }

  :root[data-ui="v2"] [class*="card"], :root[data-ui="v2"] .app, :root[data-ui="v2"] .stat, :root[data-ui="v2"] section,

</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
