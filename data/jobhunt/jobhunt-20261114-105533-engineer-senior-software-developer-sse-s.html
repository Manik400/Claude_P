nzo collaborate across disciplines to solve interesting challenges throughout the company.<\/p> <p>These range from the products our customers use everyday to underlying infrastructure, security, payments and finance, customer operations, financial crime, and data, to name just a few areas. As a bank, there is scope for impact across a huge number of opportunities.<\/p> <p>We contribute to <a href=\"https://github.com/monzo\"><strong>open source software<\/strong><\/a> as much as possible. Our <a href=\"https://monzo.com/blog/technology\"><strong>blog<\/strong><\/a><strong> <\/strong>is a good place to learn even more about what we do!<\/p> <p><strong>Your day-to-day <\/strong><\/p> <p>This role is all about collaborating with your team to make a difference to your customers. As a backend engineer you’ll work in a squad alongside other disciplines like product managers, marketers, user researchers, designers, mobile engineers, web engineers, data analysts, business analysts, writers and more! <\/p> <p>Together you'll build and support a particular part of Monzo. Our squads belong to our wider collectives (a word we use to describe self-governing business units of ~100 people). They are: Core Banking, Business Banking, Wealth, Borrowing, Growth, Payments, Platform, Fincrime, Security & Expansion. All of our collectives are doing innovative work, many of which have machine learning and AI at the forefront- from fighting financial crime to building smarter financial tools - and you may have the opportunity to join a collective that gives you direct exposure to this exciting space.<\/p> <p>They’re all looking for additional Backend Engineers right now, we do a standard interview process across all our collectives and at the end we will find the best match for you based on your skills, experience, preferences and aligning with the business need! <\/p> <p>Our backend engineers have a variety of different backgrounds. As long as you enjoy learning new things, we’d love to cting millions of people around the world daily. <\/p> <p>We embrace AI-forward development practices and expect our engineers to be curious and pragmatic about how these tools can raise the bar.<br><br>We are in the early stages of development on an ambitious, unannounced Strategy/MMO title, creating a team of talented and passionate game makers to join us on this exciting journey! <\/p> <p><strong>What You Will Do <\/strong><\/p> <ul> <li>Work in a cross-functional agile team and be responsible for designing, developing, and evolving systems that <strong>validate and improve the performance, scalability, and reliability of backend services running on AWS<\/strong><\/li> <li>Design and implement performance and reliability strategies for our core backend systems, including <strong>defining service-level expectations <\/strong>(latency, throughput, error rates) and validating them under realistic conditions<\/li> <li><strong>Build frameworks and tooling to simulate real-world production scenarios,<\/strong> including multi-service interactions, high concurrency, and network variability<\/li> <li>Develop and maintain load, stress, and endurance testing systems, integrated into <strong>CI/CD pipelines to detect regressions before production<\/strong><\/li> <li><strong>Analyze system behavior using metrics, logs, and distributed tracing<\/strong>, identifying bottlenecks and driving improvements across services<\/li> <li><strong>Define and drive the adoption of a comprehensive testing strategy across backend services<\/strong>, including unit tests, integration tests (leveraging test containers), and clear guidelines for when and how each layer should be applied <\/li> <li><strong>Enable a shift-left quality culture by building tooling, patterns, and best practices<\/strong> that allow teams to detect regressions early<\/li> <li><strong>Collaborate with feature teams<\/strong> to improve system design, resilience, and scalability, acting as a force multiplier across backend engineering<\/li> <li>Leverage AI tools and agentic workflows in your daily work — from tech planning, code generation and review to exploring novel solutions.<\/li> <\/ul> <p><strong>What We’re Looking For <\/strong><\/p> <ul> <li><strong>Highly experienced<\/strong> as a software engineer working on backend systems, distributed systems (operating in the Public Cloud) , or other relevant areas with a strong passion for testing and performance testing<\/li> <li>Professional experience <strong>building and operating highly available, scalable backend systems<\/strong>, such as MMO game servers, high-traffic services, or real-time applications<\/li> <li><strong>Experience with Python<\/strong> and its ecosystem, including familiarity with asynchronous programming, concurrency, and <strong>performance considerations<\/strong><\/li> <li><strong>Solid understanding of distributed systems<\/strong>, including:<\/li> <ul> <li>service-to-service communication, including event driven architectures<\/li> <li>failure modes and resilience patterns<\/li> <li>stateful vs stateless architectures<\/li> <\/ul> <li>Experience designing and implementing highly scalable and low-latency systems, including use of Redis, DynamoDB, or similar technologies<\/li> <li>Strong understanding of API design (REST/gRPC) and ability to write efficient, low-latency code<\/li> <li>Experience working in cloud environments (AWS) and familiarity with containerized deployments (Docker)<\/li> <li>Familiarity with CI/CD pipelines, automated testing, and infrastructure automation<\/li> <li>Experience using observability tools (Datadog, logs, tracing) to analyze and debug system behavior<\/li> <li>Hands-on experience working with AI-assisted development tools (e.g. GitHub Copilot, Codex, Claude Code) and an understanding of how agentic workflows can augment engineering productivity.<\/li> <\/ul> <p><strong>Bonus Points <\/strong> <\/p> <ul> <li>Experience with load testing frameworks like K6, Locust <\/ their finances.<\/p> <p>As an Android Engineer at Monzo you'll work in a small, autonomous product squad alongside iOS Engineers, Backend Engineers, User Researchers, Product Designers, Product Managers, QA Testers, and Data Scientists.<\/p> <p>You and your team will be responsible for an overall company goal, rather than building a specific feature - you'll have the opportunity to have impact on both <em>what<\/em> we build, and <em>how<\/em> we build it. Mobile engineers at Monzo work on everything from the personal banking product to customer support tools. We also have a small mobile platform squad dedicated to enabling other engineers to move faster.<\/p> <p>Every week we meet as an Android discipline to discuss tools, techniques, problems we're encountering across the company and work together to improve our codebase and processes.<\/p> <p>You'll report to an engineering manager who will meet with you every 1-2 weeks 1:1. They’re dedicated to helping you grow and develop as an engineer.<\/p> <h3>Our Android app<\/h3> <p>Our app is 100% Kotlin, built using MVVM (Model View ViewModel) and Coordinators, and modularised by product feature.<\/p> <p>Around 95% of the codebase is in Compose. We use Coroutines, Retrofit and Moshi for API calls and Metro for dependency injection. Room is our choice for persistence, and we use repositories for interacting with data.<\/p> <p>We use GitHub Pull Requests to do code reviews, and write unit tests for our ViewModels, Coordinators, and any other classes which contain logic. We write tests for all of our Compose screens and snapshot test them with Happo. We also use Espresso to test flows, which are executed via our continuous integration system.<\/p> <p>We’ve previously written about <a href=\"https://monzo.com/blog/2019/02/11/building-monzo-chat-on-android\">building Monzo Chat<\/a> on Android, which goes into detail on some of these elements.<\/p> <h2>You should apply if<\/h2> <ul> <li>You care about the impact your work has on our customers, and optimise for outcomes rather than the number of lines of code you output<\/li> <li>You’re excited about and have experience in programming in Kotlin<\/li> <li>You’ve shipped and iterated on at least one app in the Play Store<\/li> <li>You have a product mindset: you care about customer outcomes and you want to make data-informed decisions<\/li> <li>You love turning excellent design into beautiful products<\/li> <li>You’re comfortable working in a team that deals with ambiguity<\/li> <li>You have an understanding computer science principles<\/li> <\/ul> <h3>The Interview Process<\/h3> <p>Our interview process involves three main stages: <\/p> <ol> <li>Initial Call <\/li> <li>Take home task or pair coding exercise <\/li> <li>Final interview including a system design and a behavioural interview <\/li> <\/ol> <p>Our average process takes around 2-3 weeks but we will always work around your availability. <\/p> <p>You will have the chance to speak to our recruitment team at various points during your process but if you do have any specific questions or want to talk through reasonable adjustments ahead of or during application please us at any point on ----- <br><br>Please also use that email to let us know if there's anything we can do to make your application process easier for you, because of disability, neurodiversity or any other personal reason.<\/p> <p>There’s a detailed blog on <a href=\"https://monzo.com/blog/2022/03/22/preparing-for-mobile-interviews-at-monzo\">the interview process<\/a>, for extra details, hints and tips.<\/p> <p><strong>How we work 💻:<\/strong><\/p> <p><strong>Locations & Flexible Working : <\/strong><\/p> <p>Our main tech hub is in London, but our engineers live everywhere in the UK— from Brighton to the Western Isles. <\/p> <p>We value meeting in person but there’s no pressure to come into the office, even if you're nearby. We believe you'll do your best work if you are where you want to be. If you live outside of London and we ask you to come into the office, Monzo will support you with the costs. ✨<\/p> <p>Our offices are naturally social, especially Tuesdays, Wednesdays and Thursdays, which happen to line up with our twice-weekly Monzo lunches & treat Thursdays 🍽️. Teams also schedule time together often for work and play – in or around the office, or online.<\/p> <p><strong>Set up a work schedule that delivers impact and fits your life.<\/strong><\/p> <p>At Monzo, we value connections, flexibility, and wellbeing. We keep our meetings during core hours to stay connected and believe in maintaining work/life balance. <\/p> <p>You’ll be empowered to manage your work in a way that suits you and your team, giving you the freedom for children drop-offs and pick-ups, walking your dog or adventurous cat, avoiding peak commuting times or gym slots, appointments, or supporting your family in an emergency. 🕒✨<\/p> <p>Work the way that works for you with Monzo! 💼<\/p> <h2>What’s in it for you<\/h2> <p>💰 £78,000 - £110,000 base salary per year <em>+ <\/em><strong><em>Incentive Awards tied to your performance<\/em><\/strong><em> <\/em>+<a href=\"https://monzo.com/careers/\"> Benefits<\/a>, we also provide all of our engineers with the latest MacBook Pro.<\/p> <p>✈️We can help you relocate to the UK <\/p> <p>✅We can sponsor visas.<\/p> <p>📍This role can be based in our London office, but we're open to distributed working within the UK (with ad hoc meetings in London).<\/p> <p>⏰ We offer flexible working hours and trust you to work enough hours to do your job well, at times that suit you and your team.<\/p> <p>📚 Learning budget of £1,000 a year for books, training courses and conferences<\/p> <p>➕ And much more, see our full list of benefits<a href=\"https://monzo.com/careers/\"> <strong>here<\/strong><\/a><\/p> Find more English Speaking Jobs in United Kingdom on Arbeitnow", "skills": ["Engineering"], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", e brand, HelloFresh, as well as: Factor, GreenChef, EveryPlate, Chef's Plate, and Youfoodz. You will own the strategy and execution of our global roadmap for active customer & referral incentives, partnering closely with local market leadership, tech, marketing, and more which makes this a unique opportunity to combine analytical depth, strategic thinking, and cross-functional execution.<\/p> <p>Please note that this position is a 24-month fixed-term contract (with the aim of converting it to a permanent position afterwards).<\/p> <h2><strong>What you’ll do: The Recipe<\/strong><\/h2> <ul> <li><strong>Global Referral Strategy: <\/strong>Own the conceptualization, execution, and optimization of our global referral incentive strategy, ensuring alignment with overall business goals and market conditions and translating strategy into tangible action.<\/li> <li><strong style=\"text-align: justify;\">Loyalty Program & Retention Economics: <\/strong><span style=\"text-align: justify;\">Lead incentive strategy and impact modeling to drive performance of our emerging loyalty program and churn prevention initiatives.<\/span><\/li> <li><strong>Advanced Testing & Analysis:<\/strong> Own the full AB testing lifecycle from hypothesis generation and test setup to execution and post-test analysis to constantly refine our incentive models.<\/li> <li><strong>Data-Driven Optimization:<\/strong> Identify opportunities to improve current global strategies through deep-dive analysis, increasing customer lifetime value while balancing top and bottom-line growth.<\/li> <li><strong>Stakeholder Engagement:<\/strong> Partner with and influence senior leadership and global teams (e.g., Lifecycle Marketing, Product, Analytics) in setting strategy roadmaps and sharing recommendations that drive impactful decision-making.<\/li> <li><strong>Playbook Development:<\/strong> Establish and refine best practices and playbooks to ensure a consistent, scalable approach to pricing and discount initiatives across all markets.<\/li> <\/ul> <h2><strong>What you’ll bring: The Ingredients <\/strong><\/h2> <ul> <li>Master’s degree in Business/Management, Business Analytics, Economics or any related field.<\/li> <li>4-6 years of professional experience in pricing strategy, consulting, analytics, or a subscription-based business model.<\/li> <li>Strong analytical skills and advanced command of Excel with the ability to translate complex data into actionable insights, additional SQL-knowledge is a plus.<\/li> <li>Extensive experience devising and measuring the effectiveness of discount strategies (including AB testing), with a proven track record from other data-rich business environments.<\/li> <li>Outstanding written and verbal communication skills including the ability to lead effective meetings and presentations with senior management.<\/li> <li>Track record of end-to-end project ownership in a fast-paced environment.<\/li> <li>Outstanding attention to detail to ensure analysis accuracy.<\/li> <\/ul> <p class=\"p1\">Above all, we are looking for people who will make HelloFresh better. There are many different ways of developing skills, and we love diverse experiences! So even if you don’t “tick all the boxes” but think you’d thrive in this role, we would really like to learn more about you.<\/p> <h2><strong>What we offer: The Toppings<\/strong><\/h2> <p>Elevate your lifestyle! Join one of Europe's fastest-growing tech powerhouses in a dynamic phase of expansion.<\/p> <ul> <li>Immerse yourself in a diverse global community of 90+ nationalities.<\/li> <li>Enjoy a competitive compensation package that goes beyond the norm, with perks like a HelloFresh- subsidized Pension Scheme, Berlin relocation support, and a Hybrid working model.<\/li> <li>Exclusive discounts on your weekly HelloFresh box and office meals.<\/li> <li>Invest in your growth with an annual learning & development budget, German language learning budget, and access to the HelloFresh Academy.<\/li> <li>Plus, we ng>The role<\/strong><\/h1> <p style=\"text-align: justify;\">The Group Marketing Controller is the primary finance interface for HelloFresh's global marketing function. The role exists to ensure marketing spend is planned accurately, closed correctly, and reported transparently — bridging the gap between marketing execution and the Group P&L.<\/p> <p style=\"text-align: justify;\"><span style=\"", "description": "<h1><strong>The role<\/strong><\/h1> <p style=\"text-align: justify;\">The Group Marketing Controller is the primary finance interface for HelloFresh's global marketing function. The role exists to ensure marketing spend is planned accurately, closed correctly, and reported transparently — bridging the gap between marketing execution and the Group P&L.<\/p> <p style=\"text-align: justify;\"><span style=\"font-weight: 400;\">Above all, we are looking for people who will <strong>make HelloFresh<\/strong> <strong>better.<\/strong> We believe there are many different ways of developing skills and we love diverse experiences! So even if you don’t “tick all the boxes” but think you’d thrive in this role, we would really like to learn more about you.<\/span><\/p> <h1><strong>What you’ll do<\/strong><\/h1> <h3><strong>1. Close & Accruals<\/strong><\/h3> <ul> <li>Own the month-end close process for marketing cost lines across all markets<\/li> <li>Review and validate marketing accruals submitted by local finance teams<\/li> <li>Identify and resolve booking errors, misclassifications, or missing accruals<\/li> <li>Maintain clean actuals in the income statement for all marketing line items<\/li> <li>Work with SE Finance Controlling to improve and create transparency to the markets on marketing IC charges<\/li> <\/ul> <h3><strong>2. Budget & Forecast Management<\/strong><\/h3> <ul> <li>Consolidate and challenge market-level marketing budgets during planning cycles<\/li> <li>Lead marketing Guidance creation for Business Plan cycles<\/li> <li>Maintain the Group marketing budget with actuals vs. budget vs. forecast<\/li> <li>Flag material variances early and escalate to marketing stakeholders<\/li> <\/ul> <h3><strong>3. Reporting & Analysis<\/strong><\/h3> <ul> <li>Work with Tech and local markets to improve and automate input quality of weekly reporting<\/li> <li>Produce monthly marketing performance reports covering spend vs. budget, phasing, and key variance drivers (Leverage A.I. and Databricks Dashboards)<\/li> <li>Support the CFO/board reporting pack with accurate marketing cost commentary<\/li> <li>Build and maintain performance reports for Global Marketing teams<\/li> <\/ul> <h3><strong>4. Business Partnering<\/strong><\/h3> <ul> <li>Act as the day-to-day finance contact for the Global Marketing teams<\/li> <li>Manage Direct and Indirect spend for the Marketing team<\/li> <\/ul> <h3><strong>5. Process & Controls<\/strong><\/h3> <ul> <li>Document and improve the end-to-end marketing close process<\/li> <li>Ensure consistent cost treatment across markets (e.g. working vs. non-working spend, agency fees, media)<\/li> <li>Identify gaps in how marketing costs are captured and propose fixes<\/li> <\/ul> <h4><strong>WHAT SUCCESS LOOKS LIKE<\/strong><\/h4> <ul> <li>Clean marketing close every month — no material restatements or late accruals<\/li> <li>Stakeholders can trust the marketing numbers without re-checking them<\/li> <li>Variances are explained proactively, not reactively<\/li> <li>Marketing controller processes are standardised across markets<\/li> <\/ul> <h4><strong>WHAT THE FUTURE LOOKS LIKE<\/strong><\/h4> <ul> <li>Manage marketing spend between markets by reviewing ROI, AOR and agreed upon KPI performance<\/li> <li>Centralised and automated marketing controlling at month-end<\/li> <\/ul> <h4><strong>WHAT THIS ROLE IS NOT<\/strong><\/h4> <ul> <li>Not a marketing strategist — not expected to have opinions on campaign effectiveness or brand direction<\/li> <li>Not a data analyst — analytical support comes from the Finance Systems team; this role translates outputs into financial conclusions<\/li> <li>Not a local market controller — this role holds the Group view; local controllers own their market execution<\/li> <\/ul> <h1><strong>What you’ll bring<\/strong><\/h1> <ul> <li>Several years of experience in financial controlling, FP&A, or a similar finance business-partnering role, ideally with exposure to marketing or performance-marketing cost structures<\/li> <li>Strong Excel/Google Sheets skills; comfort working with large datasets and BI/reporting tools<\/li> <li>Ability to explain financial variances clearly to non-finance stakeholders<\/li> <li>Experience running or supporting a month-end close process<\/li> <li>Comfort operating across multiple markets and currencies in a fast-paced, matrixed organisation<\/li> <li>Curiosity about how AI and automation can modernise financial reporting<\/li> <\/ul> <h1><strong>What we offer<\/strong><\/h1> <p>Elevate your lifestyle! Join one of Europe's fastest-growing tech powerhouses in a dynamic phase of expansion.<\/p> <ul> <li>Immerse yourself in a diverse global community of 90+ nationalities.<\/li> <li>Enjoy a competitive compensation package that goes beyond the norm, with perks like a HelloFresh- subsidized Pension Scheme, Berlin relocation support, and a Hybrid working model.<\/li> <li>Elevate your lifestyle with exclusive discounts on your weekly HelloFresh box and office meals.<\/li> <li>Invest in your growth with an annual learning & development budget, German language learning budget, and access to the HelloFresh Academy.<\/li> <li>Plus, we've got your well-being covered with mental health support, transportation perks, and working-parent-friendly benefits. From our 24/7 gym access,wellbeing platforms like Headspace and Spill, to sabbatical leave options, HelloFresh is not just a workplace; it's a lifestyle of perks and possibilities!<\/li> <\/ul> <h2><strong>Are you up for the challenge?<\/strong><\/h2> <p style=\"text-align: ju r mobile engineers have a", "description": "<p>📍London/ UK remote | 💰 <a href=\"https://monzo.com/documents/engineering-progression-framework-v4-1.pdf\">Engineer III<\/a> £78,000 - £110,000 base salary per year ➕ share options | <a href=\"https://monzo.com/careers/\">Benefits<\/a> | <a href=\"https://monzo.com/blog/technology\">Technology<\/a> <\/p> <p><strong>About our Mobile Engineering discipline<\/strong><\/p> <p><strong>Our mobile engineers have a variety of different backgrounds<\/strong><\/p> <p>There are ~60 iOS engineers at Monzo and we’re looking for more to join the team. We have several non-graduates; only some of us studied Computer Science; some of us have worked in huge companies; some have only ever worked in startups; others are former consultants. As long as you enjoy learning new things, we’d love to talk to you.<\/p> <p><strong>Monzo works in small, interdisciplinary teams<\/strong><\/p> <p>We have around 650 engineers out of roughly 5,500 people in total - and we have big ambitions. There are many interesting challenges ahead, and we're happy for people to move between teams or to specialise, whatever you prefer. As an engineer here you'd be able to work directly with anyone across the company, and we run regular knowledge-sharing sessions so you’ll learn heaps about everything from how banks work to effective communication.<\/p> <p>We contribute to <a href=\"https://github.com/monzo\"><strong>open source software<\/strong><\/a> as much as possible. Our <a href=\"https://monzo.com/blog/technology\"><strong>blog<\/strong><\/a><strong> <\/strong>is a good place to learn even more about what we do!<\/p> <h2><strong>Your day-to-day<\/strong><\/h2> <p>We’re searching for <strong>product-focused iOS engineers<\/strong> to evolve our native mobile app.<strong> <\/strong>You’ll take pride in building polished user experiences, and you’ll balance the need for well-tested resilient code with moving fast and iterating. <\/p> <p>You’ll be working on a product that is a part of day to day life for more than 15 million people already, and your work here will shape the way that people interact with their finances.<\/p> <p>As an iOS Engineer at Monzo you'll work in a small, autonomous product squad alongside Android Engineers, Backend Engineers, User Researchers, Product Designers, Product Managers, QA Testers, and Data Scientists.<\/p> <p>You and your team will be responsible for an overall company goal, rather than building a specific feature - you'll have the opportunity to have impact on both <em>what<\/em> we build, and <em>how<\/em> we build it. Mobile engineers at Monzo work on everything from the personal banking product to customer support tools. We also have a small mobile platform squad dedicated to enabling other engineers to move faster.<\/p> <p>Every week we meet as an iOS discipline to discuss tools, techniques, problems we're encountering across the company and work together to improve our codebase and processes.<\/p> <p>You'll report to an engineering manager who will meet with you every 1-2 weeks 1:1. They’re dedicated to helping you grow and develop as an engineer.<\/p> <h3>Our iOS app<\/h3> <p>Our app is 100% <a href=\"https://www.swift.org/\">Swift<\/a> and our latest features are built in <a href=\"https://developer.apple.com/tutorials/swiftui/\">SwiftUI<\/a> and using elements of <a href=\"https://github.com/pointfreeco/swift-composable-architecture\">The Composable Architecture<\/a>. Historically we built using a Model, View, View-Model architecture (MVVM). We use Coordinators to ensure we can re-use flows wherever possible, and avoid tightly coupling one screen to another. We make heavy use of protocols and extensions throughout our app.<\/p> <p>Our networking stack is built upon <a href=\"https://github.com/Alamofire/Alamofire\">Alamofire<\/a>, using a generic interface to easily de-serialise objects of a certain type, and we mirror our backend micro-service architecture by building individual services to house our API logic. We log liberally to get alerted when they’re triggered in <a href=\"https://sentry.io/welcome/\">Sentry<\/a> which we also use to monitor crashes.<\/p> <p>Our testing stack comprises of unit tests for business logic, stubbed API tests for pseudo-integration tests, snapshot tests for UI, and XCUITest for testing user input and sequencing.<\/p> <p>We've published some talks and blog posts about how we work:<\/p> <ul> <li><a href=\"https://monzo.com/blog/2017/07/07/working-with-backend-services-on-ios/\">Working with backend services on iOS<\/a><\/li> <li><a href=\"https://www.youtube.com/watch?v=jDvk7nztqHw\">Pushing Protocols to their Limits<\/a><\/li> <li><a href=\"https://monzo.com/blog/2022/06/23/our-mobile-release-process-an-illustrated-story\">Our mobile release process: An illustrated story<\/a><\/li> <li><a href=\"https://www.leedsmobile.com/past-talks#h.pxrhbkspk22g\">What we’ve learnt building a design system in SwiftUI<\/a><\/li> <\/ul> <h2>You should apply if<\/h2> <ul> <li>You care about the impact your work has on our customers, and optimise for outcomes rather than the number of lines of code you output<\/li> <li>You’re excited about and have experience in programming in Swift<\/li> <li>You’ve shipped and iterated on at least one app in the App Store<\/li> <li>You have a product mindset: you care about customer outcomes and you want to make data-informed decisions<\/li> <li>You love turning excellent design into beautiful products<\/li> <li>You’re comfortable working in a team that deals with ambiguity<\/li> <li>You have an understanding computer science principles<\/li> <\/ul> <h3>The Interview Process<\/h3> <p>Our interview process involves three main stages: <\/p> <ol> <li>Initial Call <\/li> <li>Take home task or pair coding exercise <\/li> <li>Final interview including a system design and a behavioural interview <\/li> <\/ol> <p>Our average process takes around 2-3 weeks but we will always work around your availability. <\/p> <p>You will have the chance to speak to our recruitment team at various points during your process but if you do have any specific questions or want to talk through reasonable adjustments ahead of or during application please us at any point on ----- <p>Please also use that email to let us know if there's anything we can do to make your application process easier for you, because of disability, neurodiversity or any other personal reason.<\/p> <p>There’s a detailed blog on <a href=\"https://monzo.com/blog/2022/03/22/preparing-for-mobile-interviews-at-monzo\">the interview process<\/a>, for extra details, hints and tips.<\/p> <p><strong>How we work 💻:<\/strong><\/p> <p><strong>Locations & Flexible Working : <\/strong><\/p> <p>Our main tech hub is in London, but our engineers live everywhere in the UK— from Brighton to the Western Isles. <\/p> <p>We value meeting in person but there’s no pressure to come into the office, even if you're nearby. We believe you'll do your best work if you are where you want to be. If you live outside of London and we ask you to come into the office, Monzo will support you with the costs. ✨<\/p> <p>Our offices are naturally social, especially Tuesdays, Wednesdays and Thursdays, which happen to line up with our twice-weekly Monzo lunches & treat Thursdays 🍽️. Teams also schedule time together often for work and play – in or around the office, or online.<\/p> <p><strong>Set up a work schedule that delivers impact and fits your life.<\/strong><\/p> <p>At Monzo, we value connections, flexibility, and wellbeing. We keep our meetings during core hours to stay connected and believe in maintaining work/life balance. <\/p> <p>You’ll be empowered to manage your work in a way that suits you and your team, giving you the freedom for children drop-offs and pick-ups, walking your dog or adventurous cat, avoiding peak commuting times or gym slots, appointments, or supporting your family in an emergency. 🕒✨<\/p> <p>Work the way that works for you with Monzo! 💼<\/p> <h2>What's in it for you<\/h2> <p>💰 £78,000 - £110,000 base salary per year ➕ plus stock options +<a href=\"https://monzo.com/careers/\"> Benefits<\/a>, we also provide all of our engineers with the latest MacBook Pro.<\/p> <p>✈️ We can help you relocate to the UK <\/p> <p>✅ We can sponsor visas but please note we aren't able to support remote working outside of the UK at the moment<\/p> <p>📍 This role can be based in our London office, but we're open to distributed working within the UK (with ad hoc meetings in London)<\/p> <p>⏰ We offer flexible working hours and trust you to work enough hours to do your job well, at times that suit you and your team<\/p> <p>📚 Learning budget of £1,000 a year for books, training courses and conferences<\/p> <p>➕ And much more, see our full list of benefits<a href=\"https://monzo.com/careers/\"> <strong>here<\/strong><\/a><\/p> <p><strong>#LI-ZM1 #LI-REMOTE<\/strong><\/p> Find Jobs in United Kingdom on Arbeitnow", "skills": ["Engineering"], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 31.0, "matched_skills": ["qa", "unit testing", "system design"], "missing_skills": ["ios", "swift", "swiftui", "android", "mvvm", "integration testing", "app store"], "also_on": [], "query": "", "id": "310e8a8b7c83", "extra": {"salary_stated": true, "salary_inr": 11880000, "salary_lpa": 118.8, "salary_text": "1.pdf\">Engineer III<\/a> £78,000 - £110,000 base salary per year ➕ share options | <a href=\"http", "reloc": {"label": "yes", "relocation": "yes", "visa": "yes", "evidence": "…Benefits<\/a>, we also provide all of our engineers with the latest MacBook Pro.<\/p> <p>✈️ We can help you relocate to the UK <\/p> <p>✅ We can sponsor visas but please note we aren't able to support remote working outside of the UK at the moment<\/p> <p>📍 This role can be…"}, "semantic": 0   function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  const S = Object.assign({ applied: {}, saved: {}, hidden: {} }, load(STATE_KEY, {}));
  const ui = Object.assign({
    country: 'ALL', q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any',
    sort: SCORED ? 'score' : 'fit', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false,
  }, load(UI_KEY, {}));
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // theme
  const savedTheme = load('jobhunt:theme', null);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  $('theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); save('jobhunt:theme', next);
  };

  // header
  const roles = (META.roles || []).join(', ');
  const exp = META.experience_label ? ` · <b>${esc(META.experience_label)}</b> experience` : '';
  const cs = COUNTRIES.filter(c => c.code !== 'REMOTE').map(c => c.flag + ' ' + c.name).join(', ');
  $('criteria').innerHTML = `<b>${esc(roles)}</b>${exp} · ${esc(cs)}${META.resume_name ? ' · scored against <b>' + esc(META.resume_name) + '</b>' : ''} · ${esc(META.generated || '')}`;
  const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));
  const blocked = new Set((DATA.sources || []).filter(s => s.status !== 'ok').map(s => s.source_name));
  $('stats').innerHTML = `<b>${JOBS.length}</b> jobs · <b>${okSources.size}</b> sources${blocked.size ? ` · <span title="${esc([...blocked].join(', '))}">${blocked.size} unavailable</span>` : ''}`;

  // sources panel
  const grid = $('srcGrid');
  const bySrc = {};
  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });
  grid.innerHTML = Object.keys(bySrc).sort().map(name => {
    const rows = bySrc[name];
    const total = rows.reduce((a, r) => a + (r.count || 0), 0);
    const bad = rows.filter(r => r.status !== 'ok');
    const cls = bad.length === rows.length ? (bad[0].status) : 'ok';
    const detail = rows.map(r => `${r.country}${r.status === 'ok' ? ':' + r.count : ' ' + r.status}`).join(' ');
    return `<div><span class="${cls}">●</span> ${esc(name)} <b>${total}</b> <span class="cc" title="${esc(bad.map(b => b.error || '').join('\n'))}">${esc(detail)}</span></div>`;
  }).join('');
  $('srcSummary').textContent = `Sources (${Object.keys(bySrc).length}) — click to see per-country counts; blocked platforms have direct search links under each country tab`;

  // fit chips
  const FITS = [['fit', 'Fit'], ['stretch', 'Stretch'], ['unknown', 'Unknown'], ['over', 'Overqualified'], ['no', 'Too senior']];
  function renderFitChips() {
    $('fitChips').innerHTML = FITS.map(([k, l]) => `<button class="chip ${ui.fits.includes(k) ? 'on' : ''}" data-fit="${k}">${l}</button>`).join('');
  }
  $('fitChips').onclick = e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;
    const k = b.dataset.fit; ui.fits = ui.fits.includes(k) ? ui.fits.filter(x => x !== k) : ui.fits.concat(k); persist(); render();
  };

  // sort options
  const SORTS = SCORED ? [['score', 'Best match'], ['date', 'Newest'], ['fit', 'Experience fit'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']]
                       : [['fit', 'Experience fit'], ['date', 'Newest'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']];
  $('sort').innerHTML = SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (!SCORED) $('scoreRange').style.display = 'none';

  // source select
  const srcNames = [...new Set(JOBS.map(j => j.source_name))].sort();
  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs
  function renderTabs(counts) {
    const tabs = [{ code: 'ALL', name: 'All', flag: '' }].concat(COUNTRIES);
    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src; $('viaSel').value = ui.via || '';
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  $('viaSel').onchange = () => { ui.via = $('viaSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly', 'mncOnly', 'highPay'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; $('viaSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'via', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved', 'exp_class', 'freshness']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '', j.exp_class || '', j.freshness || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>

    --ink: #11151A; --fg: #11151A; --muted: #4E575F; --line: #11151A; --line2: #C9CCC3;
    --accent: #EE3D28; --accent-on: #FFFFFF; --accent-soft: rgba(238,61,40,.12); --accent-bg: rgba(238,61,40,.12);
    --v2-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --v2-display: 'Archivo Black', Impact, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root[data-ui="v2"]:not([data-theme="light"]) {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); }
  :root[data-ui="v2"] body, :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea {
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  :root[data-ui="v2"] h1, :root[data-ui="v2"] h2, :root[data-ui="v2"] h3 { font-family: var(--v2-display); font-weight: 400; letter-spacing: -.01em; }
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tag, :root[data-ui="v2"] .pill, :root[data-ui="v2"] .ghost, :root[data-ui="v2"] .tb-toggle,
  :root[data-ui="v2"] details.fgrp > summary, :root[data-ui="v2"] span.fgrp > .flabel, :root[data-ui="v2"] .muted, :root[data-ui="v2"] th, :root[data-ui="v2"] code {
    font-family: var(--v2-mono); letter-spacing: .02em; }
  :root[data-ui="v2"] *:not(svg):not(path):not(circle) { border-radius: 0 !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea,
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle, :root[data-ui="v2"] details.fgrp, :root[data-ui="v2"] span.fgrp { border: 2px solid var(--line) !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle { box-shadow: 2px 2px 0 var(--line); font-weight: 700; }
  :root[data-ui="v2"] .chip[aria-pressed="true"], :root[data-ui="v2"] button[aria-pressed="true"] { background: var(--accent) !important; color: #fff !important; }
  :root[data-ui="v2"] [class*="card"], :root[data-ui="v2"] .app, :root[data-ui="v2"] .stat, :root[data-ui="v2"] section,
  :root[data-ui="v2"] .q, :root[data-ui="v2"] .row, :root[data-ui="v2"] article { border-color: var(--line) !important; box-shadow: 3px 3px 0 var(--line); }
</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
</body>
</html>
