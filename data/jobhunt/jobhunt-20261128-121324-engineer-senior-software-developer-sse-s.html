ut day to day your duties may include: Synthesise test bench requirements from user and operator needs and plan required verification methods and tests. Translate engine test objectives and stakeholder needs into facility-level functional and performance requirements. Perform technical trade-offs to determine the best choice of hardware, software, equipment, component, location etc for various test facilities. Perform risk assessment analyses for future tests and developing mitigation actions to ensure personnel and hardware safety. Provide technical inputs to cost, schedule, procurement, commissioning, maintainability, and facility acceptance planning. Prepare and maintain P&IDs of test facilities based on test bench requirements and selecting components. Undertaking preliminary design of the ground support equipment with minimal oversight. Undertake hazard assessments of the test facility design (FMEA and HAZOPs) to determine if any additional changes to the design are required. Work with the current test bench team to coordinate end-to-end activities of the development of test facilities including design, reviews, manufacturing, installation, commissioning, test operations, ongoing upgrades and maintenance. Work with procurement, AIT and design teams during the development of test facilities to find the right balance of technical solutions, cost and lead time. Presenting findings to team members and participating in design reviews and project discussions. What we would love to see from you: Bachelor's, master's or PhD in aerospace engineering, mechanical engineering, or a related field (Master’s and above preferred). 2–5 years of experience in propulsion, test facility development, experimental engineering, or a related field. Practical experience in the design, development, commissioning, or operation of test facilities, preferably for rocket propulsion systems. Experience in test facility design for cryogenic propulsion systems is highly desirable. Relevant experience with other cryogenic or high-pressure fluid systems will also be considered. Strong analytical and problem-solving skills, with the ability to interpret technical data, challenge assumptions, and make evidence-based engineering recommendations. Proven ability to work autonomously on assigned technical topics while contributing effectively to a multidisciplinary engineering team. Excellent communication and leadership skills, with the ability to convey complex concepts to diverse audiences. Why you should join us! What makes us special here at The Exploration Company and why we think you will enjoy working here is: We’re Agile - we make decisions fast whilst keeping our goals and systems in mind We’re Open and Collaborative - we are transparent about risks and obstacles, so that we can cooperate to overcome them We have a lot of Fun - we refuel our energy knowing we are democratising space. It’s a wonderful and rare opportunity, are YOU up for the challenge? We'd love to hear from you if you wish to be a part of our journey. Please submit your CV now for immediate consideration and we will be in touch shortly. The Exploration Company is an equal opportunity employer and values diversity. We do not discriminate based on race, religion, colour, national origin, gender, sexual orientation, age, marital status or disability status. Relocation assistance is provided for those willing to relocate including visa sponsorship where applicable. All offers are contingent upon the successful completion of a background check, which will be subject to the country, role, and project you applied for. By submitting your application, you acknowledge and agree that any offer of employment may be conditional upon successful condition of this check. The Exploration Company partners with Zinc Work Limited located in the UK (Zinc), a third-party provider, to ensure this process as efficient and transparent as possible. If applicable, you will receive an email from Zinc upon acceptance of your offer with a link to a secure portal where you can provide the required information to Zinc. Find more English Speaking Jobs in France on Arbeitnow", "skills": ["MAIT"], "employment_type": "Full Time", "exp_min": 2.0, "exp_max": 5.0, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 55.4, "matched_skills": ["agile", "english"], "missing_skills": ["team leadership"], "also_on": [], "query": "", "id": "e123879c481a", "extra": {"salary_stated": false, "reloc": {"label": "yes", "relocation": "yes", "visa": "yes", "evidence": "…Relocation assistance is provided for those willing to relocate including visa sponsorship where applicable.…"}, "semantic": 0.098, "score_confidence": "high", "ai_summary": {"why": "Strong backend experience with Kafka, PostgreSQL, and AWS aligns well with the engineering mindset required for test facility design. Agile and English skills are explicitly mentioned as desired.", "gaps": "Lacks direct propulsion or test facility engineering experience; primarily a backend role."}, "is_mnc": false, "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22The%20Exploration%20Company%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Bordeaux%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22The%20Exploration%20Company%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Bordeaux%22"}, "Engineering managers": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22The%20Exploration%20Company%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22Bordeaux%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22The%20Exploration%20Company%22%20%28%22Engineering%20Manager%22%20OR%20%22Team%20Lead%22%29%20%22Bordeaux%22"}, "Head of Engineering / CTO": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22The%20Exploration%20Company%22%20%28%22Head%20of%20Engineering%22%20OR%20%22VP%20Engineering%22%20OR%20%22CTO%22%29%20%22Bordeaux%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22The%20Exploration%20Company%22%20%28%22Head%20of%20Engineering%22%20OR%20%22VP%20Engineering%22%20OR%20%22CTO%22%29%20%22Bordeaux%22"}, "Senior engineer": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22The%20Exploration%20Company%22%20%28%22Senior%20engineer%22%29%20%22Bordeaux%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22The%20Exploration%20Company%22%20%28%22Senior%20engineer%22%29%20%22Bordeaux%22"}}}}}, {"source": "arbeitnow", "source_name": "Arbeitnow", "title": "Software Engineer (Java) - Security", "company": "Teampicnic", "url": "https://www.arbeitnow.nl/jobs/companies/teampicnic/software-engineer-java-security-amsterdam-78497", "country": "DE", "location": "Amsterdam", "remote": false, "posted": "2026-11-27", "posted_at": "2026-11-27T06:55:32+00:00", "posted_raw": 1795762532, "salary": "", "snippet": "<section class=\"section vacancy-detail-intro-section\"> <div class=\"section-inner\"> <div class=\"entry-intro\"> <h2><strong>In a nutshell<\/strong><\/h2> <p>At Picnic, we're building the most secure milkman on earth. Our Security team owns the security tooling that protects Picnic, and we're looking for a Java Engineer to make it work everywhere: connecting our systems to those tools, automating checks", "description": "<section class=\"section vacancy-detail-intro-section\"> <div class=\"section-inner\"> <div class=\"entry-intro\"> <h2><strong>In a nutshell<\/strong><\/h2> <p>At Picnic, we're building the most secure milkman on earth. Our Security team owns the security tooling that protects Picnic, and we're looking for a Java Engineer to make it work everywhere: connecting our systems to those tools, automating checks across the whole company, and strengthening how we manage identity and access.<br>You'll be the engineer in the Security team. Instead of writing policies, you'll write the code that wires our security systems into the rest of Picnic, and you'll help product teams do the right thing by default. <\/p> <h2><strong>Tricks of the trade<\/strong><\/h2> <ul> <li><strong>Ownership:<\/strong> Take ownership of projects from concept to delivery, aligning technical solutions with business goals with a product engineering mindset.<\/li> <li><strong>Platform work:<\/strong> Own Picnic’s core Security and IAM platform services, and build integrations with internal and external services.<\/li> <li><strong>Identity & Access:<\/strong> Help take our IAM initiative from MVP to production. Look at the options, build or integrate the pieces and connect them to the systems Picnic runs on.<\/li> <li><strong>Collaboration: <\/strong>Work closely with development teams to integrate security best practices into the software development lifecycle.<\/li> <li><strong>Security Ambassador: <\/strong>Conduct application security workshops to raise awareness and promote secure coding practices among developers.<strong><br><\/strong><\/li> <li><strong>Our Tech:<\/strong> Java 21/25 (Spring 6 with Spring Boot 3.5, Reactor, Immutables, Maven), React, Angular, RabbitMQ, Kafka, PostgreSQL, MongoDB, Git, Docker, AWS, Helm, Terraform, Kubernetes, Vault, Datadog, Python 3.x<\/li> <\/ul> <h2><strong>We’re looking for<\/strong><\/h2> <ul> <li>You have a Master’s Degree (in Computer Science, Artificial Intelligence, Information Technology, Computer Engineering or a related technical field) or equivalent experience.<\/li> <li>You have at least 3-7 years of professional experience with Java. <\/li> <li>A genuine curiosity about security: experience isn’t required, but you’re excited to dive into topics like access control and to grow into the domain with us.<\/li> <li>Your English skills are on point (no Dutch required).<\/li> <li>You're based in or happy to relocate to the Netherlands*<br><br>For bonus points:<\/li> <li>Experience with Security frameworks like NIST, CIS Controls<\/li> <li>Working experience in IAM integrations<\/li> <\/ul> <p>We work from our office in Amsterdam. Being present makes a genuine difference to your team and the work. There's flexibility to work from home when needed, but if remote or hybrid-first is what you're after, this probably isn't the right fit.<\/p> <h2><strong>Picnic Perks<\/strong><\/h2> <p><strong>✍🏼 Every expert was once a beginner! <\/strong><\/p> <p>You’ll get plenty of opportunities to challenge yourself and grow, including the Picnic Tech Academy, Lunch & Learn sessions, and tailored soft skills training. We also offer free professional weekly language courses.<\/p> <p><strong>💡 Make a difference<\/strong><\/p> <p>You’ll work in an awesome startup environment with the freedom to drive your own projects and create a visible impact. Our fully electric vehicles and sustainable business model mean you’ll also be contributing to making the world a better place! <\/p> <p><strong>🫱🏼‍🫲🏾 Teamwork makes the dream work<\/strong><\/p> <p>With more than 80 nationalities across 3 countries, you’ll be part of a diverse company with plenty of cool stuff to get involved with, from board game evenings to after-work drinks to our company ski trip and more!<\/p> <p><strong>🍎 You are what you eat<\/strong><\/p> <p>You’ll get freshly prepared, healthy lunches and snacks (with plenty of vegetarian, vegan, and halal options). Coffee snob? Don’t worry, our amazing Picnic barista has you covered.<\/p> <p><strong>🚴🏽 Stay healthy <\/strong><\/p> <p>Mental health is important. As well as having the option to speak with Picnic colleagues who act as confidential advisors, our collaboration with OpenUp gives you easy access to professional psychologists, along with workshops and materials. There are plenty of sports communities and events to get involved with, from tennis to yoga, to climbing! <\/p> <p><strong>🔋 Attractive package<\/strong><\/p> <p>We offer competitive compensation and a pension plan that looks out for your future self, as well as 25 vacation days per year, so you can recharge your batteries <\/p> <p><strong>🌍 Benefits for expats <\/strong><\/p> <p>It can be daunting starting a new job AND moving to a new country. That’s why we offer lots of support for our many expat colleagues, if you want to find our relocation benefits, see <a href=\"https://jobs.picnic.app/en/relocation\">here<\/a>.<\/p> <\/div> <\/div> <\/section> Find Jobs in Netherlands on Arbeitnow", "skills": ["Engineering"], "employment_type": "", "exp_min": 3.0, "exp_max": 7.0, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Very fresh", "relevance": 1.0, "score": 48.7, "matched_skills": ["java", "spring", "react", "angular", "rabbitmq", "kafka", "postgresql", "docker", "aws", "english"], "missing_skills": ["iam", "mvp", "application security", "mongodb", "git", "helm", "terraform", "kubernetes"], "also_on": [], "query": "", "id": "aac1da2d0cb2", "extra": {"salary_stated": false, "reloc": {"label": "yes", "relocation": "yes", "visa": "unknown", "evidence": "…That’s why we offer lots of support for our many expat colleagues, if you want to find our relocation benefits, see <a href=\"https://jobs.picnic.app/en/relocation\">here<\/a>.<\/p> <\/div> <\/div> <\/section> Find Jobs in Netherlands on Arbeitnow"}, "semantic": 0.282, "score_confidence": "high", "ai_summary": {"why": "Strong Java/Spring Boot experience with Kafka, PostgreSQL, and AWS aligns with the core tech stack. Candidate's focus on security best practices and ownership mindset matches the Security team's goals.", "gaps": "Lacks specific experience with IAM, Kubernetes, Terraform, and Git, which are critical for the Security platform role."}, erventions — vendor-level and multi-node operations in production: full rack builds and bring-up, GPU-dense platform deployment (H100/H200-class and next-gen, including liquid-cooled racks), intricate recabling, post-restart diagnosis. You own the plan, the risk assessment, and the rollback. Own vendor management — coordinate repairs, part replacements and escalations directly with hardware vendors; hold them to their SLAs; drive proactive fixes from failure trends. Diagnose at depth — correlate symptoms across compute, storage, interconnect and cooling; read BMC/IPMI consoles, OS logs and crash dumps; methodical root-cause analysis that ends in concrete corrective actions. Deploy and validate — structured bring-up and validation of new racks and platforms; work with networking and infrastructure teams to take installations from delivery to production-ready. Lift the team — mentor and pair with L1–L3 engineers on live operations; turn your knowledge into SOPs, checklists and training material; propose and build small automation (Python/Bash) to shorten MTTR. Work the facility interface — partner with critical facilities/engineering ops on power, cooling (air and liquid), PDU and monitoring (BMS/EPMS) boundaries; enforce ESD/LOTO/PPE and audit-ready change discipline everywhere. Own spares & reliability — plan spares strategy, track fleet failure trends, and run proactive vendor actions before incidents happen. About you 6+ years in data center / server hardware or L2/L3 hardware support, including complex hands-on work in production environments (HPC/AI/cloud at scale strongly preferred). End-to-end hardware expertise: CPU/memory/PCIe (incl. accelerators), NICs, PSUs, drives, network, power and cooling interfaces (DLC included); strong judgment on when and how to escalate. Diagnostics depth: confident with BMC/IPMI logs, Linux logs and CLI checks; structured root-cause analysis. Deployment experience: you've taken racks from delivery to production, with concrete exa     const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';

    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }

    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;

    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();

<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
