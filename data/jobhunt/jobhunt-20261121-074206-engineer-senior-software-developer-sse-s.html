e, end to end. THE ROLE We’re looking for a Software Engineer to work across the full stack rather than a single siloed layer. Our system combines event-driven workflows, service-to-service APIs, and real-time client communication—so your work will span React interfaces, TypeScript and Python backend services, PostgreSQL data models, and asynchronous job queues. At this stage of our growth, the core engineering focus is scale, reliability, and hardening—driving down end-to-end latency, optimizing database queries, refining access controls, and strengthening distributed concurrency. This role fits someone who reads how a production system actually behaves before changing it, and who ships verified fixes over quick guesses. WHAT YOU’LL OWN • Candidate Coding Experience: Build and harden our browser-based IDE—editing workflows, resilient autosave, live execution feedback over WebSockets, pre-assessment environment checks, and reliable media uploads. • Recruiter Decision Console: Develop the dashboard hiring managers rely on under time pressure—candidate reports, code-quality and integrity breakdowns, session timelines, review queues, and synchronized media playback. • Core Backend & Orchestration: Design and scale APIs and state machines handling assessment lifecycles, candidate sessions, RBAC, usage accounting, and asynchronous workflows with clean contracts and idempotent failure handling. • Analysis & Scoring Pipelines: Extend our code-quality and integrity pipelines across deterministic scoring rules, telemetry processing, computer-vision signals, and bounded LLM integrations—keeping results accurate and explainable. • Reliability & Observability: Improve resilience across execution sandboxes, PostgreSQL databases, Redis queues, and object storage. Debug issues with distributed traces and metrics, and back every fix with regression tests. OUR STACK You don't need prior fluency in every tool, but you should be strong in TypeScript and comfortable moving across frontend state, backend APIs, SQL query plans, and Python services: • Frontend: React, TypeScript, Vite, Tailwind CSS, TanStack Query, Monaco Editor, Socket.IO, browser media/WASM APIs • Backend: Node.js (NestJS, Prisma, Express), Python (FastAPI) • Data & Async: PostgreSQL, Redis, S3-compatible object storage, BullMQ, Celery, Server-Sent Events • Infra & Observability: Docker, Linux, GitHub Actions, OpenTelemetry, Prometheus, Grafana, k6 WHAT WE’RE LOOKING FOR • 1–4 years of production experience shipping full-stack web applications (or equivalent demonstrated depth). • Strong TypeScript & React fundamentals—able to reason across UI state, API lifecycles, and relational schemas in the same afternoon. • Solid backend engineering: Practical grasp of HTTP semantics, auth/RBAC, idempotency, transactions, and fault-tolerant queue retries. • PostgreSQL beyond CRUD: Comfortable with joins, indexing, migrations, and reading EXPLAIN plans. • High engineering rigor: You verify changes with tests, traces, or benchmarks before calling them done. • Immediate availability to join our Mumbai office (Hybrid). Bonus points for: A live project or readable GitHub repo with real users; experience debugging distributed race conditions or retry storms; production LLM or media/computer-vision integrations; Python async services (FastAPI/Celery); or work in audited domains like HR tech or fintech. HOW WE ENGINEER • Contract-first APIs: Shared schemas, pagination standards, and permission models are strictly typed across services. • Verification by default: Bug fixes ship with regression tests; auth changes include negative (403) tests; performance work includes measurements. • Zero-downtime evolution: Database and API changes roll out via staged, backward-compatible migrations. • Safe rollouts & CI guardrails: Feature flags, shadow-mode validation for automated scoring, and automated CI checks for timeouts and bounded queries. HOW TO APPLY Please apply at https://qualifycode.com/careers (and include the following in your application or Wellfound note): 1. A working link to something you built (a live product, open-source contribution, or GitHub repo we can read). 2. One line on which part of our stack or problem space you’d most want to own.", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 72.6, "matched_skills": ["typescript", "postgresql", "react", "observability", "concurrency", "websockets", "sql", "s3", "docker", "linux", "github actions", "prometheus"], "missing_skills": ["python", "artificial intelligence", "llm", "redis", "fastapi", "event-driven", "vite", "tailwind"], "also_on": [], "query": "software-engineer", "id": "wf5081971", "extra": {"company_size": "SIZE_1_10", "salary_stated": true, "salary_inr": 2000000, "salary_lpa": 20.0, "salary_text": "₹12L – ₹20L • No equity", "semantic": 0.455, "score_confidence": "high", "ai_summary": {"why": "Strong match in event-driven architecture, PostgreSQL optimization, and distributed systems. Experience with Kafka, TimescaleDB, and AWS aligns perfectly with the core backend and orchestration requirements.", "gaps": "Limited experience with Python, Redis, and AI/LLM integrations, which are critical for this role's specific stack."}, "is_mnc": false, "lpa": 20.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0, "contacts": {"domain": "", "site": "", "emails": [], "people": [], "searches": {"Tech recruiters": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22QualifyCode%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Mumbai%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22QualifyCode%22%20%28%22Technical%20Recruiter%22%20OR%20%22Talent%20Acquisition%22%20OR%20%22Recruiter%22%29%20%22Mumbai%22"}, "Engineering managers" d by IIT-B alumni, OnGrid has completed more than 12 million checks across 900+ happy clients. At OnGrid, we are focused on redefining and reimagining trust and accountability. Our platform and digital locker infrastructure (eLockr) would enable organizations to verify credentials instantly, and as much as possible, directly via issuing source. Having built the basic pillars of trust (and creating a profitable venture with 100+ full-time people in the process), we now want our imagination to be let loose and think of avenues never explored, and execute in ways never implemented before. In this pursuit, we are looking for a Software Engineer who can drive this transformation at scale and work with upper management in building high-performing, scalable, enterprise-grade applications, to join us and drive this vision and take it to a larger scale. If you are a visionary, always on the lookout for finding the right solutions, and a technology geek, constantly seeking to learn and improve your skillset, then you are the type of person we are looking for. **What you will do** * Work on a product from the ground-up * Understand our requirements, and design, develop and iterate, think through the complex architecture * Writing clean, reusable, high-quality, high-performance, maintainable code * Work on the try-fast, fail-fast, and learn-fast principle * Ensure the technical feasibility of UI/UX designs and optimize applications for maximum speed * Keeping up to date with industry trends and developments **Requirements** * Bachelors/Masters in Computer Science or a related field * 1-2 years of prior relevant experience * Extensive experience working on Javascript * Experience in working on frameworks like React and VueJS * Excellent teamwork skills, flexibility, and ability to handle multiple tasks. * Strong understanding of Object-Oriented Programming, Data Structures, and Algorithms. * Strong knowledge of Javascript, HTML5, CSS3. **What’s in it for you** Work with experien ing, permissions, empty states, and performance optimisation. Work closely with backend engineers, designers, and product stakeholders to deliver seamless product experiences. Incorporate user feedback and continuously improve product functionality. Maintain clear technical documentation and communicate engineering decisions effectively. Must-Have Skills Software Engineering Agentic AI Coding Tools Database Design Full-Stack Development TypeScript / JavaScript React / Next.js Python / FastAPI PostgreSQL API Development & Integration Production Debugging Product Thinking Good-to-Have Skills Cursor Claude Code Codex GitHub Copilot B2B SaaS Data Engineering & Analytics ETL/ELT Pipelines dbt Fivetran / Airbyte OpenAI / LLMs Retrieval-Augmented Generation (RAG) Embeddings & Semantic Search Kafka / Redis / Celery / Temporal Enterprise Product Development Experience & Qualifications Minimum 2+ years of professional experience in software engineering and building production-grade applications. Strong understanding of full-stack development and modern software engineering practices. Hands-on experience with TypeScript, Next.js, React, Python, FastAPI, and PostgreSQL is preferred. Experience using AI-assisted development tools and agentic coding platforms. Strong understanding of database design, APIs, integrations, asynchronous processing, and system architecture. Ability to independently manage engineering tasks and deliver end-to-end product features. Strong problem-solving, analytical, and debugging capabilities. Excellent written and verbal communication skills. Must be comfortable working from Mumbai.", "skills": [], "employment_type": "['Full Time']", "exp_min": 2.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 42.9, "matched_skills": ["typescript", "react", "postgresql", "code review", "observability", "javascript", "kafka"], "missing_skills": ["artificial inte ll, "posted_raw": "", "salary": "₹20L – ₹30L", "snippet": "**About Decentro** Decentro is a Y-Combinator backed banking & payments infrastructure company. Decentro provides building blocks that help companies stitch their fintech workflows in a few weeks. While starting our first fintech venture back in 2014, we spent years convincing banks to partner with us. Before we could launch our fintech product (more here), we had to convince different departments", "description": "**About Decentro** Decentro is a Y-Combinator backed banking & payments infrastructure company. Decentro provides building blocks that help companies stitch their fintech workflows in a few weeks. While starting our first fintech venture back in 2014, we spent years convincing banks to partner with us. Before we could launch our fintech product (more here), we had to convince different departments within banks - including technology, business, leadership, legal, and support to get the green signal. Fast forward to today, we realise that banks & regulatory institutions find it difficult to help the longer tail of companies build innovative & compliant fintech solutions. What if there was a platform (think AWS for cloud or Twilio for messaging) that abstracts the complexities of banking, identity, payments, lending, and provides simple APIs so that companies do not have to spend years dealing with banks? We’re solving this pain point at Decentro since 2020. We’ve scaled to process $4 billion + in payment volumes & have 1400+ customers across India & Singapore in multiple verticals such as marketplaces, banks, regulated institutions, fintechs, lenders, gaming, and more. **About the role** We are looking for a highly motivated and experienced Site Reliability Engineer to join our engineering team. This role will focus on improving the reliability, visibility and operational excellence of our production systems. You will work closely with the SRE and engineering teams to build comprehensive observability and SLO coverage across our products and infrastructure. **What is expected from you -** 1. Operate, stabilise and continuously improve our production observability stack, with hands-on experience in Prometheus, Grafana and related monitoring systems. 2. Implement and maintain SLIs, SLOs, error budgets, recording rules, dashboards and burn-rate alerts for critical user journeys and services. 3. Drive OpenTelemetry adoption across product teams, including service instrumentation, telemetry pipelines and correlation across metrics, logs and traces. 4. Operate and troubleshoot observability workloads on Kubernetes, including stateful, multi-node and highly available production workloads. 5. Own PromQL and Prometheus-based monitoring, including query optimisation, recording rules, metric types, histograms and identifying high-cardinality issues. 6. Own alert quality and incident response, improving alerting, routing and escalation while reducing noisy and non-actionable alerts. 7. Manage and optimise the AWS telemetry surface across CloudWatch, ALB, WAF, VPC Flow Logs and ECS, including multiple accounts and regions. 8. Build automation and tooling using Python, including custom exporters, log-processing Lambdas, SLI computation jobs and other data-processing workflows. 9. Improve telemetry efficiency and cost through cardinality management, retention, sampling and data-volume optimisation, while ensuring appropriate security and compliance for sensitive data. 10. Work closely with engineering and SRE teams to audit and improve observability coverage across services and infrastructure, contribute to the migration towards a highly available LGTM stack (Loki, Grafana, Tempo and Mimir) with Prometheus on Kubernetes, and continuously improve production reliability based on operational feedback. **What we are looking for -** 1. 3+ years of hands-on experience in SRE, Observability, Production Engineering or Reliability Engineering, with 4-5 years of total engineering experience. 2. Strong production experience with Prometheus and Grafana, including PromQL, recording rules, dashboards, alerting and troubleshooting monitoring issues. 3. Hands-on experience operating observability workloads on Kubernetes, including stateful, multi-node and highly available production environments. 4. Practical experience with OpenTelemetry, including SDKs, collectors, service instrumentation and telemetry pipelines across metrics, logs and traces. 5. Proven experience implementing SLIs, SLOs, error budgets and burn-rate based alerting for production systems. 6. Strong understanding of observability best practices, including alert quality, incident management, cardinality management, retention, sampling and telemetry cost optimisation. 7. Hands-on experience with AWS observability and monitoring, particularly CloudWatch, ALB, WAF, VPC Flow Logs and ECS, preferably across multiple accounts and regions. 8. Strong Python scripting and automation skills, with experience building exporters, pipelines, Lambda functions or data-processing workflows. 9. Experience with Terraform and Helm, along with exposure to LGTM components, continuous profiling (Pyroscope), eBPF-based observability (Beyla/Alloy), SQL and analytical stores (Athena, Doris, Iceberg), frontend/RUM observability, or load/chaos testing is a strong plus. 10. Experience with live system/platform migrations, observability checks integrated into CI/CD (Jenkins), and Payments / Fintech / Banking is a plus. Strong problem-solving, ownership and communication skills, with the ability to collaborate effectively with engineering teams, are essential. **Why join Decentro** You will work on high-scale payment infrastructure, solve real production reliability challenges, and contribute to systems that power critical financial workflows. This is an opportunity to build strong platform and reliability depth while working with a fast-moving team in one of the most interesting segments of fintech. **What We Offe . * Build robust BLE communication layers covering device discovery, pairing, authentication, synchronisation, OTA firmware updates, and real-time data streaming. * Design clean, scalable, and developer-friendly SDK APIs for health, fitness, notifications, device controls, and sensor data access. * Define SDK architecture, versioning strategies, backward compatibility, and release processes. * Collaborate with firmware teams to define BLE services, GATT profiles, and device communication protocols. * Integrate health and wellness features such as heart rate, SpO₂, sleep, activity, and stress monitoring. * Optimise SDK performance, battery consumption, memory usage, and connection reliability. * Build developer documentation, sample applications, integration guides, and debugging tools. * Drive SDK quality through automated testing, CI/CD pipelines, and code reviews. * Lead technical discussions, establish engineering best practices, and mentor junior engineers. * Collaborate with Android SDK and cross-platform mobile teams to maintain consistency across platforms. **Must-Have Requirements** * 3 years of overall software development experience, with at least 2+ years of hands-on native iOS development experience. * Strong proficiency in Swift and working knowledge of Objective-C. * Proven experience developing, releasing, and maintaining production iOS applications on the Apple App Store. * Experience working with Bluetooth Low Energy (BLE) and Apple's CoreBluetooth framework in a production environment. * Hands-on experience building and publishing reusable iOS SDKs, frameworks, or developer-facing libraries. * Experience working on applications or products with meaningful production traction — at least 10,000+ Monthly Active Users (MAUs) or 10,000+ cumulative downloads. * Strong understanding of iOS architecture patterns such as MVC, MVVM, and Clean Architecture. * Experience with BLE device discovery, pairing, connection management, data transfer, and synchronisation. * Strong understanding of software design principles, multithreading, concurrency, and performance optimisation. * Experience with dependency management tools such as Swift Package Manager, CocoaPods, or Carthage. * Familiarity with REST APIs, WebSockets, and cloud-connected mobile applications. * Strong debugging and troubleshooting skills, particularly around device connectivity and communication issues. **Good-to-Have Requirements** * Experience developing SDKs or applications for smartwatches, smart rings, fitness trackers, hearables, or other wearable devices. * Experience implementing OTA firmware update workflows over BLE. * Familiarity with Apple HealthKit and health data synchronisation. * Experience working with sensor technologies such as PPG, IMU, temperature sensors, and other bio-sensing systems. * Understanding of BLE security mechanisms, including encryption, bonding, authentication, and privacy. * Experience debugging BLE communication using tools such as nRF Connect, Wireshark, or protocol analysers. * Familiarity with BLE GATT profiles, custom services, characteristics, and communication protocols. * Experience with CI/CD pipelines, automated testing, and SDK distribution platforms. * Experience collaborating with firmware, embedded systems, cloud, and algorithm engineering teams. * Familiarity with Android SDK development or experience collaborating with Android SDK counterparts. * Experience building developer documentation, sample applications, and integration tools for external developers. **What Makes You a Good Fit** * You have shipped real-world iOS applications and understand the challenges of maintaining production-grade software. * You have hands-on experience with BLE connectivity and understand the complexities of communicating with hardware devices. * You have built reusable SDKs or frameworks with clean APIs and strong backward compatibility. * You care about performance, reliability, and developer experience. * You enjoy workin velopment workflows, including dependency scanning, static analysis, and secret detection. * Write scripts to automate repetitive security checks and improve monitoring. * Maintain security documentation, incident playbooks, and evidence for audits and assessments. **What we are looking for** * 2–3 years of total professional experience, including hands-on experience in security engineering, application security, cloud security, SOC, or VAPT. * Practical understanding of common application and API vulnerabilities, including broken access controls, injection, authentication flaws, and security misconfigurations. * Familiarity with Burp Suite, OWASP ZAP, Nmap, or equivalent security-testing tools. * Working knowledge of Linux, networking, HTTP/TLS, and cloud security fundamentals. * Experience investigating security findings and documenting their impact, reproduction steps, and recommended fixes. * Basic scripting skills in Python, Bash, or a similar language. * An ownership mindset, attention to detail, and the ability to collaborate effectively with developers. * Exposure to AWS security services, SIEM tools, endpoint security, or container security is good to have. * Experience with CI/CD security tooling, SAST, DAST, or software composition analysis is good to have. * Familiarity with fintech or payments environments and frameworks such as ISO 27001, SOC 2, or PCI DSS is an added advantage. * Relevant certifications, responsible disclosures, bug bounty findings, or security projects demonstrating practical skills are an added advantage. * Prior professional, hands-on security experience is mandatory. Certifications or coursework alone will not meet this requirement. **What We Offer** * The ability to make an impact and lay the foundation for upcoming fintech innovations. A multicultural and diverse team with colleagues from different states and global backgrounds. * Progressive and flexible work hours that match your personality and lifestyle. Best-in-class perks ture a finance analyst who has just built something brilliant with an AI agent, on their laptop, over a weekend. Today, that is where it dies. Your job is to make sure it doesn’t. You will own the experience that takes anything anyone builds, with any AI tool, and turns it into real, trusted company software, without them ever needing to become an engineer. This is developer experience for the next billion builders, and the hardest version of it: your users can’t read a stack trace, so the product has to just work. ### What you’ll own - The builder’s journey from “it works on my laptop” to “the whole company uses it”, wherever they build. - The intelligence that converts apps built anywhere into secure, connected company apps, without breaking what already works. - How Isomorph guides every builder’s own AI agent, so they get things right without learning any rules. - A product that gets smarter with every app that passes through it. ### What you’ll get to build next - Turn what we learn from every real app into an edge no general-purpose agent has. Over time, that becomes the foundation for models of our own. - Get to a world where any app goes live in minutes, and builders almost never get stuck. ### You’ll thrive here if - You have built developer tools or products that people loved, and you obsess over the first five minutes. - You are a strong engineer who can understand code you didn’t write, fast. - You live in AI coding agents and have strong opinions on how to make them reliable. - You get excited by making something hard feel effortless. ### Why Isomorph For fifty years, software inside a company has been written by a small group of engineers, for everyone else. That is ending. With AI, the people who know the work best (the finance analyst, the ops lead, the recruiter, the support manager) can now build the software they need themselves. Most of them have never written a line of code. This is one of the biggest shifts in how companies work, and it has a missing piece. The software these people build is useful, and very often unsafe: no sign-in, sensitive data exposed, nobody to run it, and invisible to IT. Multiply that across a large company and you get thousands of apps and agents that nobody governs. **Isomorph is the foundation that software runs on.** Bring an app or agent built with any AI tool, and Isomorph runs it on the company’s own cloud: secured, connected to company data and systems, monitored and kept healthy. Builders never think about infrastructure. IT stays in control of everything. We believe every company will become AI-native one workflow at a time, built by its own people. Isomorph is where that software will live. **The team.** You will join a small, high-talent-density founding team from IIT Madras and IIT Delhi. The founders are second-time founders who have built companies before and sold one. ### Why you’ll love it here - **You’ll be early.** You will be one of the first people on the team, with real ownership and a real say in what Isomorph becomes. - **You’ll work at the frontier.** AI agents and enterprise-grade infrastructure, applied to a problem every company is about to have. - **You’ll see your impact.** We work side by side with customers, so what you ship is in real people’s hands within days. - **You’ll build the way the future builds.** We build Isomorph with AI agents ourselves, so your leverage is your judgment and your taste, not your typing speed. - **You’ll grow fast.** Small team, huge surface, founders who have built and scaled before. Apply: https://isomorph.ai/careers/founding-engineer-builder-experience/", "skills": [], "employment_type": "full-time", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 13.9, "matched_skills": [], "missing_skills": ["artificial intelligence", "ai agents"], "also_on": [], "query": "engineer", "id": "wf5 <script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);

  const COUNTRIES = DATA.countries || [];

  const STATE_KEY = 'jobhunt:state';
  const UI_KEY = 'jobhunt:ui:' + (META.run_id || 'run');

  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  const S = Object.assign({ applied: {}, saved: {}, hidden: {} }, load(STATE_KEY, {}));

  // theme
  const savedTheme = load('jobhunt:theme', null);

    $('fitChips').innerHTML = FITS.map(([k, l]) => `<button class="chip ${ui.fits.includes(k) ? 'on' : ''}" data-fit="${k}">${l}</button>`).join('');
  }
  $('fitChips').onclick = e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;
    const k = b.dataset.fit; ui.fits = ui.fits.includes(k) ? ui.fits.filter(x => x !== k) : ui.fits.concat(k); persist(); render();
  };

  // sort options
  const SORTS = SCORED ? [['score', 'Best match'], ['date', 'Newest'], ['fit', 'Experience fit'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']]
                       : [['fit', 'Experience fit'], ['date', 'Newest'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']];
  $('sort').innerHTML = SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (!SCORED) $('scoreRange').style.display = 'none';

  // source select
  const srcNames = [...new Set(JOBS.map(j => j.source_name))].sort();
  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs
  function renderTabs(counts) {
    const tabs = [{ code: 'ALL', name: 'All', flag: '' }].concat(COUNTRIES);
    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src; $('viaSel').value = ui.via || '';
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  $('viaSel').onchange = () => { ui.via = $('viaSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly', 'mncOnly', 'highPay'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; $('viaSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'via', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved', 'exp_class', 'freshness']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '', j.exp_class || '', j.freshness || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);

    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {

  function ring(score, conf) {

    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);

    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}

      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>

  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));

    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);

    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'

    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }

  };
  render();

<script>
(function () {

  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
</body>
</html>
