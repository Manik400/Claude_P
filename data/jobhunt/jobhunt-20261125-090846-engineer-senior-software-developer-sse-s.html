gineer%22%29%20%22Chennai%22"}}}}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Software Engineer", "company": "QualifyCode", "url": "https://wellfound.com/jobs/5081971-software-engineer", "country": "IN", "location": "Mumbai", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "₹12L – ₹20L • No equity", "snippet": "ABOUT QUALIFYCODE AI has made it trivial to fabricate resumes, take-home assignments, and remote interviews. QualifyCode is the integrity layer for technical hiring—helping engineering teams verify candidate work objectively while keeping every hiring decision explainable, auditable, and fair. We are a small, product-focused team in Mumbai running a live production platform used in real hiring wor", "description": "ABOUT QUALIFYCODE AI has made it trivial to fabricate resumes, take-home assignments, and remote interviews. QualifyCode is the integrity layer for technical hiring—helping engineering teams verify candidate work objectively while keeping every hiring decision explainable, auditable, and fair. We are a small, product-focused team in Mumbai running a live production platform used in real hiring workflows. Our product spans a proctored web coding IDE, a recruiter decision console, isolated code-execution pipelines, and automated integrity and code-quality analysis services. Everything is built and owned in-house, end to end. THE ROLE We’re looking for a Software Engineer to work across the full stack rather than a single siloed layer. Our system combines event-driven workflows, service-to-service APIs, and real-time client communication—so your work will span React interfaces, TypeScript and Python backend services, PostgreSQL data models, and asynchronous job queues. At this stage of our growth, the core engineering focus is scale, reliability, and hardening—driving down end-to-end latency, optimizing database queries, refining access controls, and strengthening distributed concurrency. This role fits someone who reads how a production system actually behaves before changing it, and who ships verified fixes over quick guesses. WHAT YOU’LL OWN • Candidate Coding Experience: Build and harden our browser-based IDE—editing workflows, resilient autosave, live execution feedback over WebSockets, pre-assessment environment checks, and reliable media uploads. • Recruiter Decision Console: Develop the dashboard hiring managers rely on under time pressure—candidate reports, code-quality and integrity breakdowns, session timelines, review queues, and synchronized media playback. • Core Backend & Orchestration: Design and scale APIs and state machines handling assessment lifecycles, candidate sessions, RBAC, usage accounting, and asynchronous workflows with clean contracts and idempotent failure handling. • Analysis & Scoring Pipelines: Extend our code-quality and integrity pipelines across deterministic scoring rules, telemetry processing, computer-vision signals, and bounded LLM integrations—keeping results accurate and explainable. • Reliability & Observability: Improve resilience across execution sandboxes, PostgreSQL databases, Redis queues, and object storage. Debug issues with distributed traces and metrics, and back every fix with regression tests. OUR STACK You don't need prior fluency in every tool, but you should be strong in TypeScript and comfortable moving across frontend state, backend APIs, SQL query plans, and Python services: • Frontend: React, TypeScript, Vite, Tailwind CSS, TanStack Query, Monaco Editor, Socket.IO, browser media/WASM APIs • Backend: Node.js (NestJS, Prisma, Express), Python (FastAPI) • Data & Async: PostgreSQL, Redis, S3-compatible object storage, BullMQ, Celery, Server-Sent Events • Infra & Observability: Docker, Linux, GitHub Actions, OpenTelemetry, Prometheus, Grafana, k6 WHAT WE’RE LOOKING FOR • 1–4 years of production experience shipping full-stack web applications (or equivalent demonstrated depth). • Strong TypeScript & React fundamentals—able to reason across UI state, API lifecycles, and relational schemas in the same afternoon. • Solid backend engineering: Practical grasp of HTTP semantics, auth/RBAC, idempotency, transactions, and fault-tolerant queue retries. • PostgreSQL beyond CRUD: Comfortable with joins, indexing, migrations, and reading EXPLAIN plans. • High engineering rigor: You verify changes with tests, traces, or benchmarks before calling them done. • Immediate availability to join our Mumbai office (Hybrid). Bonus points for: A live project or readable GitHub repo with real users; experience debugging distributed race conditions or retry storms; production LLM or media/computer-vision integrations; Python async services (FastAPI/Celery); or work in audited domains like HR tech or fintech. HOW WE ENGINEER • Contract-first APIs: Shared schemas, pagination standards, and permission models are strictly typed across services. • Verification by default: Bug fixes ship with regression tests; auth changes include negative (403) tests; performance work includes measurements. • Zero-downtime evolution: Database and API changes roll out via staged, backward-compatible migrations. • Safe rollouts & CI guardrails: Feature flags, shadow-mode validation for automated scoring, and automated CI checks for timeouts and bounded queries. HOW TO APPLY Please apply at https://qualifycode.com/careers (and include the following in your application or Wellfound note): 1. A working link to something you built (a live product, open-source contribution, or GitHub repo we can read). 2. One line on which part of our stack or problem space you’d most want to own.", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 72.7, "matched_skills": ["typescript", "postgresql", "react", "observability", "concurrency", "websockets", "sql", "s3", "docke son we are looking for. **What you will do** * Work on a product from the ground-up * Understand our requirements, and design, develop and iterate, think through the complex architecture * Writing clean, reusable, high-quality, high-performance, maintainable code * Work on the try-fast, fail-fast, and learn-fast principle * Ensure the technical feasibility of UI/UX designs and optimize applications for maximum speed * Keeping up to date with industry trends and developments **Requirements** * Bachelors/Masters in Computer Science or a related field * 1-2 years of prior relevant experience * Extensive experience working on Javascript * Experience in working on frameworks like React and VueJS * Excellent teamwork skills, flexibility, and ability to handle multiple tasks. * Strong understanding of Object-Oriented Programming, Data Structures, and Algorithms. * Strong knowledge of Javascript, HTML5, CSS3. **What’s in it for you** Work with experienced entrepreneurs in a bootstrap start-up that is growing fast despite COVID. Our teams are close-knit and often contribute to each other’s professional and personal growth. You will be a significant contributor to taking our product to the next level. You will have benefits such as Flexi working hours, receive a competitive compensation plan, paternity leave, maternity leave, ESOPs, a medical plan, etc.", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 71.5, "matched_skills": ["javascript", "data structures", "react", "html", "css"], "missing_skills": ["ui/ux", "vue", "object-oriented", "bootstrap"], "also_on": [], "query": "software-engineer", "id": "wf1998621", "extra": {"company_size": "SIZE_201_500", "salary_stated": true, "salary_inr": 1500000, "salary_lpa": 15.0, "salary_text": "₹10L – ₹15L • No equity", "semantic": 0.455, "score_confidence": "high", "ai  closely with product and business teams to understand real customer problems and translate them into technical solutions. You will be expected to think beyond the implementation and understand the business impact of what you build. ### Stay hands-on This is a highly hands-on engineering role. You will: * Write production-quality code * Prototype and test new ideas * Participate in architecture and system design discussions * Review code and improve engineering practices * Use AI tools extensively to improve engineering velocity * Continuously learn and adapt to new technologies ## WHAT SUCCESS LOOKS LIKE ### First 30 Days * Build strong context around Clara AI's technology and customers * Understand existing systems and engineering practices * Start shipping meaningful improvements * Identify opportunities to improve product or engineering velocity ### First 60 Days * Own significant technical initiatives * Deliver production features independently * Improve system quality, reliability, or performance * Contribute meaningfully to architecture and technical decisions ### First 90 Days * Independently own important areas of the product * Ship meaningful AI-native capabilities * Raise engineering quality and technical standards * Become a reliable technical owner within the team ## WHO WE'RE LOOKING FOR ### Must Have * **3–7 years of software engineering experience** * Strong hands-on engineering background * Experience building and scaling production systems * Strong problem-solving and engineering fundamentals * Experience owning features or technical initiatives end-to-end * Strong understanding of backend systems and APIs * Product mindset and ability to understand customer problems * Comfortable working in ambiguity and fast-changing environments ### Strong Signals * Has been an early engineer or worked in a startup environment * Has built products or features from zero to one * Experience with AI-powered products or LLM applications * Uses AI tools extensively t x building projects.", "skills": [], "employment_type": "permanent", "exp_min": 1.0, "exp_max": 8.0, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 43.6, "matched_skills": ["english"], "missing_skills": ["project management"], "also_on": [], "query": "engineer", "id": "8b87e041d433", "extra": {"details_fetched": true, "salary_stated": true, "salary_inr": 1500000, "salary_lpa": 15.0, "salary_text": "800,000 - 1,500,000", "semantic": 0.134, "score_confidence": "high", "is_mnc": false, "lpa": 15.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6.0}}, {"source": "instahyre", "source_name": "Instahyre", "title": "Data Engineer", "company": "Physarum", "url": "https://www.instahyre.com/job-156897-data-engineer-at-physarum-bangalore/", "country": "IN", "location": "Bangalore", "remote": null, "posted": "2022-04-17", "posted_at": null, "posted_raw": "", "salary": "", "snippet": "Unfragment enterprise AI", "description": "We are hiring engineers to build enterprise data platforms, Kafka-based streaming systems, source integrations, and data infrastructure for AI applications and agents. You will both build reusable platform capabilities and deploy them in enterprise environments, owning integration design, implementation, testing, deployment, and production operations. The role emphasises software engineering, distributed systems, and platform development, with SQL as a supporting skill. Responsibilities: Design source integrations: Assess enterprise systems and select ingestion patterns based on source interfaces, data volumes, freshness requirements, rate limits, and operational constraints. Build reusable connectors: Implement authentication, pagination, source-to-target mapping, validation, incremental state, retries, and recovery across databases, APIs, applications, files, and streams. Engineer reliable streaming: Develop Kafka-based pipelines with appropriate partitioning, state management, monitoring, replay, and failure handling. Build lakehouse capabilities: Develop pipelines and data products using S3, Iceberg, Glue, Spark, and Athena, including incremental updates, schema changes, and backfills. Enable AI consumption: Expose governed enterprise data and context through APIs, retrieval pipelines, and MCP interfaces. Automate deployment: Provision infrastructure and deploy pipelines using Terraform, containers, and GitLab CI/CD. Own production quality: Implement automated tests, reconciliation, data quality checks, observability, security controls, and recovery procedures. Deliver as an FDE: Work directly with enterprise teams to understand unfamiliar systems, resolve integration challenges, and own implementation through operational handover. Improve the shared platform: Turn recurring project needs into reusable services, connectors, SDKs, and deployment templates. Apply the Software Factory: Use and improve our engineering platform to accelerate implementation, testing, and deployment while remaining accountable for correctness. The core requirements for the job include the following: Core skills: Software engineering: Python, object-oriented programming (OOP), data structures, modular design, asynchronous programming, concurrency, automated testing, and debugging. Backend services: FastAPI, REST APIs, API contracts, authentication, validation, error handling, and reusable service components. Apache Kafka: Producers, consumers, topics, partitions, message keys, offsets, consumer groups, rebalancing, ordering, and consumer lag. Streaming reliability: Delivery semantics, idempotency, deduplication, retries, dead-letter handling, replay, backpressure, and schema evolution. Source integrations: Relational databases, REST APIs, enterprise applications, webhooks, Kafka streams, files, and object storage. Ingestion design: Batch and incremental ingestion, CDC, initial snapshots, pagination, cursor management, rate limiting, token refresh, checkpoints, backfills, and reconciliation. Distributed systems: Event-driven architecture, state management, partial failures, consistency, fault tolerance, horizontal scaling, throughput, and latency. Data platforms: Data lakes, lakehouse architecture, ingestion and transformation pipelines, metadata catalogues, data contracts, data quality, and lineage. AWS: S3, IAM, VPC, CloudWatch, Secrets Manager, and deployment using EKS, ECS/Fargate, or Lambda. Infrastructure and delivery: Terraform, Docker, Git, GitLab CI/CD, environment configuration, automated deployment, and production troubleshooting. Database fundamentals: SQL, PostgreSQL or MySQL, schema design, transactions, indexing, and query performance. Relevant technology experience: You do not need every technology listed below. Depth in software engineering, source integration, Kafka, and production deployment is especially important. CDC and connectors: Debezium, Kafka Connect, source/sink connectors, database change logs, and snapshot-to-stream transitions. Stream processing: Apache Flink, Flink SQL, Apache Spark, PySpark, Spark Structured Streaming, event time, watermarks, windowing, and stateful processing. Event contracts: Avro, Protobuf, JSON Schema, schema registries, and backwards-compatible schema evolution. Lakehouse: Apache Iceberg, Parquet, Amazon S3, AWS Glue Data Catalogue, Amazon Athena, compaction, partitioning, and small-file optimisation. Orchestration: Apache Airflow, Dagster, AWS Step Functions, or Temporal. Kubernetes: Amazon EKS, Helm, workload configuration, scaling, resource management, and troubleshooting. Databases and serving: PostgreSQL, MySQL, Amazon RDS, Aurora PostgreSQL, DynamoDB, and low-latency data APIs. AI data infrastructure: RAG pipelines, document ingestion, chunking, embeddings, vector databases, OpenSearch, and pgvector. Agent integration: Model Context Protocol (MCP), tool APIs, dataset discovery, governed query interfaces, and agent-accessible data services. Ontology and semantic data: Experience with ontologies, knowledge graphs, metadata management, and mapping business concepts to enterprise datasets is good to have. Developer tooling: SDKs, CLI tools, reusable connector frameworks, pipeline templates, Terraform modules, and Copier templates. Security and governance: OAuth2/OIDC, RBAC, least-privilege IAM, encryption, audit logging, and AWS Lake Formation. Observability: OpenTelemetry, Prometheus, Grafana, CloudWatch, pipeline freshness, consumer lag, throughput, and data quality monitoring. Relevant candidate backgrounds: Data Platform Engineer Data Infrastructure Engineer Streaming Data Engineer / Kafka Engineer Software Engineer - Distributed Systems Backend Engineer with data infrastructure experience Platform Engineer with data pipeline and AWS experience", "skills": ["Apache Kafka", "Athena", "AWS", "Debezium", "Glue", "Kafka", "Kafka Connect", "Python", "S3", "Terraform"], "employment_type": "Full Time", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "Verify before recommending", "relevance": 1.0, "score": 43.0, "matched_skills": ["kafka", "aws", "s3", "distributed systems", "sql", "postgresql", "observability", "rest api", "vector databases", "data structures", "concurrency", "test automation"], "missing_skills": ["terraform", "artificial intelligence", "spark", "data lake", "python", "monitoring", "gitlab ci", "object-oriented"], "also_on": [], "query": "engineer", "id": "ih156897", "extra": {"posted_source": "page:json-ld", "details_fetched": true, "salary_stated": false, "semantic": 0.638, "score_confidence": "high", "is_mnc": false}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Service Engineer - Graco", "company": "Mactech Engineers Pvt Ltd", "url": "https://www.adzuna.in/details/5976572289?utm_medium=api&utm_source=28f9775f", "country": "IN", "location": "Ekkaduthangal, Chennai", "remote  interdisciplinary coordination, and issue tracking. BIM Content Creation: Revit family templates, shared parameters, type catalogues, and visibility controls. Documentation: Experience preparing shop drawings, sleeve drawings, spool drawings, and model-based schedules. ADDITIONAL SKILLS: Experience with Revit Fabrication Parts, SysQue, or CADmep workflows. Exposure to Scan-to-BIM and working with Point Cloud data (ReCap, Leica, Faro) . Familiarity with ISO 19650 workflows , Common Data Environment (CDE), and Digital Twin principles. Knowledge of scripting or automation using Dynamo for Revit or Python . A detail-oriented BIM professional with strong technical knowledge of Mechanical modelling and coordination. Capable of working independently on assigned modelling tasks while collaborating with multidisciplinary teams. Comfortable working in a fast-paced, deadline-driven project environment. A good communicator who can coordinate effectively with internal teams, project leads, and other stakeholders. Committed to maintaining model accuracy, quality standards, and timely project delivery. Interested in continuously improving technical expertise and staying updated with emerging BIM technologies and international standards. WHY JOIN US? Work on landmark US & UK projects with leading global clients. Be part of a collaborative and forward-thinking Digital Engineering team . Gain exposure to international BIM standards, advanced modelling workflows, and multidisciplinary coordination. Access industry-leading technologies, continuous learning opportunities, and a supportive work environment. Benefit from competitive compensation, performance incentives, and structured career growth opportunities. IMPORTANT ELIGIBILITY CRITERIA: Candidates must meet the following requirements to be considered: Experience: 2–5 years of relevant BIM Mechanical experience. Qualification: Minimum B.E./B.Tech degree in a relevant engineering discipline. Diploma-only qualifications are not eligible. International Projects: Prior hands-on experience working on US & UK projects is mandatory. Technical Expertise: Proficiency in Revit MEP, Mechanical BIM modelling, and coordination workflows. Work Location: Must be willing to work 100% from our Pune office . WFH, Hybrid, and Remote arrangements are strictly not available. Vertical: Digital Engineering", "skills": [], "employment_type": "['Full Time']", "exp_min": 2.0, "exp_max": 5.0, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 40.3, "matched_skills": ["qa"], "missing_skills": ["python"], "also_on": [], "query": "engineer", "id": "ab7eb619c48b", "extra": {"details_fetched": true, "salary_stated": false, "semantic": 0.097, "score_confidence": "high", "is_mnc": false}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Software Development Engineer III", "company": "Entain", "url": "https://www.adzuna.in/land/ad/5977737886?se=9HfK_a3o8RGLYqZYfSmpUQ&utm_medium=api&utm_source=28f9775f&v=E8709CE1234D0B6001732846913974B8D79A4AA3", "country": "IN", "location": "Telangana, India", "remote": null, "posted": "2026-11-25", "posted_at": "2026-11-25T08:50:34+00:00", "posted_raw": "2026-11-25T08:50:34Z", "salary": "", "snippet": "This job is with Entain, an inclusive employer and a member of myGwork – the largest global platform for the LGBTQ business community. Please do not contact the recruiter directly. There's nothing like a career at Entain India. We're the technology powerhouse helping Entain – a world leader in sports and gaming – create products and experiences used by millions of customers across the globe. Wheth", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 40.0, "matched_skills": [], "missing_skills": [], "also_on": [], sure to mentoring junior QA engineers.", "skills": ["Api", "Appium", "Espresso", "Playwright", "QA", "Selenium", "Software Testing"], "employment_type": "Full Time", "exp_min": 2.0, "exp_max": 4.0, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Verify before recommending", "relevance": 1.0, "score": 37.4, "matched_skills": ["qa", "test automation", "agile", "scrum", "ci/cd"], "missing_skills": ["selenium", "appium", "playwright", "espresso", "android", "ios", "artificial intelligence", "mentoring"], "also_on": [], "query": "engineer", "id": "ih427730", "extra": {"posted_source": "page:json-ld", "details_fetched": true, "salary_stated": false, "semantic": 0.321, "score_confidence": "high", "is_mnc": false}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Engineer - Controls Engineering", "company": "GE Vernova", "url": "https://www.adzuna.in/details/5977326016?utm_medium=api&utm_source=28f9775f", "country": "IN", "location": "India", "remote": null, "posted": "2026-11-24", "posted_at": "2026-11-24T22:17:03+00:00", "posted_raw": "2026-11-24T22:17:03Z", "salary": "", "snippet": "Job Description Summary Job Description Roles and Responsibilities: Responsible for Testing and commissioning of Protection Systems equipment’s along with BCUs and other communication devices over IEC 61850 protocols. Integration of IEDs with SCADA system, Upgradation, Trouble shooting and Investigation at site on protection System in line with GE safety procedure. Training & Demonstration of the", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 37.4, "matched_skills": [], "missing_skills": ["scada"], "also_on": ["LinkedIn"], "query": "engineer", "id": "d9c694680aba", "extra": {"salary_stated": false, "semantic": 0.0, "score_confidence": "low", "is_mnc": true, "mnc_tier": "gcc", "mnc_name": "GE", "lpa": 11.0, "lpa_kind": "typical", "lpa_source": "typical for GE (MNC engineering centre, 0-2 yrs)", "lpa_url": "https://www.gecareers.com/", "lpa_lo": 8.0, "lpa_hi": 14.0, "pay_bonus": 7.0}}, {"source": "wellfound", "source_name": "Wellfound", "title": "AI Engineer – B2B SaaS (Remote)", "company": "Wisetr Technology", "url": "https://wellfound.com/jobs/5135384-ai-engineer-b2b-saas-remote", "country": "IN", "location": "Delhi", "remote": true, "posted": "2026-11-23", "posted_at": "2026-11-23T12:47:12+00:00", "posted_raw": "", "salary": "$13k – $20k • No equity", "snippet": "- **Company:** Wisetr Technology Pvt. Ltd. (FunnelKit and Sublium are brands of Wisetr Technology Pvt. Ltd.) - **Websites:** [www.funnelkit.com](https://www.funnelkit.com) | [www.sublium.com](https://www.sublium.com) - **Location:** Remote (candidates across the globe can apply) - **Employment type:** Full-time, permanent - **Experience:** 3+ years building and running AI/ML or LLM-based features", "description": "- **Company:** Wisetr Technology Pvt. Ltd. (FunnelKit and Sublium are brands of Wisetr Technology Pvt. Ltd.) - **Websites:** [www.funnelkit.com](https://www.funnelkit.com) | [www.sublium.com](https://www.sublium.com) - **Location:** Remote (candidates across the globe can apply) - **Employment type:** Full-time, permanent - **Experience:** 3+ years building and running AI/ML or LLM-based features inside production software used by paying customers (prototypes alone do not count) - **Education:** B.E./B.Tech in Computer Science, Information Technology, Electronics or a related field, or an equivalent strong engineering background. Proficiency in Python, PostgreSQL and TypeScript is required. - **Working days and hours:** 5 days, Monday to Friday ## About FunnelKit FunnelKit builds powerful no-code funnel and marketing automation products for businesses worldwide. Our mission is to help small businesses grow profitably by giving them the right tools to increase conversions and revenue, without unnecessary complexity. We are a product-first, customer-driven team that values ownership, simplicity, kindness, and excellence. ## Role Overview This role is ideal for someone who: - Treats AI as an engineering discipline: you design for results a store owner can rely on, and you test that reliability instead of stopping once the model responds. - Has spent 3+ years putting AI/ML and LLM features in front of paying customers in a live product. - Picks up an ambiguous problem, decides how to attack it, and delivers without close direction. - Writes and speaks clear English, and can walk engineers, designers, product managers and support colleagues through a technical trade-off. At FunnelKit and Sublium, AI sits inside the tools merchants use every day: suggesting funnel and checkout improvements, drafting email and on-site copy, grouping customers into segments, and automating routine marketing work. You will build these capabilities, along with the internal AI tooling our own teams use for reporting and decision support. You will carry a project from first data exploration through model choice, evaluation, API and interface work, release and production monitoring, working daily with Product, Engineering, Design, QA and Customer Success. ## Key Responsibilities **Build AI Features for Merchants** - Ship AI capabilities inside FunnelKit and Sublium, such as funnel and checkout recommendations, email and SMS copy drafting, customer segmentation, revenue forecasting and agent-style automations. - Take a merchant's goal and store data and produce suggestions concrete enough to act on. After launch, study real usage and plan the next iteration. - Agree success metrics and event tracking with the Product Manager before you build. **Design the LLM Layer** - Create prompt templates, schema-validated responses, tool calls, retrieval (RAG) and safety checks, and chain them into multi-step agent flows where they add value. - Compare models, frameworks and hosting options for each use case against quality, response time and spend. - Add fallback providers, response caching and spend limits so features stay dependable at scale. **Work with Data** - Prepare imperfect store, funnel and event data for analysis and for use as model input. - Anchor generated text to real figures from the merchant's account, so AI output never contains invented numbers. - Run the pipelines that collect, transform and serve this data to AI features and internal reports. **Measure and Protect Quality** - Build evaluation sets and monitoring so you can show that each release beats the previous one and catch regressions before merchants do. - Report quality, latency and per-request cost on dashboards shared with the team. - Help QA design tests for output that changes from run to run. **Own Delivery End to End** - Implement the backend services (Python or TypeScript) and the TypeScript and React interface that carry a result to the merchant, and deploy them. **Build Internal AI Tools** - Create AI-assisted reporting, analytics and workflow tools for Support, Marketing and Product teams, simple enough that non-engineers use them without help. **Engineering Habits and Sharing** - Deliver tested, maintainable code with error handling, logging and tracing. - Use AI coding assistants daily, and check their output before it is merged. - Write down how each solution works and how AI helped build it, so colleagues can reuse the approach. - Follow developments in models and tooling, and propose what is worth adopting. **Collaboration and Customer Support** - Work with Product, Design, QA and Customer Success to turn customer problems into improvements. - Set privacy, safety and compliance rules for AI features, with legal and security input where needed. - Make features explainable to L1/L2 support teams, and help diagnose serious production problems. ## Required Skills and Experience - **Production AI experience:** 3+ years shipping ML or LLM-based functionality that customers actually use. Prototypes and hackathon projects alone are not enough. - **Python (required):** production-quality code with tests, type annotations, packaging and async where it fits. - **TypeScript (required):** production-quality TypeScript with strict typing and tests, for Node.js services and for React interfaces. - **Full-stack range:** comfortable on both sides, with backend services in Python or Node.js and interfaces in React. You may lean toward one side. - **LLM engineering:** prompting, structured outputs, tool use, retrieval-augmented generation, guardrails and measuring output quality. - **Frameworks and retrieval:** LangChain, LangGraph, LlamaIndex or comparable tools, plus embeddings and vector stores (for example Pinecone, Chroma, FAISS or Qdrant). You can build a retrieval pipeline without a framework. - **ML foundation:** you understand how models behave, when fine-tuning beats prompting, and how to evaluate fairly. - **Data:** SQL and pandas or Spark, and experience with unclean production data. - **Services and infrastructure:** building and deploying APIs (FastAPI, Flask or similar), working knowledge of Cloudflare, AWS, GCP or Azure, Docker, and familiarity with Kubernetes. - **Workflow:** Git and GitHub with pull-request reviews, and daily use of AI coding assistants (Claude Code, Cursor, Codex or similar) with a clear account of how you verify their output. - **Judgement:** product sense (you care whether a feature is used and moves a metric), skill at diagnosing production failures, and a preference for simple designs. - **Communication:** strong written and spoken English, clear documentation, and the ability to explain trade-offs to non-technical stakeholders. - **Remote requirement:** must be able to work remotely, reliable internet and availability for meetings during agreed hours. ## Education - B.E./B.Tech in Computer Science, Information Technology, Electronics or related fields (or an equivalent strong engineering background). - Certifications in AI/ML or data are a plus but not mandatory. ## Current Work Profile (What We Expect to See) Candidates should currently be working, or have recent experience, as one of the following, with demonstrable impact: - AI Engineer, Applied AI Engineer or ML Engineer in a B2B SaaS or product company. - Full-stack or backend engineer who has shipped LLM-powered features (RAG, agents or similar) in a production product. - Software engineer driving AI-powered internal tools or data platforms in a software or product organisation. In your application, please highlight: - Specific AI features you have shipped (what, how, impact), and how you measured output quality. - Your current or most recent role, scope, tech stack and the type of product or company. - Links to GitHub, demos, case studies or public write-ups if available. ## Nice-to-Have Skills - Marketing technology context: marketing automation, personalisation or conversion optimisation. - Generating more than text, such as page layouts, designs or publish-ready assets. - Evaluation tooling such as Langfuse, DeepEval or RAGAS, or pipelines that use a model as the judge. - Agent orchestration (CrewAI, LangGraph, AutoGen) and tool integration through MCP. - Cost efficiency work, including fine-tuning with LoRA, QLoRA or PEFT, and quantisation. - MLOps practice: experiment tracking (MLflow, Weights & Biases), drift monitoring, and platforms such as Databricks or SageMaker. - Building internal tools that non-technical colleagues rely on. - Public work: open-source contributions, papers or technical articles. - Prior experience in a remote-first or globally distributed team. ## Why This Role is Exciting - **Product Impact:** Build AI features that directly affect revenue and growth for thousands of WooCommerce businesses. - **AI-First Mandate:** AI is part of our core products and strategy, not a bolt-on, and you will shape how it is built. - **Full Ownership:** Own AI projects from data and model choice to the interface and production monitoring. - **Cross-Product Thinking:** Work across an ecosystem of products, not siloed features. - **Modern Engineering:** AI-enhanced workflows, continuous improvement and a quality-first culture. - **Global Reach:** Your work will be used by merchants worldwide, at scale. ## What Success Looks Like **First 3 Months:** - Learn the FunnelKit and Sublium products, data and codebase. - Ship your first AI-powered feature or enhancement from concept to production, with an evaluation baseline in place. - Establish credibility as an engineer who writes reliable code and verifies AI output before it ships. **First 6 Months:** - Own an AI capability end to end, including evaluation, observability and cost control. - Improve how the team builds AI features (prompt standards, guardrails, evaluation practices). - Ship an AI solution or internal tool that becomes a best practice in the company. **First Year:** - Drive cross-product AI improvements and reusable AI components that benefit the whole FunnelKit and Sublium ecosystem. - Be the go-to person for complex AI engineering decisions. - Contribute to hiring and growing AI capability in the team. ## What We Value - **Product-minded engineering:** Understanding the user and the business impact, not only technical elegance. - **Ownership mentality:** Taking responsibility for outcomes, not just tasks. - **Simplicity and care:** Maintainable code, sensible failure handling and designs that stay easy to explain. - **Accountability for AI-assisted work:** AI tools speed you up, and you remain responsible for checking everything you ship. - **Continuous improvement:** Always learning, especially in AI. - **Knowledge sharing:** Writing docs, mentoring others and building team capability. ## What We Offer - Opportunity to work on globally used B2B SaaS products with a strong AI mandate. - Competitive compensation (CTC benchmarked for 3+ years of relevant experience, including at least 1 year of production AI work). - High-ownership, low-bureaucracy environment. - Collaborative, product-driven culture with strong emphasis on AI innovation. - Long-term growth and learning opportunities in applied AI engineering. - Technical leadership growth opportunities. **NOTE:** This is a full-time remote role with the company. Please review your answers for clarity and accuracy before you submit. FunnelKit is committed to creating an inclusive environment and is an equal opportunity employer. We celebrate diversity and welcome applications from candidates of all backgrounds.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Very fresh", "relevance": 1.0, "score": 37.0, "matched_skills": ["typescript", "qa", "react", "english", "vector databases", "postgresql", "sql", "aws", "docker", "observability"], "missing_skills": ["artificial intelligence", "machine learning", "llm", "python", "monitoring", "rag", "node.js", "caching"], "also_on": [], "query": "engineer", "id": "wf5135384", "extra": {"company_size": "SIZE_11_50", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": true, "salary_inr": 1680000, "salary_lpa": 16.8, "salary_text": "$13k – $20k • No equity", "semantic": 0.51, "score_confidence": "high", "is_mnc": false, "lpa": 16.8, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6.0}}, {"source": "adzuna", "source_name": "Adzuna", "title": "RTL Design Engineer, Silicon Engineering", "company": "Google", "url": "https://www.adzuna.in/details/5978012549?utm_medium=api&utm_source=28f9775f", "country": "IN", "location": "Bangalore, Karnataka", "remote": null, "posted": "2026-11-25", "posted_at": "2026-11-25T12:38:20+00:00", "posted_raw": "2026-11-25T12:38:20Z", "salary": "", "snippet": "RTL Design Engineer, Silicon Engineering Share RTL Desi  finance and operations teams, buried in work no software ever covered: reconciliations, approvals, payouts, reports stitched together from spreadsheets and email. Their own people are now building apps and agents for that work with AI. Some get them live in a day. Others get stuck on a messy system, a missing connection, or a question nobody at their company can answer. You will be the engineer who sits with them. You will work closely with about three early customers, learn how their teams really work, build and ship their apps and agents on Isomorph, and connect them to the systems they already depend on. You will be based in Bengaluru, often at their offices, and everything you learn there comes back into the product. ## What you'll own - The apps and agents your customers depend on, from the first conversation to running in production. - Connections into the systems they run on: spreadsheets, email, ERP, accounting and HR systems, databases and APIs. - Getting the builders at your customers unstuck, fast, and showing them what is possible. - The trust of each customer's business teams and their IT, as the person who gets it done. - Turning what you see in the field into product changes, so the next customer gets it for free. ## What you'll get to build next - Turn the patterns you see across customers into ready-made connectors, agents and playbooks that every Isomorph customer can use. - Get to a world where a new customer goes from first call to apps in production in days, mostly without needing us. - Shape how forward deployed engineering works at Isomorph as the team grows. ## You'll thrive here if - You have 2-6 years of building and shipping real software, and some of that time was in front of customers. - You have tamed messy business systems (ERPs, accounting or HR tools, old databases, flaky APIs) and made them reliable. - You live in AI coding agents and can put a working app in front of someone the same day. - You can sit with a finance lead or an IT head, understand the real problem, and explain the fix in plain words. - You take ownership: when a customer is stuck, it is your problem until it is solved, and then you make sure it never happens again. ## Why Isomorph For fifty years, software inside a company has been written by a small group of engineers, for everyone else. That is ending. With AI, the people who know the work best (the finance analyst, the ops lead, the recruiter, the support manager) can now build the software they need themselves. Most of them have never written a line of code. This is one of the biggest shifts in how companies work, and it has a missing piece. The software these people build is useful, and very often unsafe: no sign-in, sensitive data exposed, nobody to run it, and invisible to IT. Multiply that across a large company and you get thousands of apps and agents that nobody governs. Isomorph is the foundation that software runs on. Bring an app or agent built with any AI tool, and Isomorph runs it on the company's own cloud: secured, connected to company data and systems, monitored and kept healthy. Builders never think about infrastructure. IT stays in control of everything. We believe every company will become AI-native one workflow at a time, built by its own people. Isomorph is where that software will live. The team. You will join a small, high-talent-density founding team from IIT Madras and IIT Delhi. The founders are second-time founders who have built companies before and sold one. ## Why you'll love it here - You'll be early. You will be one of the first people on the team, with real ownership and a real say in what Isomorph becomes. - You'll work at the frontier. AI agents and enterprise-grade infrastructure, applied to a problem every company is about to have. - You'll see your impact. We work side by side with customers, so what you ship is in real people's hands within days. - You'll build the way the future builds. We build Isomorph with AI agents ourselves, so red: reconciliations, payouts, reporting, chasing numbers across systems. Finance teams are already among the most enthusiastic builders on Isomorph. Now we are building a finance platform on top of it, with ready-made agents and ap", "description": "Build AI agents that do real finance work, where being right is everything. ### The role Every finance team runs on a mountain of manual work that no software ever covered: reconciliations, payouts, reporting, chasing numbers across systems. Finance teams are already among the most enthusiastic builders on Isomorph. Now we are building a finance platform on top of it, with ready-made agents and apps that make that work run itself. You will be its founding engineer. You will build with real finance teams, ship agents that move real money correctly, and turn what works into products many companies use. ### What you’ll own - Finance agents and apps that teams adopt in days and trust completely. - Deep connections into the accounting, banking and payment systems finance runs on. - The building blocks that let a finance team’s own AI agent build software an auditor would sign off on. - Making accuracy and control the reason people choose us. ### What you’ll get to build next - Build a deep understanding of finance work, from matching messy records to reading financial documents, that in time leads to finance-specific models of our own. - Build toward a month-end close that largely runs itself. ### You’ll thrive here if - You have built software for finance, payments, accounting or fintech, and you know why accuracy matters. - You have shipped AI agents where “mostly right” was not good enough. - You have tamed messy external systems and made them reliable. - You enjoy sitting with finance teams and seeing your work change their month. ### Why Isomorph For fifty years, software inside a company has been written by a small group of engineers, for everyone else. That is ending. With AI, the people who know the work best (the finance analyst, the ops lead, the recruiter, the support manager) can now build the software they need themselves. Most of them have never written a line of code. This is one of the biggest shifts in how companies work, and it has a missing piece. The software these people build is useful, and very often unsafe: no sign-in, sensitive data exposed, nobody to run it, and invisible to IT. Multiply that across a large company and you get thousands of apps and agents that nobody governs. **Isomorph is the foundation that software runs on.** Bring an app or agent built with any AI tool, and Isomorph runs it on the company’s own cloud: secured, connected to company data and systems, monitored and kept healthy. Builders never think about infrastructure. IT stays in control of everything. We believe every company will become AI-native one workflow at a time, built by its own people. Isomorph is where that software will live. **The team.** You will join a small, high-talent-density founding team from IIT Madras and IIT Delhi. The founders are second-time founders who have built companies before and sold one. ### Why you’ll love it here - **You’ll be early.** You will be one of the first people on the team, with real ownership and a real say in what Isomorph becomes. - **You’ll work at the frontier.** AI agents and enterprise-grade infrastructure, applied to a problem every company is about to have. - **You’ll see your impact.** We work side by side with customers, so what you ship is in real people’s hands within days. - **You’ll build the way the future builds.** We build Isomorph with AI agents ourselves, so your leverage is your judgment and your taste, not your typing speed. - **You’ll grow fast.** Small team, huge surface, founders who have built and scaled before. Apply: https://isomorph.ai/careers/founding-engineer-finance-agents/", "skills": [], "employment_type": "full-time", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_c <script>

  const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));
  const blocked = new Set((DATA.sources || []).filter(s => s.status !== 'ok').map(s => s.source_name));
  $('stats').innerHTML = `<b>${JOBS.length}</b> jobs · <b>${okSources.size}</b> sources${blocked.size ? ` · <span title="${esc([...blocked].join(', '))}">${blocked.size} unavailable</span>` : ''}`;

  // sources panel
  const grid = $('srcGrid');
  const bySrc = {};
  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });
  grid.innerHTML = Object.keys(bySrc).sort().map(name => {
    const rows = bySrc[name];

    const bad = rows.filter(r => r.status !== 'ok');

    const detail = rows.map(r => `${r.country}${r.status === 'ok' ? ':' + r.count : ' ' + r.status}`).join(' ');
    return `<div><span class="${cls}">●</span> ${esc(name)} <b>${total}</b> <span class="cc" title="${esc(bad.map(b => b.error || '').join('\n'))}">${esc(detail)}</span></div>`;
  }).join('');
  $('srcSummary').textContent = `Sources (${Object.keys(bySrc).length}) — click to see per-country counts; blocked platforms have direct search links under each country tab`;

  // fit chips
  const FITS = [['fit', 'Fit'], ['stretch', 'Stretch'], ['unknown', 'Unknown'], ['over', 'Overqualified'], ['no', 'Too senior']];
  function renderFitChips() {
    $('fitChips').innerHTML = FITS.map(([k, l]) => `<button class="chip ${ui.fits.includes(k) ? 'on' : ''}" data-fit="${k}">${l}</button>`).join('');
  }
  $('fitChips').onclick = e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;

  // source select

  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs
  function renderTabs(counts) {
    const tabs = [{ code: 'ALL', name: 'All', flag: '' }].concat(COUNTRIES);
    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src; $('viaSel').value = ui.via || '';
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  $('viaSel').onchange = () => { ui.via = $('viaSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly', 'mncOnly', 'highPay'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; $('viaSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'via', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved', 'exp_class', 'freshness']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '', j.exp_class || '', j.freshness || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering

  function ring(score, conf) {

    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>
<style>

  span.fgrp > .fbody { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* the whole filter toolbar can be hidden: only its Filters button stays */
  .tb-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: inherit; font-size: 0.75rem; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }
  .tb-toggle:hover { opacity: 1; }
  .tb-toggle::after { content: "\25B4"; font-size: 0.7rem; }
  .tb-hidden .tb-toggle::after { content: "\25BE"; }
  .tb-hidden > :not(.tb-toggle) { display: none !important; }
  .tb-hidden { padding-top: 4px !important; padding-bottom: 4px !important; }

  /* thin scrollbars that follow the page's light / dark theme */
  :root { color-scheme: light dark; } :root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }
  * { scrollbar-width: thin; }

  /* V2 skin (the site's portfolio look): one layer over each page's own variables */

    --bg: #E9EAE4; --surface: #FFFFFF; --surface-2: #F5F6F2; --card: #FFFFFF; --card2: #F5F6F2;
    --ink: #11151A; --fg: #11151A; --muted: #4E575F; --line: #11151A; --line2: #C9CCC3;
    --accent: #EE3D28; --accent-on: #FFFFFF; --accent-soft: rgba(238,61,40,.12); --accent-bg: rgba(238,61,40,.12);
    --v2-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --v2-display: 'Archivo Black', Impact, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root[data-ui="v2"]:not([data-theme="light"]) {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {
    --bg: #0D1114; --surface: #151A1F; --surface-2: #1B2228; --card: #151A1F; --card2: #1B2228;
    --ink: #ECEEE9; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); }
  :root[data-ui="v2"] body, :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea {
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  :root[data-ui="v2"] h1, :root[data-ui="v2"] h2, :root[data-ui="v2"] h3 { font-family: var(--v2-display); font-weight: 400; letter-spacing: -.01em; }
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tag, :root[data-ui="v2"] .pill, :root[data-ui="v2"] .ghost, :root[data-ui="v2"] .tb-toggle,
  :root[data-ui="v2"] details.fgrp > summary, :root[data-ui="v2"] span.fgrp > .flabel, :root[data-ui="v2"] .muted, :root[data-ui="v2"] th, :root[data-ui="v2"] code {
    font-family: var(--v2-mono); letter-spacing: .02em; }
  :root[data-ui="v2"] *:not(svg):not(path):not(circle) { border-radius: 0 !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] select, :root[data-ui="v2"] textarea,
  :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle, :root[data-ui="v2"] details.fgrp, :root[data-ui="v2"] span.fgrp { border: 2px solid var(--line) !important; }
  :root[data-ui="v2"] button, :root[data-ui="v2"] .chip, :root[data-ui="v2"] .tb-toggle { box-shadow: 2px 2px 0 var(--line); font-weight: 700; }
  :root[data-ui="v2"] .chip[aria-pressed="true"], :root[data-ui="v2"] button[aria-pressed="true"] { background: var(--accent) !important; color: #fff !important; }
  :root[data-ui="v2"] [class*="card"], :root[data-ui="v2"] .app, :root[data-ui="v2"] .stat, :root[data-ui="v2"] section,
  :root[data-ui="v2"] .q, :root[data-ui="v2"] .row, :root[data-ui="v2"] article { border-color: var(--line) !important; box-shadow: 3px 3px 0 var(--line); }
</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
