  </span></span>

e, auditable, and fair. We are a small, product-focused team in Mumbai running a live production platform used in real hiring wor", "description": "ABOUT QUALIFYCODE AI has made it trivial to fabricate resumes, take-home assignments, and remote interviews. QualifyCode is the integrity layer for technical hiring—helping engineering teams verify candidate work objectively while keeping every hiring decision explainable, auditable, and fair. We are a small, product-focused team in Mumbai running a live production platform used in real hiring workflows. Our product spans a proctored web coding IDE, a recruiter decision console, isolated code-execution pipelines, and automated integrity and code-quality analysis services. Everything is built and owned in-house, end to end. THE ROLE We’re looking for a Software Engineer to work across the full stack rather than a single siloed layer. Our system combines event-driven workflows, service-to-service APIs, and real-time client communication—so your work will span React interfaces, TypeScript and Python backend services, PostgreSQL data models, and asynchronous job queues. At this stage of our growth, the core engineering focus is scale, reliability, and hardening—driving down end-to-end latency, optimizing database queries, refining access controls, and strengthening distributed concurrency. This role fits someone who reads how a production system actually behaves before changing it, and who ships verified fixes over quick guesses. WHAT YOU’LL OWN • Candidate Coding Experience: Build and harden our browser-based IDE—editing workflows, resilient autosave, live execution feedback over WebSockets, pre-assessment environment checks, and reliable media uploads. • Recruiter Decision Console: Develop the dashboard hiring managers rely on under time pressure—candidate reports, code-quality and integrity breakdowns, session timelines, review queues, and synchronized media playback. • Core Backend & Orchestration: Design and scale APIs and state machines handling assessment lifecycles, candidate sessions, RBAC, usage accounting, and asynchronous workflows with clean contracts and idempotent failure handling. • Analysis & Scoring Pipelines: Extend our code-quality and integrity pipelines across deterministic scoring rules, telemetry processing, computer-vision signals, and bounded LLM integrations—keeping results accurate and explainable. • Reliability & Observability: Improve resilience across execution sandboxes, PostgreSQL databases, Redis queues, and object storage. Debug issues with distributed traces and metrics, and back every fix with regression tests. OUR STACK You don't need prior fluency in every tool, but you should be strong in TypeScript and comfortable moving across frontend state, backend APIs, SQL query plans, and Python services: • Frontend: React, TypeScript, Vite, Tailwind CSS, TanStack Query, Monaco Editor, Socket.IO, browser media/WASM APIs • Backend: Node.js (NestJS, Prisma, Express), Python (FastAPI) • Data & Async: PostgreSQL, Redis, S3-compatible object storage, BullMQ, Celery, Server-Sent Events • Infra & Observability: Docker, Linux, GitHub Actions, OpenTelemetry, Prometheus, Grafana, k6 WHAT WE’RE LOOKING FOR • 1–4 years of production experience shipping full-stack web applications (or equivalent demonstrated depth). • Strong TypeScript & React fundamentals—able to reason across UI state, API lifecycles, and relational schemas in the same afternoon. • Solid backend engineering: Practical grasp of HTTP semantics, auth/RBAC, idempotency, transactions, and fault-tolerant queue retries. • PostgreSQL beyond CRUD: Comfortable with joins, indexing, migrations, and reading EXPLAIN plans. • High engineering rigor: You verify changes with tests, traces, or benchmarks before calling them done. • Immediate availability to join our Mumbai office (Hybrid). Bonus points for: A live project or readable GitHub repo with real users; experience debugging distributed race conditions or retry storms; production LLM or media/computer-vision integrations; Python async services (FastAPI/Celery); or work in audited domains like HR tech or fintech. HOW WE ENGINEER • Contract-first APIs: Shared schemas, pagination standards, and permission models are strictly typed across services. • Verification by default: Bug fixes ship with regression tests; auth changes include negative (403) tests; performance work includes measurements. • Zero-downtime evolution: Database and API changes roll out via staged, backward-compatible migrations. • Safe rollouts & CI guardrails: Feature flags, shadow-mode validation for automated scoring, and automated CI checks for timeouts and bounded queries. HOW TO APPLY Please apply at https://qualifycode.com/careers (and include the following in your application or Wellfound note): 1. A working link to something you built (a live product, open-source contribution, or GitHub repo we can read). 2. One line on which part of our stack or problem space you’d most want to own.", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 72.8, "matched_skills": ["typescript", "postgresql", "react", "observability", "concurrency", "websockets", "sql", "s3", "docker", "linux", "github actions", "prometheus"], "missing_skills": ["python", "artificial intelligence", "llm", "redis", "fastapi", "event-driven", "vite", "tailwind"], "also_on": [], "query": "software-engineer", "id": "wf5081971", "extra": {"company_size": "SIZE_1_10", "salary_stated": true, "salary_inr": 2000000, "salary_lpa": 20.0, "salary_text": "₹12L – ₹20L • No equity", "semantic": 0.455, "score_confidence": "high", "ai_summary": {"why": "Strong match in event-driven architecture, PostgreSQL optimization, and distributed systems. Experience with Kafka, TimescaleDB, and AWS aligns perfectly with the core backend and orchestra  aligned to a specific location, and you’ll partner with your leader to participate in meaningful in-person moments that support team connection and collaboration. About Vista Duck Creek Technologies is a portfolio company of Vista Equity Partners, a global investment firm that partners with mission-critical enterprise software and technology-enabled businesses to drive growth and operational excellence. As part of a Vista portfolio company, you’ll work in an environment backed by deep expertise, long-term investment, and a strong commitment to building market-leading businesses and meaningful careers. Position Overview We're hiring early-career engineers to join an AI engineering team building LLM-based systems. This role leans toward two things in particular: evaluating whether an AI/LLM system's output is correct , and modelling extracted information as structured knowledge (entities and relationships) so it can be trusted, queried, and reasoned over. If you've built something with an LLM and then asked yourself, \"but how do I know if it's any good?\" — this role is for you. What You’ll Do Build and extend LLM evaluation harnesses — golden datasets, precision/recall/F1, calibration, LLM-as-judge scoring. Design and work with knowledge graphs — entity-relationship modelling, graph traversal/queries, embeddings-based similarity and retrieval. Build GenAI/LLM pipelines in Python — prompting, RAG, structured output. Write clean, tested code; collaborate with senior engineers; document your work. Act in accordance with and as a good steward of Duck Creek Technologies mission, vision, and core values: Mission: To empower insurers to reimagine the future of insurance What You’ve Done Education and Work Experience: B.Tech/M.Tech with an AI/ML specialization, or CS/IT with strong, demonstrable AI coursework/projects with 0 to 2 years of experience Strong Python fundamentals; solid grasp of data structures & algorithms. Working understanding of LLM fundamentals: prompting, embeddings, RAG, basic evaluation concepts. A maintained personal GitHub profile with at least one substantive AI/LLM project (academic or personal) — not a cloned tutorial. Share your resume along with your GitHub profile link. Applications without a working GitHub link showing original project work will not be considered. Good To Have Exposure to evaluation frameworks/metrics for generative AI (e.g. Ragas, DeepEval, or a self-built LLM-judge approach). Exposure to knowledge graphs / graph data structures (NetworkX, Neo4j, RDF/OWL, or a well-reasoned custom graph model in a project). Any agent framework (LangChain/LangGraph or similar), vector databases, any cloud platform, REST API basics (FastAPI/Flask). CORE COMPETENCIES Our team is built on strong core values that guide how we work and grow together. We prioritize clear and thoughtful communication, fostering open collaboration across diverse perspectives to achieve shared goals. We approach challenges with curiosity and critical thinking, seeking creative solutions while remaining adaptable in a fast-changing environment. We take accountability for our work and outcomes, holding ourselves to high standards of integrity and professionalism. Above all, we are committed to doing the right thing—treating others with respect, embracing continuous learning, and engaging inclusively across cultures and backgrounds. LEARN MORE Company Website – Transforming Insurance with Duck Creek's SaaS Solutions Life at Duck Creek – Life at Duck Creek - Duck Creek Benefits & Rewards – Wellbeing & Rewards - Duck Creek LOCATION & WAYS OF WORKING Duck Creek is a flexible-first company, offering employees autonomy in how they manage their day-to-day work. As part of our Flying Together approach, we are thoughtfully increasing opportunities for in-person collaboration by focusing on hiring in designated locations. This role is aligned to a specific location, and you are expected to reside within reasonable proximity to that location. nerability assessment in-house: DAST, API security testing, and hands-on penetration testing of our own products. Review application code and API designs, and make cross-tenant isolation structurally impossible to get wrong. Scope and manage external specialists where they earn their cost-crown-jewel penetration tests, independent assessments and hold their output to a standard. Raise the level of the engineers around you: security champions in every squad, practical training, and reference material people actually use. Supply the technical evidence behind our ISMS and customer audits. The certification program is owned by our security team in Japan; you make it defensible. Band C: Secure what we ship (AI / LLM). Red-team Mico's own AI agents: prompt injection, jailbreaks, tool abuse, data exfiltration through model output. Build guardrails and regression gates so a prompt or model change cannot silently weaken defences. Work to OWASP LLM Top 10andMITRE ATLAS, and turn the results into evidence our enterprise customers can read. Band D: Secure what we hold (Data and PII). Classify data, then enforce it: masking and redaction in logs, non-production and analytics and before anything reaches a model. Implement just-in-time, least-privilege access across personal data, with audit trails that stand up to scrutiny. Build tokenisation and a mediated data-access path so no service or person reads sensitive stores directly. You will not be doing this alone. How the work is actually carried out. Agents carry the volume. This is the entire point of our agentic approach to security. One engineer cannot review every pull request, triage every advisory and re-test every AI feature by hand, so you build the agents that do the first pass, and you spend your time on the judgment calls. Leverage is the design here, not an afterthought. Squads own their own fixes. You are not the person patching a dozen codebases. Security champions are named in every squad; they are the first readers of agent output and the people who land the remediation. You build the system that makes them effective. Work directly with VPs. Our VP and security specialists in Japan will support you on roadmap, strategy and development. The work is sequenced, not simultaneous. Look at the first six months below: the early work is coverage and classification. AI red-teaming and data-access controls come afterwards, once the foundation carries its own weight. Nobody is expected to start four programs in week one. The function grows with you. This is an opportunity to be a first member of the security team and to grow that team with you. Being first here means shaping a team and the opportunity to become its lead in time. And what this role is not: Here is what sits outside this role, and where it actually lives. You will not run corporate IT. Devices, office network, helpdesk and identity administration belong elsewhere. You will not own ISMS / ISO 27001 audit and evidence management. Our security team in Japan owns the certification program. You support it technically; you are not the auditor. You will not be the compliance function. We will set this up separately, together. What you will own: Your first ninety days: the engineering pipeline: You take ownership of scanning coverage across our repositories: static analysis, dependency and supply-chain checks, and secret detection. You own data classification across our primary stores, and the threat-modelling gate that high-risk features pass through. You name the security champions in each squad and set how they work with you. Months four to six: agents in the engineers' path: You own the review agent that gives every pull request an explanation and a suggested fix, and the orchestration layer that turns many scanners into one prioritised queue. You run assessment in-house DAST, API security testing and penetration testing alongside the external specialists we engage. Requirements: 5-8 years in security, the majority of it in  physics or numerical simulation; electrical engineering design (RF, signal or power integrity, analog, packaging); machine learning for physical systems. - Working fluency in a second of those. - A track record of taking something from idea to a working result that someone else used. - Strong Python, and the habit of checking a result against a second method before believing it. - Comfort with an early company: ambiguous problems, few people, direct customer contact. **Nice to have** - You've written, contributed to or validated a solver. - Experience training models on simulation data. - HPC or GPU experience, or numerical linear algebra. - A PhD or equivalent research experience, publications, or open-source scientific software. - Experience building LLM agents with tools and verification. **How to apply** Apply here with your CV or LinkedIn, and a link to or description of one thing you built. Tell us what was hard about it. If you don't match every line above, apply anyway; we would rather read about the thing you built.", "skills": [], "employment_type": "full-time", "exp_min": 0, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 26.3, "matched_skills": [], "missing_skills": ["machine learning", "artificial intelligence", "python", "llm"], "also_on": [], "query": "senior-software-developer", "id": "wf5078012", "extra": {"company_size": "SIZE_1_10", "salary_stated": true, "salary_inr": 6720000, "salary_lpa": 67.2, "salary_text": "$50k – $80k • 0.5% – 2.0%", "semantic": 0.146, "score_confidence": "high", "is_mnc": false, "lpa": 67.2, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0}}, {"source": "adzuna", "source_name": "Adzuna", "title": "Test Engineer", "company": "Texas Instruments", "url": "https://www.adzuna.in/details/5974346665?utm_medium=api&utm_source=28f9775f", "country": "IN", "location": "Bangalore, Karnataka", "remote": null,   const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));

  // sources panel

  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });

  }).join('');

    const rows = [['country', 'title', 'company', 'location', 'source', 'via', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved', 'exp_class', 'freshness']];

  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>

<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
