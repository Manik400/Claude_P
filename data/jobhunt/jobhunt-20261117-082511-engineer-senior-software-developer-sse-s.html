platform used in real hiring wor", "description": "ABOUT QUALIFYCODE AI has made it trivial to fabricate resumes, take-home assignments, and remote interviews. QualifyCode is the integrity layer for technical hiring—helping engineering teams verify candidate work objectively while keeping every hiring decision explainable, auditable, and fair. We are a small, product-focused team in Mumbai running a live production platform used in real hiring workflows. Our product spans a proctored web coding IDE, a recruiter decision console, isolated code-execution pipelines, and automated integrity and code-quality analysis services. Everything is built and owned in-house, end to end. THE ROLE We’re looking for a Software Engineer to work across the full stack rather than a single siloed layer. Our system combines event-driven workflows, service-to-service APIs, and real-time client communication—so your work will span React interfaces, TypeScript and Python backend services, PostgreSQL data models, and asynchronous job queues. At this stage of our growth, the core engineering focus is scale, reliability, and hardening—driving down end-to-end latency, optimizing database queries, refining access controls, and strengthening distributed concurrency. This role fits someone who reads how a production system actually behaves before changing it, and who ships verified fixes over quick guesses. WHAT YOU’LL OWN • Candidate Coding Experience: Build and harden our browser-based IDE—editing workflows, resilient autosave, live execution feedback over WebSockets, pre-assessment environment checks, and reliable media uploads. • Recruiter Decision Console: Develop the dashboard hiring managers rely on under time pressure—candidate reports, code-quality and integrity breakdowns, session timelines, review queues, and synchronized media playback. • Core Backend & Orchestration: Design and scale APIs and state machines handling assessment lifecycles, candidate sessions, RBAC, usage accounting, and asynchronous workflows with clean contracts and idempotent failure handling. • Analysis & Scoring Pipelines: Extend our code-quality and integrity pipelines across deterministic scoring rules, telemetry processing, computer-vision signals, and bounded LLM integrations—keeping results accurate and explainable. • Reliability & Observability: Improve resilience across execution sandboxes, PostgreSQL databases, Redis queues, and object storage. Debug issues with distributed traces and metrics, and back every fix with regression tests. OUR STACK You don't need prior fluency in every tool, but you should be strong in TypeScript and comfortable moving across frontend state, backend APIs, SQL query plans, and Python services: • Frontend: React, TypeScript, Vite, Tailwind CSS, TanStack Query, Monaco Editor, Socket.IO, browser media/WASM APIs • Backend: Node.js (NestJS, Prisma, Express), Python (FastAPI) • Data & Async: PostgreSQL, Redis, S3-compatible object storage, BullMQ, Celery, Server-Sent Events • Infra & Observability: Docker, Linux, GitHub Actions, OpenTelemetry, Prometheus, Grafana, k6 WHAT WE’RE LOOKING FOR • 1–4 years of production experience shipping full-stack web applications (or equivalent demonstrated depth). • Strong TypeScript & React fundamentals—able to reason across UI state, API lifecycles, and relational schemas in the same afternoon. • Solid backend engineering: Practical grasp of HTTP semantics, auth/RBAC, idempotency, transactions, and fault-tolerant queue retries. • PostgreSQL beyond CRUD: Comfortable with joins, indexing, migrations, and reading EXPLAIN plans. • High engineering rigor: You verify changes with tests, traces, or benchmarks before calling them done. • Immediate availability to join our Mumbai office (Hybrid). Bonus points for: A live project or readable GitHub repo with real users; experience debugging distributed race conditions or retry storms; production LLM or media/computer-vision integrations; Python async services (FastAPI/Celery); or work in audited domains like HR tech or fintech. HOW WE ENGINEER • Contract-first APIs: Shared schemas, pagination standards, and permission models are strictly typed across services. • Verification by default: Bug fixes ship with regression tests; auth changes include negative (403) tests; performance work includes measurements. • Zero-downtime evolution: Database and API changes roll out via staged, backward-compatible migrations. • Safe rollouts & CI guardrails: Feature flags, shadow-mode validation for automated scoring, and automated CI checks for timeouts and bounded queries. HOW TO APPLY Please apply at https://qualifycode.com/careers (and include the following in your application or Wellfound note): 1. A working link to something you built (a live product, open-source contribution, or GitHub repo we can read). 2. One line on which part of our stack or problem space you’d most want to own.", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 72.6, "matched_skills": ["typescript", "postgresql", "react", "observability", "concurrency", "websockets", "sql", "s3", "docker", "linux", "github actions", "prometheus"], "missing_skills": ["python", "artificial intelligence", "llm", "redis", "fastapi", "event-driven", "vite", "tailwind"], "also_on": [], "query": "software-engineer", "id": "wf5081971", "extra": {"company_size": "SIZE_1_10", "salary_stated": true, "salary_inr": 2000000, "salary_lpa": 20.0, "salary_text": "₹12L – ₹20L • No equity", "semantic": 0.455, "score_confidence": "high", "ai_summary": {"why": "Strong match in event-driven architecture, PostgreSQL optimization, and distributed systems. Experience with Kafka, TimescaleDB, and AWS aligns perfectly with the core backend and orchestration requirements.", "gaps": "Limited experience with Python, Redis, and AI/LLM integrations, whi nt (HXM), Payroll, Finance, Procurement, Inventory, Projects, CRM, Workflow Automation and AI-powered business applications. We are building a scalable enterprise platform for customers across India and international markets. We are inviting passionate software developers who want to build real products, contribute to production applications and grow alongside an emerging enterprise technology company. ## Open Positions - React.js Developer Trainee – Frontend Development - React Native Developer Trainee – Mobile Applications - Node.js Developer Trainee – Backend Development - Python Developer Trainee – Backend, Automation and AI - Full-Stack Developer Trainee – React.js + Node.js/Python ## Technical Requirements **Frontend Development** - Basic to intermediate React.js and JavaScript knowledge - HTML5, CSS3, TypeScript and responsive UI development - REST API integration - Component-based architecture and state management **Mobile Development** - React Native for Android and iOS applications - API integration, navigation and mobile UI development - Basic understanding of mobile authentication and notifications **Backend Development** - Node.js, Express.js and REST APIs - Python, FastAPI or Django - Authentication, authorization and role-based access - Database operations, validations and error handling **Database Knowledge** - PostgreSQL, MySQL or other relational databases - Basic SQL queries, joins and database relationships - Understanding of database design and data integrity **Code Repositories and Cloud** - Git and GitHub fundamentals - Branching, pull requests, merging and conflict resolution - Basic understanding of Azure Repos / Azure DevOps - Basic understanding of AWS cloud services - Familiarity with CI/CD, deployment and debugging is an advantage **Additional Advantages** - AI/LLM API integration - Workflow automation - SaaS and multi-tenant application architecture - ERP, HRMS, Payroll or business application exposure - Docker and cloud deployment knowledge Applicants are not expected to be experts in every technology, but must demonstrate practical skills in at least one relevant development stack. ## Mandatory Application Requirements Applicants must share: 1. Updated resume 2. GitHub or GitLab profile 3. Links to completed projects or working applications 4. Brief explanation of their individual contributions 5. Technologies used in their projects 6. Availability to commit to a 12-month internship **A GitHub repository or demonstrable project portfolio is mandatory.** Academic, personal, internship and open-source projects are accepted. ## Internship and Compensation Transparency We want to be completely transparent with every applicant. Opland ERP is a growing product business with a developing customer base. While we have paying customers, building predictable recurring revenue takes time. At present, this opportunity is structured as a **12-month unpaid internship**, subject to applicable laws and eligibility requirements. We intend to review opportunities for paid engagement after six months, depending on customer revenue, business growth, performance and available positions. **There is no guarantee of compensation after six months or employment after the internship.** Our existing team members have contributed significantly to building our products and developing their careers with us. We hope to welcome individuals who share that commitment to learning, ownership and product engineering. ## What You Will Gain - Hands-on exposure to enterprise ERP and HXM development - Experience contributing to real product features - Practical exposure to React.js, React Native, Python and Node.js - Experience with Git, Azure Repos and AWS environments - Exposure to APIs, databases, testing and deployment - Mentorship, technical reviews and collaborative development - Opportunities to build a demonstrable professional portfolio - Consideration for future paid roles based on business needs and performance ## Who Should Apply? We welcome fresh graduates, current interns and developers with up to one year of experience who have already built projects and want meaningful product-development exposure. This opportunity is best suited to candidates who understand the unpaid structure, can commit to the agreed duration and are primarily seeking practical learning and experience. ## Selection Process 1. Resume and GitHub portfolio screening 2. Technical discussion 3. Practical coding assessment 4. Final discussion on internship expectations and terms **Build real products. Learn enterprise engineering. Grow your career with Opland ERP.** **Company Website:** www.oplandtech.com **Product Website:** www.otplx.com **Apply:** Share your resume, GitHub profile and project portfolio with cm@oplandtech.com *All internship terms, working arrangements, intellectual property provisions and any future compensation will be documented in writing before joining.*", "skills": [], "employment_type": "full-time", "exp_min": 0, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 56.5, "matched_skills": ["react", "rest api", "aws", "javascript", "html", "css", "typescript", "postgresql", "sql", "ci/cd", "docker"], "missing_skills": ["node.js", "python", "artificial intelligence", "react native", "git", "azure", "mobile development", "android"], "also_on": [], "query": "software-engineer", "id": "wf5061221", "extra": {"company_size": "SIZE_11_50", "salary_stated": false, "semantic": 0.352, "score_confidence": "high", "is_mnc": false}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Software Engineer", "company": "C42", "url": "https://wellfound.com/jobs/4897481-software-engineer", "country": "IN", "location": "Mumbai, Mumbai, Mumbai", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "No equity", "snippet": "**Experience: 4–9 Years Location: Mumbai Employment Ty ecure coding practices. • Technical documentation and maintainable software architecture. QUALIFICATIONS • Bachelor's degree in Computer Science, Software Engineering, or a related field, or equivalent practical experience. • Minimum 3 years of professional software development experience, with significant hands-on backend engineering experience. • Demonstrated experience developing, deploying, and maintaining production backend systems and relational databases. • Practical experience integrating AI/LLM capabilities into applications, preferably in production environments. • Experience with cloud infrastructure, API integrations, and application deployment. • Strong understanding of database design, backend security, scalability, and system reliability. • Ability to independently diagnose technical issues, make architectural decisions, and maintain production systems. • Proven ownership of real-world software systems beyond initial development. WHAT WE ARE LOOKING FOR We are looking for a technically strong, independent, and dependable engineer capable of taking end-to-end responsibility for backend infrastructure, AI integrations, database systems, cloud services, third-party APIs, and Android application connectivity. The successful candidate should be able to design and implement new systems, maintain and improve existing infrastructure, handle production issues, and make sound technical decisions without requiring continuous supervision. We place particular emphasis on practical engineering experience, production reliability, problem-solving ability, and demonstrated technical ownership. HOW TO APPLY Apply directly through Wellfound (or email your application to suraj@nandipipes.com if you are unable to apply here), along with your resume and one or more of the following: • Links to production applications or relevant GitHub repositories. • A brief architectural overview of a backend system, database infrastructure, or AI/LLM pipeline you personally designed, deployed, or maintained. • Details of your individual contributions to cloud infrastructure, database engineering, AI integrations, and production operations. Candidates with demonstrated experience building and maintaining real production systems will be given preference.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 55.4, "matched_skills": ["postgresql", "vector databases", "ci/cd", "test automation", "performance optimization", "typescript", "javascript", "rest api", "websockets", "sql", "concurrency", "aws"], "missing_skills": ["artificial intelligence", "android", "llm", "monitoring", "rag", "logging", "node.js", "python"], "also_on": [], "query": "senior-software-developer", "id": "wf5085724", "extra": {"company_size": "SIZE_1001_5000", "salary_stated": false, "semantic": 0.588, "score_confidence": "high", "is_mnc": false}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "Java Software Engineer", "company": "Metropolitan Wireless International", "url": "https://www.linkedin.com/jobs/view/4490255800", "country": "IN", "location": "Bengaluru South, Karnataka, India", "remote": null, "posted": "2026-11-16", "posted_at": null, "posted_raw": "1 day ago", "salary": "", "snippet": "", "description": "", "skills": [], "employment_type": "", "exp_min": null, "exp_max": null, "seniority": "", "fit": "unknown", "exp_class": "B", "exp_class_label": "STRONG POTENTIAL MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 54.3, "matched_skills": ["java"], "missing_skills": [], "also_on": [], "query": "engineer", "id": "li4490255800", "extra": {"linkedin_id": "4490255800", "salary_stated": false, "semantic": 0.261, "score_confidence": "low", "is_mnc": false}}, {"source": "instahyre", "source_name": "Instahyre", "title": "Manual QA Engineer", "company": "Truva", "url": "https:// eeks per quarter ## About Loopr AI At Loopr AI, we build AI-powered products that help manufacturers improve quality and production processes. Our platform, **LooprIQ Inspect**, uses computer vision to detect product defects, verify assembly, and monitor production processes in real time. It brings together AI inference, scalable backend services, and intuitive interfaces to turn factory-floor data into actionable insights. We also integrate with customer ERP systems to make production data more useful across the business. ## About the Role We’re looking for a **Full Stack Engineer with 4–5 years of experience** to help build and scale our product across the frontend and backend. You’ll work with React, TypeScript, Node.js, and NestJS to deliver features used in real manufacturing environments. You’ll collaborate with product and AI/ML teams, solve problems across the stack, and own your work from technical design through deployment. This role is a good fit for someone who enjoys the pace of a startup, thinks beyond individual tickets, and cares about building reliable, maintainable software. ## What You’ll Do - Build and maintain end-to-end product features across frontend and backend systems. - Create responsive, intuitive interfaces using **React and TypeScript**. - Develop scalable backend services and REST APIs using **Node.js and NestJS**. - Design data models and optimize queries using **MongoDB, Prisma, and Redis**. - Integrate application features with AI inference services, real-time data pipelines, and external systems. - Own features throughout the development lifecycle: design, implementation, testing, deployment, and monitoring. - Write clean, maintainable code and contribute to automated tests and code reviews. - Troubleshoot issues across the stack and improve application performance and reliability. - Work closely with AI/ML engineers, product teams, and other developers to turn requirements into production-ready solutions. ## What We’re Looking For jobs/5044743-ai-engineer-autonomous-agents-clone", "country": "IN", "location": "Bengaluru", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "$20k – $40k • 0.1% – 0.4%", "snippet": "HelloCounsel builds AI agents that run pre-litigation for US personal injury firms: intake, case opening, medical records, insurance claims, client communication. They work across phone, email, fax and the firm's case management system. Live at real firms, $3.2M seed. Our agents only start working once a firm gives us access to its systems. Today that's our slowest step. You make it fast. THE ROLE", "description": "HelloCounsel builds AI agents that run pre-litigation for US personal injury firms: intake, case opening, medical records, insurance claims, client communication. They work across phone, email, fax and the firm's case management system. Live at real firms, $3.2M seed. Our agents only start working once a firm gives us access to its systems. Today that's our slowest step. You make it fast. THE ROLE You take a US law firm from signed contract to agents running on its real cases. Every firm runs on a different mix of case management system, phone setup, email, fax and habits. You get us access, connect the systems, configure and extend the agents for how that firm actually works, and stay on it until the numbers show it's working. Then you turn what you learned into product, so the next firm goes live faster. Engineer first, not a PM or account manager. WHAT YOU'LL DO - Own firm onboarding end to end: access to their case management system, email, fax and phones, in days, not weeks - Write the integration code, scripts and agent configuration yourself - Work directly with firm staff to map how their cases actually move, and find what to automate next - Be first responder when an agent breaks at a customer, then fix the root cause in the product - Report every week on each firm: tasks done, time saved, what's blocking YOU'RE A FIT IF - You're an engineer who likes customers: you've shipped production code AND run implementations, integrations or support for real clients - You can debug APIs, data and permissions on someone else's system without a manual - You write clearly and stay calm with a US law firm partner on the line - You can overlap with US mornings (Bengaluru evenings) a few days a week YOU'RE NOT A FIT IF - You want to hand problems to engineering instead of fixing them - You need a playbook before you start HOW WE HIRE A short written problem, a call with the founder, then a small build: make a working AI agent. We judge how you get past obstacles, not polish. In office, Bengaluru.", "skills": [], "employment_type": "full-time", "exp_min": 2, "exp_max": null, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Unknown date", "relevance": 1.0, "score": 38.3, "matched_skills": [], "missing_skills": ["ai agents"], "also_on": [], "query": "engineer", "id": "wf5044743", "extra": {"company_size": "SIZE_1_10", "posted_checked": "none", "salary_stated": true, "salary_inr": 3360000, "salary_lpa": 33.6, "salary_text": "$20k – $40k • 0.1% – 0.4%", "semantic": 0.307, "score_confidence": "low", "is_mnc": false, "lpa": 33.6, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 8.0}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Embedded Software Engineer", "company": "CDSpace Robotics", "url": "https://wellfound.com/jobs/4867012-embedded-software-engineer", "country": "IN", "location": "Bangalore Urban", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "₹12L – ₹16L • No equity", "snippet": "### About the Role CDSPACE is looking for an Embedded Software Engineer who enjoys working close to hardware, solving challenging technical problems, and building reliable embedded systems. You will develop real-time firmware for drone gimbals, stabilization systems, avionics, and communication subsystems. The role covers the complete embedded development lifecycle, including architecture, impleme", "description": "### About the Role CDSPACE is looking for an Embedded Software Engineer who enjoys working close to hardware, solving challenging technical problems, and building reliable embedded systems. You will develop real-time firmware for drone gimbals, stabilization systems, avionics, and communication subsystems. The role covers the complete embedded development lifecycle, including architecture, implementation, hardware bring-up, debugging, testing, optimization, and production support. ### What You’ll Do **Real-Time Firmware Development** - Develop and maintain embedded firmware using C and C++. - Build real-time firmware for drone gimbals, stabilization systems, avionics, and related subsystems. - Develop bare-metal and RTOS-based applications for STM32, ESP32, and similar microcontrollers. - Design concurrent firmware components, interrupt-driven systems, and timing-critical control functions. - Optimize firmware for execution speed, memory usage, power consumption, and reliability. **Drone Communication and Subsystem Integration** - Develop communication interfaces between flight controllers, gimbals, sensors, payloads, motor controllers, and onboard computers. - Implement and debug communication protocols such as UART, SPI, I2C, CAN, and RS-485. - Support integration with wireless communication technologies such as Bluetooth Low Energy and Wi-Fi. - Develop reliable data handling, device management, error detection, and recovery mechanisms. - Diagnose communication and integration issues across multiple embedded subsystems. **Gimbal and Motor-Control Systems** - Develop firmware for gimbal control, stabilization, sensing, and motor-drive systems. - Integrate IMUs, encoders, motor drivers, and other motion-control sensors. - Work with BLDC motors, motor controllers, and electronic speed controllers. - Support the implementation and tuning of control algorithms for stabilization and motor control. - Diagnose timing, vibration, sensor, communication, and control-related issues. **Hardware Bring-Up and Device Drivers** - Develop and maintain board support packages, hardware-abstraction layers, and device drivers. - Bring up new microcontroller-based boards and validate clocks, memory, power sequencing, peripherals, and communication interfaces. - Port firmware to new hardware platforms and microcontroller variants. - Read electronic schematics and component datasheets to support firmware development and debugging. - Collaborate with hardware engineers to diagnose board-level and hardware-software integration issues. **Bootloaders and Firmware Updates** - Develop and maintain bootloaders and firmware-update mechanisms. - Support wired and wireless firmware-update workflows. - Implement firmware validation, rollback, recovery, and fail-safe mechanisms. - Improve the reliability and usability of production programming and update processes. **Debugging, Testing, and Validation** - Debug firmware using hardware debuggers, oscilloscopes, logic analyzers, and other laboratory instruments. - Develop unit, integration, hardware-in-the-loop, and system-level tests. - Investigate firmware defects, timing issues, memory corruption, communication failures, and hardware faults. - Perform root-cause analysis and implement corrective actions. - Support bench testing, field testing, flight trials, and production validation. - Maintain test procedures, debugging records, and technical documentation. **Production and Engineering Support** - Improve firmware build, programming, calibration, and production-test workflows. - Support manufacturing teams during board programming, testing, and failure analysis. - Use Git for version control, collaboration, code review, and release management. - Work with hardware, avionics, controls, and flight-test teams to resolve system-level issues. - Maintain clear documentation for firmware architecture, interfaces, configuration, and releases. ### Required Qualifications and Skills - Strong hands-on experience with Embedded C/C++ and low-level programming. - Experience with bare-metal development and microcontrollers such as STM32, ESP32, or similar platforms. - Understanding of microcontroller peripherals, interrupts, timers, ADCs, DMA, memory, and watchdogs. - Experience with UART, SPI, I2C, CAN, RS-485, and related embedded communication protocols. - Understanding of RTOS concepts, task scheduling, synchronization, concurrency, and inter-process communication. - Experience developing device drivers, board support packages, and hardware-abstraction layers. - Knowledge of bootloader development and firmware-update mechanisms. - Strong firmware debugging and root-cause analysis skills. - Experience using hardware debuggers, oscilloscopes, logic analyzers, and other laboratory instruments. - Ability to read electronic schematics, component datasheets, and technical documentation. - Basic hardware fault-finding and board bring-up skills. - Familiarity with Git and software version-control practices. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience with drones, UAV avionics, autopilots, or gimbal systems. - Knowledge of BLDC motors, motor drivers, electronic speed controllers, and motor-control techniques. - Experience integrating IMUs, encoders, cameras, or other UAV sensors and payloads. - Experience with Bluetooth Low Energy, Wi-Fi, or other wireless communication technologies. - Familiarity with control systems, sensor fusion, and stabilization algorithms. - Experience with PX4, ArduPilot, MAVLink, or similar UAV technologies. - Exposure to FPGA development and FPGA-microcontroller integration. - Experience taking embedded products from prototype through manufacturing and production. **Experience:** 2+ years in embedded software or firmware development. **Education:** B.E./B.Tech in Electronics and Commu  false}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Founding Engineer, Platform Capabilities", "company": "Isomorph AI", "url": "https://wellfound.com/jobs/5081936-founding-engineer-platform-capabilities", "country": "IN", "location": "Bengaluru", "remote": false, "posted": "2026-11-15", "posted_at": "2026-11-15T18:27:49+00:00", "posted_raw": "", "salary": "", "snippet": "Give every app and agent a company builds its superpowers: AI, integrations and computers it can use. ### The role The apps and agents people build on Isomorph need to think with the best AI models, work with every tool the company uses, react to what happens in the business, and even operate websites and software that have no API, by using a computer like a person would. You will build those supe", "description": "Give every app and agent a company builds its superpowers: AI, integrations and computers it can use. ### The role The apps and agents people build on Isomorph need to think with the best AI models, work with every tool the company uses, react to what happens in the business, and even operate websites and software that have no API, by using a computer like a person would. You will build those superpowers, once, for everyone. You will also own the AI software factory that lets a small team build a platform this ambitious. This is the role for someone who wants to work on the most frontier parts of the stack. ### What you’ll own - Computer use: agents that get real work done in websites and software no API can reach. - AI for every app: the best models, within each company’s budgets and rules. - Integrations that connect apps and agents to every tool a company runs on. - Apps that work together, turning a company’s software into a network. - The AI software factory we use to build Isomorph itself. ### What you’ll get to build next - Learn from real work done across many companies, which over time becomes the foundation for models of our own. - Build agents that do real work across a company’s apps and systems, safely. - Build a platform that runs itself, with agents handling operations, reliability and security for every app. ### You’ll thrive here if - You have built platform capabilities that other products depend on. - You have shipped AI models and agents in production and made them dependable. - You have connected to many external systems and know where they break. - You love breadth, and switching between very different hard problems. ### Why Isomorph For fifty years, software inside a company has been written by a small group of engineers, for everyone else. That is ending. With AI, the people who know the work best (the finance analyst, the ops lead, the recruiter, the support manager) can now build the software they need themselves. Most of them have never written a line of code. This is one of the biggest shifts in how companies work, and it has a missing piece. The software these people build is useful, and very often unsafe: no sign-in, sensitive data exposed, nobody to run it, and invisible to IT. Multiply that across a large company and you get thousands of apps and agents that nobody governs. **Isomorph is the foundation that software runs on.** Bring an app or agent built with any AI tool, and Isomorph runs it on the company’s own cloud: secured, connected to company data and systems, monitored and kept healthy. Builders never think about infrastructure. IT stays in control of everything. We believe every company will become AI-native one workflow at a time, built by its own people. Isomorph is where that software will live. **The team.** You will join a small, high-talent-density founding team from IIT Madras and IIT Delhi. The founders are second-time founders who have built companies before and sold one. ### Why you’ll love it here - **You’ll be early.** You will be one of the first people on the team, with real ownership and a real say in what Isomorph becomes. - **You’ll work at the frontier.** AI agents and e amentals in fluid mechanics, thermodynamics and machine design: head, NPSH, specific speed, poly-tropic head, power. Proficiency in MS Excel (calculation sheets and TBE comparisons) and the rest of MS Office. Clear written English for technical queries, TBE notes and minutes of meetings. Good to have AutoCAD or a 3D model viewer knowledge (Navisworks, SP3D/E3D review). Exposure to FAT witnessing or site commissioning. Familiarity with oil and gas, petrochemical or hydrogen services. Behavioral Raises missing or conflicting data early instead of assuming values. Keeps registers and trackers current without reminders. Accepts review comments and closes them within the agreed turnaround. Willing to travel for vendor inspections. Responsibilities Engineering and sizing support Prepare mechanical datasheets for pumps, compressors, blowers and utility skids from process datasheets, and flag gaps or conflicting data to the process engineer. Do preliminary calculations: pump power and NPSH margin checks, driver sizing, utility consumption, and package weights and footprint. Prepare or update the equipment list, utility summary and lube/seal oil consumption inputs for the rotating scope. Specifications and RFQ packages Adapt standard specifications and project-specific requirements (scope of supply, inspection and test plan, spares, documentation) from SEIPL templates. Compile RFQ packages with datasheets, specifications, vendor data requirement lists (VDRL) and applicable codes. Technical bid evaluation (TBE) Prepare technical query lists and track vendor responses. Prepare the TBE comparison sheet covering compliance, deviations, performance curves, efficiency, NPSH required, materials, seal and lube systems, utilities and spares. Draft the TBE recommendation for the senior engineer's review. Vendor document review Do a first-pass review of GA drawings, performance curves, seal and lube oil schematics, P&IDs, nozzle loads, foundation and load data, and ITPs against the purchase order and codes. Maintain the vendor document register: status codes, comments and resubmission tracking. Interdisciplinary coordination Provide equipment data to piping (nozzle orientation, allowable loads, maintenance clearances), civil/structural (foundation loads, dynamic data), electrical (motor ratings, starting method) and instrumentation (instruments in the vendor's scope, control narratives). Take part in model reviews (30/60/90%) and HAZOP or design reviews as support to the senior engineer. Codes Knowledge API 610 API 682 API 674 / 675 /676 API 617 / 618 /619 API 672 API 614 API 611 /671 /677 API RP 686 ASME B73.1, Hydraulic Institute standards ASME Sec VIII Div 1 check(event) ; career-website-detail-template-2 => apply(record.id,meta)\" mousedown=\"lyte-button => check(event)\" final-style=\"background-color:#E11D48;border-color:#E11D48;color:white;\" final-class=\"lyte-button lyteBackgroundColorBtn lyteSuccess\" lyte-rendered=\"\">", "skills": [], "employment_type": "['Full Time']", "exp_min": 1.0, "exp_max": 2.0, "seniority": "", "fit": "fit", "exp_class": "A", "exp_class_label": "DIRECT MATCH", "freshness": "Very fresh", "relevance": 1.0, "score": 25.3, "matched_skills": ["english"], "missing_skills": [], "also_on": [], "query": "engineer", "id": "4d6885472f15", "extra": {"details_fetched": true, "salary_stated": false, "semantic": 0.067, "score_confidence": "low", "is_mnc": false}}, {"source": "instahyre", "source_name": "Instahyre", "title": "Sr. AI Engineer", "company": "Arcana", "url": "https://www.instahyre.com/job-438127-sr-ai-engineer-at-arcana-bangalore/", "country": "IN", "location": "Bangalore", "remote": null, "posted": "2026-08-11", "posted_at": null, "posted_raw": "", "salary": "", "snippet": "Portfolio intelligence for top hedge funds & asset managers", "description": "Arcana is building AI agents that synthesize information across heterogeneous sources and deliver structured, reasoned answers in real time. The product only works if the agents are fast, reliable, and correct, not approximately correct. Our stack: Go + Temporal for orchestration, a Plan-Execute-Synthesize agent architecture, and an evaluation harness we use to measure every regression. The problems are hard. The latency bar is aggressive. The accuracy requirements are unforgiving. The core responsibilities for the job include the following: Inference Optimization: Drive TTFT below 400ms for multi-step agent pipelines. Streaming optimization: first token to user while sub-agents are still running. KV cache strategy, prompt compression, and dynamic context window management. Multi-provider routing: model selection by latency, cost, and task type across OpenAI, Anthropic, Gemini, and open-weight models. Agent Architecture: Design and implement Plan-Execute-Synthesize pipelines that run sub-agents in parallel DAGs, not sequential chains. Build reliable orchestration on top of Temporal: retries, timeouts, partial failure recovery, and idempotency. Structured output enforcement: JSON schema validation, retry loops on malformed LLM output, and graceful degradation. Tool call design: schema design that LLMs actually follow reliably across providers. Evaluation and Harness: Own the eval framework end to end: ground truth datasets, automated scoring pipelines, and regression detection on every PR. LLM-as-judge pipelines for qualitative output assessment. Latency regression testing: p50/p95/p99 tracked across every deployment. Adversarial test case design: ambiguous queries, missing data, conflicting sources, malformed tool responses. Infrastructure: Model serving and cold start optimization. Async worker architecture for parallel sub-agent execution. Observability: trace every token, every tool call, and every synthesis step. Requirements: You've built something that runs in production at a meaningful scale, and you understand why it's fast (or why it isn't). Strong signal: You've worked on inference pipelines where TTFT was the primary metric, and you moved it meaningfully. You've built multi-step agent systems, and you know where they break, not from reading papers but from watching them fail in production. You've written eval harnesses from scratch, and you have opinions about what makes a ground truth dataset actually useful. You've debugged LLM non-determinism in production and built systems resilient to it. You've worked with streaming LLM responses and built infrastructure around partial output handling.", "skills": ["Agent", "AI", "Eval", "Inference", "LLM", "Orchestration", "Production", "Scale", "Streaming", "Temporal"], "employment_type": "Full Time", "exp_min": null, "exp_max": null, "seniority": "senior", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Verify before recommending", "relevance": 1.0, "score": 25.3, "matched_skills": ["observability"], "missing_skills": ["llm", "artificial intelligence", "ai agents", "openai", "anthropic"], "also_on": [], "query": "engineer", "id": "ih438127", "extra": {"posted_source": "page:json-ld", "details_fetched": true, "salary_stated": false, "semantic": 0.507, "score_confidence": "high", "is_mnc": false}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Robotics Engineer", "company": "CDSpace Robotics", "url": "https://wellfound.com/jobs/4867019-robotics-engineer", "country": "IN", "location": "India, Bengaluru", "remote": false, "posted": null, "posted_at": null, "posted_raw": "", "salary": "₹12L – ₹16L • No equity", "snippet": "### About the Role CDSPACE is looking for a Robotics Engineer to develop real-time perception and intelligent navigation capabilities for UAV and robotic platforms. You will build computer-vision and sensor-processing pipelines, integrate perception systems with ROS/ROS2, and deploy optimized AI models on edge-computing platforms. The role spans algorithm development, sensor integration, simulatio", "description": "### About the Role CDSPACE is looking for a Robotics Engineer to develop real-time perception and intelligent navigation capabilities for UAV and robotic platforms. You will build computer-vision and sensor-processing pipelines, integrate perception systems with ROS/ROS2, and deploy optimized AI models on edge-computing platforms. The role spans algorithm development, sensor integration, simulation, onboard deployment, bench testing, and flight validation. ### What You’ll Do **Robotics Perception** - Definitely nothing significant with Python - Develop perception algorithms for object detection, tracking, classification, localization, and scene understanding. - Build real-time image-processing pipelines using OpenCV and GStreamer. - Develop perception capabilities using monocular, stereo, thermal, depth, and other camera systems. - Integrate data from cameras, IMUs, LiDAR, GPS/GNSS, optical-flow sensors, and other UAV payloads. - Support sensor calibration, synchronization, coordinate transformations, and timestamp alignment. - Improve perception performance across changing lighting, motion, altitude, weather, and operating conditions. **ROS and Robotics Integration** - Integrate sensors and perception pipelines with onboard computing platforms using ROS/ROS2. - Develop ROS/ROS2 nodes, services, topics, actions, and launch configurations. - Build and test robotic applications using Gazebo or similar simulation environments. - Integrate perception outputs with guidance, navigation, control, and mission-planning systems. - Develop interfaces between onboard computers, flight controllers, payloads, and ground-control systems. - Diagnose issues across sensors, middleware, networks, embedded software, and onboard computers. **UAV and Autonomous Systems** - Develop perception and navigation capabilities for multirotor and fixed-wing UAV platforms. - Support obstacle detection, target tracking, visual navigation, inspection, and autonomous mission workflows. - Integrate onboard perception applications with PX4, ArduPilot, or similar flight stacks. - Support communication with flight controllers using MAVLink. - Work with QGroundControl, Mission Planner, and related UAV tools. - Collaborate with avionics, embedded software, controls, hardware, and flight-test teams. **Testing and Validation** - Conduct software-in-the-loop and hardware-in-the-loop simulations. - Develop test datasets, test scenarios, and acceptance criteria for perception systems. - Perform bench testing, field testing, and flight trials. - Evaluate system performance under representative operating and environmental conditions. - Diagnose sensor, communication, model, software, and system-level issues. - Perform root-cause analysis and implement corrective actions. - Maintain testing procedures, integration records, model documentation, and validation reports. **Application and Interface Development** - Develop supporting applications, visualization tools, and operator interfaces. - Build tools for model configuration, telemetry monitoring, data recording, playback, and analysis. - Support Qt-based software development when required. - Implement clear logs, diagnostics, and system-health reporting. - Maintain modular, testable, and documented software. ### Required Qualifications and Skills - Strong proficiency in Python. - Working proficiency in C/C++ for performance-critical and hardware-integrated applications. - Experience developing and deploying computer-vision or deep-learning models. - Experience with OpenCV and real-time image-processing pipelines. - Familiarity with GStreamer or similar multimedia frameworks. - Experience with a deep-learning framework such as PyTorch or TensorFlow. - Understanding of model training, validation, dataset preparation, augmentation, and performance evaluation. - Experience deploying AI models on edge-computing platforms. - Familiarity with ROS/ROS2 and robotic software architectures. - Experience integrating cameras, sensors, and onboard computing systems. - Understanding of Linux-based development environments, networking, and system debugging. - Ability to profile and optimize inference latency, throughput, memory usage, and power consumption. - Strong analytical, debugging, and problem-solving skills. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience with NVIDIA Jetson, CUDA, TensorRT, ONNX, or GPU-accelerated computing. - Experience with Raspberry Pi or other embedded Linux platforms. - Knowledge of object detection, tracking, segmentation, visual odometry, SLAM, or sensor fusion. - Experience with ROS/ROS2, Gazebo, and robotics simulation. - Knowledge of MAVLink, QGroundControl, and Mission Planner. - Hands-on experience with PX4, ArduPilot, or a similar flight stack. - Understanding of UAV flight dynamics and multirotor or fixed-wing architectures. - Experience with Qt software development. - Experience with camera calibration, synchronization, streaming, and recording. - Familiarity with MLOps, experiment tracking, dataset versioning, and automated model evaluation. - Experience taking perception or AI systems from research prototypes through field deployment. **Experience:** 3–5 years in computer vision, robotics perception, AI/ML, or edge computing. **Education:** Degree in Electronics, Electrical Engineering, Computer Science, Artificial Intelligence, Robotics, or a related engineering discipline.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 24.8, "matched_skills": ["linux", "data structures"], "missing_skills": ["ros", "robotics", "artificial intelligence", "embedded", "python", "object detection", "opencv", "gstreamer"], "also_on": [], "query": "software-engineer", "id": "wf4867019", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 16000 trol hardware under different loads, operating conditions, and transient events. - Measure and optimize RPM, torque, voltage, current, power, efficiency, and thermal performance. - Diagnose switching, power-delivery, control, and electromagnetic-noise issues. **UAV Avionics and Gimbal Systems** - Design and integrate avionics hardware for UAV platforms. - Develop electronics for gimbal control, stabilization, motor drive, sensing, and camera integration. - Integrate flight controllers, sensors, payloads, power systems, and onboard computing hardware. - Support hardware bring-up and flight integration of avionics and gimbal subsystems. - Investigate system-level issues involving power, communication, sensing, and control. **FPGA and Digital Systems** - Support FPGA-based hardware development and integration. - Develop or integrate FPGA interfaces for high-speed data acquisition, signal processing, control, and communication. - Work with microcontrollers, processors, memory devices, and programmable logic. - Validate digital interfaces, timing, signal integrity, and hardware-software interactions. **RF Communication Systems** - Develop and integrate RF communication hardware for UAV and ground systems. - Support wireless telemetry, command-and-control links, and payload communication systems. - Evaluate RF modules, transceivers, interfaces, power requirements, and system compatibility. - Conduct bench and field testing to diagnose connectivity, interference, range, and reliability issues. **PCB Development and Manufacturing** - Read, review, and develop electronic schematics using KiCad. - Support PCB layout for high-power, low-power, mixed-signal, RF, motor-control, FPGA, and avionics designs. - Review PCB layouts for power integrity, signal integrity, grounding, thermal performance, manufacturability, and testability. - Prepare and maintain bills of materials, component specifications, assembly documentation, and test reports. - Coordinate with PCB fabrication, assembly, and manufacturing teams during prototyping and production. - Apply design-for-manufacturing and design-for-test principles to improve product reliability and testability. **Hardware Prototyping, Testing, and Validation** - Build prototypes and perform hardware bring-up, bench testing, and system integration. - Create test setups for motor controllers, avionics, gimbal systems, RF systems, power electronics, and camera hardware. - Use oscilloscopes, multimeters, current probes, logic analyzers, power supplies, electronic loads, and related laboratory instruments. - Conduct controlled tests across different loads, temperatures, operating conditions, and transient events. - Perform root-cause analysis across hardware, firmware, and system interfaces. - Implement corrective actions and verify their effectiveness. - Prepare test procedures, validation reports, and technical documentation. ### Required Qualifications and Skills - Strong understanding of analog, digital, mixed-signal, and power-electronic design. - Practical experience with high-power and low-power electronic systems. - Experience with Embedded C/C++ and microcontroller-based systems. - Familiarity with ARM-based microcontrollers, STM32, or similar platforms. - Understanding of BLDC/PMSM motors, three-phase inverters, motor controllers, and ESC architecture. - Knowledge of switching devices, gate drivers, current sensing, voltage sensing, power conversion, and protection circuits. - Understanding of UAV avionics, gimbal systems, sensors, payloads, and onboard electronics. - Familiarity with FPGA hardware, programmable logic, or high-speed digital interfaces. - Understanding of RF communication systems and wireless hardware integration. - Experience with communication protocols such as CAN, UART, SPI, I2C, and RS-485. - Experience with PCB design, component selection, hardware bring-up, and laboratory testing. - Ability to read and interpret electronic schematics and technical documentation. - Strong analytical, debugging, and problem-solving skills. - Ability to communicate technical findings clearly and work effectively across engineering teams. ### Good to Have - Experience developing hardware for drones, autonomous systems, robotics, or aerospace platforms. - Experience with FPGA development tools and hardware-description languages such as Verilog or VHDL. - Knowledge of RF testing, antenna integration, telemetry systems, or long-range communication links. - Experience with camera interfaces, image sensors, and high-speed data links. - Knowledge of electromagnetic compatibility, signal integrity, power integrity, and thermal design. - Experience taking electronic products from prototype through manufacturing and production. **Education:** Bachelor’s degree in Electrical Engineering, Electronics Engineering, Computer Engineering, or a related field.", "skills": [], "employment_type": "full-time", "exp_min": 3, "exp_max": null, "seniority": "", "fit": "stretch", "exp_class": "C", "exp_class_label": "STRETCH OPPORTUNITY", "freshness": "Unknown date", "relevance": 1.0, "score": 20.3, "matched_skills": [], "missing_skills": ["fpga", "embedded", "prototyping", "technical documentation", "monitoring", "firmware", "c++", "stm32"], "also_on": [], "query": "software-engineer", "id": "wf4867010", "extra": {"company_size": "SIZE_11_50", "salary_stated": true, "salary_inr": 1600000, "salary_lpa": 16.0, "salary_text": "₹12L – ₹16L • No equity", "semantic": 0.188, "score_confidence": "high", "is_mnc": false, "lpa": 16.0, "lpa_kind": "stated", "lpa_source": "the posting", "pay_bonus": 6.0}}, {"source": "linkedin", "source_name": "LinkedIn", "title": "DevSecOps Cyber Engineer 1", "company": "Garmin Hyderabad", "url": "https://www.linkedin.com/jobs/view/4489741735", "country": "IN", "location": "Hyderabad, Telangana, India", "remote": null, "posted": "2026-11-16", "posted_at": "2026-11-16T13:12:48.753377+00:00", "posted_raw": "19 hours ago", "salary": "", "snippet": "", "desc here being right is everything. ### The role Every finance team runs on a mountain of manual work that no software ever covered: reconciliations, payouts, reporting, chasing numbers across systems. Finance teams are already among the most enthusiastic builders on Isomorph. Now we are building a finance platform on top of it, with ready-made agents and ap", "description": "Build AI agents that do real finance work, where being right is everything. ### The role Every finance team runs on a mountain of manual work that no software ever covered: reconciliations, payouts, reporting, chasing numbers across systems. Finance teams are already among the most enthusiastic builders on Isomorph. Now we are building a finance platform on top of it, with ready-made agents and apps that make that work run itself. You will be its founding engineer. You will build with real finance teams, ship agents that move real money correctly, and turn what works into products many companies use. ### What you’ll own - Finance agents and apps that teams adopt in days and trust completely. - Deep connections into the accounting, banking and payment systems finance runs on. - The building blocks that let a finance team’s own AI agent build software an auditor would sign off on. - Making accuracy and control the reason people choose us. ### What you’ll get to build next - Build a deep understanding of finance work, from matching messy records to reading financial documents, that in time leads to finance-specific models of our own. - Build toward a month-end close that largely runs itself. ### You’ll thrive here if - You have built software for finance, payments, accounting or fintech, and you know why accuracy matters. - You have shipped AI agents where “mostly right” was not good enough. - You have tamed messy external systems and made them reliable. - You enjoy sitting with finance teams and seeing your work change their month. ### Why Isomorph For fifty years, software inside a company has been <script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const META = DATA.meta || {};
  const JOBS = DATA.jobs || [];
  const COUNTRIES = DATA.countries || [];
  const SCORED = JOBS.some(j => j.score !== null && j.score !== undefined);
  const STATE_KEY = 'jobhunt:state';
  const UI_KEY = 'jobhunt:ui:' + (META.run_id || 'run');

  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  const S = Object.assign({ applied: {}, saved: {}, hidden: {} }, load(STATE_KEY, {}));
  const ui = Object.assign({
    country: 'ALL', q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any',
    sort: SCORED ? 'score' : 'fit', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false,
  }, load(UI_KEY, {}));
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // theme
  const savedTheme = load('jobhunt:theme', null);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  $('theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); save('jobhunt:theme', next);
  };

  // header
  const roles = (META.roles || []).join(', ');
  const exp = META.experience_label ? ` · <b>${esc(META.experience_label)}</b> experience` : '';
  const cs = COUNTRIES.filter(c => c.code !== 'REMOTE').map(c => c.flag + ' ' + c.name).join(', ');
  $('criteria').innerHTML = `<b>${esc(roles)}</b>${exp} · ${esc(cs)}${META.resume_name ? ' · scored against <b>' + esc(META.resume_name) + '</b>' : ''} · ${esc(META.generated || '')}`;
  const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));
  const blocked = new Set((DATA.sources || []).filter(s => s.status !== 'ok').map(s => s.source_name));
  $('stats').innerHTML = `<b>${JOBS.length}</b> jobs · <b>${okSources.size}</b> sources${blocked.size ? ` · <span title="${esc([...blocked].join(', '))}">${blocked.size} unavailable</span>` : ''}`;

  // sources panel
  const grid = $('srcGrid');
  const bySrc = {};
  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });
  grid.innerHTML = Object.keys(bySrc).sort().map(name => {
    const rows = bySrc[name];
    const total = rows.reduce((a, r) => a + (r.count || 0), 0);
    const bad = rows.filter(r => r.status !== 'ok');
    const cls = bad.length === rows.length ? (bad[0].status) : 'ok';
    const detail = rows.map(r => `${r.country}${r.status === 'ok' ? ':' + r.count : ' ' + r.status}`).join(' ');
    return `<div><span class="${cls}">●</span> ${esc(name)} <b>${total}</b> <span class="cc" title="${esc(bad.map(b => b.error || '').join('\n'))}">${esc(detail)}</span></div>`;
  }).join('');
  $('srcSummary').textContent = `Sources (${Object.keys(bySrc).length}) — click to see per-country counts; blocked platforms have direct search links under each country tab`;

  // fit chips
  const FITS = [['fit', 'Fit'], ['stretch', 'Stretch'], ['unknown', 'Unknown'], ['over', 'Overqualified'], ['no', 'Too senior']];
  function renderFitChips() {
    $('fitChips').innerHTML = FITS.map(([k, l]) => `<button class="chip ${ui.fits.includes(k) ? 'on' : ''}" data-fit="${k}">${l}</button>`).join('');
  }
  $('fitChips').onclick = e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;
    const k = b.dataset.fit; ui.fits = ui.fits.includes(k) ? ui.fits.filter(x => x !== k) : ui.fits.concat(k); persist(); render();
  };

  // sort options
  const SORTS = SCORED ? [['score', 'Best match'], ['date', 'Newest'], ['fit', 'Experience fit'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']]
                       : [['fit', 'Experience fit'], ['date', 'Newest'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']];
  $('sort').innerHTML = SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (!SCORED) $('scoreRange').style.display = 'none';

  // source select
  const srcNames = [...new Set(JOBS.map(j => j.source_name))].sort();
  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs
  function renderTabs(counts) {
    const tabs = [{ code: 'ALL', name: 'All', flag: '' }].concat(COUNTRIES);
    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src; $('viaSel').value = ui.via || '';
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  $('viaSel').onchange = () => { ui.via = $('viaSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly', 'mncOnly', 'highPay'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', via: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; $('viaSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'via', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved', 'exp_class', 'freshness']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, isApify(j) ? ((j.extra && j.extra.worldwide) ? 'apify-worldwide' : 'apify') : '', j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '', j.exp_class || '', j.freshness || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function isApify(j) { return !!((j.extra && j.extra.via === 'apify') || /^apify-/.test(j.source || '') || /\(Apify\)/.test(j.source_name || '')); }
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.via === 'apify' && !isApify(j)) return false;
    if (ui.via === 'world' && !(j.extra && j.extra.worldwide)) return false;
    if (ui.via === 'direct' && isApify(j)) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${j.extra && j.extra.worldwide ? '<span class="b" title="Found by the Apify worldwide pass">🌍 worldwide</span>' : ''}${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${j.exp_class ? `<span class="b fit-${j.fit}" title="Career OS class ${esc(j.exp_class)}: ${esc(j.exp_class_label || '')}">${esc(j.exp_class)} · ${esc(j.exp_class_label || '')}</span>` : ''}${j.freshness ? `<span class="b" title="Posting age when this report was made (Career OS freshness label)">${esc(j.freshness)}</span>` : ''}${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>

    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }

  .tb-toggle::after { content: "\25B4"; font-size: 0.7rem; }

  /* thin scrollbars that follow the page's light / dark theme */

    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }

</style>
<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
