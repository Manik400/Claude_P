r software engineer": {"linkedin": "https://www.linkedin.com/search/results/people/?keywords=%22Beghou%20Consulting%22%20%28%22Senior%20software%20engineer%22%29%20%22Pune%22", "google": "https://www.google.com/search?q=site%3Alinkedin.com/in%20%22Beghou%20Consulting%22%20%28%22Senior%20software%20engineer%22%29%20%22Pune%22"}}}}}, {"source": "wellfound", "source_name": "Wellfound", "title": "Software Engineer", "company": "ClearFeed", "url": "https://wellfound.com/jobs/4377418-software-engineer", "country": "IN", "location": "Bangalore Urban", "remote": false, "posted": "2026-09-23", "posted_at": "2026-09-23T16:31:10+00:00", "posted_raw": "", "salary": "", "snippet": "## This is not a normal software engineering role At ClearFeed, using AI to build software is not optional. Every engineer is expected to use AI every day — to understand code, write code, review code, debug issues, design product flows, generate tests, write docs, explore APIs, and ship faster. We expect you to be comfortable using tools like Claude, Cursor, ChatGPT, Codex, or similar AI tools as", "description": "## This is not a normal software engineering role At ClearFeed, using AI to build software is not optional. Every engineer is expected to use AI every day — to understand code, write code, review code, debug issues, design product flows, generate tests, write docs, explore APIs, and ship faster. We expect you to be comfortable using tools like Claude, Cursor, ChatGPT, Codex, or similar AI tools as part of your default engineering workflow. If you do not know how to use AI effectively to write code, debug issues, understand unfamiliar systems, and improve your own engineering output, **please do not apply**. We are looking for engineers who can use AI as leverage — while still bringing strong judgment, ownership, and engineering taste. AI can write a lot of the first draft. You are responsible for the final result. ## What we are building ClearFeed is building an AI-first support platform for modern teams working in Slack and Microsoft Teams. Our product connects conversations, tickets, knowledge bases, engineering tools, CRMs, and AI agents so companies can resolve customer and internal requests faster. Our engineers work on real product problems: * How should an AI agent understand a support conversation? * When should it answer automatically, and when should it ask a human? * How do we safely connect Slack, Teams, Zendesk, Jira, GitHub, Linear, Salesforce, HubSpot, and other tools? * How do we make AI workflows observable, debuggable, and trustworthy? * How do we ship fast without creating chaos for customers? ## What you will do You will take ambiguous customer problems and turn them into working software. That may include API design, backend logic, database changes, Slack/Teams workflows, AI-agent behavior, product UX, tests, monitoring, and deployment. You will be expected to: * Use AI tools heavily while writing and reviewing code. * Use AI to create first-pass designs, specs, implementation plans, tests, and docs. * Build backend services using TypeScript, Node.js, NestJS, PostgreSQL, Redis, queues, and cloud infrastructure. * Work on AI-agent features involving LLMs, RAG, tool-calling, structured outputs, evals, guardrails, and observability. * Own features end to end: idea → design → implementation → testing → release → production debugging. * Debug production issues and improve the system after every incident. * Improve our engineering system itself: better prompts, better internal tools, better test generation, better review loops, better deployment workflows. * Move fast, but stay accountable for what ships. ## What “AI-native” means here We do not mean “vibe code and hope it works.” We mean: * You can use AI to move significantly faster. * You can use AI to write, refactor, test, and debug code. * You can review AI-generated code critically. * You understand that AI is often confidently wrong. * You can use AI for product thinking, but you do not outsource judgment. * You can ship faster without lowering quality. * You can explain your decisions clearly to humans. The best engineers in the next decade will not be the ones who manually type the most code. They will be the ones who combine product judgment, technical depth, and AI leverage to ship high-quality software faster than traditional teams. ## What we are looking for You may be a good fit if: * You are already using AI coding tools daily. * You are faster today than you were one year ago because of AI. * You have strong software fundamentals and do not blindly trust generated code. * You can work across backend, product, integrations, and basic frontend when needed. * You care about customer experience, not just clean abstractions. * You enjoy working in small teams with high ownership. * You can take a problem statement and come back with a working solution. * You are comfortable with ambiguity. * You like shipping. * You are curious, direct, and low-ego. ## Bonus points We will pay extra attention if you have: * Built something real using AI agents. * Used Claude Code, Cursor, Codex, v0, Lovable, Replit, or similar tools seriously. * Shipped a side project using AI. * Built integrations with Slack, Teams, Zendesk, Jira, GitHub, Salesforce, or HubSpot. * Worked on support, developer tools, workflow automation, or B2B SaaS products. * Written about your engineering work. * Open-source contributions or visible proof of work. ## How we evaluate We use AI in our hiring process for the same reason we use it in engineering: it helps everyone move faster and spend time where human judgment matters most. The first step is a short AI-led interview of around 15 minutes. It helps us understand your background, your experience, and how you think about building software. After that, you will have three technical discussions with our team: * Problem solving + debugging * Problem solving * System design We want to understand how you reason, how you debug, how you make trade-offs, and how well you can combine engineering fundamentals with AI tools to build reliable software faster. ## What you get We want engineers to have the tools, support, and environment to do their best work. ### Flexible AI Credits You will get flexible AI credits and access to the tools you need to build faster — Claude, Cursor, ChatGPT, Codex, or whatever genuinely helps you ship better software. We do not want engineers hesitating before using AI because of subscription limits or tool access. ### Health and medical support You get comprehensive medical insurance, along with **free doctor consultations**. We are a small team, but we want to be thoughtful about health, family, and emergencies. You should not have to figure everything out on your own when something medical comes up. ### Sports and team activities We sponsor badminton and cricket games for the team. Not mandatory forced-fun activities. Just real sports, real games, and a good way to spend time with people outside tickets, PRs, and production issues. ## How to apply Apply here or send your resume to jobs@clearfeed.ai with: * Your LinkedIn, GitHub, or resume. * One thing you have built that you are proud of. * A short note on how you use AI in your engineering workflow. * Optional: a Loom/video/walkthrough of something you built.", "skills": [], "employment_type": "full-time", "exp_min": 0, "exp_max": null, "seniority": "", "fit": "fit", "relevance": 1.0, "score": 71.7, "matched_skills": ["artificial intelligence", "ai agents", "api design", "typescript", "postgresql", "redis", "llm", "observability", "system design"], "missing_skills": ["jira", "salesforce", "ui/ux", "monitoring", "node.js", "nestjs", "rag"], "also_on": [], "query": "software-engineer", "id": "wf4377418", "extra": {"company_size": "SIZE_11_50", "posted_source": "page:json-ld", "posted_checked": "json-ld", "salary_stated": false, "semantic": 0.482, "score_confidence": "high", "ai_summary": {"why": "Strong .NET/Angu onsible for batch monitoring tools , expertise in CA7 scheduling, NDM , JCL What you will be doing Collaborate with engineers across the Core Transaction Processing Team to create technical designs, develop, test and solve complex problems that drive the solution from initial concept to production. Contribute to our Automated build, deploy and test processes for each solution. Work in an iterative manner that fits well with the development practices and pace within the team, with focus on a fail fast approach. Demo your work for colleagues and members of the business team. Conduct research on new and interesting technologies that help to progress our products and platforms. Create mechanisms/architectures that enable rapid recovery, repair and cleanup of existing solutions with good understanding of fault tolerance and failure domains. Identify opportunities to deliver self service capability for the most common infrastructure and application management tasks. Create automated tests that easily plug into our automated code pipeline. Provide deep and detailed levels of monitoring across all levels of the application. What you will bring • Experience of working on SOA Architecture, Microservices Architecture, Event drives and serverless architectures. • Good Knowledge of JAVA/JEE Design Patterns, Enterprise Integration Design Patterns , • SOA Design Patterns, MicroServices Design Patterns. Experience of working on RestFull services, SOAP WebServices, gRPC , Async & streaming technologies. • Experience of working on Java 1.8 +, Spring 4.x +, Spring Boot, Spring data, SpringREST, • Spring MVC, Spring-integration (i.e. no EJB :), Tomcat 8.5.x (embedded version), JUnit + Spring-test, application stack • Experience of working on ORM / Persistence frameworks or technologies like Hibernate , MyBatis, iBatis • Experience on designing and developing Fault Tolerant , HA systems • Good hands on experience on AWS stack and services like S3,EC2, KMS, EKS, MSK, Lambda, Iam, RDS, Dy nd eliminating unnecessary steps. - Identify gaps in the current application and proactively recommend improvements. - Test enhancements, troubleshoot defects, and implement changes with minimal disruption to existing operations. ### 3. Python Development and Automation - Develop Python scripts and utilities to automate repetitive tasks and business processes. - Build integrations between Quickbase and other applications, APIs, databases, and data sources. - Use Python to perform data validation, transformation, reconciliation, and bulk data processing. - Develop custom functionality where Quickbase's native capabilities are insufficient or where an external service would be more effective. - Write maintainable, reusable, and well-documented code. ### 4. Integrations and Data Management - Work with Quickbase APIs and REST APIs to exchange data with external systems. - Design and maintain reliable data import, export, synchronization, and integration processes. - Monitor data quality, investigate discrepancies, and implement validation and error-handling mechanisms. - Ensure appropriate handling of credentials, access permissions, and sensitive business data. ### 5. Continuous Improvement - Work with business stakeholders to understand operational challenges and improvement opportunities. - Evaluate whether a requirement is best addressed through Quickbase configuration, Python development, or integration with another system. - Recommend solutions that improve productivity, reduce errors, and support future business growth. - Maintain technical documentation and communicate progress, issues, and recommendations clearly. ## Required Qualifications - Demonstrated experience developing and maintaining applications using **Quickbase**. - Proficiency in **Python**, including writing scripts, working with data, debugging, and building automation. - Experience working with REST APIs, JSON, authentication, and API integrations. - Understanding of relational databases, data s <script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const META = DATA.meta || {};
  const JOBS = DATA.jobs || [];
  const COUNTRIES = DATA.countries || [];
  const SCORED = JOBS.some(j => j.score !== null && j.score !== undefined);
  const STATE_KEY = 'jobhunt:state';
  const UI_KEY = 'jobhunt:ui:' + (META.run_id || 'run');

  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  const S = Object.assign({ applied: {}, saved: {}, hidden: {} }, load(STATE_KEY, {}));
  const ui = Object.assign({
    country: 'ALL', q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any',
    sort: SCORED ? 'score' : 'fit', src: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false,
  }, load(UI_KEY, {}));
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // theme
  const savedTheme = load('jobhunt:theme', null);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  $('theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); save('jobhunt:theme', next);
  };

  // header
  const roles = (META.roles || []).join(', ');
  const exp = META.experience_label ? ` · <b>${esc(META.experience_label)}</b> experience` : '';
  const cs = COUNTRIES.filter(c => c.code !== 'REMOTE').map(c => c.flag + ' ' + c.name).join(', ');
  $('criteria').innerHTML = `<b>${esc(roles)}</b>${exp} · ${esc(cs)}${META.resume_name ? ' · scored against <b>' + esc(META.resume_name) + '</b>' : ''} · ${esc(META.generated || '')}`;
  const okSources = new Set((DATA.sources || []).filter(s => s.status === 'ok' && s.count > 0).map(s => s.source_name));
  const blocked = new Set((DATA.sources || []).filter(s => s.status !== 'ok').map(s => s.source_name));
  $('stats').innerHTML = `<b>${JOBS.length}</b> jobs · <b>${okSources.size}</b> sources${blocked.size ? ` · <span title="${esc([...blocked].join(', '))}">${blocked.size} unavailable</span>` : ''}`;

  // sources panel
  const grid = $('srcGrid');
  const bySrc = {};
  (DATA.sources || []).forEach(s => { (bySrc[s.source_name] = bySrc[s.source_name] || []).push(s); });
  grid.innerHTML = Object.keys(bySrc).sort().map(name => {
    const rows = bySrc[name];
    const total = rows.reduce((a, r) => a + (r.count || 0), 0);
    const bad = rows.filter(r => r.status !== 'ok');
    const cls = bad.length === rows.length ? (bad[0].status) : 'ok';
    const detail = rows.map(r => `${r.country}${r.status === 'ok' ? ':' + r.count : ' ' + r.status}`).join(' ');
    return `<div><span class="${cls}">●</span> ${esc(name)} <b>${total}</b> <span class="cc" title="${esc(bad.map(b => b.error || '').join('\n'))}">${esc(detail)}</span></div>`;
  }).join('');
  $('srcSummary').textContent = `Sources (${Object.keys(bySrc).length}) — click to see per-country counts; blocked platforms have direct search links under each country tab`;

  // fit chips
  const FITS = [['fit', 'Fit'], ['stretch', 'Stretch'], ['unknown', 'Unknown'], ['over', 'Overqualified'], ['no', 'Too senior']];
  function renderFitChips() {
    $('fitChips').innerHTML = FITS.map(([k, l]) => `<button class="chip ${ui.fits.includes(k) ? 'on' : ''}" data-fit="${k}">${l}</button>`).join('');
  }
  $('fitChips').onclick = e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;
    const k = b.dataset.fit; ui.fits = ui.fits.includes(k) ? ui.fits.filter(x => x !== k) : ui.fits.concat(k); persist(); render();
  };

  // sort options
  const SORTS = SCORED ? [['score', 'Best match'], ['date', 'Newest'], ['fit', 'Experience fit'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']]
                       : [['fit', 'Experience fit'], ['date', 'Newest'], ['relevance', 'Title relevance'], ['company', 'Company A–Z']];
  $('sort').innerHTML = SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (!SCORED) $('scoreRange').style.display = 'none';

  // source select
  const srcNames = [...new Set(JOBS.map(j => j.source_name))].sort();
  $('srcSel').innerHTML = '<option value="">All sources</option>' + srcNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  // tabs
  function renderTabs(counts) {
    const tabs = [{ code: 'ALL', name: 'All', flag: '' }].concat(COUNTRIES);
    $('tabs').innerHTML = tabs.map(c => `<button class="tab ${ui.country === c.code ? 'active' : ''}" data-cc="${c.code}">${c.flag ? c.flag + ' ' : ''}${esc(c.name)} <span class="n">${counts[c.code] || 0}</span></button>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-cc]'); if (!b) return; ui.country = b.dataset.cc; persist(); render(); window.scrollTo({ top: 0 }); };

  // controls wiring
  $('q').value = ui.q; $('minScore').value = ui.minScore; $('minScoreV').textContent = ui.minScore; $('remote').value = ui.remote; $('sort').value = ui.sort; $('srcSel').value = ui.src;
  $('q').oninput = () => { ui.q = $('q').value; persist(); render(); };
  $('minScore').oninput = () => { ui.minScore = +$('minScore').value; $('minScoreV').textContent = ui.minScore; persist(); render(); };
  $('remote').onchange = () => { ui.remote = $('remote').value; persist(); render(); };
  $('sort').onchange = () => { ui.sort = $('sort').value; persist(); render(); };
  $('srcSel').onchange = () => { ui.src = $('srcSel').value; persist(); render(); };
  ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly', 'mncOnly', 'highPay'].forEach(k => { $(k).onclick = () => { ui[k] = !ui[k]; persist(); render(); }; });
  $('reset').onclick = () => { Object.assign(ui, { q: '', minScore: 0, fits: ['fit', 'stretch', 'unknown', 'over'], remote: 'any', src: '', onlySaved: false, hideApplied: false, showHidden: false, titleOnly: false, mncOnly: false, highPay: false }); $('q').value = ''; $('minScore').value = 0; $('minScoreV').textContent = 0; $('remote').value = 'any'; $('srcSel').value = ''; persist(); render(); };
  $('csv').onclick = () => {
    const rows = [['country', 'title', 'company', 'location', 'source', 'posted', 'salary', 'fit', 'exp_min', 'exp_max', 'score', 'matched_skills', 'missing_skills', 'ai_why', 'ai_gaps', 'url', 'applied', 'saved']];
    visible().forEach(j => rows.push([j.country, j.title, j.company, j.location, j.source_name, j.posted || '', j.salary, j.fit, j.exp_min ?? '', j.exp_max ?? '', j.score ?? '', (j.matched_skills || []).join('; '), (j.missing_skills || []).join('; '), (j.extra && j.extra.ai_summary && j.extra.ai_summary.why) || '', (j.extra && j.extra.ai_summary && j.extra.ai_summary.gaps) || '', j.url, S.applied[j.id] ? 'yes' : '', S.saved[j.id] ? 'yes' : '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'jobs.csv'; a.click();
  };
  function persist() { save(UI_KEY, ui); }

  // filtering
  function passes(j, ignoreCountry) {
    if (!ignoreCountry && ui.country !== 'ALL' && j.country !== ui.country) return false;
    if (S.hidden[j.id] && !ui.showHidden) return false;
    if (ui.hideApplied && S.applied[j.id]) return false;
    if (ui.onlySaved && !S.saved[j.id]) return false;
    if (!ui.fits.includes(j.fit || 'unknown')) return false;
    if (SCORED && ui.minScore > 0 && (j.score == null || j.score < ui.minScore)) return false;
    if (ui.remote === 'only' && !j.remote) return false;
    if (ui.remote === 'no' && j.remote === true) return false;
    if (ui.src && j.source_name !== ui.src) return false;
    if (ui.titleOnly && !(j.relevance >= 0.75)) return false;
    if (ui.mncOnly && !(j.extra && j.extra.is_mnc)) return false;
    if (ui.highPay && !(j.extra && (j.extra.lpa || 0) >= 10)) return false;
    if (ui.q) {
      const q = ui.q.toLowerCase();
      const hay = [j.title, j.company, j.location, (j.skills || []).join(' '), (j.matched_skills || []).join(' '), j.snippet].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  const FIT_RANK = { fit: 0, unknown: 1, stretch: 2, over: 3, no: 4 };
  function sorter(a, b) {
    switch (ui.sort) {
      case 'score': return (b.score ?? -1) - (a.score ?? -1) || (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.posted || '').localeCompare(a.posted || '');
      case 'date': return (b.posted || '').localeCompare(a.posted || '') || (b.score ?? -1) - (a.score ?? -1);
      case 'fit': return (FIT_RANK[a.fit] - FIT_RANK[b.fit]) || (b.score ?? -1) - (a.score ?? -1) || (b.relevance - a.relevance) || (b.posted || '').localeCompare(a.posted || '');
      case 'relevance': return (b.relevance - a.relevance) || (b.score ?? -1) - (a.score ?? -1);
      case 'company': return (a.company || '').localeCompare(b.company || '') || (b.score ?? -1) - (a.score ?? -1);
    }
    return 0;
  }
  function visible() { return JOBS.filter(j => passes(j, false)).sort(sorter); }

  // rendering
  function ago(iso) {
    if (!iso) return '';
    const d = Math.round((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return Math.round(d / 30) + 'mo ago';
  }
  function ring(score, conf) {
    if (score == null) return '';
    const col = score >= 70 ? 'var(--good)' : score >= 45 ? 'var(--warn)' : 'var(--muted)';
    const r = 22, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return `<div class="ring" title="Resume match ${score} (${conf || ''} confidence)"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="v">${Math.round(score)}</div><div class="lbl">${conf === 'low' ? 'title only' : 'match'}</div></div>`;
  }
  function expLabel(j) {
    if (j.exp_min == null && j.exp_max == null) return j.seniority ? j.seniority : '';
    if (j.exp_min != null && j.exp_max != null && j.exp_min !== j.exp_max) return `${j.exp_min}–${j.exp_max} yrs`;
    if (j.exp_min != null) return `${j.exp_min}${j.exp_max == null ? '+' : ''} yrs`;
    return `up to ${j.exp_max} yrs`;
  }
  const FIT_LABEL = { fit: 'Fit', stretch: 'Stretch', unknown: 'Exp. unknown', over: 'Overqualified', no: 'Too senior' };
  // what it pays: the posting's own figure, else the estimate (typical for the company / looked up) - always with a "~"
  function payBadge(j) {
    const x = j.extra || {}; if (!x.lpa) return '';
    const fig = String(Math.round(x.lpa * 10) / 10), stated = x.lpa_kind === 'stated';
    const cls = x.lpa >= 10 ? 'fit-fit' : (stated && x.lpa < 6 ? 'fit-no' : '');
    return `<span class="b ${cls}" title="${esc(x.lpa_source || '')}${x.lpa_lo && x.lpa_hi ? ' (' + x.lpa_lo + '–' + x.lpa_hi + ' LPA)' : ''}">${stated ? '' : '~'}₹${fig} LPA${stated ? '' : ' · ' + esc(x.lpa_kind)}</span>`;
  }
  function card(j) {
    const applied = !!S.applied[j.id], saved = !!S.saved[j.id], hidden = !!S.hidden[j.id];
    const matched = new Set(j.matched_skills || []), missing = new Set(j.missing_skills || []);
    const tagSkills = (j.skills || []).filter(s => !matched.has(s) && !missing.has(s)).slice(0, 8);
    const skills = [...matched].map(s => `<span class="sk hit" title="in your resume">${esc(s)}</span>`)
      .concat([...missing].map(s => `<span class="sk miss" title="asked for, not in your resume">${esc(s)}</span>`))
      .concat(tagSkills.map(s => `<span class="sk">${esc(s)}</span>`)).join('');
    const eligible = (j.extra && j.extra.eligible && j.extra.eligible.length) ? `<span class="b remote" title="Countries this remote job is open to">open to: ${esc(j.extra.eligible.join(', '))}</span>` : '';
    const country = COUNTRIES.find(c => c.code === j.country);
    const text = j.description && j.description.length > (j.snippet || '').length ? j.description : (j.snippet || '');
    return `<article class="card ${applied ? 'applied' : ''} ${saved ? 'saved' : ''} ${hidden ? 'hidden-job' : ''}" data-id="${j.id}">
      <div class="head">${ring(j.score, j.extra && j.extra.score_confidence)}<div style="flex:1;min-width:0">
        <div class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="sub"><b>${esc(j.company || '—')}</b>${j.location ? ' · ' + esc(j.location) : ''}${ui.country === 'ALL' && country ? ' · ' + country.flag : ''}${j.posted ? ' · ' + ago(j.posted) : ''}${j.salary ? ' · ' + esc(j.salary) : ''}${j.employment_type ? ' · ' + esc(j.employment_type) : ''}</div>
      </div></div>
      <div class="badges"><span class="b src">${esc(j.source_name)}</span>${(j.also_on || []).map(a => `<span class="b">also on ${esc(a)}</span>`).join('')}${payBadge(j)}${j.extra && j.extra.is_mnc ? `<span class="b remote" title="${esc(j.extra.mnc_name || '')}">MNC · ${esc(j.extra.mnc_tier || '')}</span>` : ''}<span class="b fit-${j.fit}">${FIT_LABEL[j.fit] || j.fit}</span>${expLabel(j) ? `<span class="b">${esc(expLabel(j))}</span>` : ''}${j.remote ? '<span class="b remote">remote</span>' : ''}${eligible}${j.extra && j.extra.relocation_paid ? '<span class="b remote">relocation paid</span>' : ''}${j.extra && j.extra.applied_status === 'applied' ? '<span class="b fit-fit" title="' + esc(j.extra.applied_note || '') + '">Applied by agent</span>' : ''}${j.extra && j.extra.applied_status === 'questionnaire' ? '<span class="b fit-stretch" title="' + esc(j.extra.applied_note || '') + '">Needs your answer</span>' : ''}${j.extra && j.extra.applied_status === 'would-apply' ? '<span class="b fit-fit">Would apply</span>' : ''}${j.extra && j.extra.applied_status === 'offsite' ? '<span class="b">Apply on company site</span>' : ''}${j.extra && j.extra.japanese_level ? `<span class="b">JP: ${esc(j.extra.japanese_level)}</span>` : ''}</div>
      ${skills ? `<div class="skills">${skills}</div>` : ''}
      ${j.extra && j.extra.ai_summary && j.extra.ai_summary.why ? `<div class="ai" title="from the local model"><b>Fit:</b> ${esc(j.extra.ai_summary.why)}${j.extra.ai_summary.gaps && !/^none\.?$/i.test(j.extra.ai_summary.gaps) ? ` <b>Gap:</b> ${esc(j.extra.ai_summary.gaps)}` : ''}</div>` : ''}
      ${text ? `<div class="snip">${esc(text)}</div><button class="more" data-act="more">more</button>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="apply">Apply ↗</a>
        <button class="btn ${applied ? 'on' : ''}" data-act="applied">${applied ? '✓ Applied' : 'Mark applied'}</button>
        <button class="btn warn ${saved ? 'on' : ''}" data-act="save">${saved ? '★ Saved' : '☆ Save'}</button>
        <button class="btn icon" data-act="hide" title="${hidden ? 'Put back in the list' : 'Remove from list'}" aria-label="${hidden ? 'Put back in the list' : 'Remove from list'}">${hidden ? '↺' : '🗑'}</button>
      </div>
    </article>`;
  }
  function render() {
    renderFitChips();
    ['onlySaved', 'hideApplied', 'showHidden', 'titleOnly'].forEach(k => $(k).classList.toggle('on', !!ui[k]));
    const counts = { ALL: 0 };
    JOBS.forEach(j => { if (passes(j, true)) { counts.ALL++; counts[j.country] = (counts[j.country] || 0) + 1; } });
    renderTabs(counts);
    const cur = COUNTRIES.find(c => c.code === ui.country);
    $('direct').innerHTML = cur && cur.links && cur.links.length ? `Search directly on: ${cur.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`).join('')}` : (ui.country === 'ALL' ? 'Pick a country tab to see one-click search links for platforms that block automated search (Indeed, Glassdoor, Naukri, StepStone…).' : '');
    const vis = visible();
    const todo = vis.filter(j => !S.applied[j.id]), done = vis.filter(j => S.applied[j.id]);
    $('list').innerHTML = !vis.length ? '<div class="empty">No jobs match the current filters.</div>'
      : (todo.length ? todo.map(card).join('') : '<div class="empty sect">Nothing left to apply to here — everything shown is in Applied below.</div>')
        + (done.length ? `<div class="sect">Applied · ${done.length}</div>` + done.map(card).join('') : '');
    $('foot').innerHTML = `Showing ${vis.length} of ${JOBS.length} jobs · generated by the job-hunt skill ${META.generated ? 'on ' + esc(META.generated) : ''} · ${META.version ? 'jobbot v' + esc(META.version) : ''}<br>Applied / saved / removed marks are stored in this browser only. Scores are a lexical estimate (skills overlap + text similarity + experience fit) — read the posting before applying.`;
  }
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const art = b.closest('.card'); const id = art.dataset.id; const act = b.dataset.act;
    if (act === 'apply') { S.applied[id] = S.applied[id] || Date.now(); save(STATE_KEY, S); setTimeout(render, 300); return; }
    if (act === 'more') { art.classList.toggle('open'); b.textContent = art.classList.contains('open') ? 'less' : 'more'; return; }
    e.preventDefault();
    if (act === 'applied') { if (S.applied[id]) delete S.applied[id]; else S.applied[id] = Date.now(); }
    if (act === 'save') { if (S.saved[id]) delete S.saved[id]; else S.saved[id] = Date.now(); }
    if (act === 'hide') { if (S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = Date.now(); }
    save(STATE_KEY, S); render();
  };
  render();
})();
</script>

    letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35);
    background: transparent; color: inherit; opacity: .85; flex: none; }

  .tb-toggle::after { content: "\25B4"; font-size: 0.7rem; }

  /* thin scrollbars that follow the page's light / dark theme */

  }

    --accent: #FF5F49; --accent-on: #11151A; --accent-soft: rgba(255,95,73,.16); --accent-bg: rgba(255,95,73,.16); } }
  :root[data-ui="v2"][data-theme="dark"] {

<script>
(function () {
  "use strict";
  // collapsible filter groups, open / closed remembered
  document.querySelectorAll("details.fgrp[data-acc]").forEach(function (d) {
    var key = "acc:" + d.getAttribute("data-acc");
    try { var v = localStorage.getItem(key); if (v !== null) d.open = v === "1"; } catch (e) { /* private window */ }
    d.addEventListener("toggle", function () {
      try { localStorage.setItem(key, d.open ? "1" : "0"); } catch (e) { /* private window */ }
    });
  });

  // a Filters button on every filter toolbar: hides / shows the whole bar
  var kind = (document.title || "page").split(/\s+/).slice(0, 2).join("-").toLowerCase();
  var bars = Array.prototype.filter.call(document.querySelectorAll(".bar-tools, section.controls, div.bar"), function (el) {
    return el.querySelector(".chip, input[type=search], .search, select");   // a real filter bar, not a progress bar
  });
  bars.forEach(function (bar, i) {
    if (bar.querySelector(":scope > .tb-toggle")) return;
    var key = "tb:" + kind + ":" + i, btn = document.createElement("button");
    btn.type = "button"; btn.className = "tb-toggle";
    function paint(hidden) {
      bar.classList.toggle("tb-hidden", hidden);
      btn.textContent = hidden ? "Show filters" : "Filters";
      btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      btn.title = hidden ? "Show the filters" : "Hide the filters";
    }
    var hidden = false;
    try { hidden = localStorage.getItem(key) === "1"; } catch (e) {}
    bar.insertBefore(btn, bar.firstChild);
    paint(hidden);
    btn.addEventListener("click", function () {
      var h = !bar.classList.contains("tb-hidden"); paint(h);
      try { h ? localStorage.setItem(key, "1") : localStorage.removeItem(key); } catch (e) {}
    });
  });

  // the site's theme / skin changed while this page is open: follow it
  window.addEventListener("storage", function (e) {
    if (e.key !== "jh:theme" && e.key !== "jh:ui") return;
    var r = document.documentElement, t = localStorage.getItem("jh:theme") || "auto";
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    if (localStorage.getItem("jh:ui") === "v2") r.setAttribute("data-ui", "v2"); else r.removeAttribute("data-ui");
  });
})();
</script>
