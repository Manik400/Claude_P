<!-- The 75-Day SDE Plan tracker. Stands alone, and is also the phone site's

<style>

  .hbar { display: grid; grid-template-columns: 150px 1fr 48px; gap: 8px; align-items: center; font-size: 0.7812rem; margin: 6px 0; }
  .hbar .bar { margin: 0; height: 8px; }

  .streaks div { background: var(--card2); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px; }
  .streaks b { font-size: 1.125rem; } .streaks span { display: block; font-size: 0.7188rem; color: var(--muted); }
  .catch { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line2); font-size: 0.8125rem; width: 100%;

  .setrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; font-size: 0.8125rem; }
  .setrow input { border: 1px solid var(--line); border-radius: 8px; background: var(--card2); padding: 6px 8px; }
  .msg { font-size: 0.7812rem; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg);

  .toast.on { opacity: .97; }
  .tabbar { display: none; }

  /* phones */
  @media (max-width: 899px) {
    .top { padding: 12px 14px 10px; gap: 10px; }

    .monthnav { width: 100%; }
    .monthnav b { flex: 1; text-align: left; font-size: 1rem; min-width: 0; }
    .wrap { grid-template-columns: 1fr; padding: 10px 12px 16px; gap: 12px; }
    .cal { gap: 4px; }
    .dow { font-size: 0.625rem; text-align: center; padding: 0; }
    .cell { min-height: 58px; padding: 5px 4px 6px; gap: 3px; border-radius: 10px; align-items: center; box-shadow: none; }
    .cell .d { justify-content: center; }
    .cell .d b { font-size: 0.8438rem; }
    .cell .d .pd, .cell .th, .cell .foot { display: none; }
    .cell .dots { display: flex; gap: 3px; justify-content: center; }
    .cell .mini { display: block; font-size: 0.5938rem; font-weight: 700; color: var(--muted); }
    .cell .bar { width: 80%; height: 4px; }
    .legend { margin-top: 0; }
    .mkpis { display: grid !important; }
    /* the day opens as a full-screen sheet */
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    .panel { position: fixed; top: 0; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 30; border-radius: 0; border: 0; max-height: none;
      transform: translateX(0); transition: transform .22s ease; }

    .panel.swl { transform: translateX(-12%); opacity: .4; } .panel.swr { transform: translateX(12%); opacity: .4; }
    .closeday { display: grid; }
    .qa { position: fixed; top: 0; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 35; border-radius: 0; border: 0; max-height: none; }
    .qa .qh { padding-top: calc(12px + env(safe-area-inset-top)); }

      padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
    .tabbar button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.6875rem; color: var(--muted); padding: 4px; border-radius: 10px; }

  }
  @media (max-width: 380px) {

    .phases .ring { width: 54px; height: 54px; } .phases .ring i { width: 44px; height: 44px; }

  }
  .mkpis { display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mkpis .kpi { flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; }

  /* ---- one scroll at a time ------------------------------------------------
     Desktop: the page is exactly the window. The calendar's rows share the
     height left under the header (no scrolling at all); only the day panel and
     the Q&A column scroll, each inside itself. Phones: one normal page scroll,
     and the page behind an open day / Q&A sheet is locked. Scrollbars are thin
     and follow the light / dark theme. */
  :root { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (min-width: 900px) {

  @media (min-width: 900px) and (max-height: 660px) { .cell .foot { display: none; } .cell { gap: 3px; padding: 6px 8px; } }
  @media (max-width: 899px) { html.sheet-open, html.sheet-open body { overflow: hidden; } }

  /* ---- header stays on one row on desktop; the stats shrink before anything wraps ---- */
  @media (min-width: 900px) {
    .top { flex-wrap: nowrap; }
    .top > div:first-child { min-width: 0; flex: none; }
    .kpis { flex-wrap: nowrap; min-width: 0; overflow: hidden; }
  }
  @media (min-width: 900px) and (max-width: 1500px) { .kpi span { display: none; } .kpi { padding: 5px 9px; } }
  @media (min-width: 900px) and (max-width: 1180px) { .top .kpis, .top > .spacer { display: none; } .top .views { margin-left: auto; } }
  @media (min-width: 900px) and (max-width: 1080px) { .top .sub { display: none; } }

  /* ---- filters: each group is one line (label beside its chips) ---- */
  .fbody { align-items: center; row-gap: 8px; padding-top: 8px; padding-bottom: 8px; }
  .fbody > div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fbody .flabel { margin: 0; }
  .chips button { padding: 4px 10px; }

  /* ---- V2 skin: the site's portfolio look (paper and ink, square, hard shadows) ---- */
  :root[data-ui="v2"] {
    --bg: #E9EAE4; --card: #FFFFFF; --card2: #F5F6F2; --fg: #11151A; --muted: #4E575F; --line: #11151A; --line2: #C9CCC3;
    --accent: #EE3D28; --accent-bg: rgba(238,61,40,.12); --accent-fg: #FFFFFF;
    --ok: #1FA971; --ok-bg: rgba(31,169,113,.16); --warn: #B07400; --warn-bg: rgba(255,180,0,.24);
    --bad: #D22F1C; --bad-bg: rgba(238,61,40,.14); --info: #1B3FA0; --info-bg: rgba(27,63,160,.14);
    --rest: #6D3FC0; --rest-bg: rgba(109,63,192,.14); --chip: #F5F6F2; --weekend: #F1F2ED; --shadow: 3px 3px 0 #11151A;
    --v2-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; --v2-display: 'Archivo Black', Impact, system-ui, sans-serif;
  }
  :root[data-ui="v2"][data-theme="dark"] {
    --bg: #0D1114; --card: #151A1F; --card2: #1B2228; --fg: #ECEEE9; --muted: #98A4AC; --line: #2B333A; --line2: #232A30;
    --accent: #FF5F49; --accent-bg: rgba(255,95,73,.16); --accent-fg: #11151A;
    --ok: #31CE88; --ok-bg: rgba(49,206,136,.16); --warn: #FFC42E; --warn-bg: rgba(255,196,46,.16);
    --bad: #FF5F49; --bad-bg: rgba(255,95,73,.16); --info: #5B7BE0; --info-bg: rgba(91,123,224,.18);
    --rest: #A78BFA; --rest-bg: rgba(167,139,250,.16); --chip: #1B2228; --weekend: #12171B; --shadow: 3px 3px 0 #000;
  }
  :root[data-ui="v2"] body, :root[data-ui="v2"] button, :root[data-ui="v2"] input, :root[data-ui="v2"] textarea {
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  :root[data-ui="v2"] h1, :root[data-ui="v2"] h2, :root[data-ui="v2"] .monthnav b, :root[data-ui="v2"] .cell .d b, :root[data-ui="v2"] .kpi b,
  :root[data-ui="v2"] .qa .qh .t b { font-family: var(--v2-display); font-weight: 400; letter-spacing: -.01em; }
  :root[data-ui="v2"] .sub, :root[data-ui="v2"] .legend, :root[data-ui="v2"] .dow, :root[data-ui="v2"] .flabel, :root[data-ui="v2"] .st,
  :root[data-ui="v2"] .tag, :root[data-ui="v2"] .pt, :root[data-ui="v2"] .df, :root[data-ui="v2"] .cnt, :root[data-ui="v2"] .pd,
  :root[data-ui="v2"] .chips button, :root[data-ui="v2"] .views button, :root[data-ui="v2"] .mode button, :root[data-ui="v2"] .tl,
  :root[data-ui="v2"] .ph .date, :root[data-ui="v2"] details.filters > summary b, :root[data-ui="v2"] .card h3,
  :root[data-ui="v2"] .lvl .lb, :root[data-ui="v2"] .tabbar button { font-family: var(--v2-mono); letter-spacing: .02em; }
  :root[data-ui="v2"] .cell, :root[data-ui="v2"] .panel, :root[data-ui="v2"] .qa, :root[data-ui="v2"] .card, :root[data-ui="v2"] .kpi,
  :root[data-ui="v2"] details.filters, :root[data-ui="v2"] .qi, :root[data-ui="v2"] .tip, :root[data-ui="v2"] .todaycard {
    border-radius: 0 !important; border: 2px solid var(--line); box-shadow: var(--shadow); }
  :root[data-ui="v2"] .cell.out { box-shadow: none; border-color: var(--line2); }
  :root[data-ui="v2"] .cell.today { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent); }
  :root[data-ui="v2"] .cell.sel { outline: 3px solid var(--accent); outline-offset: 0; }
  :root[data-ui="v2"] .ib, :root[data-ui="v2"] .btn, :root[data-ui="v2"] .chips button, :root[data-ui="v2"] .views, :root[data-ui="v2"] .mode,
  :root[data-ui="v2"] .views button, :root[data-ui="v2"] .mode button, :root[data-ui="v2"] .rv, :root[data-ui="v2"] .qabtn, :root[data-ui="v2"] .cb,
  :root[data-ui="v2"] .tl, :root[data-ui="v2"] .st, :root[data-ui="v2"] .tag, :root[data-ui="v2"] .pt, :root[data-ui="v2"] .df, :root[data-ui="v2"] .pd,
  :root[data-ui="v2"] .sec > summary .ic, :root[data-ui="v2"] .sec > summary .c, :root[data-ui="v2"] textarea.note, :root[data-ui="v2"] .setrow input,
  :root[data-ui="v2"] .lvl .lb, :root[data-ui="v2"] .tabbar button, :root[data-ui="v2"] .water button { border-radius: 0 !important; }
  :root[data-ui="v2"] .ib, :root[data-ui="v2"] .btn { border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--line); font-weight: 700; }
  :root[data-ui="v2"] .ib:hover, :root[data-ui="v2"] .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
  :root[data-ui="v2"] .btn.acc { background: var(--accent); color: #fff; }
  :root[data-ui="v2"] .chips button { border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--line); font-weight: 700; font-size: 0.72rem; }
  :root[data-ui="v2"] .chips button.on { background: var(--accent); color: #fff; }
  :root[data-ui="v2"] .views, :root[data-ui="v2"] .mode { border: 2px solid var(--line); }
  :root[data-ui="v2"] .views button.on, :root[data-ui="v2"] .mode button.on { background: var(--fg); color: var(--bg); box-shadow: none; }
  :root[data-ui="v2"] .cb { border-width: 2px; border-color: var(--line); }
  :root[data-ui="v2"] .cb.on { background: var(--accent); border-color: var(--line); color: #fff; }
  :root[data-ui="v2"] .bar { border-radius: 0; border: 2px solid var(--line); background: var(--card2); height: 9px; }

  :root[data-ui="v2"] .sec, :root[data-ui="v2"] .ph, :root[data-ui="v2"] .lvl { border-bottom: 2px solid var(--line2); }

  :root[data-ui="v2"] .tabbar button.on { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>75-Day SDE Plan</h1>
    <div class="sub"><span id="range">loading…</span> · <button class="sync" id="sync" title="Sync status - tap to sync now">not synced</button></div>
  </div>
  <div class="monthnav"><button class="ib" id="m-prev" aria-label="Previous month">‹</button><b id="m-title"></b>
    <button class="ib" id="m-next" aria-label="Next month">›</button><button class="btn" id="m-today">Today</button></div>
  <div class="spacer"></div>
  <div class="kpis" id="kpis"></div>
  <div class="views" id="views"><button data-view="cal" class="on">Calendar</button><button data-view="stats">Progress</button></div>
  <button class="ib" id="hdr-tog" title="Collapse the header" aria-label="Collapse the header" aria-expanded="true">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
</header>

<main id="v-cal">
  <div class="wrap" id="wrap">
    <div>
      <div class="mkpis" id="mkpis" style="margin-bottom:10px"></div>
      <details class="filters" id="acc-filters"><summary><b>Filters</b><span class="sum" id="f-sum">All days · all phases</span></summary>
        <div class="fbody">
          <div><div class="flabel">Show</div><div class="chips" id="f-show"></div></div>
          <div><div class="flabel">Phase</div><div class="chips" id="f-phase"></div></div>
        </div></details>
      <div class="legend"><span><i style="background:var(--ok)"></i>Completed</span><span><i style="background:var(--warn)"></i>Partial</span>
        <span><i style="background:var(--bad)"></i>Missed</span><span><i style="background:var(--accent)"></i>Today</span>
        <span><i style="background:var(--rest)"></i>Sunday review</span><span><i style="background:var(--info)"></i>Checkpoint</span>
        <span><i style="background:var(--line)"></i>Upcoming</span></div>
      <div class="cal" id="cal"></div>
    </div>
    <aside class="panel closed" id="panel" aria-label="Day tasks"></aside>
    <aside class="qa" id="qa" hidden aria-label="Questions and answers"></aside>
  </div>
</main>
<main id="v-stats" hidden><div class="grid2" id="stats"></div></main>

<nav class="tabbar" id="tabbar">
  <button data-go="cal" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Today</button>
  <button data-go="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</nav>
<div class="qa-backdrop" id="qa-back" hidden></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("on"); }, 2200); }
  var mobile = function () { return matchMedia("(max-width: 899px)").matches; };

  // ------------------------------------------------------------ dates (India, IST)
  function todayISO() {
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
    catch (e) { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  }
  function parse(iso) { var p = iso.split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function addDays(isoStr, n) { var d = parse(isoStr); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  function diffDays(a, b) { return Math.round((parse(a) - parse(b)) / 86400000); }
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function nice(isoStr, withYear) { var d = parse(isoStr); return WD[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()].slice(0, 3) + (withYear ? " " + d.getUTCFullYear() : ""); }

  // ------------------------------------------------------------ state
  var PLAN = null, TODAY = todayISO();
  var P = loadLocal();          // { v:1, items: { key: {v, at} } }
  var UI = { month: null, sel: null, view: "cal", show: store.get("plan.f.show", "all"), phase: store.get("plan.f.phase", "all"), qa: null };
  var QNA = null, qnaLoading = null;

  function loadLocal() { try { return JSON.parse(store.get("plan.progress", "")) || { v: 1, items: {} }; } catch (e) { return { v: 1, items: {} }; } }
  function saveLocal() { store.set("plan.progress", JSON.stringify(P)); }
  function get(key, d) { var it = P.items[key]; return it ? it.v : d; }
  function put(key, v) { P.items[key] = { v: v, at: Date.now() }; saveLocal(); Sync.soon(); }
  function startISO() { return get("cfg.start", null) || PLAN.start; }
  function dateOf(n) { return addDays(startISO(), n - 1); }
  function dayAt(isoStr) { var n = diffDays(isoStr, startISO()) + 1; return n >= 1 && n <= 75 ? PLAN.days[n - 1] : null; }

  // ------------------------------------------------------------ tasks and status
  var HAB = [["walk", "Walk 1 km / 30 min exercise"], ["water", "Water 2.5–3 L"], ["food", "Healthy food, no junk"], ["chill", "1 hour to chill, guilt-free"], ["sleep", "Screens down by 11, sleep by 11:15"]];
  var EASY_KEYS = { lc0: 1, lc1: 1, sql: 1, hld: 1, walk: 1, water: 1, food: 1 };
  function taskKeys(n) {
    var easy = !!get(n + ".easy", 0), keys = ["lc0", "lc1", "lc2", "sql", "dsg", "hld", "lld", "cloud", "walk", "water", "food", "chill", "sleep"];
    return easy ? keys.filter(function (k) { return EASY_KEYS[k]; }) : keys;
  }
  function isDone(n, k) { return k === "water" ? (+get(n + ".water", 0) >= 2.5) : !!get(n + "." + k, 0); }

    var hs = function (k) { var n = 0, cur = TODAY, d = dayAt(cur); if (d && !isDone(d.day, k)) cur = addDays(cur, -1);
      for (;;) { d = dayAt(cur); if (!d || !isDone(d.day, k)) break; n++; cur = addDays(cur, -1); } return n; };
    var catchRows = [];
    PLAN.days.forEach(function (d) {
      if (dateOf(d.day) >= TODAY) return;
      taskKeys(d.day).forEach(function (k) {
        if (isDone(d.day, k) || ["walk", "water", "food", "chill", "sleep"].indexOf(k) >= 0) return;
        var label = k.indexOf("lc") === 0 ? "LC: " + d.leetcode[+k[2]].name : k === "hld" ? "HLD: " + d.hld.topic : k === "lld" ? "LLD: " + d.lld.topic
          : k === "sql" ? "SQL: " + d.sql.name : k === "dsg" ? "Design: " + d.design.name : "Cloud: " + d.cloud.topic;
        catchRows.push('<button class="catch" data-day="' + d.day + '"><span class="st ' + (progressOf(d.day).done ? "part" : "miss") + '">Day ' + d.day + "</span>" + esc(label) + "</button>");
      });
    });
    var ms = [25, 50, 75].map(function (n) { var d = PLAN.days[n - 1], done = statusOf(d) === "done", left = diffDays(dateOf(n), TODAY);
      return '<div class="' + (done ? "on" : "") + '"><b>Day ' + n + "</b>" + (n === 75 ? "Final mocks" : "Checkpoint " + n / 25) + '<br><span class="muted">' +
        (done ? "passed ✓" : left > 0 ? left + " days to go" : left === 0 ? "today" : "open") + "</span></div>"; }).join("");
    $("stats").innerHTML =
      '<div class="card" style="grid-column:1/-1"><div class="kpirow">' +
      '<div class="kpi"><b>' + t.pct + '%</b><span>overall · ' + t.daysDone + '/75 days</span></div><div class="kpi"><b>🔥 ' + t.streak + '</b><span>day streak</span></div>' +
      '<div class="kpi"><b>' + t.lc + '</b><span>LeetCode of 225</span></div><div class="kpi"><b>' + sqlDone + '</b><span>SQL of 75</span></div>' +
      '<div class="kpi"><b>' + dsgDone + '</b><span>design of 75</span></div><div class="kpi"><b>' + qaKnown + '</b><span>Q&amp;A known of 900</span></div>' +
      '<div class="kpi"><b style="color:' + (t.behind ? "var(--bad)" : "var(--ok)") + '">' + t.behind + '</b><span>days to catch up</span></div></div></div>' +
      '<div class="card"><h3>Phases</h3><div class="phases">' + phases + "</div></div>" +
      '<div class="card"><h3>Habit streaks</h3><div class="streaks"><div><b>🚶 ' + hs("walk") + '</b><span>walk / exercise</span></div><div><b>💧 ' + hs("water") +
      '</b><span>water 2.5 L+</span></div><div><b>🥗 ' + hs("food") + '</b><span>healthy food</span></div><div><b>😴 ' + hs("sleep") + '</b><span>sleep by 11:15</span></div></div></div>' +
      '<div class="card"><h3>LeetCode by pattern</h3>' + bars + "</div>" +
      '<div class="card"><h3>Catch up · ' + catchRows.length + " open task" + (catchRows.length === 1 ? "" : "s") + "</h3>" +
      (catchRows.length ? catchRows.slice(0, 30).join("") : '<div class="muted">Nothing behind. Keep going.</div>') + "</div>" +
      '<div class="card"><h3>Milestones</h3><div class="ms">' + ms + "</div></div>" +
      '<div class="card"><h3>Rules</h3><ul class="rules">' + PLAN.rules.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="card"><h3>Settings</h3><div class="setrow">Day 1 (a Monday): <input type="date" id="s-start" value="' + startISO() + '"><button class="btn" id="s-save">Save</button></div>' +
      '<div class="msg">Moving the start shifts every date; ticks stay with their plan day. ' +
      'Sync uses the GitHub token from the Job Hunt site Settings (needs Contents: read and write) and saves to the <code>plan-progress</code> branch.</div>' +
      '<div class="setrow"><button class="btn" id="s-sync">Sync now</button><span class="msg" id="s-syncmsg"></span></div></div>';
  }

  // ------------------------------------------------------------ render all + events
  function renderAll() {
    renderKpis(); renderFilters();
    if (UI.view === "stats") { renderStats(); } else { renderCal(); renderPanel(); }
    var qb = $("qbody"), qTop = qb ? qb.scrollTop : 0, qOpen = qb ? Array.prototype.map.call(qb.querySelectorAll("details.qi"), function (x) { return x.open; }) : null;
    renderQa();
    if (qOpen && $("qbody")) { var qs = $("qbody").querySelectorAll("details.qi"); if (qs.length === qOpen.length) qOpen.forEach(function (o, i) { qs[i].open = o; }); $("qbody").scrollTop = qTop; }
    $("v-cal").hidden = UI.view === "stats"; $("v-stats").hidden = UI.view !== "stats";
    // phones: an open day / Q&A sheet owns the only scroll; the page behind it stays put
    document.documentElement.classList.toggle("sheet-open", mobile() && UI.view === "cal" && !!UI.sel);
    document.querySelectorAll("#views button").forEach(function (b) { b.classList.toggle("on", b.dataset.view === UI.view); });
    var tab = UI.view === "stats" ? "stats" : (mobile() && UI.sel ? "today" : "cal");
    document.querySelectorAll("#tabbar button").forEach(function (b) { b.classList.toggle("on", b.dataset.go === tab); });
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, a");
    if (!t) return;
    if (t.tagName === "A") return;
    var n = UI.sel;
    if (t.dataset.day) { UI.view = "cal"; openDay(+t.dataset.day); return; }
    if (t.dataset.tick && n) { var k = t.dataset.tick; put(n + "." + k, isDone(n, k) ? 0 : 1); renderAll(); return; }
    if (t.dataset.rv != null && n) { put(n + ".rv" + t.dataset.rv, get(n + ".rv" + t.dataset.rv, 0) ? 0 : 1); renderAll(); return; }
    if (t.dataset.water != null && n) { var v = +t.dataset.water; if (+get(n + ".water", 0) === v && v > 0) v -= 0.5; put(n + ".water", v); renderAll(); return; }
    if (t.dataset.easy != null && n) { put(n + ".easy", +t.dataset.easy); renderAll(); return; }
    if (t.dataset.qa && n) { UI.qa = t.dataset.qa; loadQna().then(renderAll); renderAll(); return; }
    if (t.dataset.qak && n) { UI.qa = t.dataset.qak; renderAll(); if ($("qbody")) $("qbody").scrollTop = 0; return; }
    if (t.dataset.know != null && n) { var kk = n + ".qa." + UI.qa + t.dataset.know; put(kk, get(kk, 0) ? 0 : 1); renderAll(); return; }
    if (t.dataset.show) { UI.show = t.dataset.show; store.set("plan.f.show", UI.show); renderAll(); return; }
    if (t.dataset.phase) { UI.phase = t.dataset.phase; store.set("plan.f.phase", UI.phase); renderAll(); return; }
    if (t.dataset.view) { UI.view = t.dataset.view; renderAll(); return; }
    if (t.dataset.go) {
      if (t.dataset.go === "stats") UI.view = "stats";
      else if (t.dataset.go === "today") { UI.view = "cal"; var td = dayAt(TODAY); openDay(td ? td.day : (TODAY < startISO() ? 1 : 75)); return; }
      else { UI.view = "cal"; UI.sel = null; }
      renderAll(); return;
    }
    switch (t.id) {
      case "m-prev": shiftMonth(-1); break;
      case "m-next": shiftMonth(1); break;
      case "m-today": UI.month = monthOf(TODAY); UI.view = "cal"; renderAll(); break;
      case "d-prev": openDay(n - 1, -1); break;
      case "d-next": openDay(n + 1, 1); break;
      case "d-close": UI.sel = null; UI.qa = null; renderAll(); break;
      case "qa-close": UI.qa = null; renderAll(); break;
      case "qa-open": document.querySelectorAll("#qbody details").forEach(function (x) { x.open = true; }); break;
      case "qa-shut": document.querySelectorAll("#qbody details.qi").forEach(function (x) { x.open = false; }); break;
      case "d-go": if (n < 75) openDay(n + 1, 1); else toast("75 days. Done. 🎉"); break;
      case "d-all":
        var all = progressOf(n).done < progressOf(n).total;
        taskKeys(n).forEach(function (k) { if (k === "water") put(n + ".water", all ? 2.5 : 0); else put(n + "." + k, all ? 1 : 0); });
        renderAll(); break;
      case "s-save":
        var s = $("s-start").value;
        if (!s || parse(s).getUTCDay() !== 1) { toast("Pick a Monday - the weekend days depend on it"); break; }
        put("cfg.start", s); UI.month = monthOf(s); toast("Day 1 is now " + nice(s, true)); renderAll(); break;
      case "s-sync": case "sync": Sync.now(true); break;
    }
  });
  document.addEventListener("toggle", function (e) {
    var d = e.target; if (d.matches && d.matches("details.sec[data-acc]")) store.set("plan.acc." + d.dataset.acc, d.open ? "1" : "0");
    if (d.id === "acc-filters") store.set("plan.acc.filters", d.open ? "1" : "0");
  }, true);
  var noteTimer = null;
  document.addEventListener("input", function (e) {
    if (e.target.id !== "d-note" || !UI.sel) return;
    var n = UI.sel, v = e.target.value; clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { put(n + ".note", v); }, 600);
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "Escape" && UI.qa) { UI.qa = null; renderAll(); return; }
    if (e.key === "Escape" && UI.sel) { UI.sel = null; renderAll(); }
    if (e.key === "ArrowRight" && UI.sel) openDay(UI.sel + 1, 1);
    if (e.key === "ArrowLeft" && UI.sel) openDay(UI.sel - 1, -1);
  });
  // swipe the day sheet left / right on phones
  var sx = null, sy = null;
  $("panel").addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("panel").addEventListener("touchend", function (e) {
    if (sx == null || !UI.sel) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 1.5 * Math.abs(dy)) openDay(UI.sel + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  });
  window.addEventListener("resize", function () { renderAll(); });
  $("qa-back").addEventListener("click", function () { UI.qa = null; renderAll(); });
  // the site's theme or skin switch changed: pick it up (the Plan tab is a same-origin frame)
  window.addEventListener("storage", function (e) { if (e.key === "jh:theme" || e.key === "jh:ui") location.reload(); });

  // ------------------------------------------------------------ GitHub sync
  // progress.json on the plan-progress branch. Every key carries its own
  // timestamp, so two devices merge cleanly: for each key the newer write wins.
  var Sync = (function () {
    var BRANCH = "plan-progress", FILE = "progress.json", timer = null, busy = false, again = false;
    function cfg() {
      var token = store.get("jh:token", ""), repo = store.get("jh:repo", "");
      if (!repo) { var host = location.hostname.split("."), seg = location.pathname.split("/").filter(Boolean);
        if (host.length > 2 && host[1] === "github" && seg[0]) repo = host[0] + "/" + seg[0]; }
      return { token: token, repo: repo };
    }
    function state(cls, text, detail) {
      var el = $("sync"); el.className = "sync " + cls; el.textContent = text; el.title = detail || "Sync status - tap to sync now";
      var m = $("s-syncmsg"); if (m) m.textContent = text + (detail ? " (" + detail + ")" : "");
    }
    function gh(path, opts) {
      var c = cfg(); opts = opts || {};
      opts.headers = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Authorization": "Bearer " + c.token };
      // GitHub lets browsers cache API reads for 60 s; a cached file sha makes the next write a 409 conflict
      opts.cache = "no-store";
      if (opts.body) opts.headers["Content-Type"] = "application/json";
      return fetch("https://api.github.com/repos/" + c.repo + path, opts).then(function (r) {
        if (r.status === 404) return null;
        return r.json().then(function (j) { if (!r.ok) { var e = new Error((j && j.message) || ("HTTP " + r.status)); e.status = r.status; throw e; } return j; });
      });
    }
    function b64dec(s) { var bin = atob(s.replace(/\s/g, "")), bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
    function b64enc(s) { var bytes = new TextEncoder().encode(s), bin = ""; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }
    function merge(remote) {
      var changed = false, items = (remote && remote.items) || {};
      Object.keys(items).forEach(function (k) { var a = P.items[k], b = items[k]; if (!a || (b.at || 0) > (a.at || 0)) { P.items[k] = b; changed = true; } });
      return changed;
    }
    function ensureBranch() {
      return gh("/git/ref/heads/" + BRANCH).then(function (ref) {
        if (ref) return;
        return gh("").then(function (repo) { return gh("/git/ref/heads/" + repo.default_branch); })
          .then(function (base) { return gh("/git/refs", { method: "POST", body: JSON.stringify({ ref: "refs/heads/" + BRANCH, sha: base.object.sha }) }); });
      });
    }
    function once() {
      return ensureBranch().then(function () { return gh("/contents/" + FILE + "?ref=" + BRANCH); }).then(function (file) {
        var remote = file ? JSON.parse(b64dec(file.content)) : null;
        var pulled = merge(remote); saveLocal();
        var body = JSON.stringify({ v: 1, updated: new Date().toISOString(), items: P.items });
        var remoteBody = remote ? JSON.stringify({ v: 1, items: remote.items }) : "";
        if (remote && JSON.stringify(remote.items) === JSON.stringify(P.items)) return pulled;
        return gh("/contents/" + FILE, { method: "PUT", body: JSON.stringify({ message: "plan: progress", branch: BRANCH, content: b64enc(body), sha: file ? file.sha : undefined }) })
          .then(function () { return pulled; });
      });
    }
    function now(manual) {
      var c = cfg();
      if (!c.token || !c.repo) { state("", "this device only"); if (manual) toast("Add your GitHub token in the Job Hunt site's Settings to sync"); return Promise.resolve(); }
      if (!navigator.onLine) { state("err", "offline - saved here"); return Promise.resolve(); }
      if (busy) { again = true; return Promise.resolve(); }
      busy = true; state("busy", "syncing…");
      var tries = 0;
      function attempt() {
        return once().catch(function (e) { if ((e.status === 409 || e.status === 422) && ++tries < 3) return attempt(); throw e; });
      }
      return attempt().then(function (pulled) {
        store.set("plan.synced", String(Date.now())); state("ok", "synced", "Last synced " + new Date().toLocaleTimeString());
        retryIn = 30000;
        if (pulled) renderAll();
      }).catch(function (e) {
        var auth = e.status === 403 || e.status === 401, net = !e.status;
        // a dropped connection is temporary: say so and try again by itself, backing off to 5 minutes
        state("err", auth ? "token can't write - check Contents permission" : net ? "offline - will retry" : "sync failed - saved here, retrying",
              e.message + (e.status ? " (HTTP " + e.status + ")" : ""));
        if (manual) toast("Sync: " + e.message);
        if (!auth) { clearTimeout(retryTimer); retryTimer = setTimeout(now, retryIn); retryIn = Math.min(retryIn * 2, 300000); }
      }).then(function () { busy = false; if (again) { again = false; soon(); } });
    }
    var retryTimer = null, retryIn = 30000;
    function soon() { clearTimeout(timer); state("busy", "saving…"); timer = setTimeout(now, 2000); }
    window.addEventListener("online", function () { now(); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) now(); });
    return { now: now, soon: soon };
  })();

  // ------------------------------------------------------------ header fold + site full screen
  var fsOn = false;
  function setHeader(min) {
    var top = document.querySelector(".top"), folded = min || fsOn;
    top.classList.toggle("min", folded);
    $("hdr-tog").setAttribute("aria-expanded", folded ? "false" : "true");
    $("hdr-tog").title = folded ? "Show the full header" : "Collapse the header";
  }
  function setFs(on) { fsOn = !!on; document.documentElement.classList.toggle("fs", fsOn); setHeader(store.get("plan.hdr", "open") === "min"); }
  $("hdr-tog").addEventListener("click", function () {
    var min = !document.querySelector(".top").classList.contains("min");
    if (fsOn && !min) fsOn = false;          // opening the header in full screen shows it until full screen is toggled again
    store.set("plan.hdr", min ? "min" : "open"); setHeader(min);
  });
  window.addEventListener("message", function (e) {
    if (e.origin === location.origin && e.data && e.data.type === "site-fs") setFs(e.data.on);
  });

  // ------------------------------------------------------------ boot
  fetch("plan.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (plan) {
    PLAN = plan;
    UI.month = monthOf(TODAY < startISO() ? startISO() : TODAY > dateOf(75) ? dateOf(75) : TODAY);
    var td = dayAt(TODAY); if (td && !mobile()) UI.sel = td.day;
    if (store.get("plan.acc.filters", "0") === "1") $("acc-filters").open = true;
    setHeader(store.get("plan.hdr", "open") === "min");
    try { setFs(window.parent !== window && window.parent.document.documentElement.classList.contains("site-fs")); } catch (e) {}
    renderAll(); Sync.now();
  }).catch(function (e) { $("cal").innerHTML = '<div class="card">Could not load plan.json: ' + esc(e.message) + "</div>"; });
})();
</script>
</body>
</html>
